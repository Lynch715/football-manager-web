<!doctype html><meta charset="utf-8"><title>足球经理截止日完整流程QA</title>
<script>
(async()=>{
 const html=await(await fetch('../../index.html',{cache:'no-store'})).text();
 const setup=()=>document.addEventListener('DOMContentLoaded',()=>{
  registerSW=()=>{};offlineHint=()=>{};
  startMenu=async function(){try{
   SAVE_ENABLED=false;
   const args=new URLSearchParams(location.search),scene=args.get('scene')||'summer-pitch';
   await ensureRealData();
   newWorld(20261019,'Real Madrid');SAVE_ENABLED=false;
   const winter=scene.startsWith('winter'),kind=scene.split('-').pop();
   WORLD.day=winter?winterDay():0;const end=windowEndDay();WORLD.day=end-1;
   WORLD.inbox=[];WORLD.offers=[];WORLD.interest=[];WORLD.pitches=[];seedRng(+(args.get('seed')||5001));
   const u=UC(),p=u.squad.map(P).find(p=>p.pos==='ST'&&!p.loan);p.autoSell=false;p.untouchable=false;p.wantsLoan=false;p.injury=0;
   for(let k=0;k<2;k++){const q=makePlayer(100,p.pos,24,u.id);WORLD.players[q.id]=q;u.squad.push(q.id)}
   const buyers=WORLD.clubs.filter(c=>c.id!==u.id&&c.squad.length<27&&pitchNeed(c,p)>=1).slice(0,8);
   for(const b of buyers){b.finance.balance=1e12;b.finance.locked=0;b.finance.cap0=1e12;}
   p.listed=true;p.askPrice=Math.max(5000,Math.floor(askingPrice(p)*.45/1000)*1000);
   if(kind==='ai')WORLD.interest=buyers.map(b=>({pid:p.id,club:b.id,heat:1,since:absDay()-10}));
   if(kind==='pitch')WORLD.pitches=[{pid:p.id,club:buyers[0].id,price:p.askPrice,day:end-1,due:end}];
   if(kind==='loan'){p.age=22;p.ca=150;p.listed=false;p.wantsLoan=true;for(const b of WORLD.clubs.filter(c=>c.id!==u.id&&c.rep>=55&&c.rep<=70&&c.squad.length<27)){b.finance.balance=1e12;b.finance.locked=0;b.finance.cap0=1e12;}}
   WORLD.fixtures=WORLD.fixtures.filter(f=>f.day!==end&&f.day!==end-1);
   const data={pid:p.id,end};clearTimeout(SAVE_TIMER);
   const counts={daily:0,market:0,sim:0};for(const [name,key] of [['dailyTick','daily'],['marketDaily','market'],['simDay','sim']]){const fn=window[name];window[name]=function(...a){counts[key]++;return fn(...a)}}
   if(args.get('match')==='1'){const games=WORLD.fixtures.filter(f=>!f.played&&f.comp==='L'&&(f.home===WORLD.userClub||f.away===WORLD.userClub)&&f.day>data.end+1);games[0].day=data.end-1;games[1].day=data.end;}
   if(args.get('raw')==='1')WORLD.day=data.end;
   const original=render;render=function(){original();let r=document.getElementById('deadline-proof');if(!r){r=document.createElement('script');r.type='application/json';r.id='deadline-proof';document.body.appendChild(r)}r.textContent=JSON.stringify({scene,day:WORLD.day,date:fmtDateShort(dateOf(WORLD.day)),end:data.end,pid:data.pid,club:P(data.pid).clubId,user:WORLD.userClub,offers:WORLD.offers.filter(o=>o.pid===data.pid).map(o=>({day:o.day,until:o.until,valid:!offerDateError(o)})),open:inTransferWindow(),prepared:WORLD.deadlineMarketKey,closed:WORLD.closedTransferWindowKey,counts,savingEnabled:SAVE_ENABLED})};
   VIEW='transfer';enterGame();SAVE_ENABLED=false;clearTimeout(SAVE_TIMER);
  }catch(e){const r=document.createElement('pre');r.id='deadline-error';r.textContent=e.stack;document.body.appendChild(r);console.error(e)}};
 });
 document.open();document.write(html.replace('</head>','<base href="../../"><script>('+setup.toString()+')();<\/script></head>'));document.close();
})();
</script>
