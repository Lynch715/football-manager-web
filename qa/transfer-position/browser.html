<!doctype html><meta charset="utf-8"><title>足球经理 · 转会与客串验收</title>
<script>
(async()=>{
 const html=await(await fetch('../../index.html',{cache:'no-store'})).text();
 const setup=()=>document.addEventListener('DOMContentLoaded',()=>{
  registerSW=()=>{};offlineHint=()=>{};
  startMenu=async function(){try{
   await ensureRealData();newWorld(20261106,'Coventry City');SAVE_ENABLED=false;clearTimeout(SAVE_TIMER);
   while(UC().squad.length>28)toFreeAgent(P(UC().squad.at(-1)),UC());
   const baseline=JSON.stringify(WORLD),paint=render;let targetId=null,lastSold=null,scenario='';
   const bar=document.createElement('div');bar.style='background:#102819;color:#fff;padding:10px';
   bar.innerHTML='<b>足球经理验收 · 独立测试世界 · 不写存档</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"><button id="qa-bid">冬窗加盟选择</button><button id="qa-sell">出售最后一名左前卫</button><button id="qa-position">安排前锋客串</button></div><pre id="qa-proof" style="max-height:120px;overflow:auto;white-space:pre-wrap;font-size:12px"></pre>';
   function proof(){
    if(bar.parentNode!==document.getElementById('view'))document.getElementById('view').prepend(bar);
    const p=P(targetId),c=UC(),slot=p?c.lineup.indexOf(p.id):-1;
    const data={scenario,day:WORLD.day,savingEnabled:SAVE_ENABLED,player:p?.cn,club:p?.clubId,ourClub:c.id,precontract:p?.precontract||null,assigned:slot<0?null:FORMATIONS[c.tactic.formation][slot][0],natural:p?.pos,fit:slot<0?null:posFit(p,FORMATIONS[c.tactic.formation][slot][0]),lastSold:lastSold?{player:P(lastSold).cn,left:!c.squad.includes(lastSold),remainingML:c.squad.map(P).filter(q=>q.pos==='ML'||q.pos2.includes('ML')).length}:null,horizontalOverflow:document.documentElement.scrollWidth>innerWidth};
    document.getElementById('qa-proof').textContent=JSON.stringify(data,null,2);
   }
   render=function(){paint();proof();};
   function reset(name){adoptWorld(JSON.parse(baseline));SAVE_ENABLED=false;clearTimeout(SAVE_TIMER);CURMATCH=null;PREMATCH=null;SELSLOT=null;WORLD.day=winterDay();scenario=name;lastSold=null;for(const c of WORLD.clubs){c.finance.balance=1e10;c.finance.locked=0;c.finance.cap0=1e10;}closeModal();}
   function bidScene(){reset('冬窗加盟选择');const u=UC(),seller=WORLD.clubs.find(c=>c.id!==u.id&&c.rep<=u.rep+14&&c.squad.length>20),p=P(seller.squad.find(id=>!saleTerms(seller,P(id)).blocked));p.contract=WORLD.season;p.age=24;targetId=p.id;VIEW='transfer';render();makeBid(p.id);document.getElementById('bid-fee').value=toCurIn(Math.ceil(Math.max(askingPrice(p)*1.2,saleTerms(seller,p).fee||0)/1000)*1000);updBidArrival(p.id);proof();}
   function positionScene(){reset('安排前锋客串左前卫');const c=UC();remapLineup(c,'4-4-2');const p=P(c.squad.find(id=>P(id).pos==='ST'));p.injury=0;disciplineOf(p).bans={};p.susp=0;targetId=p.id;VIEW='tactics';render();assignPositionDialog(p.id);proof();}
   function sellScene(){reset('出售最后一名左前卫');const c=UC();remapLineup(c,'4-4-2');const p=P(c.lineup[FORMATIONS[c.tactic.formation].findIndex(sl=>sl[0]==='ML')]);for(const id of c.squad){const q=P(id);q.pos2=q.pos2.filter(pos=>pos!=='ML');if(q.pos==='ML')q.pos='MC';}p.pos='ML';p.pos2=[];const b=WORLD.clubs.find(c=>c.id!==UC().id&&c.squad.length<30);WORLD.offers=[{pid:p.id,club:b.id,fee:100000,wage:wageDemand(p,b),day:WORLD.day,until:WORLD.day+7}];targetId=p.id;lastSold=p.id;VIEW='transfer';render();}
   bar.querySelector('#qa-bid').onclick=bidScene;bar.querySelector('#qa-sell').onclick=sellScene;bar.querySelector('#qa-position').onclick=positionScene;
   enterGame();SAVE_ENABLED=false;clearTimeout(SAVE_TIMER);bidScene();
  }catch(e){document.body.insertAdjacentHTML('beforeend','<pre id="qa-error"></pre>');document.getElementById('qa-error').textContent=e.stack;console.error(e);}};
 });
 document.open();document.write(html.replace('</head>','<base href="../../"><script>('+setup.toString()+')();<\/script></head>'));document.close();
})();
</script>
