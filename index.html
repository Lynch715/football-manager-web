// ---------- 阵容 ----------
function playerScore(p,pos){
  if(!p) return 0;
  const fit=posFit(p,pos);
  const cond=0.55+0.45*(p.condition/100);
  const mor=0.9+0.2*(p.morale/100);
  const sh=0.85+0.15*(p.sharp/100);
  return p.ca*fit*cond*mor*sh;
}
// 只修补名单：踢掉已离队/伤停的人，补上空缺，替补席补到 7 人，
// 其余保持玩家自己的安排不动（转会、解约时用这个，别用 autoPickLineup）
function repairLineup(club){
  // 注意用 squad 判在队与否：transferPlayer 里 clubId 是后设置的，只查 clubId 会漏掉刚卖掉的人
  const inSquad=new Set(club.squad);
  const ok=id=>{ const p=P(id); return p && inSquad.has(id) && p.injury<=0 && p.susp<=0; };
  const slots=FORMATIONS[club.tactic.formation];
  if(!club.lineup || club.lineup.length!==slots.length){ autoPickLineup(club); return; }
  const used=new Set();
  club.lineup=club.lineup.map(id=> ok(id)? (used.add(id),id) : null);
  club.subs=(club.subs||[]).filter(id=> ok(id) && !used.has(id) && (used.add(id),true));
  const pool=club.squad.filter(id=>ok(id)&&!used.has(id));
  // 补空缺的首发位置
  slots.forEach((sl,i)=>{
    if(club.lineup[i]!=null) return;
    let best=null,bs=-1;
    pool.forEach(id=>{ if(used.has(id))return; const sc=playerScore(P(id),sl[0]); if(sc>bs){bs=sc;best=id;} });
    if(best!=null){ used.add(best); club.lineup[i]=best; }
  });
  // 替补席补到 7 人，优先保证有一个门将
  const rest=club.squad.filter(id=>ok(id)&&!used.has(id)).sort((a,b)=>P(b).ca-P(a).ca);
  if(!club.subs.some(id=>P(id).pos==="GK")){
    const gk=rest.find(id=>P(id).pos==="GK");
    if(gk && club.subs.length<BENCH_MAX){ club.subs.push(gk); used.add(gk); }
  }
  for(const id of rest){ if(club.subs.length>=BENCH_MAX) break; if(used.has(id)) continue; club.subs.push(id); used.add(id); }
}
function autoPickLineup(club){
  const slots=FORMATIONS[club.tactic.formation];
  const avail=club.squad.filter(id=>{const p=P(id); return p.injury<=0 && p.susp<=0;});
  const used=new Set(), lineup=[];
  // 先门将
  slots.forEach((s,si)=>{ lineup[si]=null; });
  const order=slots.map((s,i)=>i).sort((a,b)=> (slots[a][0]==="GK"?-1:0)-(slots[b][0]==="GK"?-1:0));
  for(const si of order){
    const pos=slots[si][0];
    let best=null,bs=-1;
    for(const id of avail){ if(used.has(id))continue;
      const sc=playerScore(P(id),pos);
      if(sc>bs){bs=sc;best=id;} }
    if(best!=null){ used.add(best); lineup[si]=best; }
  }
  club.lineup=lineup;
  // 替补 7 人：保证 1 门将
  const restIds=avail.filter(id=>!used.has(id));
  restIds.sort((a,b)=>P(b).ca-P(a).ca);
  const subs=[];
  const gk=restIds.find(id=>P(id).pos==="GK"); if(gk){subs.push(gk);used.add(gk);}
  for(const id of restIds){ if(subs.length>=7)break; if(used.has(id))continue; subs.push(id); used.add(id); }
  club.subs=subs;
}
// 阵容实力：首发骨架（门将 1 / 后卫 4 / 中场 4 / 前锋 2）满权重，替补递减。
// 用于董事会期望、升级附加赛、联赛页「阵容」名次；不进比赛引擎（引擎直接吃 playerScore）
function squadStrength(c){
  const grp={gk:[],df:[],mf:[],fw:[]};
  c.squad.forEach(id=>{ const p=P(id); if(p) grp[POS_GRP[p.pos]].push(p.ca); });
  for(const k in grp) grp[k].sort((a,b)=>b-a);
  const need={gk:1,df:4,mf:4,fw:2};
  let s=0,w=0; const rest=[];
  for(const k in need){ const arr=grp[k]; for(let i=0;i<need[k];i++){ s+=(arr[i]||0); w+=1; } rest.push(...arr.slice(need[k])); }
  rest.sort((a,b)=>b-a);
  rest.forEach((ca,i)=>{ const wt= i<5?0.35: i<9?0.12:0; s+=ca*wt; w+=wt; });
  return (s/Math.max(1,w))*(1+((c.coachRating||10)-10)*0.004);
}
// 联赛内阵容实力名次表 {clubId: rank}
function squadRanks(lg){
  const arr=lg.clubIds.map(id=>({id,s:squadStrength(C(id))})).sort((a,b)=>b.s-a.s);
  const m={}; arr.forEach((x,i)=>m[x.id]=i+1); return m;
}
function teamStrength(club, forMatch){
  const slots=FORMATIONS[club.tactic.formation];
  let sum=0;
  club.lineup.forEach((id,i)=>{ if(id==null)return;
    sum += playerScore(P(id), slots[i][0]); });
  const n=club.lineup.filter(x=>x!=null).length||1;
  let s=sum/n;
  s *= 1 + (club.coachRating-10)*0.004;
  return s;
}
/* =========================================================
   比赛引擎：回合推进 + 位置轨迹
   球场坐标 105 x 68，主队由左向右进攻
   ========================================================= */
const PW=105, PH=68;

function slotWorld(fx,fy,side){   // side 0 主 1 客
  return side===0 ? {x:fx/100*PW, y:fy/100*PH} : {x:PW-fx/100*PW, y:PH-fy/100*PH};
}

function createMatch(homeId, awayId, opts){
  opts=opts||{};
  const M={
    h:homeId, a:awayId, comp:opts.comp||"L", round:opts.round||0, neutral:!!opts.neutral,
    knockout:!!opts.knockout, record:!!opts.record, aggBase:opts.aggBase||null,
    t:0, addedTime:0, half:1, done:false,
    score:[0,0], events:[], frames:[], phase:0,
    stats:[blankStats(),blankStats()],
    teams:[], possTicks:[0,0], ballOwner:null, side:0,
    ball:{x:PW/2,y:PH/2}, lastTouch:null, subsMade:[0,0], pens:null,
    userSide: opts.userSide!=null?opts.userSide:-1,
    momentum:0, log:[]
  };
  [homeId,awayId].forEach((cid,side)=>{
    const club=C(cid);
    if(!club.lineup.length || club.lineup.filter(x=>x!=null).length<11) autoPickLineup(club);
    const slots=FORMATIONS[club.tactic.formation];
    const arr=[];
    club.lineup.forEach((pid,i)=>{
      if(pid==null) return;
      const p=P(pid), w=slotWorld(slots[i][1],slots[i][2],side);
      arr.push({
        id:pid, p, slot:i, pos:slots[i][0], bx:w.x, by:w.y, x:w.x, y:w.y,
        cond:p.condition, rating:6.4, goals:0, assists:0, shots:0, sot:0,
        passes:0, passOk:0, tackles:0, tackleOk:0, saves:0, keyp:0, drib:0,
        yellow:0, red:0, off:false, mins:0
      });
    });
    M.teams.push({cid, club, men:arr, benchUsed:[], gk:arr.find(m=>m.pos==="GK")||arr[0],
      form:club.tactic.formation, tac:Object.assign({},club.tactic), tac0:Object.assign({},club.tactic),
      homeAdv: side===0 && !M.neutral ? 1.17 : 1});
  });
  M.ballOwner = M.teams[0].men.find(m=>m.pos==="MC")||M.teams[0].men[5];
  updatePositions(M);
  return M;
}
function blankStats(){ return {shots:0,sot:0,poss:0,corners:0,fouls:0,yellow:0,red:0,offside:0,pass:0,passOk:0,xg:0,saves:0}; }

// ---------- 位置更新 ----------
function updatePositions(M){
  const bx=M.ball.x, by=M.ball.y;
  M.teams.forEach((T,side)=>{
    const att = M.side===side;
    const tac=T.tac;
    const ment=(tac.mentality-2)*0.055;
    const widthF=0.85+tac.width*0.09;
    const pressF=0.5+tac.press*0.075;
    const dir = side===0?1:-1;
    T.men.forEach(m=>{
      if(m.off) return;
      const prog=(bx-PW/2)*dir;              // 球在本方进攻方向的推进度
      const surge = (att && prog>12)? (prog-12)*(POS_SURGE[m.pos]||0) : 0;
      let shift = prog*(att?0.42:0.46) + ment*PW*(att?(ment>0?ENG.up:1):(ment<0?ENG.deep:ENG.upD)) + surge;
      // 门将跟随较少
      if(m.pos==="GK") shift = prog*0.10;
      let tx = m.bx + shift*dir;
      let ty = PH/2 + (m.by-PH/2)*widthF + (by-PH/2)*(m.pos==="GK"?0.12:0.22*pressF);
      // 前锋压上/后卫回收极限
      // 不允许挤到对方门线：进攻推进度上限 96m
      const axp = side===0? tx : PW-tx;
      if(m.pos!=="GK" && axp>96) tx = side===0? 96 : PW-96;
      tx = clamp(tx, 3, PW-3); ty = clamp(ty, 2, PH-2);
      // 靠近球时被吸引
      const d=Math.hypot(bx-tx, by-ty);
      if(d<20 && m.pos!=="GK"){ const k=(att?0.16:0.30)*(1-d/20)*pressF; tx+=(bx-tx)*k; ty+=(by-ty)*k; }
      m.x = tx + gauss(0,0.9); m.y = clamp(ty + gauss(0,0.9),1,PH-1);
    });
  });
  if(M.ballOwner && !M.ballOwner.off){ M.ballOwner.x=M.ball.x; M.ballOwner.y=M.ball.y; }
}

function pressureOn(M, side, x, y){
  const opp=M.teams[1-side]; let pr=0;
  opp.men.forEach(m=>{ if(m.off||m.pos==="GK")return;
    const d=Math.hypot(m.x-x,m.y-y);
    if(d<14) pr += (1-d/14)*(0.55+ (m.p.a.tackling+m.p.a.aggression+m.p.a.workrate)/120);
  });
  return pr*(1+(opp.tac.press-2)*ENG.prK);
}
function nearestOpp(M, side, x, y){
  const opp=M.teams[1-side]; let best=null,bd=1e9;
  opp.men.forEach(m=>{ if(m.off||m.pos==="GK")return;
    const d=Math.hypot(m.x-x,m.y-y); if(d<bd){bd=d;best=m;} });
  return {m:best,d:bd};
}
/* 2026-10 战术平衡：压上要有代价（身后空当 / 反击），收缩要有收益（封堵），逼抢和快节奏更耗体能。
   ENG 里的系数是跑 1500 场对比调出来的，改之前先看 match_engine_tuning。*/
/* v49：门将/中卫不再按全场跑动掉体能后，疲劳门将送的球没了，pGoal 2.2→2.6 把场均进球拉回原水平（3000 场 2.45→2.49）。*/
const ENG={ctr:0.0061, ctrM:0.55, ctrP:0.19, ctrWin:2.0, blkM:0.08, onTM:0.06, tempoD:0.16, pressD:0.18, lowS:0.4, condK:0.014, pGoal:2.6, deep:1.2, up:1, upD:0.5, fwdB:0.005, shootB:1.04, prK:0.04};
// 体能：75 以上影响很小，75 以下掉得快（高位逼抢踢满 90 分钟的队下半场会明显踢不动）
function condF(c){ return c>=75? 1-(100-c)*0.004 : 0.9-(75-c)*ENG.condK; }
const att=(m,k)=> m.p.a[k]*condF(m.cond);

function addEvent(M,type,text,cls){
  const e={t:Math.floor(M.t), half:M.half, type, text, cls:cls||type, score:[...M.score]};
  M.events.push(e); return e;
}
function nm(m){ return m.p.cn.split("·")[1]||m.p.cn; }

/* 位置跑动量。原来体能消耗只看耐力/积极性，门将耐力属性普遍很低，于是门将掉得最快、中卫其次。*/
const POS_RUN={GK:0.35, DC:0.80, DL:1.05, DR:1.05, DM:1.05, MC:1.05, ML:1.05, MR:1.05, AM:1.00, ST:0.95};
// ---------- 主循环：推进一个回合 ----------
function stepMatch(M){
  if(M.done) return null;
  const dt = 2.4 + rnd()*5.2;
  M.t += dt/60;
  const side=M.side, T=M.teams[side], O=M.teams[1-side];
  M.possTicks[side]++;
  // 体能消耗
  M.teams.forEach((tm,s)=>{
    const dT=tm.tac.tempo-2, dP=tm.tac.press-2;   // 往上加码掉体能多，往下收只省一点
    const tempoF=1+dT*ENG.tempoD*(dT<0?ENG.lowS:1), pressG=1+dP*ENG.pressD*(dP<0?ENG.lowS:1);
    tm.men.forEach(m=>{ if(m.off)return;
    m.mins += dt/60;
    const st=m.p.a.stamina, wr=m.p.a.workrate;
    // 位置只折算基础跑动；战术加码（快节奏/高逼抢）的额外消耗外场球员一样吃，否则压上的代价被变相打折
    const mult=(s===side?tempoF:pressG*1.05), pr=POS_RUN[m.pos]||1;
    let drain=(dt/60)*(0.30+ (20-st)*0.028 + wr*0.006)*(m.pos==="GK"? pr*mult : Math.max(0.2, pr+mult-1));
    m.cond=clamp(m.cond-drain,12,100);
  }); });

  const owner=M.ballOwner;
  if(!owner||owner.off){ M.ballOwner=T.men.find(m=>!m.off)||O.men[0]; }
  if(M.ctr){ const cs=M.ctr-1; M.ctr=0; if(cs===side && doCounter(M,side)) return finPhase(M,dt); }
  const o=M.ballOwner;
  const dir = side===0?1:-1;
  const ax = side===0 ? o.x : PW-o.x;             // 进攻推进度 0..105
  const dy = Math.abs(o.y-PH/2);
  const pr = pressureOn(M, side, o.x, o.y);
  const goalX = side===0?PW:0;
  const distGoal = Math.hypot(goalX-o.x, PH/2-o.y);

  // --- 决策权重 ---
  const A=o.p.a;
  let wShoot=0, wCross=0, wDrib=0, wPass=1.0;
  const posSF = POS_SHOOT_F[o.pos]!=null? POS_SHOOT_F[o.pos] : 1;
  if(ax>48 && distGoal<40){
    const angle = 1 - clamp(dy/34,0,1)*0.72;
    wShoot = 0.46*angle*(0.40+A.finishing/22)*Math.exp(-(distGoal-7)/12)/(1+pr*0.75)*posSF;
    if(distGoal>19) wShoot *= clamp(A.longshot/15,0.30,1.5);
  }
  // 传中只是边路球员的一个选项，不该压倒其它决策（原系数 12 → 4.2，非边路再打 0.5 折）
  if(ax>50 && dy>13){
    const wideF = (o.pos==="ML"||o.pos==="MR"||o.pos==="DL"||o.pos==="DR")? 1 : 0.5;
    wCross = 4.2*wideF*(A.crossing/16)*(ax-50)/55/(1+pr*0.5)*clamp((dy-11)/12,0,1.25);
  }
  wDrib = 0.55*(A.dribbling/17)*(0.6+A.flair/34)/(1+pr*1.25)*(0.6+A.accel/30);
  wPass = 1.35*(0.5+A.passing/22)*(0.7+A.vision/30);
  if(pr>2.2) { wPass*=1.25; wDrib*=0.5; }
  if(T.tac.tempo>=3) { wPass*=1.05; wDrib*=0.95; }
  if(T.tac.mentality>=3){ wShoot*=ENG.shootB; wCross*=1.1; }
  if(T.tac.mentality<=1){ wShoot*=0.8; wPass*=1.15; }

  const tot=wShoot+wCross+wDrib+wPass; let r=rnd()*tot, act;
  if((r-=wShoot)<0) act="shoot"; else if((r-=wCross)<0) act="cross";
  else if((r-=wDrib)<0) act="drib"; else act="pass";

  // --- 抢断拦截判定（先于动作）---
  const near=nearestOpp(M,side,o.x,o.y);
  if(near.m && near.d<8 && rnd()< 0.30*(1-near.d/8)+0.025){
    const D=near.m;
    D.tackles++;
    const dv=(att(D,'tackling')*0.6+att(D,'marking')*0.25+att(D,'aggression')*0.15)*(side===0?1:1.04)+gauss(0,3.2);
    const ov=att(o,'dribbling')*0.4+att(o,'technique')*0.25+att(o,'agility')*0.2+att(o,'strength')*0.15+gauss(0,3.2);
    if(dv>ov){
      if(rnd()<0.55){ // 犯规
        M.stats[1-side].fouls++; D.rating-=0.06;
        const inBox = (side===0? D.x>PW-16.5 : D.x<16.5) && Math.abs(D.y-PH/2)<20.15;
        cardCheck(M,1-side,D,inBox);
        if(inBox && rnd()<0.030){ penalty(M,side,o); return finPhase(M,dt); }
        // 任意球
        if(ax>72 && dy<22 && rnd()<0.45){ freeKick(M,side,o); return finPhase(M,dt); }
        M._k="foul"; M.ballOwner=o; return finPhase(M,dt);
      }
      D.tackleOk++; D.rating+=0.07; o.rating-=0.05;
      M._k="tackle"; turnover(M,D); return finPhase(M,dt);
    } else { o.rating+=0.03; }
  }

  M._k=act;
  switch(act){
    case "shoot": doShot(M,side,o,distGoal,dy,pr,false); break;
    case "cross": doCross(M,side,o); break;
    case "drib": doDribble(M,side,o,pr,dir); break;
    default: doPass(M,side,o,pr,dir); break;
  }
  return finPhase(M,dt);
}

function finPhase(M,dt){
  updatePositions(M);
  if(M.record){
    const list=M.teams.flatMap(T=>T.men.filter(m=>!m.off));
    M.frames.push({t:M.t, b:{x:R1(M.ball.x),y:R1(M.ball.y)}, s:M.side, k:M._k||"", o:list.indexOf(M.ballOwner),
      p:list.map(m=>[Math.round(m.x*10)/10,Math.round(m.y*10)/10])});
  }
  M._k="";
  M.phase++;
  // 半场 / 结束
  if(M.half===1 && M.t>=45+M.addedTime){
    if(M.addedTime===0){ M.addedTime=ri(1,4); }
    if(M.t>=45+M.addedTime){ M.half=2; M.t=45; M.addedTime=0; M.side=1;
      M.ball={x:PW/2,y:PH/2}; M.ballOwner=M.teams[1].men[5]||M.teams[1].men[0];
      addEvent(M,"sys","—— 中场休息  "+M.score[0]+" : "+M.score[1]+" ——","sys");
      halftimeRecover(M); updatePositions(M); }
  } else if(M.half===2 && M.t>=90+M.addedTime){
    if(M.addedTime===0) M.addedTime=ri(2,6);
    if(M.t>=90+M.addedTime) endMatch(M);
  }
  aiSubs(M);
  aiTactics(M);
  return M.events[M.events.length-1];
}
function halftimeRecover(M){ M.teams.forEach(T=>T.men.forEach(m=>{ m.cond=clamp(m.cond+ri(3,7),0,100); })); }

// ---------- 具体动作 ----------
function turnover(M, newOwner){
  M.side = M.teams[0].men.includes(newOwner)?0:1;
  M.ballOwner=newOwner; M.ball={x:newOwner.x,y:newOwner.y};
  // 门将拿球不算（开大脚没有反击的突然性）；对手已经在前场拿球也不算
  if(newOwner.pos!=="GK"){
    const L=M.teams[1-M.side].tac, ax=M.side===0? newOwner.x : PW-newOwner.x;
    if(ax<62){
      const f=Math.max(0, 1 + (L.mentality-2)*ENG.ctrM*2 + (L.press-2)*ENG.ctrP*2);
      const W=M.teams[M.side].tac;                     // 战术页「快速反击」没勾的队，拿球后不急着打身后
      if(rnd()<ENG.ctr*f*(W.counter===false?0.6:1)) M.ctr=M.side+1;
    }
  }
}
// 快速反击：最快的前插球员和对方最慢的后卫赛跑，传球人得把球送到位
function doCounter(M,side){
  const T=M.teams[side], O=M.teams[1-side], o=M.ballOwner;
  const runners=T.men.filter(m=>!m.off&&m!==o&&["ST","AM","ML","MR"].includes(m.pos));
  const backs=O.men.filter(m=>!m.off&&POS_GRP[m.pos]==="df");
  if(!runners.length||!backs.length) return false;
  const spd=m=>att(m,'pace')*0.6+att(m,'accel')*0.4;
  const run=runners.reduce((b,m)=>spd(m)>spd(b)?m:b), back=backs.reduce((b,m)=>spd(m)<spd(b)?m:b);
  const pass=att(o,'passing')*0.5+att(o,'vision')*0.5;
  const L=O.tac;
  const av=spd(run)+ (pass-10)*0.35 + gauss(0,3.2);
  const dv=spd(back)+ att(back,'positioning')*0.25 + (2-L.mentality)*1.6 + ENG.ctrWin + gauss(0,3.2);
  addEvent(M,"ctr",`${C(T.cid).short} 打出快速反击`,"");
  if(av<=dv){ turnover(M, back); M.ctr=0; return true; }
  const dir=side===0?1:-1;
  run.x = side===0? PW-11-rnd()*9 : 11+rnd()*9; run.y=PH/2+gauss(0,6);
  M.ball={x:run.x,y:run.y}; M.ballOwner=run; M.lastTouch=o; o.keyp++; o.rating+=0.05;
  doShot(M,side,run,Math.hypot((side===0?PW:0)-run.x,PH/2-run.y),Math.abs(run.y-PH/2),0.25,false);
  return true;
}
function doPass(M,side,o,pr,dir){
  const T=M.teams[side];
  const mates=T.men.filter(m=>m!==o && !m.off);
  // 选择接球人：偏向前场、距离适中
  let best=null,bw=-1;
  mates.forEach(m=>{
    const fwd=(m.x-o.x)*dir, d=Math.hypot(m.x-o.x,m.y-o.y);
    if(d<2) return;
    const oppPr=pressureOn(M,side,m.x,m.y);
    let w=(1+Math.max(0,fwd)*0.075) / (1+Math.abs(d-16)*0.055) / (1+oppPr*0.7);
    if(m.pos==="GK") w*=0.06;
    const axm=side===0?m.x:PW-m.x; if(axm>88) w*=0.55;
    if(T.tac.mentality>=3) w*=(1+Math.max(0,fwd)*ENG.fwdB);
    if(T.tac.tempo>=3&&fwd>18) w*=1.35;
    best=(w>bw)?(bw=w,m):best;
  });
  if(!best){ return; }
  const d=Math.hypot(best.x-o.x,best.y-o.y);
  o.passes++; M.stats[side].pass++;
  const skill=att(o,'passing')*0.5+att(o,'vision')*0.25+att(o,'technique')*0.25;
  let p = 0.965 - d*0.0125 - pr*0.055 + (skill-10)*0.021;
  p = clamp(p*(side===0&&!M.neutral?1.03:1),0.28,0.97);
  // 越位判定（简化）
  const axT = side===0? best.x : PW-best.x;
  if(axT>72 && M.teams[1-side].tac.offside && rnd()<0.032){
    M.stats[side].offside++; addEvent(M,"off",`${nm(best)} 越位在先`,"");
    const D=M.teams[1-side].gk; turnover(M,D); return;
  }
  if(rnd()<p){
    o.passOk++; M.stats[side].passOk++; o.rating+=0.006;
    const axB=side===0?best.x:PW-best.x;
    if(axB>78 && (best.x-o.x)*dir>10){ o.keyp++; o.rating+=0.05; }
    M.ballOwner=best; M.ball={x:best.x,y:best.y}; M.lastTouch=o;
  } else {
    o.rating-=0.025;
    const iv=nearestOpp(M,side,best.x,best.y);
    turnover(M, iv.m || M.teams[1-side].gk);
  }
}
function doDribble(M,side,o,pr,dir){
  const D=nearestOpp(M,side,o.x,o.y);
  const ov=att(o,'dribbling')*0.4+att(o,'agility')*0.2+att(o,'accel')*0.2+att(o,'flair')*0.2+gauss(0,3);
  const dv=D.m? (att(D.m,'tackling')*0.4+att(D.m,'marking')*0.2+att(D.m,'pace')*0.2+att(D.m,'positioning')*0.2)*(D.d<6?1:0.45)+gauss(0,3) : 3;
  if(ov>dv){
    o.drib++; o.rating+=0.045;
    const adv=6+rnd()*10;
    o.x=clamp(o.x+adv*dir, side===0?2:PW-95, side===0?95:PW-2); o.y=clamp(o.y+gauss(0,5),2,PH-2);
    M.ball={x:o.x,y:o.y};
  } else {
    o.rating-=0.03;
    if(D.m){ D.m.tackleOk++; D.m.rating+=0.06; turnover(M,D.m); }
  }
}
function doCross(M,side,o){
  const T=M.teams[side], dir=side===0?1:-1;
  const targets=T.men.filter(m=>!m.off&&m!==o&&(POS_BOX_W[m.pos]||0)>0);
  if(!targets.length){ doPass(M,side,o,0,dir); return; }
  // 运动战传中找的是会进禁区的人（锋线/前腰/边路），中卫只有极小概率前插
  const tgt=pickW(targets, targets.map(m=>POS_BOX_W[m.pos]*(0.45+(att(m,'heading')*0.6+att(m,'jumping')*0.4)/26)));
  const acc = clamp(0.10+att(o,'crossing')*0.017 + att(o,'technique')*0.004,0.08,0.42);
  M.stats[side].pass++; o.passes++;
  if(rnd()<acc){
    o.passOk++; M.stats[side].passOk++;
    const gk=M.teams[1-side].gk;
    const def=nearestOpp(M,side,side===0?PW-11:11,PH/2);
    const av=att(tgt,'heading')*0.55+att(tgt,'jumping')*0.3+att(tgt,'strength')*0.15+gauss(0,3);
    const dv=(def.m?(att(def.m,'heading')*0.5+att(def.m,'jumping')*0.3+att(def.m,'marking')*0.2):6)+2.6+gauss(0,3);
    tgt.x = side===0? PW-10-rnd()*6 : 10+rnd()*6; tgt.y=PH/2+gauss(0,7);
    M.ball={x:tgt.x,y:tgt.y};
    if(av>dv){ M.ballOwner=tgt; M.lastTouch=o; doShot(M,side,tgt,Math.hypot((side===0?PW:0)-tgt.x,PH/2-tgt.y),Math.abs(tgt.y-PH/2),0.6,true); }
    else { if(rnd()<0.34){ corner(M,side); } else turnover(M, def.m||gk); }
  } else {
    if(rnd()<0.26) corner(M,side); else turnover(M, M.teams[1-side].gk);
  }
}
function corner(M,side){
  M.stats[side].corners++;
  const T=M.teams[side], dir=side===0?1:-1;
  const taker=T.men.reduce((b,m)=> att(m,'setpiece')>att(b,'setpiece')?m:b);
  const cands=T.men.filter(m=>!m.off&&m!==taker&&POS_CORNER_W[m.pos]>0);
  const tgt=cands.length? pickW(cands, cands.map(m=>POS_CORNER_W[m.pos]*(0.35+(att(m,'heading')*0.6+att(m,'jumping')*0.4)/24))) : taker;
  const gk=M.teams[1-side].gk;
  M.ball={x:side===0?PW-9-rnd()*4:9+rnd()*4,y:PH/2+gauss(0,6)};
  const q=att(taker,'setpiece')*0.6+att(taker,'crossing')*0.4;
  if(rnd()< 0.19+q*0.012){
    const av=att(tgt,'heading')*0.6+att(tgt,'jumping')*0.4+gauss(0,3.4);
    const dv=att(gk,'aerial')*0.4+ 12 + gauss(0,3.4);
    tgt.x=M.ball.x; tgt.y=M.ball.y; M.ballOwner=tgt; M.lastTouch=taker;
    if(av>dv){ doShot(M,side,tgt,Math.hypot((side===0?PW:0)-tgt.x,PH/2-tgt.y),Math.abs(tgt.y-PH/2),0.7,true); return; }
  }
  turnover(M,gk);
}
function doShot(M,side,o,dist,dy,pr,isHeader){
  const gk=M.teams[1-side].gk;
  o.shots++; M.stats[side].shots++;
  const angle=1-clamp(dy/30,0,1)*0.6;
  // 预期进球
  let xg = clamp(0.92*Math.exp(-dist/9.0)*angle*(isHeader?0.62:1)/(1+pr*0.42),0.008,0.86);
  M.stats[side].xg+=xg;
  const fin=isHeader? att(o,'heading')*0.65+att(o,'jumping')*0.35 : att(o,'finishing')*0.7+att(o,'technique')*0.3;
  const comp=att(o,'composure');
  const dm=M.teams[1-side].tac.mentality-2;            // 防守方心态：负数=收缩
  let onTarget = clamp((0.20+fin*0.020+comp*0.006-dist*0.0092-pr*0.030)*0.93*(1+dm*ENG.onTM),0.06,0.76);   // 2026-09-12：场均 1.9 球太干，调到 ~2.5（再高顶级前锋一季 70+ 球）
  const blocked = rnd()< clamp(pr*0.11 - dm*ENG.blkM,0,0.40);
  if(blocked){ addEvent(M,"blk",`${nm(o)} 的射门被封堵`,""); 
    if(rnd()<0.46) corner(M,side); else turnover(M, nearestOpp(M,side,o.x,o.y).m||gk); return; }
  if(rnd()>onTarget){
    o.rating-=0.06;
    addEvent(M,"miss",`${nm(o)} ${dist>24?"远射":"打门"}偏出`, xg>0.28?"chance":"");
    if(rnd()<0.10) corner(M,side); else turnover(M,gk); return;
  }
  o.sot++; M.stats[side].sot++;
  // 门将扑救
  const gkq=att(gk,'reflex')*0.45+att(gk,'handling')*0.2+att(gk,'oneonone')*0.2+att(gk,'positioning')*0.15;
  let pGoal = clamp(xg*ENG.pGoal*(0.70+fin*0.030)*(1.30-gkq*0.028),0.015,0.90);
  pGoal *= M.teams[side].homeAdv;
  if(rnd()<pGoal){ scoreGoal(M,side,o,isHeader?"头球":dist>24?"远射":"射门"); }
  else{
    gk.saves++; gk.rating+=0.12; M.stats[1-side].saves++; o.rating+=0.04;
    addEvent(M,"save",`${nm(gk)} 扑出 ${nm(o)} 的射门！`, xg>0.30?"chance":"");
    if(rnd()<0.40) corner(M,side); else turnover(M,gk);
  }
}
function scoreGoal(M,side,o,how){
  M.score[side]++; o.goals++; o.rating+=1.05;
  let asst=null;
  if(M.lastTouch && M.lastTouch!==o && M.teams[side].men.includes(M.lastTouch)){
    asst=M.lastTouch; asst.assists++; asst.rating+=0.55;
  }
  const T=M.teams[side];
  addEvent(M,"goal",`⚽ 进球！${C(T.cid).short} ${nm(o)} ${how}破门${asst?"（"+nm(asst)+" 助攻）":""}  ${M.score[0]}-${M.score[1]}`,"goal");
  M.teams[1-side].men.forEach(m=>{ if(m.pos==="GK") m.rating-=0.32; else if(POS_GRP[m.pos]==="df") m.rating-=0.11; });
  T.men.forEach(m=>m.rating+=0.03);
  M.momentum = side===0?2:-2;
  // 中圈开球
  M.ball={x:PW/2,y:PH/2}; M.side=1-side;
  M.ballOwner=M.teams[1-side].men.find(m=>m.pos==="MC"&&!m.off)||M.teams[1-side].men[5];
  M.lastTouch=null;
  M.t += 0.7;
}
function penalty(M,side,victim){
  const T=M.teams[side], gk=M.teams[1-side].gk;
  const taker=T.men.filter(m=>!m.off).reduce((b,m)=> (att(m,'finishing')*0.6+att(m,'composure')*0.4)>(att(b,'finishing')*0.6+att(b,'composure')*0.4)?m:b);
  addEvent(M,"pen",`点球！${C(T.cid).short} 获得 12 码机会`,"chance");
  taker.shots++; M.stats[side].shots++; M.stats[side].xg+=0.78;
  const p=clamp(0.62+att(taker,'finishing')*0.012+att(taker,'composure')*0.010-att(gk,'reflex')*0.008,0.4,0.94);
  M.ball={x:side===0?PW-11:11,y:PH/2};
  if(rnd()<p){ M.stats[side].sot++; taker.sot++; scoreGoal(M,side,taker,"点球"); }
  else { M.stats[side].sot++; taker.sot++; taker.rating-=0.55; gk.rating+=0.5; gk.saves++;
    addEvent(M,"save",`${nm(gk)} 扑出点球！${nm(taker)} 罚失`,"chance"); turnover(M,gk); }
}
function freeKick(M,side,o){
  const T=M.teams[side], gk=M.teams[1-side].gk;
  const taker=T.men.filter(m=>!m.off).reduce((b,m)=> att(m,'setpiece')>att(b,'setpiece')?m:b);
  const dist=18+rnd()*12;
  if(rnd()<0.42){   // 直接射门
    taker.shots++; M.stats[side].shots++;
    const q=att(taker,'setpiece')*0.6+att(taker,'technique')*0.4;
    const xg=clamp(0.055*(q/13),0.01,0.18); M.stats[side].xg+=xg;
    if(rnd()< clamp(0.18+q*0.014,0.1,0.5)){
      taker.sot++; M.stats[side].sot++;
      if(rnd()< clamp(xg*3.2*(1.25-att(gk,'reflex')*0.026),0.02,0.45)) { scoreGoal(M,side,taker,"任意球直接"); return; }
      gk.saves++; gk.rating+=0.12; M.stats[1-side].saves++;
      addEvent(M,"save",`${nm(taker)} 任意球被 ${nm(gk)} 没收`,"");
      turnover(M,gk); return;
    }
    addEvent(M,"miss",`${nm(taker)} 任意球高出横梁`,""); turnover(M,gk); return;
  }
  M.ball={x:side===0?PW-dist:dist,y:PH/2+gauss(0,10)};
  M.ballOwner=taker; taker.x=M.ball.x; taker.y=M.ball.y;
  doCross(M,side,taker);
}
function cardCheck(M,side,D,inBox){
  const agg=D.p.a.aggression;
  let pY=0.10+agg*0.006;
  if(inBox) pY+=0.06;
  if(D.yellow>=1) pY*=0.22;                 // 身背黄牌的球员会收着踢，裁判也更少掏第二张
  if(rnd()<pY){
    if(D.yellow>=1 || rnd()<0.010){
      D.red=1; D.yellow=D.yellow; D.off=true; M.stats[side].red++; D.rating-=1.3;
      addEvent(M,"card",`🟥 ${nm(D)} 被红牌罚下！`,"card");
    } else {
      D.yellow=1; M.stats[side].yellow++; D.rating-=0.25;
      addEvent(M,"card",`🟨 ${nm(D)} 吃到黄牌`,"card");
    }
  }
  // 受伤
  if(rnd()<0.0035){
    const T=M.teams[1-side];
    const v=T.men[Math.floor(rnd()*T.men.length)];
    if(v && !v.off){ v.off=true; v.injured=true;
      addEvent(M,"hurt",`🚑 ${nm(v)} 受伤离场`,"hurt"); }
  }
}

// ---------- 换人 ----------
function canSub(M,side){ return M.subsMade[side]<5; }
function doSub(M,side,outMan,inPid){
  if(!canSub(M,side)) return false;
  const T=M.teams[side], p=P(inPid);
  if(T.benchUsed.includes(inPid)) return false;
  const slots=FORMATIONS[T.form];
  const w=slotWorld(slots[outMan.slot][1],slots[outMan.slot][2],side);
  outMan.off=true;
  const nm2={id:inPid,p,slot:outMan.slot,pos:slots[outMan.slot][0],bx:w.x,by:w.y,x:w.x,y:w.y,
    cond:p.condition,rating:6.4,goals:0,assists:0,shots:0,sot:0,passes:0,passOk:0,tackles:0,tackleOk:0,
    saves:0,keyp:0,drib:0,yellow:0,red:0,off:false,mins:0,subIn:M.t};
  T.men.push(nm2); T.benchUsed.push(inPid); M.subsMade[side]++;
  if(outMan.pos==="GK") T.gk=nm2;
  addEvent(M,"sub",`🔁 ${C(T.cid).short} 换人：${nm(nm2)} 换下 ${nm(outMan)}`,"sys");
  if(M.ballOwner===outMan) M.ballOwner=nm2;
  return true;
}
// 落后：70 分钟后压上；领先：最后 15 分钟收缩（弱队更愿意收）。只调一次。玩家现场观战时不碰玩家一方
function aiTactics(M){
  if(M.t<70) return;
  M.teams.forEach((T,side)=>{
    if(side===M.userSide && !M.autoUser && subModeOf(M)!=="all") return;
    if(T.adj) return;
    const diff=M.score[side]-M.score[1-side], b=T.tac0||T.tac;
    if(diff<0 && M.t>=70){ T.adj=1; if(rnd()<0.8){ T.tac.mentality=Math.min(4,b.mentality+2); T.tac.tempo=Math.min(4,b.tempo+1); } }
    else if(diff>0 && M.t>=75){ T.adj=1;
      const weaker = squadStrength(C(T.cid)) < squadStrength(C(M.teams[1-side].cid));
      if(rnd()<(weaker?0.85:0.55)){ T.tac.mentality=Math.max(0,b.mentality-(weaker?2:1)); T.tac.press=Math.max(0,b.press-1); } }
  });
}
function aiSubs(M){
  M.teams.forEach((T,side)=>{
    // 玩家一方按换人开关：全管=和电脑一样；只补伤员=只换伤员；全手动=助教一个都不换
    const mode = (side===M.userSide && !M.autoUser)? subModeOf(M) : "all";
    if(mode==="manual") return;
    const userLive = mode==="inj";
    if(!canSub(M,side)) return;
    if(M.t<55 && !T.men.some(m=>m.injured&&m.off&&!m.subDone)) return;
    // 受伤优先
    let out=T.men.find(m=>m.off&&m.injured&&!m.subDone);
    if(out){ out.subDone=true; }
    else {
      if(userLive) return;
      if(rnd()>0.045) return;
      const cands=T.men.filter(m=>!m.off&&m.pos!=="GK"&&m.cond<64);
      if(!cands.length) return;
      out=cands.reduce((b,m)=>m.cond<b.cond?m:b);
    }
    const club=C(T.cid);
    const bench=club.subs.filter(id=>!T.benchUsed.includes(id)&&P(id).injury<=0);
    if(!bench.length) return;
    const slots=FORMATIONS[T.form], want=slots[out.slot][0];
    let bestId=null,bs=-1;
    bench.forEach(id=>{ const sc=playerScore(P(id),want)* (P(id).pos===want?1.1:1);
      if(sc>bs){bs=sc;bestId=id;} });
    if(bestId) doSub(M,side,out,bestId);
  });
}

// ---------- 结束 ----------
function endMatch(M){
  M.done=true;
  const tot=M.possTicks[0]+M.possTicks[1]||1;
  M.stats[0].poss=Math.round(M.possTicks[0]/tot*100);
  M.stats[1].poss=100-M.stats[0].poss;
  M.teams.forEach((T,side)=>{
    const conceded=M.score[1-side];
    T.men.forEach(m=>{
      if(conceded===0 && m.mins>44){ m.rating += m.pos==="GK"?0.45:(POS_GRP[m.pos]==="df"?0.3:0.1); }
      let r = m.rating + (M.score[side]-M.score[1-side])*0.07;
      if(r>7.4) r = 7.4 + (r-7.4)*0.58;          // 压缩高分尾部
      if(r<5.2) r = 5.2 - (5.2-r)*0.75;
      m.rating = Math.round(clamp(r,3.2,10.0)*10)/10;
    });
  });
  // 全场最佳
  let best=null; M.teams.forEach(T=>T.men.forEach(m=>{ if(!best||m.rating>best.rating) best=m; }));
  M.motm=best;
  const agg0=M.score[0]+(M.aggBase?M.aggBase[0]:0), agg1=M.score[1]+(M.aggBase?M.aggBase[1]:0);
  if(M.knockout && agg0===agg1){
    // 点球大战
    let p=[0,0];
    for(let i=0;i<5;i++){ if(rnd()<0.75)p[0]++; if(rnd()<0.75)p[1]++; }
    while(p[0]===p[1]){ if(rnd()<0.75)p[0]++; if(rnd()<0.75)p[1]++; }
    M.pens=p;
    addEvent(M,"sys",`点球大战 ${p[0]}-${p[1]}，${C(p[0]>p[1]?M.h:M.a).cn} 晋级`,"sys");
  }
  addEvent(M,"sys",`—— 全场结束  ${C(M.h).short} ${M.score[0]} : ${M.score[1]} ${C(M.a).short} ——`,"sys");
}
function runMatch(M){ let guard=0; while(!M.done && guard++<20000) stepMatch(M); return M; }

function applyResult(fx, M){
  fx.played=true; fx.hg=M.score[0]; fx.ag=M.score[1]; fx.pens=M.pens;
  fx.stats=[M.stats[0],M.stats[1]];
  fx.scorers=[[],[]];
  M.events.filter(e=>e.type==="goal").forEach(e=>{});
  const H=C(fx.home), A=C(fx.away);
  if(EURO_COMPS[fx.comp] && fx.stage==="G" && WORLD.euro && WORLD.euro[fx.comp]) euroApplyGroupResult(WORLD.euro[fx.comp], fx);
  if(fx.comp==="L"){
    [[H,M.score[0],M.score[1]],[A,M.score[1],M.score[0]]].forEach(([c,gf,ga])=>{
      const s=c.seasonStats; s.p++; s.gf+=gf; s.ga+=ga;
      if(gf>ga){s.w++;s.pts+=3;c.form.push("W");}
      else if(gf===ga){s.d++;s.pts++;c.form.push("D");}
      else {s.l++;c.form.push("L");}
      if(c.form.length>8) c.form.shift();
    });
  }
  // 上座与收入
  const att0=Math.round(Math.min(H.cap, H.cap*(0.55+H.rep/220+ (H.seasonStats.pts/Math.max(1,H.seasonStats.p))*0.06)));
  const price = ticketPrice(H);
  const gate = Math.round(att0*price*(fx.comp==="C"?0.8: EURO_COMPS[fx.comp]?1.3 : 1));
  if(fx.neutral){ addMoney(H, Math.round(gate/2), "决赛门票分成 vs "+A.short); addMoney(A, Math.round(gate/2), "决赛门票分成 vs "+H.short); }
  else addMoney(H, gate, "门票收入 vs "+A.short);
  fx.attendance=att0; FIN_CLK++;
  // 球员数据结算
  M.teams.forEach((T,side)=>{
    const conceded=M.score[1-side];
    T.men.forEach(m=>{
      const p=P(m.id);
      p.condition=Math.round(m.cond);
      p.apps++; p.careerApps++; p.goals+=m.goals; p.careerGoals+=m.goals;
      p.assists+=m.assists; p.ratingSum+=m.rating;
      p.form.push(m.rating); if(p.form.length>6)p.form.shift();
      if(conceded===0 && p.pos==="GK" && m.mins>60) p.cleanSheet++;
      if(m.yellow) p.yellow++;
      if(m.red){ p.red++; p.susp += ri(1,3); }
      else if(p.yellow>0 && p.yellow%5===0 && m.yellow) p.susp+=1;
      p.sharp=clamp(p.sharp + (m.mins>60?6:m.mins>20?3:0),0,100);
      // 士气
      const res = M.score[side]-M.score[1-side];
      let dm = res>0?ri(3,8): res===0?ri(-2,3): ri(-8,-2);
      if(m.mins<10) dm-=2;
      if(m.goals) dm+=4*m.goals;
      p.morale=clamp(p.morale+dm,5,100);
      if(m.injured){
        const sev=rnd();
        p.injury = sev<0.55? ri(3,10) : sev<0.85? ri(11,30) : ri(31,120);
        p.injType = p.injury<11?"轻伤":p.injury<31?"肌肉拉伤":"重伤";
        injuryHitsPotential(p,p.injury);
        if(T.cid===WORLD.userClub) news(`${p.cn} 受伤`,`${p.cn} 在对阵${C(side===0?fx.away:fx.home).cn}的比赛中受伤，预计缺阵约 ${p.injury} 天（${p.injType}）。`,"bad");
      }
    });
    if(M.motm && T.men.includes(M.motm)) {}
  });
  if(M.motm) P(M.motm.id).motm++;
  // 未出场球员恢复
  [H,A].forEach(c=>{ c.squad.forEach(id=>{ const p=P(id);
    if(!M.teams.flatMap(t=>t.men).some(m=>m.id===id)) p.condition=clamp(p.condition+ri(2,6),0,100); }); });
  if(fx.comp==="C") { /* 杯赛晋级在当日统一处理 */ }
  fx.motm = M.motm? M.motm.id : null;
  fx.events = M.events.filter(e=>["goal","card","hurt","pen"].includes(e.type)).map(e=>({t:e.t,x:e.text,c:e.cls}));
}

// 外围队（只打欧战）没有联赛主场：按 17 个本国联赛主场折算门票，和转播一起分 10 期按月发
const EURO_TV_K=95;                 // 本国联赛转播 = rep³×K（赛季中发一半、赛季末发一半）
const EURO_HOME_GAMES=17;
function euroDomesticGate(c){
  const price=["葡萄牙","荷兰","土耳其"].includes(c.country)? 22 : 16;
  const att=Math.min(c.cap, c.cap*(0.55+c.rep/220+0.09));
  return Math.round(EURO_HOME_GAMES*att*price);
}
function ticketPrice(c){
  const lg=LG(c); if(lg) return lg.price;
  return c.rep>=70? 30 : 22;
}
function addMoney(club, amt, memo){
  club.finance.balance += amt;
  if(amt>0) club.finance.income+=amt; else club.finance.expense-=amt;
  club.finance.ledger.unshift({d:WORLD.day, amt, memo});
  if(club.finance.ledger.length>90) club.finance.ledger.length=90;
}

// ---------- 俱乐部建设 ----------
const FACILITIES=[
  {k:"coachRating",  n:"教练团队", ic:"🎓", desc:"球员训练成长更快，临场发挥更稳", mult:1.0},
  {k:"physioRating", n:"医疗中心", ic:"🏥", desc:"体能恢复更快，训练与比赛受伤风险更低", mult:0.85},
  {k:"scoutRating",  n:"球探网络", ic:"🔍", desc:"关注名单的情报积累更快，更早看清真实潜力", mult:0.7},
  {k:"youthRating",  n:"青训学院", ic:"🌱", desc:"每年 3 月输送的青训球员起点与潜力更高", mult:1.1}
];
const STADIUM_OPTS=[2000,5000,10000];
const STADIUM_MAX=90000;
function projectsOf(c){ if(!c.projects) c.projects=[]; return c.projects; }
function facilityCost(c,f){ const L=c[f.k]; return Math.round((Math.pow(L,2.5)*60000+250000)*f.mult*(0.5+c.rep/100)); }
function facilityDays(c,f){ return 40+c[f.k]*6; }
function stadiumCost(c,seats){ return Math.round(seats*4000*(0.7+c.rep/150)*(1+c.cap/120000)); }
function stadiumDays(seats){ return 120+Math.round(seats/50); }
function activeProject(c,type,key){ return projectsOf(c).find(p=>p.type===type && (key==null||p.k===key)); }
function startFacility(c,f){
  const say=m=>{ if(c.id===WORLD.userClub) toast(m,"bad"); };
  if(c[f.k]>=20){ say("已达最高等级"); return false; }
  if(activeProject(c,"fac",f.k)){ say("该设施正在升级中"); return false; }
  const cost=facilityCost(c,f);
  if(c.finance.balance<cost){ say("余额不足"); return false; }
  const d=facilityDays(c,f);
  addMoney(c,-cost,`${f.n}升级至 ${c[f.k]+1} 级`);
  projectsOf(c).push({type:"fac",k:f.k,n:f.n,to:c[f.k]+1,left:d,total:d,cost});
  return true;
}
function startStadium(c,seats){
  const say=m=>{ if(c.id===WORLD.userClub) toast(m,"bad"); };
  if(activeProject(c,"stad")){ say("球场扩建正在进行中"); return false; }
  if(c.cap+seats>STADIUM_MAX){ say("超过球场容量上限 "+STADIUM_MAX.toLocaleString()); return false; }
  const cost=stadiumCost(c,seats);
  if(c.finance.balance<cost){ say("余额不足"); return false; }
  const d=stadiumDays(seats);
  addMoney(c,-cost,`球场扩建 +${seats.toLocaleString()} 座`);
  projectsOf(c).push({type:"stad",seats,n:"球场扩建",left:d,total:d,cost});
  return true;
}
function tickProjects(){
  WORLD.clubs.forEach(c=>{
    const ps=projectsOf(c); if(!ps.length) return;
    ps.forEach(p=>p.left--);
    ps.filter(p=>p.left<=0).forEach(p=>{
      if(p.type==="fac"){
        c[p.k]=clamp(c[p.k]+1,3,20);
        if(c.id===WORLD.userClub) news(`${p.n}升级完成`,`${p.n}已升级至 ${c[p.k]} 级，新的设施即刻投入使用。`,"good");
      } else {
        c.cap+=p.seats; c.rep=clamp(c.rep+1,1,100);
        if(c.id===WORLD.userClub) news("球场扩建竣工",`${c.stadium}的新看台正式落成，容量增至 ${c.cap.toLocaleString()} 座，俱乐部声望 +1。`,"good");
      }
    });
    c.projects=ps.filter(p=>p.left>0);
  });
}
// AI 俱乐部赛季末投资：余额充裕时升级最弱设施；常年满座则扩建
function aiInvest(c){
  const reserve=Math.pow(c.rep,3)*25;
  let n=0;
  const facs=FACILITIES.filter(f=>c[f.k]<20 && !activeProject(c,"fac",f.k)).sort((a,b)=>c[a.k]-c[b.k]);
  for(const f of facs){ if(n>=2) break;
    const cost=facilityCost(c,f);
    if(c.finance.balance-cost>reserve && cost<c.finance.balance*0.3 && startFacility(c,f)) n++;
  }
  const occ=0.55+c.rep/220+(c.lastRank?(21-c.lastRank)/20*0.09:0.06);
  if(occ>=0.96 && !activeProject(c,"stad")){
    const seats=c.cap>=50000?10000:5000;
    if(c.cap+seats<=STADIUM_MAX){
      const cost=stadiumCost(c,seats);
      if(c.finance.balance-cost>reserve && cost<c.finance.balance*0.35) startStadium(c,seats);
    }
  }
}

function trainClub(c){
  const focus=TRAIN_FOCUS[c.trainFocus];
  const inten=[0.45,0.75,1,1.28,1.55][c.trainIntensity];
  c.squad.forEach(id=>{
    const p=P(id);
    if(p.injury>18) return;
    const ageF = p.age<=18?1.55: p.age<=20?1.35: p.age<=22?1.12: p.age<=24?0.85: p.age<=26?0.55: p.age<=28?0.30: p.age<=30?0.12:0.03;
    const coachF = 0.55 + c.coachRating*0.055;
    const gp=c.seasonStats.p||0, share = gp>=3? clamp(p.apps/gp,0,1.25) : 0.6;   // 赛季头几轮按中性算
    const playF = p.age<=21? 0.45 + Math.min(1,share)*0.9 : 0.75 + share*0.45;   // 21 岁以下不上场就长不动
    const profF = 0.5 + (profOf(p)-1)/19*0.8;                                     // 职业素养 0.5~1.3
    const gap = Math.max(0,p.pa-p.ca);
    let gain = gap*0.0052*ageF*coachF*playF*profF*inten*(0.55+p.a.workrate/22)*(0.7+rnd()*0.7);
    if(p.loan){                                        // 租到低级别：出场多但对手弱，成长打折
      const o=C(p.loan.owner);
      const d = o.nation===c.nation ? (c.tier-o.tier) : (o.rep-c.rep>12 ? 1 : 0);
      gain *= d>=2? 0.7 : d===1? 0.85 : d<0? 1.1 : 1;
    }
    if(p.ca>=devCap(p)) gain *= 0.15;                  // 已经吃满这个年龄该有的水平
    // 老化衰退
    if(p.age>=30) gain -= (p.age-29)*0.055*(1.15-p.a.stamina*0.012);
    if(p.injury>0) gain*=0.25;
    p.dev=(p.dev||0)+gain;
    while(p.dev>=1){ p.dev-=1; bumpAttr(p,focus.a,+1,c); }
    while(p.dev<=-1){ p.dev+=1; bumpAttr(p,null,-1,c); }
    p.value=calcValue(p);
    // 士气自然回归
    p.morale = clamp(p.morale + (p.morale<55?1.5:-0.4) + (p.injury>0?-1.2:0), 5,100);
  });
}
function bumpAttr(p,focusList,dir,club){
  const w=POS_WEIGHTS[p.pos];
  let pool=[];
  if(dir>0){
    for(const k in w) for(let i=0;i<w[k];i++) pool.push(k);
    if(focusList) focusList.forEach(k=>{ for(let i=0;i<7;i++) pool.push(k); });
    if(p.pos==="GK") for(const k in ATTRS_GK) for(let i=0;i<3;i++) pool.push(k);
    pool=pool.filter(k=>p.a[k]<20);
  } else {
    // 衰退优先身体属性
    ["pace","accel","agility","stamina","jumping","strength"].forEach(k=>{ for(let i=0;i<4;i++) pool.push(k); });
    for(const k in w) pool.push(k);
    pool=pool.filter(k=>p.a[k]>1);
  }
  if(!pool.length) return;
  const k=pick(pool);
  p.a[k]=clamp(p.a[k]+dir,1,20);
  const nc=calcCA(p.a,p.pos);
  if(dir>0 && (nc>p.pa || nc>devCap(p))) { p.a[k]-=dir; return; }
  p.ca=nc;
  if(dir>0 && club && club.id===WORLD.userClub && rnd()<0.06)
    news(`${p.cn} 状态提升`,`训练报告：${p.cn} 的「${ALL_ATTRS[k]}」提升到 ${p.a[k]}。`,"good");
}

function boardReview(){
  WORLD.clubs.forEach(c=>{
    const r=leagueRowOf(c);
    if(!r||r.p<4) return;
    const diff = r.rank - c.board.target;      // 正数=低于期望
    const dc = diff<=0? 0.75 : diff<=2? -0.15 : diff<=5? -0.45 : diff<=9? -0.80 : -1.15;
    c.board.conf = clamp(c.board.conf + dc, 0, 100);
    if(c.finance.balance < -Math.pow(c.rep,3)*30) c.board.conf-=0.8;
  });

  }

}

// ---------- 转会 ----------
function inTransferWindow(){
  const d=WORLD.day;                     // 8/1 起
  const dt=dateOf(d), m=dt.getMonth()+1;
  return m===8 || (m===1);
}
function windowName(){ const m=dateOf(WORLD.day).getMonth()+1; return m===8?"夏窗":m===1?"冬窗":null; }


/* ================= 财政 v37：转会预算 + 工资预算合并为一笔「可用资金」 =================
   规范见项目目录《财政系统合并规范.md》。核心是 avail(c) 无状态：转会费、工资、卖人
   都通过 balance / weeklyWages 自动反映，不需要任何地方手工加减存量字段。 */
const BAL_RELEASE = 0.35;                       // 赛季初余额释放比例。校准项 C3：管豪门，0.42 时曼城 8 季后 avail 顶到 £220M
const OPEX_RATE   = 0.20;                       // 营收中视为运营留存、不可用于阵容的比例（不真扣现金）
const WAGE_CAP    = {0:0.85, 1:0.92, 2:0.95};   // 下季承诺工资 / 预计营收 上限，按 tier；欧战散队 tier 0
const CAP_RATCHET = 0.94;                       // 过渡棘轮：已超 k×rev0 的队，上限按赛季初现有工资的 94% 核定（每季至少压 6%）
function wageCapK(c){ const k=WAGE_CAP[c.tier]; return k==null? 0.90 : k; }

let FIN_CLK = 0;                                // 每场比赛结算后 +1，让营收预测缓存失效
/* 营收预测：一次扫完 fixtures 建索引，238 队共用。别在逐队循环里重复扫。
   原则是只算确定或接近确定的、往低估——低估的部分赛季中变成真金进余额，avail 自然上浮。 */
function revScan(fromDay, allGames){
  const home=new Map();
  WORLD.fixtures.forEach(f=>{
    if(f.comp!=="L" || f.neutral) return;
    if(!allGames && (f.played || f.day<fromDay)) return;
    home.set(f.home,(home.get(f.home)||0)+1);
  });
  let mon=0, tv=0;
  for(let d=fromDay; d<SEASON_DAYS; d++){
    if(dateOf(d).getDay()!==1) continue;         // 赞助与转播都在周一的 weeklyTick 发
    mon++; const wk=Math.floor(d/7); if(wk%4===2 && wk<40) tv++;
  }
  return {home, mon, tv, m:new Map()};
}
const REV_RANK = 1;   // 1 = 名次奖金按上季名次估；0 = 一律按倒数第一（规范原稿）
/* 赛季末名次奖金的预估。一律按倒数第一对 hi/lo 拉得开的联赛低估太多
   （德甲 38M~100M，拜仁按倒一算只有 19M，实际拿 100M 上下），
   于是这些队的工资天然顶破按 rev0 算的 cap。改成按「上季名次」估——
   这是「接近确定」的量，再打 0.85 的保守折，仍然是往低估。*/
function endPrize(c){
  const lg=LG(c); if(!lg) return Math.pow(c.rep,3)*EURO_TV_K;
  const [hi,lo]=lg.prize, n=Math.max(2, lg.clubIds.length);
  if(!REV_RANK) return lo*0.5;
  let rank;
  if(c.lastLg===c.lg && c.lastRank>0) rank=c.lastRank;
  else { const by=[...lg.clubIds].sort((a,b)=>C(b).rep-C(a).rep); rank=by.indexOf(c.id)+1; if(rank<1) rank=n; }
  rank=clamp(rank, 1, n);
  return (lo*0.5 + (hi-lo)*(n-rank)/(n-1)) * 0.85;
}
function revOf(c, R){
  let v=R.m.get(c.id); if(v!=null) return v;
  const lg=LG(c), cap=c.cap||0;
  const att=Math.round(Math.min(cap, cap*(0.55 + c.rep/220 + 0.06)));    // 场均积分按 1.0 保守估
  v=Math.round(Math.pow(c.rep,3)*2*R.mon                                  // 商业赞助
    + (lg? lg.prize[1]*0.5/10 : (Math.pow(c.rep,3)*EURO_TV_K + (c.nation===EURO_NATION? euroDomesticGate(c) : 0))/10)*R.tv   // 月度转播（外围队含本国联赛门票）
    + (R.home.get(c.id)||0)*att*ticketPrice(c)                            // 联赛主场门票（杯赛/欧战不算）
    + endPrize(c)                                                         // 赛季末名次奖金
    + (R===REV_S? euroExpected(c) : 0));                                  // 已确定的欧战收入（只进整季预测 rev0）
  R.m.set(c.id,v); return v;
}
/* 赛季初已经拿到欧冠/欧联资格的队：参赛奖金 + 按小组赛两胜一平估的奖金，打 0.85 折。*/
function euroExpected(c){
  const E=c.euro && EURO_COMPS[c.euro]; if(!E) return 0;
  const z=E.prize; return Math.round((z.enter + 2*z.win + z.draw)*0.85);
}
let REV_R={key:""}, REV_S={key:""};
function revRemain(c){                            // 本季剩余
  const key=absDay()+"/"+FIN_CLK;
  if(REV_R.key!==key){ REV_R=revScan(WORLD.day,false); REV_R.key=key; }
  return revOf(c, REV_R);
}
function revSeason(c){                            // 整季（不管已踢多少），用来定 rev0
  const key="s"+WORLD.season;
  if(REV_S.key!==key){ REV_S=revScan(0,true); REV_S.key=key; }
  return revOf(c, REV_S);
}
function remWeeks(c){ return Math.max(0, Math.ceil((SEASON_DAYS-WORLD.day)/7)); }
function wageRemain(c){ return weeklyWages(c)*remWeeks(c); }   // 含租借分摊，与实际扣款口径一致

/* 字段兜底。v17/v18 的老档 migrate 逻辑走不全，凡是读 locked/rev0/alloc0 的都走这里。*/
function fin3(c){
  const f=c.finance;
  if(f.locked==null) f.locked=Math.round((1-BAL_RELEASE)*Math.max(0,f.balance));
  if(f.grant==null)  f.grant=0;
  if(!(f.rev0>0))    f.rev0=revSeason(c);
  if(f.alloc0==null) f.alloc0=Math.round(avail(c));
  if(!(f.cap0>0))    f.cap0=Math.round(Math.max(wageCapK(c)*f.rev0, ownWages(c)*CAP_RATCHET));
  return f;
}
/* 可用资金。可以为负（那就是资金缺口）。玩家看到的主数字。*/
function avail(c){
  const f=c.finance;
  const locked = f.locked!=null? f.locked : Math.round((1-BAL_RELEASE)*Math.max(0,f.balance));
  return Math.round(f.balance + revRemain(c)*(1-OPEX_RATE) - wageRemain(c) - locked + (f.grant||0));
}
/* 下赛季仍在合同期的自有球员（含外租，不含租入）年薪合计 */
function committedNext(c){
  let w=0;
  c.squad.forEach(id=>{ const p=P(id); if(p && !p.loan && p.contract>WORLD.season) w+=p.wage*52; });
  (c.loanedOut||[]).forEach(id=>{ const p=P(id); if(p && p.contract>WORLD.season) w+=p.wage*52; });
  return Math.round(w);
}
/* 自有球员全部年薪：含本季到期的、含外租的全额，不含租入。棘轮的基数。*/
function ownWages(c){
  let w=0;
  c.squad.forEach(id=>{ const p=P(id); if(p && !p.loan) w+=p.wage*52; });
  (c.loanedOut||[]).forEach(id=>{ const p=P(id); if(p) w+=p.wage*52; });
  return Math.round(w);
}
/* 本季工资上限。赛季初核定一次存进 cap0，赛季中不变。
   已经超出 k×rev0 的队走过渡棘轮：上限 = 现有工资 × 0.94，每季至少压 6%。
   基数用 ownWages 而不是 committedNext——否则一支现有工资 £25M、其中 £5M 本季到期的队，
   上限会被压到 £20M×0.94，连到期的人都替换不了，整队冻住。用 £25M×0.94 = £23.5M，
   它能补回 £3.5M：到期的钱不能全花，每季自然收 6%，合同到期本身还会加速收敛。*/
const CAP_MODE = 1;   // 0 = 锚在当季 ownWages（§10.2 原稿）；1 = 锚在上季 cap0，6% 逐季复利
/* 本季上限的棘轮基数。CAP_MODE=1 时锚在上季上限：ownWages 只在第一次（建世界 / 老档迁移）当种子。
   原稿锚在当季 ownWages，实测不收敛——原薪续约免检，球队每季把工资填回上限，
   ownWages 不降，cap0 就跟着它原地踏步（8 季超 cap 队一直在 50~99）。*/
function capBase(c){
  const f=c.finance;
  if(CAP_MODE && f.cap0>0) return Math.min(f.cap0, Math.max(ownWages(c), wageCapK(c)*f.rev0));
  return ownWages(c);
}
function capTarget(c){ return Math.round(wageCapK(c)*fin3(c).rev0); }   // 董事会的最终目标
function wageCap(c){ return fin3(c).cap0; }
function inCapTransition(c){ return fin3(c).cap0 > capTarget(c)+1; }    // 是否还在过渡期
/* 本季到期的合同年薪合计——给玩家的出路提示 */
function expiringWages(c){
  let w=0;
  c.squad.forEach(id=>{ const p=P(id); if(p && !p.loan && p.contract===WORLD.season) w+=p.wage*52; });
  (c.loanedOut||[]).forEach(id=>{ const p=P(id); if(p && p.contract===WORLD.season) w+=p.wage*52; });
  return Math.round(w);
}
/* 唯一的准入函数。两条规则都要过：
   1 现金——这季付得起（转会费 + 本季要付的工资）；
   2 结构——下季承诺工资不超过预计营收的 k，防止把全部可用资金签成多年工资。
   fee 转会费(£)，annual 该合同年薪(£/年，租借传己方承担部分)，
   opt.weeks 本季实际要付的周数（默认 remWeeks），opt.nextYear=false 表示下季不在（租借），
   opt.capAnnual 单独给规则 2 用的年薪——续约一个本季到期的球员时，
   本季现金只多付涨薪那部分（他本来就在发薪名单上），但下季承诺是**整份**新增的。*/
function canAfford(c, fee, annual, opt){
  opt=opt||{};
  const weeks = opt.weeks==null? remWeeks(c) : opt.weeks;
  const capAn = opt.capAnnual==null? annual : opt.capAnnual;
  const cash  = (fee||0) + annual*weeks/52;
  const av    = avail(c);
  if(cash > av) return {ok:false, why:"cash", gap:Math.round(cash-av), weeks, cash:Math.round(cash)};
  if(opt.nextYear!==false && capAn>0){
    const next=committedNext(c)+capAn, cap=wageCap(c);
    if(next > cap) return {ok:false, why:"cap", gap:Math.round(next-cap), next:Math.round(next), cap, weeks};
  }
  return {ok:true, weeks};
}
/* 拒绝文案：说清差多少、为什么、怎么办 */
function affordMsg(c, r, fee, annual){
  if(r.why==="cash")
    return `可用资金不足，差 ${money(r.gap)}。这笔签约本季要占用 ${money(fee||0)} 转会费 + ${money(Math.round(annual*r.weeks/52))} 工资（${r.weeks} 周）。卖人或等合同到期可以腾出空间。`;
  const over = committedNext(c) > wageCap(c);
  const tr = inCapTransition(c);
  return (over? "俱乐部工资承诺已超出本季上限，只能原薪续约或等合同到期。" : "")
    + `下季工资承诺将达 ${money(r.next)}，`
    + (tr? `超过本季上限 ${money(r.cap)}（过渡期，目标 预计营收 ${money(fin3(c).rev0)} 的 ${Math.round(wageCapK(c)*100)}%）。`
         : `超过董事会上限 ${money(r.cap)}（预计营收 ${money(fin3(c).rev0)} 的 ${Math.round(wageCapK(c)*100)}%）。`)
    + `差 ${money(r.gap)}/年。本季到期合同可释放 ${money(expiringWages(c))}/年。`;
}
/* 每季初重新核定。调用点：newWorld（buildSeason 之后）、endSeason（buildSeason 之后）、migrateWorld */
function resetSeasonFinance(c){
  const f=c.finance;
  f.locked = Math.round((1-BAL_RELEASE)*Math.max(0, f.balance));
  f.grant  = 0;
  f.rev0   = revSeason(c);
  f.cap0   = Math.round(Math.max(wageCapK(c)*f.rev0, capBase(c)*CAP_RATCHET));   // 过渡棘轮
  f.alloc0 = Math.round(avail(c));      // 此时 grant=0、day=0，就是董事会核定值
}

// 年度工资预算：随声望浮动，并保证不低于现有薪资总额的 1.12 倍（小球会也要有签人空间）
/* AI 判断能否负担某份合同。v37 起玩家和 AI 走同一条规则（没有自动调配了）。
   第二个参数是年薪、第三个是转会费，语义与 canAfford 对得上。*/
function aiAffordWage(c, annual, fee){ return canAfford(c, fee||0, annual).ok; }
/* 阵容保底闸。cap 把补人拦住、合同又到期，球队会一路缩到踢不了球——
   棘轮该压工资，不该压到 11 人踢不出阵容。人数不足 18 时，签自由球员只过现金规则、跳过 cap。
   两道门防止它变成绕过 cap 的后门：
   1 只认市场价的便宜人（不许溢价抢人）；2 单份合同不超过本季上限的 6%（就是个替补的量级）。
   签到 18 人这道口就自动关上。*/
const SQUAD_FLOOR = 18;
function faReliefOK(c, p, annual){
  if(!p || c.squad.length>=SQUAD_FLOOR) return false;
  if(annual > marketWage(p)*52*1.35) return false;      // 溢价抢来的不算补窟窿
  if(annual > wageCap(c)*0.06) return false;            // 替补的量级
  return canAfford(c, 0, annual, {nextYear:false}).ok;  // 现金够就行
}
// 自由球员的市场期望周薪：按当前能力重算，避免旧合同价格与实际要价脱节
function marketWage(p){ return Math.max(300, Math.round(calcWage(p,30)*0.92/50)*50); }
function askingPrice(p){
  const c=ownerOf(p)>=0?C(ownerOf(p)):null;
  let base=p.value;
  if(!c) return 0;        // 自由球员免签。以前收「身价×30%」，而 AI 签同一个人付 0，只坑玩家
  const same=c.squad.map(i=>P(i)).filter(q=>q.pos===p.pos).sort((a,b)=>b.ca-a.ca);
  const isKey = same.indexOf(p)===0;
  let mult = 1.04 + (isKey?0.28:0) + c.rep/520;          // 年轻/表现溢价已进身价（valueCA）
  const yrs=p.contract-WORLD.season;
  if(yrs<=0) mult*=0.30; else if(yrs===1) mult*=0.66;
  if(p.morale<40) mult*=0.86;
  if(p.injury>20) mult*=0.80;
  if(p.age<=21 && p.pa>=150) mult *= 1.35 + (p.pa-150)/100;   // 少年天才：俱乐部知道手里是什么
  if(p.listed && p.clubId!==WORLD.userClub) mult*=0.85; // AI 挂牌 → 折价
  return Math.max(5000, Math.round(base*mult/1000)*1000);
}
// 必须是确定性的：报价弹窗里展示的要求，与提交时校验的要求要完全一致
function wageDemand(p, club){
  const w=calcWage(p,club.rep,club);
  const h=(hashStr(p.id+"|"+club.id+"|"+p.contract)%1000)/1000;
  const own=p.clubId>=0? C(p.clubId) : null;
  const k=own? clamp(wageF(club)/wageF(own),0.6,1) : 1;          // 去薪资水平更低的联赛，现薪地板跟着打折
  return Math.round(Math.max(p.wage*1.06*k, w*(0.95+h*0.35))/50)*50;
}
function squadNeed(club){
  // 返回最薄弱的位置
  let worst=null, ws=1e9;
  SQUAD_TEMPLATE.forEach(([pos,n])=>{
    const arr=club.squad.map(i=>P(i)).filter(p=>p.pos===pos||(p.pos2||[]).includes(pos));
    const s = arr.length? arr.sort((a,b)=>b.ca-a.ca)[0].ca * (arr.length>=n-1?1:0.75) : 0;
    if(s<ws){ws=s;worst=pos;}
  });
  return {pos:worst, cur:ws};
}
function canSell(club,p){
  if(p.loan) return false;                     // 租借中不可出售
  const same=club.squad.filter(i=>P(i).pos===p.pos);
  return same.length>2;
}
/* 把球员踢成自由身的唯一入口。以前六处各写各的，其中三处忘了重置 contract，
   于是出现「自由球员 · 合同至 2029 年」——而 calcValue 按剩余合同年限打折
   （0 年 ×0.16、3 年 ×1），这些人身价直接虚高 6 倍多，玩家还得按虚高价掏签字费。
   注意不动 shortlist：被原东家扫地出门的球员，玩家多半更想继续盯着他。*/
function toFreeAgent(p, from){
  const c = from || (p.clubId>=0? C(p.clubId) : null);
  if(c) c.squad=c.squad.filter(i=>i!==p.id);
  p.clubId=-1; p.num=null;
  p.contract=WORLD.season;                       // 合同到此为止
  p.listed=false; p.untouchable=false; p.unrest=0; p.wantsLoan=false;
  p.wage=marketWage(p); p.value=calcValue(p);    // 先归零合同再算身价，顺序不能反
  WORLD.offers=(WORLD.offers||[]).filter(o=>o.pid!==p.id);
  if(!WORLD.freeAgents.includes(p.id)) WORLD.freeAgents.push(p.id);
  if(c) { if(c.id===WORLD.userClub) repairLineup(c); else autoPickLineup(c); }
}
// 把人从 A 队搬到 B 队：改 squad / clubId / 号码 / 阵容。买卖和租借都走这里；钱和合同由调用方处理
function movePlayer(pid, toClubId, fee, labelOut, labelIn){
  const p=P(pid), to=C(toClubId);
  const from = p.clubId>=0? C(p.clubId):null;
  if(from){ from.squad=from.squad.filter(i=>i!==pid); if(fee) addMoney(from, fee, `${labelOut||"出售"} ${p.cn}`);
            if(from.id===WORLD.userClub) repairLineup(from); else autoPickLineup(from); }
  else WORLD.freeAgents=WORLD.freeAgents.filter(i=>i!==pid);
  if(fee) addMoney(to, -fee, `${labelIn||"引进"} ${p.cn}`);
  p.num=null;                                  // 换东家就换号
  to.squad=to.squad.filter(i=>i!==pid); to.squad.push(pid); p.clubId=toClubId;
  // 已经是自己人就没必要再派球探盯着，否则他会永远卡在关注名单里（球员卡的阵容分支没有取消按钮）
  if(toClubId===WORLD.userClub) WORLD.shortlist=(WORLD.shortlist||[]).filter(s=>s.id!==pid);
  assignNumber(to, p);
  if(to.id===WORLD.userClub) repairLineup(to); else autoPickLineup(to);
  return {from,to};
}
function pushTransferLog(row){
  WORLD.transferLog.unshift(Object.assign({d:WORLD.day, s:WORLD.season}, row));
  if(WORLD.transferLog.length>200) WORLD.transferLog.length=200;
}
function transferPlayer(pid, toClubId, fee, wage, years){
  const p=P(pid);
  if(p.loan) return false;                     // 租借中的球员不可转会（归属权在母队）
  const {from,to}=movePlayer(pid, toClubId, fee);
  p.wage=wage; p.contract=WORLD.season+years; p.joinedAbs=WORLD.season*400+WORLD.day;
  p.wantsLoan=false;
  p.morale=clamp(p.morale+8,5,100); p.value=calcValue(p);
  pushTransferLog({pid, name:p.cn, pos:p.pos, from:from?from.id:-1, to:toClubId, fee});
  return true;
}

/* =========================================================
   球员外租
   租期内球员「真的搬过去」：clubId / squad 都在借入队，比赛训练统计照常；
   归属权（买卖、续约、挂牌、解约、合同到期）一律看 ownerOf(p)。
   ========================================================= */
function ownerOf(p){ return p ? (p.loan ? p.loan.owner : p.clubId) : -1; }
function isOnLoan(p){ return !!(p && p.loan); }
function loanedOutOf(c){ if(!c.loanedOut) c.loanedOut=[]; return c.loanedOut; }
// 冬窗首日（1 月 1 日）是赛季第几天
function winterDay(){ for(let d=100; d<SEASON_DAYS; d++){ const t=dateOf(d); if(t.getMonth()===0 && t.getDate()===1) return d; } return 153; }
// 归队日：half=半季（只有夏窗租出才有意义）→ 冬窗首日；否则赛季末（比 SEASON_DAYS 大，靠 endSeason 开头强制归队）
function loanUntilAbs(half){ const wd=winterDay(); if(half && WORLD.day<wd-14) return WORLD.season*400+wd; return WORLD.season*400+SEASON_DAYS+9; }
function loanIsHalf(L){ return !!(L && L.half && L.untilAbs%400 < SEASON_DAYS); }
// 一笔租借本季实际要付几周工资：半季的只算到冬窗
function loanWeeks(half){ return Math.max(1, Math.ceil((loanUntilAbs(!!half)-absDay())/7)); }
// 出租以来：借入队已赛场次 / 他出场次数
function loanGames(p){
  const L=p.loan; if(!L) return {apps:0,games:0,goals:0,rt:0};
  const cid=p.clubId;
  const games=WORLD.fixtures.filter(f=>f.played && f.day>=L.startDay && (f.home===cid||f.away===cid)).length;
  const apps=Math.max(0,p.apps-(L.startApps||0)), goals=Math.max(0,p.goals-(L.startGoals||0));
  const rt = apps? (p.ratingSum-(L.startRatingSum||0))/apps : 0;
  return {apps,games,goals,rt};
}
function loanAppsShare(p){ const g=loanGames(p); return g.games? g.apps/g.games : 1; }
// 出场条款是否被借入队满足（样本太少时视为满足）
function loanClauseMet(p){ const L=p.loan; if(!L||!L.minApps) return true; const g=loanGames(p); if(g.games<4) return true; return g.apps/g.games >= L.minApps; }
// 提前终止的补偿：剩余租期内对方承担那部分工资的 25%
function loanBreakCost(p, byOwner){
  const L=p.loan; if(!L) return 0;
  const weeks=Math.max(0, (L.untilAbs-absDay()))/7;
  const share = byOwner ? L.wageShare : (1-L.wageShare);      // 母队召回 → 赔借入队本来要付的；借入队退回 → 赔母队本来省下的
  if(byOwner && !loanClauseMet(p)) return 0;                  // 条款没满足，免费召回
  return Math.max(0, Math.round(p.wage*share*weeks*0.25/1000)*1000);
}
function loanPlayer(pid, toClubId, t){
  const p=P(pid); if(!p || p.loan || p.clubId<0 || p.clubId===toClubId) return false;
  t=t||{};
  const owner=C(p.clubId), to=C(toClubId);
  const fee=Math.max(0, Math.round((t.fee||0)/1000)*1000);
  movePlayer(pid, toClubId, 0);
  if(fee){ addMoney(owner, fee, `租借费 ${p.cn}`); addMoney(to, -fee, `租借费 ${p.cn}`); }
  p.loan={owner:owner.id, from:owner.id, to:toClubId, half:!!t.half, untilAbs:loanUntilAbs(!!t.half),
          wageShare: t.wageShare==null? 1 : t.wageShare, fee, minApps:t.minApps||0,
          startApps:p.apps, startGoals:p.goals, startRatingSum:p.ratingSum, startDay:WORLD.day, recalled:false, buyout:0};
  loanedOutOf(owner).push(pid);
  p.wantsLoan=false; p.listed=false; p.morale=clamp(p.morale+6,5,100);
  pushTransferLog({pid, name:p.cn, pos:p.pos, from:owner.id, to:toClubId, fee, loan:1});
  WORLD.offers=(WORLD.offers||[]).filter(o=>o.pid!==pid);
  WORLD.interest=interestList().filter(it=>it.pid!==pid);
  return true;
}
function loanReportText(p){
  const g=loanGames(p);
  return `出场 ${g.apps}/${g.games}，进 ${g.goals} 球${g.apps?`，平均评分 ${g.rt.toFixed(2)}`:""}`;
}
function returnLoan(pid, reason){
  const p=P(pid); if(!p || !p.loan) return false;
  const L=p.loan, owner=C(L.owner), host=p.clubId>=0? C(p.clubId) : null;
  const report=loanReportText(p);
  p.loan=null;
  if(host && host.id!==owner.id) movePlayer(pid, owner.id, 0);
  else if(!host){ WORLD.freeAgents=WORLD.freeAgents.filter(i=>i!==pid); owner.squad.push(pid); p.clubId=owner.id; assignNumber(owner,p); if(owner.id===WORLD.userClub) repairLineup(owner); else autoPickLineup(owner); }
  owner.loanedOut=loanedOutOf(owner).filter(i=>i!==pid);
  pushTransferLog({pid, name:p.cn, pos:p.pos, from:host?host.id:-1, to:owner.id, fee:0, loan:2});
  const why = reason==="recall"?"被召回":reason==="terminate"?"被借入方提前退回":"租借期满";
  if(owner.id===WORLD.userClub)
    news(`${p.cn} ${why}归队`,`${p.cn} 结束了在 ${host?host.cn:"外队"} 的租借回到球队。租借期间${report}。`, reason==="terminate"?"warn":"info");
  else if(host && host.id===WORLD.userClub)
    news(`${p.cn} ${why}`,`租借球员 ${p.cn} 已回到 ${owner.cn}。他在本队期间${report}。`,"info");
  return true;
}
// 母队召回（byOwner=true）或借入队提前退回（false）——都只能在转会窗
function terminateLoan(pid, byOwner){
  const p=P(pid); if(!p || !p.loan) return false;
  if(!inTransferWindow()) return false;
  const owner=C(p.loan.owner), host=C(p.clubId);
  const cost=loanBreakCost(p, byOwner);
  if(cost){
    const payer=byOwner?owner:host, payee=byOwner?host:owner;
    if(payer.finance.balance<cost && payer.id===WORLD.userClub) return false;
    addMoney(payer, -cost, `提前终止租借 ${p.cn}`); addMoney(payee, cost, `租借提前终止补偿 ${p.cn}`);
  }
  p.loan.recalled=true;
  return returnLoan(pid, byOwner?"recall":"terminate");
}
// 每天：到期归队。force=true（赛季末）全部归队；顺手修复索引
function processLoanExpiry(force){
  const now=absDay();
  Object.values(WORLD.players).forEach(p=>{ if(p.loan && (force || p.loan.untilAbs<=now)) returnLoan(p.id, force?"season":"expire"); });
  WORLD.clubs.forEach(c=>{ if(c.loanedOut) c.loanedOut=c.loanedOut.filter(id=>{ const q=P(id); return q && q.loan && q.loan.owner===c.id; }); });
}
// 周薪口径：租入的按 wageShare 付，租出去的付剩下那部分
function weeklyWages(c){
  let w=0;
  c.squad.forEach(i=>{ const p=P(i); if(!p) return; w += p.loan? p.wage*p.loan.wageShare : p.wage; });
  loanedOutOf(c).forEach(i=>{ const p=P(i); if(p && p.loan) w += p.wage*(1-p.loan.wageShare); });
  return Math.round(w);
}

// ---------- 外租：AI 规则 ----------
function clubGames(c){ return WORLD.fixtures.filter(f=>f.played&&(f.home===c.id||f.away===c.id)).length; }
function playShare(p){ const c=p.clubId>=0?C(p.clubId):null; if(!c) return 1; const g=clubGames(c); return g? p.apps/g : 1; }
// 同位置排名（1=最强）
function posRank(c,p){ return c.squad.map(i=>P(i)).filter(q=>q.pos===p.pos).sort((a,b)=>b.ca-a.ca).indexOf(p)+1; }
// 他去了这家俱乐部能不能首发：和对方同位置最强的比
function wouldStart(p,c){ const best=c.squad.map(i=>P(i)).filter(q=>q.pos===p.pos&&q.id!==p.id).sort((a,b)=>b.ca-a.ca)[0]; return !best || p.ca>=best.ca-2; }
// AI 母队愿不愿意把这名球员租出去
function aiWillLoanOut(p){
  if(p.loan || p.clubId<0 || p.clubId===WORLD.userClub) return false;
  const c=C(p.clubId);
  if(p.listed || p.injury>20) return false;
  if(!(p.age<=25 || p.age>=31)) return false;
  const same=c.squad.map(i=>P(i)).filter(q=>q.pos===p.pos);
  if(same.length<3) return false;              // 租走后该位置至少还剩 2 人
  if(posRank(c,p)<=2) return false;            // 前两顺位不租
  return true;
}
// AI 母队开出的租借条款（确定性：弹窗里显示的和提交时一致）
function loanTermsFor(p, borrower){
  const owner=C(ownerOf(p));
  const gap=owner.rep-borrower.rep;            // 正数 = 母队更强
  let fee=0;
  if(gap>0) fee=Math.round(p.value*(0.03+0.05*clamp(gap/30,0,1))/1e4)*1e4;
  return {fee, wageShare: gap>8?0.5:1, minApps: gap>8?0.6:0};
}
// 借入方（AI）会接受哪些条款：wageShare 越低、minApps 越高越难
function aiAcceptLoanTerms(p, b, t){
  if(!canAfford(b, t.fee||0, p.wage*52*t.wageShare, {nextYear:false}).ok) return false;   // 租借下季不在，不吃 cap
  if(t.wageShare<1 && !(p.ca>b.rep*1.75)) return false;     // 只有明显高出他们层级的球员，他们才肯让母队贴工资
  if(t.wageShare<=0 && !(p.ca>b.rep*2.0)) return false;
  if(t.minApps>0 && !wouldStart(p,b)) return false;          // 承诺不了出场就不签条款
  return true;
}
// 每周：玩家队出场不足的年轻人闹外租；外租简报
function loanWeekly(){
  const u=UC();
  const games=clubGames(u);
  if(games>=8){
    u.squad.map(i=>P(i)).forEach(p=>{
      if(p.loan) return;
      const share=p.apps/games;
      if(p.wantsLoan){
        if(share>=0.5){ p.wantsLoan=false; news(`${p.cn} 不再要求外租`,`${p.cn} 近来获得了稳定的出场时间，经纪人表示他愿意留下来竞争位置。`,"good"); }
        else p.morale=clamp(p.morale-2,5,100);
        return;
      }
      if(p.age>24 || share>=0.35 || p.injury>0 || p.untouchable || (p.unrest||0)>=2) return;
      if(posRank(u,p)>3) return;
      if(rnd()>0.22) return;
      p.wantsLoan=true; p.morale=clamp(p.morale-4,5,100);
      news(`${p.cn} 希望外租`,`${p.cn}（${p.age} 岁，${POS_CN[p.pos]}）本季球队踢了 ${games} 场，他只出场 ${p.apps} 次。经纪人来找过：他想出去踢球，哪怕是低级别联赛。${inTransferWindow()?"转会窗开着，可以在他的档案里安排外租。":`下一个转会窗约 ${nextWindowIn()} 天后开启。`}`,"warn");
    });
  }
  if(Math.floor(WORLD.day/7)%4===0){
    loanedOutOf(u).forEach(id=>{ const p=P(id); if(!p||!p.loan) return; const host=C(p.clubId), g=loanGames(p);
      if(g.games<3) return;
      const ok=loanClauseMet(p);
      news(`外租简报：${p.cn}`,`${p.cn} 在 ${host.cn} ${loanReportText(p)}。${p.loan.minApps? (ok?"出场条款目前得到履行。":"出场条款未被履行，转会窗内可以免费召回。") : (g.apps/g.games<0.3?"他在那边也坐板凳，这次外租作用不大。":"")}`, ok?"info":"warn");
    });
  }
}
// AI 小球会来借玩家的年轻人（转会窗内每日）
function aiLoanOffersToUser(){
  const u=UC(); WORLD.offers=WORLD.offers||[];
  if(WORLD.offers.length>=10) return;
  const games=clubGames(u);
  const cands=u.squad.map(i=>P(i)).filter(p=>!p.loan && p.age<=24 && p.injury<=10 && !p.untouchable
      && (p.wantsLoan || (games>=4 && p.apps/games<0.4)) && !WORLD.offers.some(o=>o.pid===p.id));
  cands.forEach(p=>{
    let pr = p.wantsLoan? 0.12 : 0.035; if(isDeadline()) pr*=2;
    if(rnd()>pr) return;
    const pool=WORLD.clubs.filter(b=>b.id!==u.id && b.rep<u.rep && b.squad.length<27 && p.ca>b.rep*1.5 && p.ca<b.rep*2.05+42
        && wouldStart(p,b) && (squadNeed(b).pos===p.pos || (p.pos2||[]).includes(squadNeed(b).pos) || rnd()<0.3));
    if(!pool.length) return;
    const b=pick(pool);
    makeLoanOffer(b,p);
  });
}
/* 构造一份「AI 向玩家请求租借」的 offer。推销回复里买不起的分支也走这里，别抄第二份。*/
function makeLoanOffer(b, p, note){
  const u=UC();
  const wageShare = (u.rep-b.rep>12 && rnd()<0.5)? 0.5 : 1;
  const fee = p.ca>b.rep*1.9 ? Math.round(p.value*0.04/1e4)*1e4 : 0;
  if(fee>clubSpend(b)) return false;
  if(!canAfford(b, fee, p.wage*52*wageShare, {nextYear:false}).ok) return false;
  const half = windowName()==="夏窗" && rnd()<0.3;
  WORLD.offers.push({type:"loan", pid:p.id, club:b.id, fee, wageShare, minApps:0.6, half, day:WORLD.day, until:Math.min(WORLD.day+10, windowEndDay())});
  news(`${b.cn} 请求租借 ${p.cn}`,
    (note||`${b.cn}（${LGS(b)}）希望租借 ${p.cn} ${half?"至冬窗":"至赛季末"}`)
    +`，承担 ${Math.round(wageShare*100)}% 工资${fee?`，另付租借费 ${money(fee)}`:""}，并承诺 60% 以上的出场。${p.wantsLoan?"球员本人正希望出去踢球。":""}请到「转会」页面处理。`,"info");
  return true;
}
// AI 之间：买不起就租（转会窗内每日，跟在 aiTransferRound 后）
function aiLoanRound(){
  const u=UC();
  for(let k=0;k<(isDeadline()?ri(4,8):ri(2,5));k++){
    const b=WORLD.clubs[Math.floor(rnd()*WORLD.clubs.length)];
    if(b.id===u.id || b.squad.length>=27) continue;
    const need=squadNeed(b), spend=clubSpend(b), preferLoan=rnd()<0.3;   // 三成球队本来就想租不想买
    const pool=Object.values(WORLD.players).filter(p=>p.clubId>=0 && p.clubId!==b.id && p.clubId!==u.id && !p.loan && p.injury<=20
       && (p.pos===need.pos||(p.pos2||[]).includes(need.pos)) && p.ca>need.cur+5 && p.ca<b.rep*2.05+42
       && (askingPrice(p)>spend || preferLoan) && aiWillLoanOut(p));
    if(!pool.length) continue;
    pool.sort((a,c)=>c.ca-a.ca);
    const p=pool[Math.floor(Math.pow(rnd(),1.6)*Math.min(pool.length,8))];
    const t=loanTermsFor(p,b);
    if(t.fee>spend) continue;
    if(!canAfford(b, t.fee, p.wage*52*t.wageShare, {nextYear:false}).ok) continue;
    const owner=C(p.clubId);
    if(!loanPlayer(p.id, b.id, {fee:t.fee, wageShare:t.wageShare, minApps:t.minApps, half:false})) continue;
    if((b.lg===u.lg || owner.lg===u.lg) && p.ca>=u.rep*1.6 && rnd()<0.5)
      news(`租借：${p.cn} 加盟 ${b.cn}`,`${b.cn} 从 ${owner.cn} 租借 ${POS_CN[p.pos]} ${p.cn}（${p.age} 岁，能力 ${ovr(p)}）至赛季末${t.fee?`，租借费 ${money(t.fee)}`:""}。`,"info");
  }
}
function clubSpend(c){ return Math.max(0, avail(c)); }        // 能付的最大转会费
function windowEndDay(){
  const dt=dateOf(WORLD.day);
  const end=new Date(dt.getFullYear(), dt.getMonth()+1, 0);
  return Math.round((end-dateOf(0))/864e5);
}
function windowDaysLeft(){ return inTransferWindow()? windowEndDay()-WORLD.day+1 : 0; }
function nextWindowIn(){
  for(let d=WORLD.day+1; d<WORLD.day+400; d++){ const m=dateOf(d).getMonth()+1; if(m===8||m===1) return d-WORLD.day; }
  return 0;
}
function isDeadline(){ return inTransferWindow() && windowEndDay()-WORLD.day<=2; }
function absDay(){ return WORLD.season*400+WORLD.day; }

// 表现指数 0~1：综合本季（样本不足时参考上季）评分、进球助攻、全场最佳
function perfCore(p, withSample){
  const cur={apps:p.apps||0,goals:p.goals||0,assists:p.assists||0,rt:p.apps?p.ratingSum/p.apps:0,motm:p.motm||0};
  const last=p.last||{apps:0,goals:0,assists:0,rt:0,motm:0};
  const g=POS_GRP[p.pos];
  const score=st=>{
    if(!st.apps) return withSample? 0 : 0.45;          // 没样本：perfIndex 视为 0，perfRaw 视为中性
    const rt=clamp((st.rt-6.7)/1.0,0,1);
    const ga=(st.goals+st.assists*0.6)/st.apps;
    const atk= g==="fw"? clamp(ga/0.7,0,1) : g==="mf"? clamp(ga/0.4,0,1) : g==="df"? clamp(ga/0.18,0,1) : 0;
    const motm=clamp(st.motm/st.apps/0.18,0,1);
    const base = (g==="gk"||g==="df") ? rt*0.8+motm*0.2 : rt*0.5+atk*0.32+motm*0.18;
    return Math.min(1, base) * (withSample? Math.min(1, st.apps/14) : 1);
  };
  const w=Math.min(1, cur.apps/12);
  return clamp(score(cur)*w + score(last)*(1-w), 0, 1);
}
function perfIndex(p){ return perfCore(p, true); }    // 0~1，样本不足往 0 压——给关注度/标签用
function perfRaw(p){ return perfCore(p, false); }     // 0~1，0.45 中性——给身价用
function perfTag(p){
  const x=perfIndex(p);
  return x>=0.75?'<span class="tag t-ok">🔥 火热</span>':x>=0.5?'<span class="tag t-i">状态出色</span>':'';
}

// ---------- 外界对玩家球员的关注 ----------
/* ===== 转会市场主动化 v38 公共件 =====
   规范见项目目录《转会市场主动化规范.md》。玩家挂牌可以带要价，AI 的估值必须是确定性的，
   否则推销回复和日常报价会给出两个数。 */
function winKey(){ return WORLD.season*2 + (windowName()==="冬窗"?1:0); }
// 玩家挂牌的要价；没挂牌或没填就是市价
function sellPrice(p){ return (p.listed && p.askPrice>0)? p.askPrice : askingPrice(p); }
// 折扣幅度：正 = 低于市价挂，负 = 高于市价
function disc(p){ const a=askingPrice(p); return a>0? clamp(1 - sellPrice(p)/a, -0.5, 0.6) : 0; }
/* AI 对某球员的估值。原来 aiOffersToUser 里用 rnd()，换成按 (球员|球会|赛季|窗口) 的 hash，
   这样同一个窗口里推销问一次、日常报价再来一次，答案一致，问不出更高价。*/
function aiValuation(b, p){
  const u=UC(), ask=askingPrice(p);
  const h=(hashStr(p.id+"|"+b.id+"|"+WORLD.season+"|"+(windowName()||""))%1000)/1000;
  let mult = 0.9 + perfIndex(p)*0.2 + Math.max(0,b.rep-u.rep)/55 + h*0.25;
  if(p.untouchable) mult+=0.3;
  return Math.round(Math.min(ask*mult, clubSpend(b))/1e4)*1e4;
}
function interestList(){ return WORLD.interest=(WORLD.interest||[]); }
function interestOf(pid){ return interestList().filter(it=>it.pid===pid); }
function heatOf(p){
  const u=UC();
  const perf=perfIndex(p);
  const star=clamp((p.ca-u.rep*1.85)/28,0,1);          // 能力明显高于球队层级
  const young=p.age<=23? clamp((p.pa-p.ca)/45,0,0.7):0;  // 潜力股
  let heat=perf*0.65 + star*0.35 + young*0.3;
  if(p.age>=31) heat*=0.5; if(p.age>=33) heat*=0.4;
  if(p.injury>40) heat*=0.5;
  if(p.listed) heat += disc(p) < -0.2 ? 0 : clamp(0.25 + disc(p)*0.6, 0, 0.6);   // 要价越低越抢手；高出市价两成以上没加成
  if(p.untouchable) heat*=0.4;
  return clamp(heat,0,1.4);
}
function addInterest(p, force){
  if(p.loan) return false;                     // 租借中的球员没人报价
  const u=UC(); const cur=interestOf(p.id);
  if(cur.length>=4) return false;
  const heat=heatOf(p);
  if(!force && heat<0.2) return false;
  if(absDay()-(p.joinedAbs!=null?p.joinedAbs:-999)<120) return false;   // 新援短期内不会被挖角
  if(!force && rnd() > heat*0.45) return false;
  const ask=sellPrice(p);
  const pool=WORLD.clubs.filter(c=>c.id!==u.id && !cur.some(e=>e.club===c.id)
    && c.squad.length<29
    && p.ca < c.rep*2.05+42 && p.ca > c.rep*1.45
    && clubSpend(c) >= ask*(p.untouchable?1.1:0.7));
  if(!pool.length) return false;
  // 声望越高的俱乐部越可能盯上明星
  const w=pool.map(c=>Math.pow(c.rep,1.5)*(c.rep>u.rep?1.6:1));
  let r=rnd()*w.reduce((a,b)=>a+b,0), b=pool[0];
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0){ b=pool[i]; break; } }
  interestList().push({pid:p.id, club:b.id, heat:+heat.toFixed(2), since:absDay()});
  if(b.rep>u.rep+4 || heat>=0.5 || force)
    news(`${b.cn} 盯上 ${p.cn}`,
      `有消息称 ${b.cn} 的球探多次现场考察 ${p.cn}${perfIndex(p)>=0.5?"，他近来的出色表现引起了广泛关注":""}。${inTransferWindow()?"预计很快会有正式报价。":`他们可能在约 ${nextWindowIn()} 天后开启的转会窗口出手。`}`,"info");
  return true;
}
function updateInterest(){
  const u=UC();
  WORLD.interest=interestList().filter(it=>{ const p=P(it.pid); return p && p.clubId===u.id && WORLD.clubs[it.club] && absDay()-it.since<170; });
  u.squad.map(i=>P(i)).forEach(p=>{
    addInterest(p,false);
    if((p.unrest||0)>=2 && p.morale>30) p.morale-=2;   // 要求转会的球员士气持续走低
  });
}

// ---------- AI 向玩家报价（转会窗内每日） ----------
function aiOffersToUser(){
  const u=UC(); WORLD.offers=WORLD.offers||[];
  const dl=isDeadline();
  interestList().forEach(it=>{
    const p=P(it.pid), b=WORLD.clubs[it.club]; if(!p||!b||p.clubId!==u.id||p.loan) return;
    if(WORLD.offers.some(o=>o.pid===p.id&&o.club===b.id)) return;
    if(b.squad.length>=29 || WORLD.offers.length>=10) return;
    const heat=heatOf(p);
    let pr = 0.05 + heat*0.09; if(dl) pr*=2.5;
    if(p.listed) pr += 0.06 + Math.max(0,disc(p))*0.15;        // 挂得越便宜来得越勤
    if(rnd()>pr) return;
    const ask=askingPrice(p), want=sellPrice(p), spend=clubSpend(b);
    if(spend < want*0.8) return;
    const v=aiValuation(b,p);
    let fee=v, atAsk=false;
    if(p.listed && p.askPrice>0 && p.askPrice<=v){ fee=p.askPrice; atAsk=true; }   // 到要价就照要价出
    const top=WORLD.offers.filter(o=>o.pid===p.id).sort((a,b)=>b.fee-a.fee)[0];
    if(top){ fee=Math.max(fee, Math.round(top.fee*(1.06+rnd()*0.12)/1e4)*1e4); atAsk=fee>=want; if(fee>spend || fee>ask*2.2) return; }
    if(fee < want*0.75) return;                                 // 差太远他们自己知道，不来
    fee=Math.min(fee, Math.round(ask*2.2/1e4)*1e4);
    const wage=wageDemand(p,b);
    if(!aiAffordWage(b, wage*52, fee)) return;
    const max=Math.round(Math.min(spend, fee*(1.12+heat*0.35))/1e4)*1e4;
    WORLD.offers.push({pid:p.id, club:b.id, fee, max, wage, atAsk, day:WORLD.day, until:Math.min(WORLD.day+14, windowEndDay())});
    const eager = b.rep>u.rep+8;
    news(top?`${b.cn} 加入争夺 ${p.cn}`:`${b.cn} 报价 ${p.cn}`,
      `${b.cn} 为 ${p.cn} 提交了 ${money(fee)} 的正式报价${top?`，高于 ${C(top.club).cn} 此前的 ${money(top.fee)}`:""}${fee>=ask*1.3?"，远超市场估价":""}。${eager?"据悉球员本人对加盟这家豪门很感兴趣。":""}请到「转会」页面处理，${dl?"转会窗即将关闭":"14 天内有效"}。`,"warn");
  });
}

// ---------- AI 之间的转会（转会窗内每日） ----------
function bigTransferNews(p, from, to, fee){
  const u=UC();
  if(!WORLD.aiNews || WORLD.aiNews.d!==WORLD.day) WORLD.aiNews={d:WORLD.day,n:0};
  if(WORLD.aiNews.n>=2) return;
  const bar=Math.max(3e6, Math.pow(u.rep,3)*10);
  const big = fee>=2.5e7 || (to.lg===u.lg && fee>=bar) || (from && from.lg===u.lg && fee>=bar);
  if(!big) return;
  WORLD.aiNews.n++;
  news(`转会：${p.cn} 加盟 ${to.cn}`,
    `${to.cn} 以 ${money(fee)} 从 ${from?from.cn:"自由市场"} 签下 ${POS_CN[p.pos]} ${p.cn}（${p.age} 岁，能力 ${ovr(p)}）${perfIndex(p)>=0.5?"，他近期状态火热":""}。`,"info");
}
function aiTransferRound(tries){
  const u=UC();
  if(tries==null) tries = isDeadline()? ri(6,10) : ri(2,5);
  for(let k=0;k<tries;k++){
    const buyer=WORLD.clubs[Math.floor(rnd()*WORLD.clubs.length)];
    if(buyer.id===u.id) continue;
    if(buyer.squad.length>=29) continue;
    const budget=clubSpend(buyer);
    if(budget<50000) continue;
    const need=squadNeed(buyer);
    const r0=rnd();
    const chasePot = r0<0.22 && buyer.rep>=34;   // 22% 抢高潜力少年（只有像样的俱乐部干这事）
    const chase = !chasePot && r0<0.46;          // 24% 追逐表现突出的球员，其余补短板
    const pool=Object.values(WORLD.players).filter(p=>
        p.clubId!==buyer.id && p.clubId!==u.id && !p.loan && p.injury<=25 && p.age<34 &&
        absDay()-(p.joinedAbs!=null?p.joinedAbs:-999)>150 &&
        (chasePot ? (p.age<=21 && p.pa>=150 && p.pa-p.ca>=25)
         : chase ? (perfIndex(p)>=0.45 && p.ca>buyer.rep*1.6)
               : ((p.pos===need.pos||(p.pos2||[]).includes(need.pos)) && p.ca>need.cur+5)) &&
        (chasePot || p.ca < buyer.rep*2.05+42));
    const afford=pool.filter(p=>{
        const seller=p.clubId>=0?C(p.clubId):null;
        if(seller && !canSell(seller,p)) return false;
        if(seller && seller.rep>buyer.rep+11 && rnd()<0.85) return false;
        if(seller && !p.listed && buyer.rep < seller.rep-3 && rnd()<0.5) return false;
        return askingPrice(p)<=budget; });
    if(!afford.length) continue;
    if(chasePot) afford.sort((a,b)=>(b.pa*1.0+b.ca*0.25)-(a.pa*1.0+a.ca*0.25));
    else afford.sort((a,b)=>(b.ca+perfIndex(b)*18)-(a.ca+perfIndex(a)*18));
    const tgt=afford[Math.floor(Math.pow(rnd(),1.8)*Math.min(afford.length,12))];
    if(!tgt) continue;
    const seller=tgt.clubId>=0?C(tgt.clubId):null;
    let fee=askingPrice(tgt);
    if(seller && !tgt.listed && seller.rep<buyer.rep-8 && rnd()<0.5) fee=Math.round(fee*(1.05+rnd()*0.3)/1000)*1000;  // 豪门抢人溢价
    fee=Math.min(fee,budget);
    const wage=wageDemand(tgt,buyer);
    if(!aiAffordWage(buyer, wage*52, fee)) continue;
    tgt.listed=false;
    transferPlayer(tgt.id, buyer.id, fee, wage, ri(2,5));
    bigTransferNews(tgt, seller, buyer, fee);
  }
}
/* 自由球员签约。自由身不受转会窗限制（现实里也是这样），所以这段每天都跑、
   不跟 marketDaily 绑定；窗外降频，否则 304 天会把市场抽干。
   门槛用队内中位 CA，不用 rep——rep*1.2 那种写法把中游队全挡在门外，市场清不掉。*/
function faSigningRound(){
  const u=UC(), open=inTransferWindow();
  const faN=(WORLD.freeAgents||[]).length;
  const tries = faN<60 ? (open? ri(0,1) : 0)
              : open   ? (isDeadline()? ri(2,6) : ri(1,3))
                       : ri(0,1);
  for(let k=0;k<tries;k++){
    const buyer=WORLD.clubs[Math.floor(rnd()*WORLD.clubs.length)];
    if(buyer.id===u.id||buyer.squad.length>=28) continue;
    const bMed=squadMedCA(buyer);
    const fa=WORLD.freeAgents.filter(i=>{ const q=P(i); if(!q) return false;
      return (q.ca>=bMed*0.85 && q.ca<=bMed*1.50) || (q.age<=20 && q.pa>=150); });   // 潜力股也要抢
    if(!fa.length) continue;
    const id=pick(fa), fw=wageDemand(P(id),buyer);
    if(!aiAffordWage(buyer, fw*52, 0) && !faReliefOK(buyer, P(id), fw*52)) continue;
    transferPlayer(id, buyer.id, 0, fw, ri(2,4));
  }
  // 高能力自由球员不该在市场上挂一整年：CA>=150 的每天都有强队来抢
  const hot = open? 0.25 : 0.10;
  (WORLD.freeAgents||[]).slice().forEach(id=>{
    const p=P(id); if(!p || p.ca<150 || rnd()>=hot) return;
    const cands=WORLD.clubs.filter(b=>b.id!==u.id && b.rep>=70 && b.squad.length<28);
    if(!cands.length) return;
    const b=pickW(cands, cands.map(x=>Math.pow(x.rep,2.2)));
    if(!b) return;
    const w=wageDemand(p,b);
    if(!aiAffordWage(b, w*52, 0)) return;
    transferPlayer(id, b.id, 0, w, ri(2,4));
  });
}
// 传奇之种 / 妖人如果玩家不出手，就会被别的俱乐部签走——错过就是真错过
function poachProspects(){
  if(!inTransferWindow()) return;
  const u=UC();
  const isProspect=p=>p && p.age<=21 && (p.legend||p.wonderkid||p.pa>=160);
  const known=pid=>(WORLD.shortlist||[]).some(s=>s.id===pid);
  // (a) 自由市场里的少年天才
  (WORLD.freeAgents||[]).slice().forEach(id=>{
    const p=P(id); if(!isProspect(p)) return;
    if(rnd()>0.26) return;
    const cands=WORLD.clubs.filter(c=>c.id!==u.id && c.squad.length<30 && c.rep>=30);
    if(!cands.length) return;
    const b=pickW(cands, cands.map(c=>Math.pow(c.rep,2.2)));
    if(!b) return;
    const w=wageDemand(p,b);
    if(!aiAffordWage(b, w*52, 0)) return;
    transferPlayer(id, b.id, 0, w, ri(3,5));
    if(p.legend||known(id))
      news(`${p.cn} 被 ${b.short} 签下`,
        `自由身少年 ${p.cn}（${POS_CN[p.pos]}，${p.age} 岁）已与 ${b.cn} 签约。${known(id)?"他在你的关注名单上——你没有出手。":"你的球探此前提到过他。"}`,"bad");
  });
  // (b) 待在小俱乐部里的少年天才，会被豪门挖走
  WORLD.clubs.forEach(c=>{
    if(c.id===u.id || c.rep>=62) return;
    c.squad.map(i=>P(i)).filter(isProspect).forEach(p=>{
      if(rnd()>0.05) return;
      const cands=WORLD.clubs.filter(b=>b.id!==u.id && b.id!==c.id && b.rep>c.rep+12 && b.squad.length<30);
      if(!cands.length) return;
      const b=pickW(cands, cands.map(x=>Math.pow(x.rep,2.2)));
      if(!b) return;
      const fee=askingPrice(p), w=wageDemand(p,b);
      if(fee>clubSpend(b) || !aiAffordWage(b, w*52, fee)) return;
      transferPlayer(p.id, b.id, fee, w, ri(3,5));
      if(p.legend||known(p.id))
        news(`${b.short} 抢下 ${p.cn}`,
          `${b.cn} 以 ${money(fee)} 从 ${c.cn} 签下 ${p.age} 岁的 ${POS_CN[p.pos]} ${p.cn}。${known(p.id)?"他在你的关注名单上。":""}`,"bad");
    });
  });
}

// AI 俱乐部每周把冗员挂牌（市场上会出现折价球员）
function aiListSurplus(){
  WORLD.clubs.forEach(c=>{
    if(c.id===WORLD.userClub) return;
    const ps=c.squad.map(i=>P(i));
    if(ps.length<=24){ ps.forEach(p=>p.listed=false); return; }
    if(ps.filter(p=>p.listed).length>=3 || rnd()<0.6) return;
    const cand=ps.filter(p=>!p.listed && !p.loan && canSell(c,p) && (p.age>=30 || p.ca<c.rep*1.5 || p.morale<40)).sort((a,b)=>a.ca-b.ca);
    if(cand.length) cand[Math.floor(rnd()*Math.min(3,cand.length))].listed=true;
  });
}
function marketDaily(){
  const u=UC();
  // AI 清理冗员：先想办法卖掉或租出去，只有窗口最后几天还清不掉才解约（以前是直接白送）
  WORLD.clubs.forEach(c=>{
    if(c.id===u.id || c.squad.length<=27) return;
    const ps=c.squad.map(i=>P(i)).filter(p=>!p.loan && canSell(c,p));
    if(!ps.length) return;
    const worst=ps.sort((a,b)=>(a.ca+(a.pa-a.ca)*0.5)-(b.ca+(b.pa-b.ca)*0.5))[0];
    if(windowEndDay()-WORLD.day>3){
      // 一半挂牌（挂牌有折价、买家会上门），一半留着不挂牌——aiWillLoanOut 只认没挂牌的人
      if(!worst.listed && rnd()<0.5) worst.listed=true;
      return;
    }
    if(rnd()>0.5) return;
    toFreeAgent(worst, c);
  });
  aiTransferRound();
  aiLoanRound();
  aiOffersToUser();
  aiLoanOffersToUser();
  pitchReplies();
  // 没被盯上也可能突然来人（挂牌球员更常见）
  if(rnd()<0.04 && u.squad.length>17){
    const all=u.squad.map(i=>P(i));
    const listed=all.filter(p=>p.listed);
    const pool=(listed.length&&rnd()<0.7)? listed : all.filter(p=>p.injury<=0).sort((a,b)=>b.ca-a.ca).slice(0,10);
    if(pool.length) addInterest(pick(pool), true);
  }
  const endD=windowEndDay(), key=WORLD.season+":"+windowName();
  if(WORLD.day===endD-2 && WORLD.dlNoted!==key){
    WORLD.dlNoted=key;
    const n=(WORLD.offers||[]).length;
    news(`${windowName()}截止日临近`,`转会窗将在 3 天后关闭，各俱乐部正在加紧最后的谈判${n?`。你手上还有 ${n} 份未处理的报价，窗口关闭后将自动失效`:""}。`,"warn");
  }
  if(WORLD.day===endD){
    // 挂了一整窗没人问的，给一条提示，顺便说清可能的原因
    u.squad.map(i=>P(i)).filter(p=>p.listed && !p.loan).forEach(p=>{
      if((WORLD.offers||[]).some(o=>o.pid===p.id)) return;
      const ask=askingPrice(p), want=sellPrice(p);
      const n=p.listedAbs!=null? Math.max(1, absDay()-p.listedAbs) : windowEndDay()-1;
      news(`${p.cn} 没有收到报价`,
        `${p.cn} 挂牌 ${n} 天没有收到任何报价。市价 ${money(ask)}，你的要价 ${money(want)}。`
        + (want>ask? "要价高于市价可能是原因。" : "这个位置近期没有球队缺人。"),"warn");
    });
    u.squad.map(i=>P(i)).filter(p=>p.wantsLoan && !p.loan).forEach(p=>{
      p.unrest=(p.unrest||0)+1; p.morale=clamp(p.morale-8,5,100);
      news(`${p.cn} 对没被外租感到失望`,`转会窗关闭了，${p.cn} 还是没能出去踢球。${p.unrest>=2?"他的经纪人放话：下个窗口要么走人，要么公开要求转会。":"他的士气受到影响。"}`,"warn");
    });
    const L=WORLD.transferLog.filter(t=>t.s===WORLD.season && t.d>endD-31 && t.d<=endD);
    const paid=L.filter(t=>t.fee>0);
    const top=paid.sort((a,b)=>b.fee-a.fee)[0];
    news(`${windowName()}关闭`,`本次转会窗共完成 ${L.length} 笔转会（其中 ${paid.length} 笔付费转会），总金额 ${money(paid.reduce((s,t)=>s+t.fee,0))}${top?`；标王为 ${top.name}（${C(top.to).cn}，${money(top.fee)}）`:""}。下一个转会窗约 ${nextWindowIn()} 天后开启。`,"info");
  }
}

// ---------- 解约 ----------
function releaseFee(p){
  // 剩余合同（含本季未走完的部分）薪水的七折作为一次性遣散费
  const yrsLeft=Math.max(0.1, (p.contract-WORLD.season+1) - WORLD.day/SEASON_DAYS);
  return Math.max(10000, Math.round(p.wage*52*yrsLeft*0.7/1000)*1000);
}
function releasePlayer(pid){
  const p=P(pid), c=UC();
  if(p.clubId!==c.id) return;
  if(p.loan){ toast("租借球员不能解约，归属权在母队","bad"); return; }
  const fee=releaseFee(p);
  const yrs=Math.max(0,(p.contract-WORLD.season+1)-WORLD.day/SEASON_DAYS).toFixed(1);
  const gk=c.squad.filter(i=>P(i).pos==="GK").length;
  const warn = c.squad.length<=18 ? "阵容已不足 18 人，无法再解约。" : (p.pos==="GK"&&gk<=2) ? "至少要保留 2 名门将。" : "";
  openModal("解约 "+esc(p.cn),
    `<div class="hint">${esc(p.cn)}（${POS_CN[p.pos]}，${p.age} 岁，能力 ${ovr(p)}）目前周薪 ${money(p.wage)}，合同至 ${p.contract} 年，剩余约 ${yrs} 年。</div>
     <div style="margin-top:10px">一次性遣散费：<b style="color:var(--warn)">${money(fee)}</b> <span class="hint">（剩余合同薪水的 70%）</span></div>
     <div class="hint" style="margin-top:6px">解约后他成为自由球员，工资空间立即释放，每年可省 ${money(p.wage*52)}；但你拿不到任何转会费，其他俱乐部可以免费签走他。</div>
     ${(WORLD.offers||[]).some(o=>o.pid===pid)?'<div class="hint" style="margin-top:6px;color:var(--warn)">注意：目前有俱乐部正在报价这名球员，出售能拿到转会费。</div>':''}
     ${warn?`<div style="margin-top:8px;color:var(--bad)">${warn}</div>`:""}
     <div class="hint" style="margin-top:8px">你的可用资金：${money(c.finance.balance)}</div>`,
    `${warn?"":`<button class="pri" onclick="doRelease(${pid})">确认解约</button>`}<button onclick="closeModal()">取消</button>`);
}
function doRelease(pid){
  const p=P(pid), c=UC();
  if(p.clubId!==c.id || p.loan) return;
  const fee=releaseFee(p), freedWage=p.wage*52;
  if(c.squad.length<=18){ toast("阵容不足 18 人，无法解约","bad"); return; }
  if(c.finance.balance<fee){ toast("资金不足，无法支付遣散费","bad"); return; }
  addMoney(c, -fee, `解约 ${p.cn}`);
  toFreeAgent(p, c);
  p.morale=clamp(p.morale-10,5,100);
  WORLD.interest=interestList().filter(it=>it.pid!==pid);
  WORLD.shortlist=(WORLD.shortlist||[]).filter(s=>s.id!==pid);
  repairLineup(c);
  news(`${p.cn} 与俱乐部解约`,`${c.cn} 支付 ${money(fee)} 遣散费后与 ${p.cn} 提前解除合同，他现在是自由球员。释放年薪 ${money(freedWage)}/年，目前可用资金 ${money(avail(c))}。`,"warn");
  toast(`已与 ${p.cn} 解约，支付遣散费 ${money(fee)}`); closeModal(); render();
}

function setShirtNumber(pid){

function toggleUntouchable(pid){
  const p=P(pid); if(p.loan){ toast("租借球员的归属权在母队","bad"); return; }
