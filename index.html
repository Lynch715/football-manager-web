function makeBid(pid){
  const p=P(pid), c=UC();
  if(!inTransferWindow()){ toast("当前不在转会窗口","bad"); return; }
  const ask=askingPrice(p);
  const wg=wageDemand(p,c);
  openModal("为 "+esc(p.cn)+" 报价",
    `<div class="hint">对方要价约 <b style="color:var(--acc)">${money(ask)}</b>，球员周薪要求约 <b>${money(wg)}</b></div>
     <div style="margin-top:12px"><label>转会费（£）</label><input id="bid-fee" type="number" value="${ask}" style="width:180px"></div>
     <div style="margin-top:8px"><label>周薪（£）</label><input id="bid-wage" type="number" value="${wg}" style="width:180px"></div>
     <div style="margin-top:8px"><label>合同年限</label><select id="bid-yr"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
     <div class="hint" style="margin-top:12px">你的转会预算：${money(c.finance.transferBudget)}　薪资空间：${money(Math.max(0,c.finance.wageBudget-wageBill(c)))}/年</div>`,
    `<button class="pri" onclick="submitBid(${pid})">提交报价</button><button onclick="closeModal()">取消</button>`);
}
function submitBid(pid){
  const p=P(pid), c=UC();
  const fee=+$("#bid-fee").value, wg=+$("#bid-wage").value, yr=+$("#bid-yr").value;
  const ask=askingPrice(p), need=wageDemand(p,c);
  if(fee>c.finance.transferBudget){ toast("超出转会预算","bad"); return; }
  if(wageBill(c)+wg*52>c.finance.wageBudget){ toast("超出工资预算","bad"); return; }
  if(c.squad.length>=30){ toast("阵容已满（上限 30 人）","bad"); return; }
  const seller=p.clubId>=0?C(p.clubId):null;
  if(seller && !canSell(seller,p)){ toast(`${seller.cn} 拒绝出售——该位置人手不足`,"bad"); closeModal(); return; }
  if(fee < ask*0.93){ toast(`${seller?seller.cn:"球员"} 拒绝了报价，要价 ${money(ask)}`,"bad"); closeModal(); return; }
  if(wg < need*0.92){ toast(`${p.cn} 认为薪资不足，要求 ${money(need)}/周`,"bad"); closeModal(); return; }
  // 球员意愿：声望差
  if(seller && seller.rep > c.rep+14 && rnd()<0.6){ toast(`${p.cn} 不愿加盟——认为这是职业生涯的倒退`,"bad"); closeModal(); return; }
  transferPlayer(pid, c.id, fee, wg, yr);
  news(`签下 ${p.cn}`,`${c.cn} 以 ${money(fee)} 从 ${seller?seller.cn:"自由市场"} 签下 ${p.cn}，签约 ${yr} 年，周薪 ${money(wg)}。`,"good");
  toast(`签约成功：${p.cn}`); closeModal(); render();
}
function renewContract(pid){
  const p=P(pid), c=UC();
  const nw=Math.round(Math.max(p.wage*1.15, calcWage(p,c.rep)*(1+ (p.pa-p.ca)/300))/50)*50;
  openModal("续约 "+esc(p.cn),
    `<div class="hint">${esc(p.cn)} 目前周薪 ${money(p.wage)}，合同到 ${p.contract} 年。</div>
     <div style="margin-top:10px">他的要求：<b style="color:var(--acc)">${money(nw)}</b> / 周</div>
     <div style="margin-top:10px"><label>提供周薪</label><input id="rn-w" type="number" value="${nw}" style="width:160px"></div>
     <div style="margin-top:8px"><label>年限</label><select id="rn-y"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>`,
    `<button class="pri" onclick="doRenew(${pid},${nw})">确认续约</button><button onclick="closeModal()">取消</button>`);
}
function doRenew(pid,need){
  const p=P(pid), c=UC(); const w=+$("#rn-w").value, y=+$("#rn-y").value;
  if(w<need*0.95){ toast(`${p.cn} 拒绝了这份合同`,"bad"); return; }
  if(wageBill(c)-p.wage*52+w*52>c.finance.wageBudget){ toast("超出工资预算","bad"); return; }
  p.wage=w; p.contract=WORLD.season+y; p.morale=clamp(p.morale+10,5,100); p.value=calcValue(p);
  toast(`${p.cn} 已续约至 ${p.contract} 年`); closeModal(); render();
}
function listPlayer(pid){
  const p=P(pid);
  p.listed=!p.listed;
  toast(p.listed?`${p.cn} 已挂牌，其他俱乐部会更积极报价`:`已取消 ${p.cn} 的挂牌`);
  closeModal(); render();
}

function shrinkImage(file, size, cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas"); cv.width=size; cv.height=size;
        const ctx=cv.getContext("2d");
        if(!ctx){ cb(fr.result); return; }
        const r=Math.min(size/img.width, size/img.height);
        const w=img.width*r, h=img.height*r;
        ctx.clearRect(0,0,size,size);
        ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        cb(cv.toDataURL("image/png"));
      }catch(e){ cb(fr.result); }
    };
    img.onerror=()=>cb(null);
    img.src=fr.result;
  };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}
function importCrest(clubId, file){
  shrinkImage(file,128,url=>{
    if(!url){ toast("图片无法读取","bad"); return; }
    CUSTOM_CRESTS[clubId]=url;
    if(!saveCustomCrests()){ delete CUSTOM_CRESTS[clubId]; toast("浏览器存储空间不足，无法保存队徽","bad"); return; }
    toast(`${C(clubId).cn} 队徽已更新`); render();
  });
}
function matchClubByFilename(name){
  const base=name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[\s_\-]/g,"");
  let best=null,bl=0;
  WORLD.clubs.forEach(c=>{
    const keys=[c.en.toLowerCase().replace(/[\s_\-]/g,""), c.cn, c.short];
    keys.forEach(k=>{ const kk=k.toLowerCase().replace(/[\s_\-]/g,"");
      if(kk && (base.includes(kk)||kk.includes(base)) && kk.length>bl){ bl=kk.length; best=c; } });
  });
  return best;
}
function batchImport(files){
  if(!files.length) return;
  let done=0, ok=0, miss=[];
  files.forEach(f=>{
    const c=matchClubByFilename(f.name);
    if(!c){ miss.push(f.name); done++; if(done===files.length) finish(); return; }
    shrinkImage(f,128,url=>{
      if(url){ CUSTOM_CRESTS[c.id]=url; ok++; }
      done++; if(done===files.length) finish();
    });
  });
  function finish(){
    if(!saveCustomCrests()) toast("部分队徽未能保存：浏览器存储空间不足","bad");
    render();
    toast(`已匹配替换 ${ok} 支球队${miss.length?`，${miss.length} 个文件未识别`:""}`, miss.length?"warn":"");
  }
}

function toggleplay(force){
  const b=$("#btn-play"); if(!b) return;
  ANIM.playing = force!=null? force : !ANIM.playing;
  b.textContent=ANIM.playing?"⏸ 暂停":"▶ 继续";
  if(ANIM.playing){ ANIM.last=performance.now(); ANIM.raf=requestAnimationFrame(animLoop); }
  else cancelAnimationFrame(ANIM.raf);
}
function animLoop(ts){
  const M=CURMATCH; if(!M||VIEW!=="match"){ ANIM.playing=false; return; }
  const dt=Math.min(120, ts-ANIM.last); ANIM.last=ts;
  ANIM.acc += dt*ANIM.speed;
  let steps=0;
  while(ANIM.acc>=PHASE_MS && !M.done && steps<40){
    ANIM.prev=ANIM.cur;
    const before=M.score[0]+M.score[1];
    stepMatch(M);
    ANIM.cur=M.frames[M.frames.length-1];
    ANIM.acc-=PHASE_MS; steps++;
    if(M.score[0]+M.score[1]>before) flashGoal();
  }
  if(M.done && !ANIM.ended){ ANIM.ended=true; ANIM.playing=false;
    cancelAnimationFrame(ANIM.raf); onMatchEnd(); drawPitch(1); refreshMatchUI(); return; }
  drawPitch(clamp(ANIM.acc/PHASE_MS,0,1));
  refreshMatchUI();
  if(ANIM.playing) ANIM.raf=requestAnimationFrame(animLoop);
}
function skipMatch(){
  const M=CURMATCH; if(!M) return;
  ANIM.playing=false; cancelAnimationFrame(ANIM.raf);

  ANIM.ended=true; onMatchEnd(); refreshMatchUI();
}

function refreshMatchUI(){
  const M=CURMATCH; if(!M) return;
  const sc=$("#m-sc"); if(sc) sc.textContent=`${M.score[0]} : ${M.score[1]}`;
  const ck=$("#mclock"); if(ck){
    const mm=Math.min(Math.floor(M.t), M.half===1?45+M.addedTime:90+M.addedTime);
    ck.textContent = M.done? "全场结束" : (mm>=90? `90+${mm-90}'` : mm>=45&&M.half===1? `45+${mm-45}'` : mm+"'");
  }
  const st=$("#m-stats");
  if(st){
    const s=M.stats, tot=(a,b)=>a+b||1;
    const line=(n,a,b)=>`<div style="margin-bottom:5px"><div style="display:flex;font-size:11px"><b style="width:38px">${a}</b>
      <span class="hint" style="flex:1;text-align:center">${n}</span><b style="width:38px;text-align:right">${b}</b></div>
      <div style="display:flex;height:4px;gap:2px"><div style="flex:${(+a||0)+0.01};background:var(--acc);border-radius:2px"></div>
      <div style="flex:${(+b||0)+0.01};background:#4a9eff;border-radius:2px"></div></div></div>`;
    st.innerHTML=line("控球率",s[0].poss||Math.round(M.possTicks[0]/(M.possTicks[0]+M.possTicks[1]||1)*100),
                       s[1].poss||100-Math.round(M.possTicks[0]/(M.possTicks[0]+M.possTicks[1]||1)*100))
      +line("射门",s[0].shots,s[1].shots)+line("射正",s[0].sot,s[1].sot)
      +line("xG",s[0].xg.toFixed(2),s[1].xg.toFixed(2))
      +line("角球",s[0].corners,s[1].corners)+line("犯规",s[0].fouls,s[1].fouls);
  }
  const fd=$("#mfeed");
  if(fd && ANIM.evShown<M.events.length){
    for(let i=ANIM.evShown;i<M.events.length;i++){
      const e=M.events[i];
      if(["blk","off"].includes(e.type)&&rnd()<0.5) continue;
      const d=el("div","ev "+(e.cls||""),`<span class="m">${Math.floor(e.t)}'</span><span>${esc(e.text)}</span>`);
      fd.appendChild(d);
    }
    ANIM.evShown=M.events.length; fd.scrollTop=fd.scrollHeight;
  }
  const pl=$("#m-players");
  if(pl){
    const mk=side=>`<div class="col"><div class="hint" style="margin-bottom:3px">${esc(C(side===0?M.h:M.a).cn)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${M.teams[side].men.filter(m=>!m.off).map(m=>
        `<span class="pill" style="font-size:10px;${m.cond<60?'border-color:#f0a020':''}">${POS_CN[m.pos]} ${esc(nm(m))}
         <b style="color:${m.cond>70?'#00d47e':m.cond>50?'#f0a020':'#e5484d'}">${Math.round(m.cond)}</b>
         <span style="color:var(--gold)">${m.rating.toFixed(1)}</span>${m.goals?" ⚽".repeat(m.goals):""}${m.yellow?" 🟨":""}</span>`).join("")}</div></div>`;
    pl.className="row"; pl.innerHTML=mk(0)+mk(1);
  }
}

// ---------- Canvas 渲染 ----------
function drawPitch(alpha){
  const cv=$("#pitch"); if(!cv) return;
  const ctx=cv.getContext?cv.getContext("2d"):null; if(!ctx) return;
  const W=cv.width, H=cv.height;
  const M=CURMATCH;
  const mx=22, my=22, pw=W-mx*2, ph=H-my*2;
  const X=x=>mx+x/PW*pw, Y=y=>my+y/PH*ph;
  // 草地
  ctx.fillStyle="#12331f"; ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ ctx.fillStyle= i%2? "#15391f":"#123016";
    ctx.fillRect(mx+i*pw/10, my, pw/10, ph); }
  ctx.strokeStyle="rgba(255,255,255,.42)"; ctx.lineWidth=2.4;
  ctx.strokeRect(mx,my,pw,ph);
  ctx.beginPath(); ctx.moveTo(X(52.5),my); ctx.lineTo(X(52.5),my+ph); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(52.5),Y(34), 9.15/PW*pw, 0, 6.2832); ctx.stroke();
  // 禁区
  [[0,1],[PW,-1]].forEach(([bx,dir])=>{
    ctx.strokeRect(X(bx)- (dir<0?16.5/PW*pw:0), Y(34-20.15), 16.5/PW*pw, 40.3/PH*ph);
    ctx.strokeRect(X(bx)- (dir<0?5.5/PW*pw:0), Y(34-9.16), 5.5/PW*pw, 18.32/PH*ph);
    ctx.fillStyle="rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.arc(X(bx+dir*11),Y(34),3,0,6.2832); ctx.fill();
    // 球门
    ctx.fillStyle="rgba(255,255,255,.75)";
    ctx.fillRect(X(bx)-(dir<0?0:5), Y(34-3.66), 5, 7.32/PH*ph);
  });
  if(!M) return;
  const a = alpha==null?1:alpha;
  const A=ANIM.prev, B=ANIM.cur;
  let ball, pts;
  if(B&&A&&A.p.length===B.p.length){
    ball={x:A.b.x+(B.b.x-A.b.x)*a, y:A.b.y+(B.b.y-A.b.y)*a};
    pts=B.p.map((q,i)=>[A.p[i][0]+(q[0]-A.p[i][0])*a, A.p[i][1]+(q[1]-A.p[i][1])*a]);
  } else if(B){ ball=B.b; pts=B.p; }
  else { ball=M.ball; pts=M.teams.flatMap(T=>T.men.filter(m=>!m.off).map(m=>[m.x,m.y])); }
  const men=M.teams.flatMap((T,s)=>T.men.filter(m=>!m.off).map(m=>({m,s})));
  // 阴影
  pts.forEach((q,i)=>{ if(!men[i])return;
    ctx.fillStyle="rgba(0,0,0,.34)"; ctx.beginPath(); ctx.arc(X(q[0])+2,Y(q[1])+3,10,0,6.2832); ctx.fill(); });
  pts.forEach((q,i)=>{
    const info=men[i]; if(!info) return;
    const club=C(info.s===0?M.h:M.a);
    const isOwner = M.ballOwner===info.m;
    ctx.beginPath(); ctx.arc(X(q[0]),Y(q[1]), info.m.pos==="GK"?10:11, 0, 6.2832);
    ctx.fillStyle= info.m.pos==="GK"? "#f0e14a" : club.c1;
    ctx.fill();
    ctx.lineWidth= isOwner?3.2:1.6;
    ctx.strokeStyle= isOwner? "#ffffff" : (info.s===0? "rgba(255,255,255,.65)":"rgba(0,0,0,.6)");
    ctx.stroke();
    ctx.fillStyle= info.m.pos==="GK"? "#111" : club.c2;
    ctx.font="bold 10px -apple-system,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(String(POSITIONS.indexOf(info.m.pos)+1), X(q[0]), Y(q[1]));
    // 名字
    ctx.fillStyle="rgba(255,255,255,.78)"; ctx.font="9px -apple-system,sans-serif";
    ctx.fillText(nm(info.m).slice(0,4), X(q[0]), Y(q[1])+19);
  });
  // 球
  ctx.beginPath(); ctx.arc(X(ball.x),Y(ball.y),6.2,0,6.2832);
  ctx.fillStyle="#ffffff"; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle="#111"; ctx.stroke();
}

  const M=CURMATCH, side=M.userSide;
  if(side<0) return;
  const T=M.teams[side], club=C(T.cid);
  const on=T.men.filter(m=>!m.off);
  const bench=club.subs.filter(id=>!T.benchUsed.includes(id)&&P(id).injury<=0);
  openModal(`换人（剩余 ${5-M.subsMade[side]} 个名额）`,
    `<div class="row"><div class="col"><div class="hint" style="margin-bottom:5px">场上球员（点击选择换下）</div>
      ${on.map((m,i)=>`<div class="clickable" onclick="pickOut(${i})" id="so-${i}"
        style="display:flex;gap:8px;padding:5px;border-bottom:1px solid #1d242e">
        <span class="tag t-${POS_GRP[m.pos]}">${POS_CN[m.pos]}</span><span style="flex:1">${esc(nm(m))}</span>
        <span style="color:${m.cond>70?'#00d47e':m.cond>50?'#f0a020':'#e5484d'}">${Math.round(m.cond)}%</span>
        <span style="color:var(--gold)">${m.rating.toFixed(1)}</span></div>`).join("")}</div>
    <div class="col"><div class="hint" style="margin-bottom:5px">替补席（点击换上）</div>
      ${bench.map(id=>{const p=P(id);return `<div class="clickable" onclick="pickIn(${id})"
        style="display:flex;gap:8px;padding:5px;border-bottom:1px solid #1d242e">
        <span class="tag t-${POS_GRP[p.pos]}">${POS_CN[p.pos]}</span><span style="flex:1">${esc(p.cn)}</span>
        <b style="color:${caColor(p.ca)}">${ovr(p)}</b><span class="hint">${Math.round(p.condition)}%</span></div>`;}).join("")

    <div class="hint" style="margin-top:10px" id="sub-hint">先选择换下的球员，再选择替补。</div>`);

let SUBOUT=null;
function pickOut(i){ SUBOUT=i;
  document.querySelectorAll('[id^="so-"]').forEach(e=>e.style.background="");
  const e=$("#so-"+i); if(e) e.style.background="#16301f";
  $("#sub-hint").textContent="已选择换下，请点击右侧替补球员。";
}
function pickIn(id){
  const M=CURMATCH, side=M.userSide;
  if(SUBOUT==null){ $("#sub-hint").textContent="请先选择要换下的球员。"; return; }
  const on=M.teams[side].men.filter(m=>!m.off);
  if(doSub(M,side,on[SUBOUT],id)){ toast("换人完成"); SUBOUT=null; closeModal(); refreshMatchUI(); }
  else toast("换人失败：名额已用完","bad");
}
function tacDialog(){
  const M=CURMATCH, T=M.teams[M.userSide], t=T.tac;
  const opts=[["mentality","心态",MENTALITY],["tempo","节奏",TEMPO_N],["press","逼抢",PRESS_N],["width","宽度",WIDTH_N]];

const SAVEKEY="fmweb_save_v1";

function vSave(v){
  v.appendChild(el("div","",`<h1>存档</h1><div class="sub">存档保存在本浏览器中；也可以导出为文件长期保留</div>`));
  const g=el("div","grid2");
  const a=el("div","card"); a.innerHTML="<h3>浏览器存档</h3>";
  let info='<div class="hint">暂无存档</div>';
  try{ const raw=localStorage.getItem(SAVEKEY);
    if(raw){ const m=JSON.parse(localStorage.getItem(SAVEKEY+"_meta")||"{}");
      info=`<div class="hint">${esc(m.club||"?")} · ${m.season||"?"} 赛季 · 第 ${m.day||0} 天<br>存档大小 ${(raw.length/1048576).toFixed(2)} MB</div>`; }
  }catch(e){}
  a.appendChild(el("div","",info));
  const b1=el("button","pri","保存进度"); b1.onclick=()=>saveGame();
  const b2=el("button","","读取存档"); b2.style.marginLeft="8px"; b2.onclick=()=>loadGame();
  const b3=el("button","danger","删除存档"); b3.style.marginLeft="8px";
  b3.onclick=()=>{ if(confirm("确定删除浏览器存档？")){ localStorage.removeItem(SAVEKEY); localStorage.removeItem(SAVEKEY+"_meta"); render(); } };
  a.appendChild(el("div","hr")); a.appendChild(b1); a.appendChild(b2); a.appendChild(b3);
  g.appendChild(a);

  const c2=el("div","card"); c2.innerHTML="<h3>文件存档</h3><div class='hint'>导出为 .json 文件，可在任何设备导入继续游戏</div><div class='hr'></div>";
  const e1=el("button","","导出存档文件"); e1.onclick=()=>exportSave();
  const inp=el("input"); inp.type="file"; inp.accept=".json"; inp.style.display="none";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ try{ WORLD=JSON.parse(r.result); VIEW="home"; render(); toast("存档已导入"); }
      catch(err){ toast("文件无法解析","bad"); } }; r.readAsText(f); };
  const e2=el("button","","导入存档文件"); e2.style.marginLeft="8px"; e2.onclick=()=>inp.click();
  c2.appendChild(e1); c2.appendChild(e2); c2.appendChild(inp);
  g.appendChild(c2);
  v.appendChild(g);

  const up=el("div","card");
  up.innerHTML=`<h3>版本与更新 ${UPDATE_READY?'<span class="tag t-w">有新版本</span>':''}</h3>
    <div class="hint">${UPDATE_READY
      ? "新版本已下载完成。<b style=\"color:var(--warn)\">请先在上方保存进度</b>，然后点击下方按钮应用更新。"
      : "全屏模式下没有浏览器刷新按钮。如果怀疑用的是旧版本，可在此强制拉取最新版（会先清空离线缓存）。"}</div>
    <div class="hr"></div>`;
  const ub=el("button", UPDATE_READY?"pri":"", UPDATE_READY?"应用更新并重新载入":"检查更新 / 强制刷新");
  ub.onclick=()=>{ toast("正在拉取最新版本…"); setTimeout(applyUpdate,400); };
  up.appendChild(ub);
  v.appendChild(up);

  const nn=el("div","card"); nn.innerHTML="<h3>重新开始</h3><div class='hint'>放弃当前进度，选择新的俱乐部</div><div class='hr'></div>";
  const nb=el("button","danger","开始新游戏");
  nb.onclick=()=>{ if(confirm("确定放弃当前进度并重新开始？")) newGameScreen(); };
  nn.appendChild(nb); v.appendChild(nn);
}
function saveGame(){
  try{
    const s=JSON.stringify(WORLD);
    localStorage.setItem(SAVEKEY,s);
    localStorage.setItem(SAVEKEY+"_meta",JSON.stringify({club:UC().cn,season:WORLD.season,day:WORLD.day}));
    toast(`已保存（${(s.length/1048576).toFixed(2)} MB）`);
  }catch(e){ toast("保存失败：浏览器存储空间不足，请改用导出文件","bad"); }
}
function loadGame(){
  try{
    const s=localStorage.getItem(SAVEKEY);
    if(!s){ toast("没有找到存档","bad"); return; }
    WORLD=JSON.parse(s); CURMATCH=null; VIEW="home"; render(); toast("存档已载入");
  }catch(e){ toast("读取失败","bad"); }
}
function exportSave(){
  const blob=new Blob([JSON.stringify(WORLD)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`足球经理_${UC().short}_${WORLD.season}_第${WORLD.day}天.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("存档文件已导出");
}

    <div style="background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:11px;text-align:left">
      <div class="hint">上次进度</div>
      <div style="font-weight:700;font-size:15px;margin:2px 0">${esc(m.club)}</div>
      <div class="hint">${m.season||"?"}/${m.season!=null?String(m.season+1).slice(2):"??"} 赛季 · 第 ${m.day} 天 · ${m.mb} MB</div>
    </div><div class="hr"></div>`;
  const mk=(cls,txt,fn)=>{ const b=el("button",cls,txt);
    b.style.cssText="display:block;width:100%;margin-top:9px;padding:11px"; b.onclick=fn; return b; };
  box.appendChild(mk("pri","▶ 继续游戏", continueGame));
  box.appendChild(mk("","＋ 新开一局", ()=>{
    if(confirm("开始新游戏会在保存时覆盖当前存档，确定继续？")) newGameScreen();
  }));
  const inp=el("input"); inp.type="file"; inp.accept=".json"; inp.style.display="none";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ WORLD=JSON.parse(r.result); CURMATCH=null; VIEW="home";
        AUTOSAVE_DAY=WORLD.day; enterGame(); toast("存档已导入"); }
      catch(err){ toast("文件无法解析","bad"); } };
    r.readAsText(f); };
  box.appendChild(mk("","📂 导入存档文件", ()=>inp.click()));
  box.appendChild(inp);
  ls.appendChild(box);
}

/* ---------- 新游戏 ---------- */
function newGameScreen(){
  document.getElementById("app").style.display="none";
  const ls=document.getElementById("loadscr");
  ls.style.display="flex"; ls.innerHTML="";
  // 顶部必须避开灵动岛/刘海，否则标题会被挖孔盖住
  ls.style.cssText="position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;display:block;"+
    "padding:calc(20px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal))";
  const box=el("div"); box.style.cssText="max-width:1080px;margin:0 auto";
  box.innerHTML=`<h1 style="font-size:32px;letter-spacing:5px;color:var(--acc);text-align:center;margin-bottom:4px">足球经理</h1>
    <div class="sub" style="text-align:center">选择一家俱乐部，开始你的执教生涯 · ${LEAGUE_SHORT.join(" / ")} 共 60 队</div>`;
  const tabs=el("div"); tabs.style.cssText="text-align:center;margin-bottom:14px";
  let curTier=0;
  const grid=el("div","grid4");
  function paint(){
    tabs.innerHTML="";
    LEAGUE_SHORT.forEach((n,i)=>{ const b=el("button","sm"+(curTier===i?" on":""),n);
      b.style.margin="0 5px"; b.onclick=()=>{curTier=i;paint();}; tabs.appendChild(b); });
    grid.innerHTML="";
    CLUB_DATA[curTier].forEach((cd,idx)=>{
      const [en,cn,sh,c1,c2,rep,cap,st]=cd;
      const d=el("div","card"); d.style.cssText+="cursor:pointer;transition:.15s";
      d.onmouseenter=()=>d.style.borderColor="var(--acc)";
      d.onmouseleave=()=>d.style.borderColor="var(--line)";
      const diff = rep>=80?["轻松","#00d47e"] : rep>=60?["普通","#7ed957"] : rep>=42?["有挑战","#ffd24a"] : rep>=30?["困难","#f0a020"] : ["地狱","#e5484d"];
      d.innerHTML=`<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        <img class="crest" src="${crestURI(clubFromData(curTier,idx))}" width="38" height="38" alt="">
        <div><b style="font-size:14px">${cn}</b><div class="hint" style="font-size:10px">${en}</div></div></div>
        <div class="hint">${st} · ${cap.toLocaleString()} 座</div>
        <div style="margin:6px 0"><div class="hint">俱乐部声望 ${rep}</div>
          <div class="bar"><i style="width:${rep}%;background:${diff[1]}"></i></div></div>
        <div class="hint">执教难度 <b style="color:${diff[1]}">${diff[0]}</b></div>`;
      d.onclick=()=>startGame(curTier, idx);
      grid.appendChild(d);
    });
  }
  paint();
  box.appendChild(tabs); box.appendChild(grid);
  const ft=el("div","hint"); ft.style.cssText="text-align:center;margin:22px 0 12px";
  ft.textContent="提示：声望越低的球队资金与球员越差，挑战越大。";
  box.appendChild(ft);
  if(saveMeta()){                       // 有存档时留一个退路，别把人困在选队页
    const back=el("div"); back.style.cssText="text-align:center;margin-bottom:36px";
    const b=el("button","sm","← 返回，继续原来的存档"); b.onclick=()=>startMenu();
    back.appendChild(b); box.appendChild(back);
  }
  ls.appendChild(box);
}
function startGame(tier, idx){
  const globalId = tier*20+idx;
  newWorld(Date.now()%2147483647, globalId, tier);
  WORLD.userClub=globalId;
  const c=UC();
  autoPickLineup(c);
  news("欢迎上任",`欢迎来到 ${c.cn}！董事会对你本赛季的期望是「${c.board.expect}」。祝你好运，教练。`,"good");
  news("赛季前瞻",`${WORLD.season}/${String(WORLD.season+1).slice(2)} 赛季即将开始，你可以在「战术」中调整阵型，在「转会」中补强阵容。`,"info");
  VIEW="home"; AUTOSAVE_DAY=WORLD.day; enterGame();
}

/* ---------- 赛季结束 ---------- */
function showSeasonEnd(){
  const h=WORLD.history[WORLD.history.length-1];
  if(!h) return;
  const c=UC();
  let html=`<div class="hint" style="margin-bottom:10px">${h.season}/${String(h.season+1).slice(2)} 赛季全部结束</div><div class="row">`;
  h.leagues.forEach(l=>{
    html+=`<div class="col"><div style="font-weight:700;margin-bottom:4px">${LEAGUE_NAMES[l.tier]}</div>`;
    l.table.slice(0,4).forEach(r=>html+=`<div style="font-size:12px">${r.rank}. ${crestHTML(C(r.id))}${esc(C(r.id).cn)} <span class="hint">${r.pts}分</span></div>`);
    html+=`</div>`;
  });
  html+=`</div><div class="hr"></div>
    <div>🏆 ${CUP_NAME}冠军：<b>${h.cup!=null?esc(C(h.cup).cn):"—"}</b></div>`;
  if(h.topScorers&&h.topScorers.length){
    html+=`<div class="hr"></div><div style="font-weight:700;margin-bottom:4px">最佳射手</div>`;
    h.topScorers.slice(0,5).forEach(x=>html+=`<div style="font-size:12px">${esc(x.n)} <span class="hint">${esc(x.c)}</span> — <b>${x.g}</b> 球 / ${x.ap} 场</div>`);
  }
  openModal("赛季回顾", html, `<button class="pri" onclick="closeModal();go('home')">进入新赛季</button>`);
}

/* ---------- 继续按钮 ---------- */
let BUSY=false;
function onContinue(){
  if(BUSY) return;
  if(WORLD.gameOver){ openModal("下课",`<div>${esc(WORLD.gameOver)}</div>`,
     `<button class="pri" onclick="closeModal();newGameScreen()">重新开始</button>`); return; }
  // 有未结算的用户比赛：未打完 → 回到比赛页；已打完 → 直接结算，否则会卡住
  if(CURMATCH){
    if(!CURMATCH.done){ VIEW="match"; render(); return; }
    BUSY=true;
    try{ completeMatch(); }
    catch(err){ console.error(err); toast("结算比赛出错："+(err&&err.message||err),"bad"); }
    finally{ BUSY=false; }
    return;
  }
  BUSY=true;
  let r;
  try{ r=advance(); }
  catch(err){ console.error(err); toast("推进失败："+(err&&err.message||err),"bad"); return; }
  finally{ BUSY=false; }   // 出错也要解锁，否则「继续」会永久失效
  if(r.t==="match"){ startUserMatch(r.fx); return; }
  if(r.t==="season"){ AUTOSAVE_DAY=-99; autoSave(); render(); showSeasonEnd(); return; }
  autoSave();
  render();
}

/* ---------- 启动 ---------- */
/* ---------- PWA：可安装 + 离线 ---------- */
let UPDATE_READY=false;
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  if(!/^https?:$/.test(location.protocol)) return;   // file:// 下跳过
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        // 已有旧版本在跑，且新版本装好了 → 提示而不是直接刷新，避免冲掉未保存的进度
        if(nw.state==="installed" && hadController && !UPDATE_READY){
          UPDATE_READY=true;
          toast("已下载新版本：请先保存进度，再到「存档」页点『应用更新』","warn");
          if(VIEW==="save") render();
        }
      });
    });
    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});
}
// 全屏模式下没有地址栏也没有下拉刷新，这里提供手动更新出口
function applyUpdate(){
  if(!("serviceWorker" in navigator)){ location.reload(); return; }
  navigator.serviceWorker.getRegistrations()
    .then(rs=>Promise.all(rs.map(r=>r.unregister())))
    .then(()=>caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))))
    .catch(()=>{})
    .then(()=>location.reload(true));
}
// 离线可用提示（仅首次）
function offlineHint(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    if(localStorage.getItem("fmweb_pwa_hint")) return;
    localStorage.setItem("fmweb_pwa_hint","1");
    setTimeout(()=>toast("提示：可把本页「添加到主屏幕」，之后断网也能玩"),2200);
  }catch(e){}
}

/* ---------- 移动端手势：彻底关掉缩放 ---------- */
function lockZoom(){
  // iOS Safari 会忽略 user-scalable=no，需拦截 gesture 事件
  ["gesturestart","gesturechange","gestureend"].forEach(t=>
    document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
  // 双指 touchmove 兜底（不影响单指滚动）
  document.addEventListener("touchmove", e=>{
    if(e.touches && e.touches.length>1) e.preventDefault();
  }, {passive:false});
  // 万一被浏览器缩放过，切回前台时复位
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden && window.visualViewport && window.visualViewport.scale>1.01)
      window.scrollTo(0,0);
  });
}

// 屏幕旋转：等布局稳定后重绘一次，避免残留滚动偏移与半旧布局
let _oriT=0, _oriLast="";
function watchOrientation(){
  const key=()=>innerWidth>innerHeight?"L":"P";
  _oriLast=key();
  const on=()=>{
    if(key()===_oriLast) return;
    _oriLast=key();
    clearTimeout(_oriT);
    _oriT=setTimeout(()=>{
      const s=document.getElementById("side"); if(s){ s.scrollLeft=0; s.scrollTop=0; }
      const v=document.getElementById("view"); if(v) v.scrollTop=0;
      try{ render(); }catch(e){}
    },260);
  };
  window.addEventListener("orientationchange",on);
  window.addEventListener("resize",on);
}

window.addEventListener("DOMContentLoaded",()=>{
  lockZoom();
  watchOrientation();
  registerSW();
  loadCustomCrests();
  document.getElementById("tb-go").onclick=onContinue;
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeModal();
    if(e.code==="Space" && VIEW==="match" && CURMATCH && !CURMATCH.done){ e.preventDefault(); toggleplay(); }
    if(e.key==="Enter" && !$("#modal").classList.contains("on")
       && (VIEW!=="match" || (CURMATCH && CURMATCH.done))) onContinue();
  });
  setTimeout(()=>{ startMenu(); offlineHint(); },450);
});

/* ---------- 调试/测试桥接（顶层 let 绑定不会自动挂到 window） ---------- */
Object.defineProperties(window,{
  WORLD:{get:()=>WORLD, set:v=>{WORLD=v;}, configurable:true},
  CURMATCH:{get:()=>CURMATCH, set:v=>{CURMATCH=v;}, configurable:true},
  ANIM:{get:()=>ANIM, set:v=>{ANIM=v;}, configurable:true},
  VIEW:{get:()=>VIEW, set:v=>{VIEW=v;}, configurable:true}
});
