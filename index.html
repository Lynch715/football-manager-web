<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="足球经理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>足球经理 · Football Manager Web</title>
<style>
:root{
  --bg:#0d1117; --bg2:#151b24; --bg3:#1c2430; --line:#2a3441;
  --txt:#e6edf3; --dim:#8b98a8; --dim2:#5f6b7a;
  --acc:#00d47e; --acc2:#0a8f57; --warn:#f0a020; --bad:#e5484d; --info:#4a9eff;
  --gold:#ffcc44;
  /* 刘海 / 灵动岛 / home 指示条安全区 */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{
  background:#121821;               /* 与底栏底色一致，万一差几像素也看不出 */
  touch-action:pan-x pan-y;          /* 允许滚动，禁止双指缩放与双击放大 */
  overscroll-behavior:none;          /* 禁止下拉刷新与橡皮筋回弹 */
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body{
  background:var(--bg);color:var(--txt);
  font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,212,126,.18);
}
input,textarea,select{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333d4b;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#465264}

/* ---------- 布局 ---------- */
/* 用 fixed+inset 铺满，不用 100vh/100svh：iOS 主屏启动（black-translucent）时 svh 会少算状态栏那一截，底部空出一条黑边 */
#app{display:flex;flex-direction:column;position:fixed;inset:0;overflow:hidden}
#topbar{
  height:calc(52px + var(--sat));flex:0 0 calc(52px + var(--sat));
  background:linear-gradient(180deg,#1b2430,#141b24);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:var(--sat) calc(14px + var(--sar)) 0 calc(14px + var(--sal));
}
#tb-crest{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
#tb-club{font-weight:700;font-size:14px;line-height:1.15}
#tb-club small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
.tb-stat{text-align:center;padding:0 10px;border-left:1px solid var(--line);min-width:78px}
.tb-stat b{display:block;font-size:13px}
.tb-stat span{font-size:10px;color:var(--dim)}
#tb-spacer{flex:1}
#main{flex:1;display:flex;min-height:0;min-width:0;overflow:hidden}
#side{
  width:calc(172px + var(--sal));flex:0 0 calc(172px + var(--sal));
  background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;overflow-anchor:none;min-height:0;min-width:0;
  padding:6px 0 var(--sab) var(--sal);
}
.nav-grp{font-size:10px;color:var(--dim2);padding:10px 14px 4px;letter-spacing:1px}
.nav{
  display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;
  color:var(--dim);border-left:3px solid transparent;user-select:none;font-size:13px;
}
.nav:hover{background:var(--bg3);color:var(--txt)}
.nav.on{background:var(--bg3);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.nav i{font-style:normal;width:16px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:700}
#view{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-anchor:none;
  -webkit-overflow-scrolling:touch;background:var(--bg);
  padding:16px calc(20px + var(--sar)) calc(40px + var(--sab)) 20px}
/* 超宽屏：内容居中限宽，表格与正文不被拉得太散 */
@media(min-width:1560px){#view>*{max-width:1440px;margin-left:auto;margin-right:auto}}

/* ---------- 通用组件 ---------- */
h1{font-size:19px;font-weight:700;margin-bottom:3px}
h2{font-size:15px;font-weight:700;margin:18px 0 8px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card>h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--txt);
  display:flex;align-items:center;gap:8px}
.card>h3 .tag{margin-left:auto}
/* 折叠栏目 */
.card.fold{padding:0;overflow:hidden;transition:border-color .25s}
.card.fold.open{border-color:#334050}
.fold>.fh{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:12px 14px;background:none;border:0;border-radius:0;
  color:var(--txt);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fold>.fh:active{background:rgba(255,255,255,.025)}
.fold>.fh:focus-visible{outline:2px solid var(--info);outline-offset:-2px}
.fold .fa{flex:0 0 3px;align-self:stretch;border-radius:2px;background:var(--line);margin:-2px 0;transition:background .25s}
.fold.open .fa{background:var(--acc)}
.fold .ft{font-size:13.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.fold .fs{flex:1;min-width:0;display:flex;gap:6px;justify-content:flex-end;align-items:center;overflow:hidden;white-space:nowrap}
.fold .chip{flex:0 0 auto;font-size:11px;color:var(--dim);background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.fold .chip.hot{color:#ffb070;border-color:rgba(255,122,69,.35);background:rgba(255,122,69,.08)}
.fold .chip.ok{color:var(--acc);border-color:rgba(0,212,126,.3);background:rgba(0,212,126,.07)}
.fold .chev{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);border:1px solid var(--line);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s}
.fold .chev svg{width:12px;height:12px;stroke:var(--dim);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.fold.open .chev{transform:rotate(180deg);background:rgba(0,212,126,.1);border-color:rgba(0,212,126,.35)}
.fold.open .chev svg{stroke:var(--acc)}
.fold .fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.fold.open .fb{grid-template-rows:1fr}
.fold .fbi{min-height:0;overflow:hidden}
.fold .fbc{padding:0 14px 14px;border-top:1px solid transparent;opacity:0;transform:translateY(-4px);transition:opacity .22s,transform .3s,border-color .25s}
.fold.open .fbc{opacity:1;transform:none;border-top-color:var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){ .fold .fb,.fold .fbc,.fold .chev,.fold .fa{transition:none} }
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
/* 网格子项默认 min-width:auto，卡片里的横滚表格会把整格顶宽（320px 机型上整页横向溢出）*/
.grid2>*,.grid3>*,.grid4>*,.row>.col{min-width:0}
@media(max-width:1100px){.grid3,.grid4{grid-template-columns:1fr 1fr}}

.tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:6px 7px;
  border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--bg2);z-index:2
}
th:hover{color:var(--txt)}
th.nos{cursor:default}
td{padding:5px 7px;border-bottom:1px solid #1d242e;white-space:nowrap}
tbody tr:hover{background:#1a222c}
tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
@media(min-width:901px){th.flexcol{width:100%}}
.ctr{text-align:center}

button,.btn{
  background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:5px;
  padding:6px 13px;font-size:12px;line-height:1.4;cursor:pointer;font-family:inherit;transition:.12s;
  min-height:32px;                       /* 2026-09-12 审计：全站点按高度下限，行内小按钮也一样 */
}
select{min-height:32px}
input[type=checkbox]{width:18px;height:18px;vertical-align:-4px;accent-color:var(--acc);margin:0 4px 0 0}
.tb-stat b,.tb-stat span{white-space:nowrap}
button:hover,.btn:hover{background:#28323f;border-color:#3c4756}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
button.pri:hover{background:#0aa866;border-color:#0aa866}
button.danger{background:#7a2226;border-color:#7a2226;color:#fff}
button.sm{padding:5px 10px;font-size:11px}
button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
select,input[type=text],input[type=number]{
  background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:5px;
  padding:5px 8px;font-size:12px;font-family:inherit
}
input[type=range]{accent-color:var(--acc)}
label{font-size:11px;color:var(--dim);display:block;margin-bottom:3px}
/* 筛选行：每个字段一列，控件行等高，滑块与下拉框基线对齐 */
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.filters>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.filters label{margin:0;white-space:nowrap}
.filters .ctl{height:30px;display:flex;align-items:center}
.filters select,.filters input[type=text]{height:30px;padding-top:0;padding-bottom:0}
.filters input[type=range]{margin:0;display:block}

.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:700;line-height:1.35}
.t-gk{background:#3d2a52;color:#c79cf0}
.t-df{background:#1e3a52;color:#69b7f0}
.t-mf{background:#1e4a30;color:#5fd48f}
.t-fw{background:#52281e;color:#f09069}
.t-ok{background:#123a26;color:var(--acc)}
.t-w{background:#3d3010;color:var(--warn)}
.t-b{background:#3d1618;color:#ff8080}
.t-i{background:#12293d;color:var(--info)}
.t-n{background:#252d38;color:var(--dim)}
.t-eu{background:#2a1f45;color:#c9a6ff}

.bar{height:5px;background:#252d38;border-radius:3px;overflow:hidden;min-width:44px}
.bar>i{display:block;height:100%;border-radius:3px}
.hint{color:var(--dim);font-size:11px}
.big{font-size:22px;font-weight:800;line-height:1.1}
.mono{font-variant-numeric:tabular-nums}
.pos{color:var(--acc)}.neg{color:var(--bad)}
.hr{height:1px;background:var(--line);margin:12px 0}
.center{display:flex;align-items:center;justify-content:center}
.empty{color:var(--dim2);text-align:center;padding:20px 16px;font-size:12px}
.scroll{max-height:420px;overflow-y:auto}
.pill{background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px}
.pcol-side{flex:0 0 210px;min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px 16px}
.chipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.attrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;align-items:start}
.attr{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px}
.attr .an{flex:1;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attr .av{width:20px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.crest{vertical-align:-4px;margin-right:6px;flex:0 0 auto;object-fit:contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
img.crest{display:inline-block}

/* ---------- 弹窗 ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:100;
  align-items:center;justify-content:center;backdrop-filter:blur(2px);
  padding:calc(24px + var(--sat)) calc(24px + var(--sar)) calc(24px + var(--sab)) calc(24px + var(--sal))}
#modal.on{display:flex}
#modal-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  /* 宽度贴合内容，短表单不再飘在一个 900px 的空盒子里 */
  width:max-content;min-width:min(440px,100%);max-width:min(900px,100%);
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal-hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#modal-hd b{font-size:15px}
#modal-hd .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:21px;line-height:1;
  width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;margin-right:-4px}
#modal-hd .x:hover{color:var(--txt);background:var(--bg3)}
#modal-bd{padding:16px;overflow-y:auto}
#modal-ft{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#modal-ft button{white-space:nowrap}

/* ---------- 提示条 ---------- */
#toast{position:fixed;bottom:calc(20px + var(--sab));left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:#1f2937;border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:6px;padding:9px 15px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);
  animation:tin .25s ease}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ---------- 比赛日 ---------- */
#pitchwrap{background:#0a1410;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#pitch{display:block;width:100%;height:auto;background:#12331f}
#mscore{display:flex;align-items:center;justify-content:center;gap:16px;padding:11px;
  background:var(--bg2);border-bottom:1px solid var(--line)}
#mscore .tn{font-weight:700;font-size:14px;width:190px}
#mscore .tn.a{text-align:right}
#mscore .sc{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
  background:#0b0f14;padding:2px 14px;border-radius:6px;letter-spacing:1px}
#mclock{text-align:center;font-size:12px;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
#mfeed{height:230px;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;font-size:12px}
.ev{padding:3px 0;border-bottom:1px solid #1a2029;display:flex;gap:9px;animation:evin .2s}
@keyframes evin{from{opacity:0;transform:translateX(-6px)}}
.ev .m{color:var(--dim);width:34px;flex:0 0 34px;font-variant-numeric:tabular-nums;font-size:11px}
.ev.goal{color:var(--acc);font-weight:700;background:#0d2a1c;margin:2px 0;padding:5px 8px;border-radius:4px}
#mfeed .ev.goal{margin:2px -12px;padding:5px 12px;border-radius:0}
.ev.chance{color:var(--warn)}
.ev.card{color:#ffd24a}
.ev.hurt{color:var(--bad)}
.ev.sys{color:var(--info)}

.fmt-slot{position:absolute;transform:translate(-50%,-50%);width:80px;text-align:center;cursor:pointer;user-select:none}
.fmt-slot .n{background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  font-size:11px;padding:3px 4px;margin:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmt-slot .p{font-size:10px;color:var(--acc);font-weight:700}
.fmt-slot .fs{font-size:10px;color:var(--dim)}
.fmt-slot.sel .n{border-color:var(--acc);background:var(--acc2);color:#fff}
.fmt-slot.tired .n{border-color:var(--warn)}

#loadscr{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:18px}
#loadscr h1{font-size:34px;letter-spacing:5px;color:var(--acc);font-weight:800}

/* ================= 移动端适配 ================= */
.mcol-main{flex:1;min-width:520px}
.mcol-side{flex:0 0 330px}
.tac-pitch{flex:0 0 520px}
#rotate-tip{display:none}

@media (max-width:900px){
  body{font-size:13px}
  #topbar{height:calc(46px + var(--sat));flex:0 0 calc(46px + var(--sat));gap:8px;
    padding:var(--sat) calc(8px + var(--sar)) 0 calc(8px + var(--sal))}
  #tb-crest{width:28px;height:28px;flex:0 0 28px}
  #tb-crest img{width:28px;height:28px}
  #tb-club{font-size:12.5px}
  #tb-club small{font-size:10px}
  .tb-stat{min-width:0;padding:0 7px}
  .tb-stat b{font-size:12px} .tb-stat span{font-size:10px}
  .s-pos{display:none}
  #tb-go{padding:7px 13px !important;font-size:12px;margin-left:6px !important}

  /* 导航移到底部：用 order 而非 column-reverse，避免反向弹性容器的重排抖动 */
  #main{flex-direction:column}
  #view{order:1}
  /* 两排固定导航：9 + 8，全部可见，无需横向滚动 */
  #side{order:2;
    width:100%;
    height:auto;flex:0 0 auto;
    display:flex;flex-wrap:wrap;align-items:stretch;
    overflow:hidden;overflow-anchor:none;
    border-right:none;border-top:1px solid var(--line);
    background:linear-gradient(180deg,#18202b,#121821);
    /* 安全区只留一小截，别整条空着 */
    padding:1px var(--sar) max(calc(var(--sab) - 14px), 3px) var(--sal);
    scrollbar-width:none}
  #side::-webkit-scrollbar{display:none}
  .nav-grp{display:none}
  .nav{position:relative;flex:1 1 10%;flex-direction:column;gap:0;
    margin:2px 1px;padding:3px 0 2px;border-radius:8px;
    border-left:none;border-top:none;line-height:1.1;
    font-size:9px;white-space:nowrap;min-width:0;justify-content:center;align-items:center;
    overflow:hidden}
  .nav:hover{background:none;color:var(--dim)}
  .nav.on{background:rgba(0,212,126,.13);color:var(--acc);font-weight:600}
  .nav i{width:auto;font-size:15px;line-height:1.3;filter:grayscale(1);opacity:.6}
  .nav.on i{filter:none;opacity:1}
  .nav .badge{position:absolute;top:0;right:50%;transform:translate(15px,0);margin:0}
  /* 底栏已经吃掉安全区，视图底部不要再补一次，否则留白翻倍 */
  #view{padding:11px calc(11px + var(--sar)) 10px calc(11px + var(--sal))}

  /* 单栏堆叠 */
  .grid2,.grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr;gap:9px}
  .row{gap:11px}
  .col{min-width:100% !important}
  .mcol-main,.mcol-side,.tac-pitch,.pcol-side{flex:1 1 100% !important;min-width:0 !important}
  .card{padding:11px;margin-bottom:11px}
  h1{font-size:17px}
  .big{font-size:19px}

  /* 筛选行：等宽网格，列与列对齐，控件拉满，不再一行一个宽度 */
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px 12px;align-items:end}
  .filters>div{min-width:0}
  .filters .ctl{height:36px}
  .filters select,.filters input[type=text],.filters input[type=number]{height:36px;width:100% !important}
  .filters input[type=range]{width:100% !important}

  /* 表格 */
  .pill{padding:7px 11px;font-size:11.5px;min-height:32px;display:inline-flex;align-items:center;gap:4px}
  .tw{border-radius:6px}
  table{font-size:11.5px;min-width:max-content}
  th,td{padding:6px 8px}
  button,.btn{padding:9px 14px;font-size:12.5px}
  button.sm{padding:8px 11px;font-size:12px}
  select,input[type=text],input[type=number]{font-size:16px;padding:7px 9px}

  /* 弹窗全屏 */
  #modal{padding:0;align-items:stretch}
  #modal-box{max-height:100vh;max-height:100svh;border-radius:0;width:100%;min-width:0;max-width:none}
  #modal-hd{padding-top:calc(13px + var(--sat));
    padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar))}
  #modal-bd{padding:12px calc(12px + var(--sar)) 12px calc(12px + var(--sal))}
  #modal-ft{padding-bottom:calc(11px + var(--sab));
    padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar))}
  #modal-bd table{min-width:max-content}

  /* 比赛日 */
  #mscore{padding:8px;gap:8px}
  #mscore .tn{width:auto;flex:1;font-size:12.5px}
  #mscore .sc{font-size:21px;padding:2px 10px}
  #mfeed{height:170px}
  .fmt-slot{width:68px}
  .fmt-slot .n{font-size:10px;padding:2px 3px}
  .fmt-slot .p,.fmt-slot .fs{font-size:10px}
}

/* 竖屏窄屏进一步压缩 */
@media (max-width:560px){
  .grid4{grid-template-columns:1fr 1fr}
  .s-next{display:none}
  #tb-club{max-width:96px;overflow:hidden}
  .nav{font-size:9px}
  /* 表格：隐藏次要列，让积分 / 能力等关键列不用横向滚动就能看到 */
  .mh,.en-sub,.pos2{display:none !important}
  th,td{padding:6px 5px}
  .tag{padding:2px 5px;font-size:11px}
  /* 提示气泡移到底部导航之上，避免遮住导航 */
  #toast{bottom:calc(84px + var(--sab))}
  /* 弹窗底部按钮：均分两列，文字不折行 */
  #modal-ft{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #modal-ft button{width:100%;padding:10px 6px;font-size:13px}
  #modal-ft button:only-child,
  #modal-ft button:last-child:nth-child(odd){grid-column:1 / -1}   /* 落单的按钮占满整行，别孤零零挂在左边 */
  /* 页面顶部的分段按钮组：可横向滚动而不换行挤压 */
  .segbar{display:flex;flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .segbar::-webkit-scrollbar{display:none}
  .segbar button{flex:0 0 auto}
}

/* 横屏手机：保留左侧图标导航，纵向空间优先 */
@media (max-height:520px) and (orientation:landscape){
  /* 安卓/鸿蒙弹键盘会把视口压扁，看起来像横屏；html.kb 时不切横屏布局（见 kbGuard） */
  html:not(.kb) #topbar{height:calc(40px + var(--sat));flex:0 0 calc(40px + var(--sat));padding-top:var(--sat)}
  html:not(.kb) #tb-crest{width:24px;height:24px;flex:0 0 24px}
  html:not(.kb) #tb-crest img{width:24px;height:24px}
  html:not(.kb) #main{flex-direction:row}
  html:not(.kb) #view{order:2}
  html:not(.kb) #side{order:1;
    width:calc(60px + var(--sal));flex:0 0 calc(60px + var(--sal));
    height:auto;flex-direction:column;flex-wrap:nowrap;align-items:stretch;
    overflow-y:auto;overflow-x:hidden;
    border-top:none;border-right:1px solid var(--line);
    padding:2px 0 var(--sab) var(--sal)}
  html:not(.kb) .nav{flex:0 0 auto}
  html:not(.kb) .nav{min-width:0;margin:0;border-radius:0;padding:7px 2px;font-size:9px;border-top:none;border-left:3px solid transparent}
  html:not(.kb) .nav.on{background:var(--bg3);border-left-color:var(--acc);border-top-color:transparent}
  html:not(.kb) #view{padding:9px calc(11px + var(--sar)) calc(16px + var(--sab)) 11px}
  html:not(.kb) #mfeed{height:150px}
  html:not(.kb) .card{margin-bottom:9px}
  html:not(.kb) .col{min-width:0 !important}
  html:not(.kb) .mcol-main{flex:1 1 60% !important}
  html:not(.kb) .mcol-side{flex:1 1 34% !important;min-width:250px !important}
  html:not(.kb) .tac-pitch{flex:1 1 46% !important;min-width:280px !important}
  html:not(.kb) .tac-pitch>div[style*="aspect-ratio"]{max-height:260px !important;min-height:200px !important}
  html:not(.kb) .grid2{grid-template-columns:1fr 1fr}
  html:not(.kb) .grid4{grid-template-columns:repeat(4,1fr)}
  html:not(.kb) #modal-box{max-height:100svh}
}
/* 阵容预设 */
.preset-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.preset{display:flex;flex-direction:column;gap:4px;min-width:0}
.preset-main{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-width:0;text-align:left;padding:6px 8px}
.preset-main .pn{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-main .pf{font-size:11px;color:var(--dim)}
.preset-main.empty{opacity:.55;border-style:dashed}
.preset-ops{display:flex;gap:4px}
.preset-ops button{flex:1;padding:4px 0;font-size:12px;min-width:0}
.preset-ops button[data-op="ren"]{flex:0 0 34px}
</style>
</head>

/* =========================================================
   队徽系统：原创 SVG 生成 + 自定义图片替换

// 每队 [外形, 底纹]  外形: shield 尖盾 / crest 平顶盾 / round 圆形 / diamond 菱形
// 底纹: solid 纯色 / vstripe 竖条 / hoops 横环 / halves 左右分色 / sash 斜带 / quarters 四分 / chevron 人字
// 队徽外形/缩写已并入各队数据行

// ---------- 颜色工具 ----------
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lum(h){ const [r,g,b]=hex2rgb(h).map(v=>{v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b; }
function contrast(a,b){ const la=lum(a),lb=lum(b);
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05); }
function shade(h,f){ const [r,g,b]=hex2rgb(h);
  const m=v=>Math.round(clamp(f<0? v*(1+f) : v+(255-v)*f,0,255));
  return "#"+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,"0")).join(""); }

function initialsOf(en, abbr){
  if(abbr) return abbr;
  const w=en.replace(/[^A-Za-z ]/g,"").split(/\s+/).filter(Boolean);
  if(w.length===1) return w[0].slice(0,3).toUpperCase();
  if(w.length===2) return (w[0][0]+w[1][0]).toUpperCase();
  return w.slice(0,3).map(x=>x[0]).join("").toUpperCase();
}

// ---------- 外形路径 ----------
function shapePath(kind,inset){
  const k=inset||0;
  switch(kind){
    case "round":   return null;   // 用 circle
    case "diamond": return `M32 ${2+k} L${62-k} 32 L32 ${62-k} L${2+k} 32 Z`;
    case "crest":   return `M${5+k} ${5+k} H${59-k} V${34-k*0.3} Q${59-k} ${52-k} 32 ${61-k} Q${5+k} ${52-k} ${5+k} ${34-k*0.3} Z`;
    default:        return `M32 ${2+k} L${60-k} ${11+k} V${31} C${60-k} ${46-k} ${46-k} ${57-k} 32 ${62-k} C${18+k} ${57-k} ${4+k} ${46-k} ${4+k} 31 V${11+k} Z`;
  }
}
function patternSVG(kind,col){
  switch(kind){
    case "vstripe": return [10,22,34,46].map(x=>`<rect x="${x}" y="0" width="6" height="64" fill="${col}"/>`).join("");
    case "hoops":   return [12,26,40,54].map(y=>`<rect x="0" y="${y}" width="64" height="7" fill="${col}"/>`).join("");
    case "halves":  return `<rect x="0" y="0" width="32" height="64" fill="${col}"/>`;
    case "sash":    return `<path d="M-6 44 L44 -6 L60 6 L10 56 Z" fill="${col}"/>`;
    case "quarters":return `<rect x="0" y="0" width="32" height="32" fill="${col}"/><rect x="32" y="32" width="32" height="32" fill="${col}"/>`;
    case "chevron": return `<path d="M32 8 L60 34 L60 48 L32 22 L4 48 L4 34 Z" fill="${col}"/>`;
    default:        return "";
  }
}
function starRow(n,y){
  if(!n) return "";
  const s=(cx)=>`<path transform="translate(${cx} ${y}) scale(.115)" fill="#ffcf४4"
    d="M0 -30 L8.8 -9.3 L31 -9.3 L13 4.5 L20 26 L0 13 L-20 26 L-13 4.5 L-31 -9.3 L-8.8 -9.3 Z"/>`;
  const xs = n===1?[32]: n===2?[25,39]: [18,32,46];
  return xs.map(s).join("").replace(/ffcf४4/g,"ffcf44");
}

// ---------- 生成 SVG ----------
function buildCrestSVG(c){
  const idx = "c"+hashStr(c.en).toString(36);
  const shape=c.shape||"shield", pat=c.pat||"solid";
  let c1=c.c1, c2=c.c2;
  if(contrast(c1,c2)<1.35) c2 = lum(c1)>0.5? shade(c1,-0.55) : shade(c1,0.55);
  const dark = lum(c1)>0.55;
  const border = dark? shade(c1,-0.62) : shade(c1,-0.35);
  const band   = dark? "#111820" : "#ffffff";
  let txt = contrast(c1,band)>=2.6? c1 : (contrast(c2,band)>=2.6? c2 : (band==="#ffffff"?"#111820":"#ffffff"));
  const ini=initialsOf(c.en, c.abbr);
  const stars = c.rep>=85?3 : c.rep>=68?2 : c.rep>=48?1 : 0;
  const fs = ini.length>=3? 15.5 : 18;
  const clip=`cl${idx}`;
  const inner = shape==="round"
    ? `<circle cx="32" cy="32" r="26.5"/>`
    : `<path d="${shapePath(shape,4)}"/>`;
  const outer = shape==="round"
    ? `<circle cx="32" cy="32" r="30" fill="${border}"/>`
    : `<path d="${shapePath(shape,0)}" fill="${border}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<defs><clipPath id="${clip}">${inner}</clipPath>
<linearGradient id="g${idx}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#000000" stop-opacity=".22"/></linearGradient></defs>
${outer}
<g clip-path="url(#${clip})">
  <rect x="0" y="0" width="64" height="64" fill="${c1}"/>
  ${patternSVG(pat,c2)}
  <rect x="0" y="0" width="64" height="64" fill="url(#g${idx})"/>
  <rect x="0" y="${shape==="round"?26:27}" width="64" height="17" fill="${band}" opacity=".93"/>
  <text x="32" y="${shape==="round"?38.5:39.5}" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
    font-size="${fs}" font-weight="700" fill="${txt}" letter-spacing="0.5">${ini}</text>
  ${starRow(stars, shape==="round"?17:18)}
</g>
${shape==="round"?`<circle cx="32" cy="32" r="26.5" fill="none" stroke="${band}" stroke-opacity=".35" stroke-width="1"/>`
 :`<path d="${shapePath(shape,4)}" fill="none" stroke="${band}" stroke-opacity=".3" stroke-width="1"/>`}
</svg>`;
}

// 由数据行构造俱乐部基础对象（不含阵容）
function clubFromRow(row, nation, tier){

// ---------- 种子随机 ----------
let RNGSTATE = 123456789;
function seedRng(s){ RNGSTATE = (s>>>0)||1; }
function rnd(){ // mulberry32
  RNGSTATE |= 0; RNGSTATE = (RNGSTATE + 0x6D2B79F5) | 0;
  let t = Math.imul(RNGSTATE ^ (RNGSTATE >>> 15), 1 | RNGSTATE);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a,b)=> a + Math.floor(rnd()*(b-a+1));
const pick = arr => arr[Math.floor(rnd()*arr.length)];
// 按权重随机取一个元素（权重全为 0 时退化为均匀随机）
function pickW(arr, wts){
  let t=0; for(let i=0;i<wts.length;i++) t+=Math.max(0,wts[i]);
  if(t<=0) return pick(arr);
  let r=rnd()*t;
  for(let i=0;i<arr.length;i++){ r-=Math.max(0,wts[i]); if(r<0) return arr[i]; }
  return arr[arr.length-1];
}
function gauss(mu,sd){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd();
  return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v); }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const R1=v=>Math.round(v*10)/10;

// ---------- 中文译名 ----------
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function toCN(first,last){
  return (NAME_CN[first]||first) + "·" + (NAME_CN[last]||last);
}

// ---------- 属性生成 ----------
function genAttrs(lvl,pos){
  const w = POS_WEIGHTS[pos], A={};
  const isGK = pos==="GK";
  for(const k of ATTR_KEYS){
    const gkAttr = k in ATTRS_GK;
    let base;
    if(gkAttr && !isGK)      base = lvl*0.045 + gauss(0,1.2) - 4;
    else if(!gkAttr && isGK && (k in ATTRS_TECH) && k!=="passing" && k!=="setpiece")
                             base = lvl*0.09 + gauss(0,1.3) - 2;
    else {
      const weight = w[k]||0;
      const wf = 0.72 + weight*0.075;          // 关键属性更高
      base = (lvl/5.2)*wf + gauss(0,1.35);
    }
    A[k]=clamp(Math.round(base),1,20);
  }
  return A;
}

// 成长天花板：球员从出道能力 ca0 出发，16 到 26 岁之间逐步释放 pa-ca0 这段空间。
// 没有这条，17 岁的青训产物一个赛季能涨 30 点，20 岁就顶满潜力。
function devCap(p){
  const base = (p.ca0!=null? p.ca0 : p.ca);
  const f = clamp(((p.age!=null?p.age:24)-15.5)/10.5, 0.05, 1);
  return base + (p.pa-base)*f + p.pa*0.03;      // 末尾 3% 是余量，免得曲线太规整
}
// 职业素养（隐藏，1~20）：同样的潜力，能兑现多少看它。大多数人 8~14。
function genProf(){ return clamp(Math.round(gauss(10.5,3.2)),1,20); }
function genProfLegend(){ return clamp(Math.round(gauss(15.5,2.5)),14,20); }   // 传奇保底 14
function profOf(p){ if(p.prof==null) p.prof = p.legend? genProfLegend() : genProf(); return p.prof; }
function profTxt(p){ const v=profOf(p);
  return v>=17?'<b style="color:var(--acc)">极其职业</b>' : v>=14?'训练刻苦' : v>=9?'正常' :
         v>=6?'<span style="color:var(--warn)">态度一般</span>' : '<span style="color:var(--bad)">态度散漫</span>'; }

// 季末（年龄 +1 之后）调用：成长窗口关闭 + 23 岁以下的停滞 / 后程发力
const GAP_LOSS={24:0.25,25:0.40,26:0.55};
function prospectFate(p){
  const pr=profOf(p);
  const own = p.clubId>=0 && p.clubId===WORLD.userClub;
  const sl = (WORLD.shortlist||[]).find(x=>x.id===p.id);
  const showNum = own || (sl && sl.know>=95);
  // 24 岁起，没长出来的那段潜力逐年作废，27 岁基本定型
  if(p.age>=24){
    const gap=p.pa-p.ca;
    if(gap>4){ const k=(p.age>=27?0.7:GAP_LOSS[p.age])*(1.25-pr*0.025);
      p.pa=Math.max(p.ca, Math.round(p.pa-gap*k)); }
  }
  if(p.age>24) return;
  const sh=clamp(playShare(p),0,1);
  const stallP=0.085*(1.6-pr*0.06)*(sh<0.3?1.5:sh>0.6?0.7:1);
  const bloomP=0.03*(0.4+pr*0.06)*(sh>0.6?1.4:sh<0.3?0.5:1);
  const r=rnd(), a=p.pa;
  if(r<stallP && p.pa-p.ca>=6){
    p.pa=Math.max(p.ca+2, p.pa-ri(14,34));
    const why = sh<0.3? "这一年上场太少，" : pr<8? "训练里不太上心，" : "";
    if(own) news(`${p.cn} 发展停滞`,`助教的年度报告：${p.cn}${why}进步比预想的慢。教练组把对他的预期从 ${Math.round(a/2)} 下调到 ${Math.round(p.pa/2)}。`,"bad");
    else if(sl) news(`球探简报：${p.cn} 不如预期`,`球探跟了 ${p.cn} 一年，觉得他${why}没长成当初看好的样子，评估已经下调。`,"warn");
  } else if(r<stallP+bloomP){
    p.pa=Math.min(200, p.pa+ri(10,24));
    if(own) news(`${p.cn} 进步神速`,`助教的年度报告：${p.cn} 这一年的进步超出了所有人预料。教练组把对他的预期从 ${Math.round(a/2)} 上调到 ${Math.round(p.pa/2)}。`,"good");
    else if(sl) news(`球探简报：${p.cn} 比预想的好`,`球探说 ${p.cn} 这一年长得很快，${showNum?`潜力评估上调到 ${Math.round(p.pa/2)}`:"评估已经上调"}。`,"good");
  }
  p.value=calcValue(p);
}
// 23 岁以下伤停 60 天以上：可能伤到潜力和身体
function injuryHitsPotential(p,days){
  if(p.age>23 || days<60) return;
  if(rnd() >= (days>=100?0.5:0.3)) return;
  const a=p.pa;
  p.pa=Math.max(p.ca+2, p.pa-ri(8,24));
  const n=ri(1,2);
  for(let i=0;i<n;i++){ const k=pick(["pace","accel","agility","stamina","jumping","strength"]); if(p.a[k]>1) p.a[k]--; }
  p.ca=calcCA(p.a,p.pos); p.value=calcValue(p);
  if(p.clubId>=0 && p.clubId===WORLD.userClub)
    news(`${p.cn} 的伤可能留下后遗症`,`队医的判断：${p.cn} 这次伤得很重，恢复后身体素质会打折扣，教练组把对他的预期从 ${Math.round(a/2)} 下调到 ${Math.round(p.pa/2)}。`,"bad");
}
function calcCA(A,pos){
  const w=POS_WEIGHTS[pos]; let s=0,t=0;
  for(const k in w){ s += (A[k]||1)*w[k]; t += w[k]; }
  const core = s/t;                       // 1-20
  let extra=0,n=0;
  for(const k of ATTR_KEYS){ if(!(k in w) && !(k in ATTRS_GK)){ extra+=A[k]; n++; } }
  const rest = n? extra/n : 10;
  return Math.round((core*0.85 + rest*0.15)*10);   // 10-200
}

// 位置适配度 0~1
function posFit(p,pos){
  if(p.pos===pos) return 1;
  if((p.pos2||[]).includes(pos)) return 0.9;
  if((POS_NEAR[p.pos]||[]).includes(pos)) return 0.72;
  if(p.pos==="GK"||pos==="GK") return 0.18;
  return 0.5;
}

// ---------- 身价 / 工资 ----------
/* ---- 球员价值（借 ZenGM value / valueCombineOvrPot 的思路） ----
   valueCA = 「按表现修正的当前能力」与潜力按年龄合成，再向 ca 压回 K 倍。
   身价、要价、AI 出价都吃它；排阵不吃（排阵不该看潜力）。 */
const VALUE_K = 0.5;                                  // 2026-09-12 校准：24-28 岁桶身价中位 0.98，≤19 桶 1.0/95 分位 1.58
function valueCombine(cur, pot, age){
  if(age<=19) return .70*pot+.30*cur;
  if(age<=21) return .60*pot+.40*cur;
  if(age<=23) return .55*pot+.45*cur;
  if(age<=24) return .45*pot+.55*cur;
  if(age<=25) return .30*pot+.70*cur;
  if(age<=26) return .15*pot+.85*cur;
  if(age<=27) return .025*pot+.975*cur;
  if(age<=30) return .93*cur;
  if(age<=33) return .92*cur;
  return .90*cur;
}
// 表现折算到 CA 尺度。perfRaw 是单边指标（评分 6.7 以下一律 0，中位数只有 0.02），
// 所以中性点取 0.08：普通人 −2，前 10% 的表现 +12 左右（显示尺度 +6）；本季出场不足 12 场按比例少信
function perfCA(p){
  const w=Math.min(1,(p.apps||0)/12);
  const hasLast=p.last&&p.last.apps>0;
  const ww = w>0? w : (hasLast? 0.6 : 0);            // 新赛季初拿上季数据，打六折
  return p.ca + (perfRaw(p)-0.08)*28*ww;
}
function valueCA(p){
  const cur=perfCA(p), pot=Math.max(p.pa||p.ca, cur);
  const comb=valueCombine(cur, pot, p.age!=null?p.age:26);
  return p.ca + (comb-p.ca)*VALUE_K;
}
function calcValue(p){
  const ca=valueCA(p), age=p.age;
  let v = Math.pow(ca/10, 3.55) * 2200;
  let ageF = age<=19?1.4: age<=22?1.5: age<=25?1.4: age<=28?1.1: age<=31?0.7: age<=33?0.35: 0.14;
  v *= ageF;
  const yrs = Math.max(0, p.contract - WORLD.season);
  v *= yrs<=0?0.16: yrs===1?0.62: yrs===2?0.9: 1;
  if(p.injury>0) v*=0.82;
  return Math.max(3000, Math.round(v/1000)*1000);
}
/* 联赛薪资系数（2026-10 v49）。工资公式原来不分联赛，德甲/法甲/意甲球队的工资按英超水平开、
   营收却只有英超的一半多，开局八成球队超出董事会上限，只能靠租借凑阵容。
   系数按「开局各联赛 现有年薪/目标上限 中位数 ≈ 0.95」校准，次序 = LEAGUE_DEFS（英超、英冠、英甲、西甲、西乙、意甲、意乙、德甲、德乙、法甲、法乙）。*/
const LEAGUE_WAGE_F=[0.92, 0.97, 0.74, 0.84, 0.65, 0.69, 0.61, 0.59, 0.79, 0.53, 0.65];
const EURO_WAGE_F=0.69;
function wageF(c){ if(!c) return 1; if(c.nation===EURO_NATION) return EURO_WAGE_F;
  const lg=lgIndex(c.nation,c.tier); return (lg>=0 && LEAGUE_WAGE_F[lg]!=null)? LEAGUE_WAGE_F[lg] : 1; }   // 建世界时 c.lg 还没设，按 nation/tier 现算
function calcWage(p, rep, club){
  let w = (Math.pow(p.ca/10,3.0)*33 + rep*20) * wageF(club);
  if(p.age<21) w*=0.5; else if(p.age<24) w*=0.82; else if(p.age>33) w*=0.85;
  return Math.max(300, Math.round(w/50)*50);   // 周薪 £

// ---------- 单个球员 ----------
let PID=1;
function nextPid(){ if(WORLD && WORLD.pid!=null){ WORLD.pid++; return WORLD.pid; } return PID++; }
function makePlayer(lvl, pos, age, clubId){
  const club = (clubId>=0 && WORLD && WORLD.clubs[clubId]) ? WORLD.clubs[clubId] : null;
  const wheel = club ? regionWheelFor(club.rg, NATIONS[club.nation]?NATIONS[club.nation].code:"") : REGION_WHEEL;
  const rg=pick(wheel), pool=NAME_POOLS[rg];

    pos, pos2:[], age, clubId, nat:(club && club.nation===EURO_NATION && rg===club.rg && club.country)? club.country : pick(pool.nat), rg,
    a:A, ca:0, pa:0,

    contract:0, wage:0, value:0,
    apps:0, goals:0, assists:0, cleanSheet:0, ratingSum:0, motm:0, yellow:0, red:0, susp:0,
    careerApps:0, careerGoals:0,

             : age<=23? ri(6,32) : age<=26? ri(0,18) : age<=29? ri(0,7) : 0;

  // 副位置

     原来的 ri(1,4) 让建世界时几乎没人到期（中位 0%），过渡棘轮在第一季拿不到任何空间，
     全世界冻一季（实测第一季 AI 只成交 48 笔，稳态 210~262）。*/
  p.contract = WORLD.season + (age<20? ri(1,4) : age>32? ri(0,2) : ri(0,4));
  return p;
}

// ---------- 球衣号码 ----------
// 各位置的惯用号码，按顺序试；都被占了就取 1~99 里最小的空号。
const NUM_PREF = {
  GK:[1,12,13,25,31], DC:[4,5,6,3,2,15,24,32], DL:[3,18,33,26], DR:[2,12,22,27],
  DM:[6,4,16,28,29], MC:[8,14,16,20,21,23], ML:[11,17,19,30], MR:[7,17,26,34],
  AM:[10,21,23,35], ST:[9,19,20,29,39,45]
};
function takenNumbers(c){
  const set=new Set();
  c.squad.forEach(id=>{ const q=P(id); if(q && q.num) set.add(q.num); });
  return set;
}
function assignNumber(c, p, taken){
  taken = taken || takenNumbers(c);
  for(const k of (NUM_PREF[p.pos]||[])) if(!taken.has(k)){ p.num=k; taken.add(k); return k; }
  // 兜底先从 12 号往上找：1~11 是有讲究的号码，别让边前卫捡到 9 号
  for(let k=12;k<=99;k++) if(!taken.has(k)){ p.num=k; taken.add(k); return k; }
  for(let k=2;k<=11;k++) if(!taken.has(k)){ p.num=k; taken.add(k); return k; }
  p.num=null; return null;
}
// 给整支球队补号：只动没号的和撞号的，已有号码保持不变
function ensureNumbers(c){
  if(!c || !c.squad) return;
  const taken=new Set(), dup=[];
  c.squad.forEach(id=>{
    const q=P(id); if(!q) return;
    if(q.num && !taken.has(q.num)) taken.add(q.num);
    else { q.num=null; dup.push(q); }
  });
  // 先排门将，再按位置模板顺序，让 1/9/10 这类号码落到对的人身上
  const order=["GK","DC","DL","DR","DM","MC","ML","MR","AM","ST"];
  dup.sort((a,b)=> (order.indexOf(a.pos)-order.indexOf(b.pos)) || (b.ca-a.ca));
  dup.forEach(q=>assignNumber(c,q,taken));
}
function ensureAllNumbers(){ (WORLD.clubs||[]).forEach(ensureNumbers); }

// ---------- 阵容生成 ----------
const SQUAD_TEMPLATE = [ // 位置 : 人数
  ["GK",3],["DC",5],["DL",2],["DR",2],["DM",2],["MC",4],["ML",2],["MR",2],["AM",2],["ST",4]

// 让单项能力算出来的 CA 与总评一致（否则第一次训练加点时 CA 会跳变，
// 部分球员 CA 会高于潜力而永远无法成长）
function fitAttrsToOverall(A,pos,target){
  for(let it=0;it<8;it++){
    const cur=calcCA(A,pos); if(Math.abs(cur-target)<=2) break;
    const k=target/cur;
    for(const key of ATTR_KEYS){
      const gk=key in ATTRS_GK;
      if((pos==="GK")!==gk && A[key]<=4) continue;      // 无关的低分项不动
      A[key]=clamp(Math.round(A[key]*k),1,20);
    }
  }
}

    // 合同年限打散到 1~4 年（33 岁以上 0~2 年）。原来一律 +2，开局没人到期、第二季末三千多名真实球员同时到期；
    // 也不放 0 年：最后一年合同身价只剩一成多，开局会有一批球星 £3M 就能买走
    contract:WORLD.season+(age>32? ri(0,2) : ri(1,4)), wage:0, value:0,
    apps:0, goals:0, assists:0, cleanSheet:0, ratingSum:0, motm:0, yellow:0, red:0, susp:0,
    careerApps:0, careerGoals:0,
    scouted:0, homegrown:false, form:[], realData:true
  };
  p.pa=Math.max(p.pa,p.ca); p.prof=genProf();
  // 副位置去掉与主位置相同的项
  p.pos2=p.pos2.filter(x=>x!==pos);
  p.wage=calcWage(p,club?club.rep:50,club); p.value=calcValue(p);
  return p;
}
// 真实名单人数不足（有的队只有 15 人）时，用生成球员补足替补深度
function topUpSquad(club){
  const rep=club.rep;
  const count=pos=>club.squad.filter(i=>P(i).pos===pos).length;
  const add=pos=>{
    const lvl=clamp(gauss(rep*0.70+4, 5), 8, 90);        // 替补级别
    const r=rnd(); const age = r<0.35? ri(18,21) : r<0.75? ri(22,26) : ri(27,31);
    const p=makePlayer(lvl,pos,age,club.id);
    p.wage=calcWage(p,rep,club); p.value=calcValue(p);
    if(age<=21 && rnd()<0.6) p.homegrown=true;
    WORLD.players[p.id]=p; club.squad.push(p.id);
  };
  const minPer={GK:2,DC:3,DL:1,DR:1,DM:1,MC:2,ML:1,MR:1,AM:1,ST:2};
  for(const pos in minPer){ let guard=0; while(count(pos)<minPer[pos] && guard++<5) add(pos); }
  let guard=0;
  while(club.squad.length<22 && guard++<20){
    // 补最缺的位置
    let best=null,bestGap=-1;
    for(const [pos,cnt] of SQUAD_TEMPLATE){ const gap=cnt-count(pos); if(gap>bestGap){bestGap=gap;best=pos;} }
    add(best||pick(POSITIONS));
  }
}

function genSquad(club){
  const realRoster=REAL_ROSTERS[club.en];
  if(realRoster){
    const ids=realRoster.map(row=>{
      const p=makeRealPlayer(row,club.id);
      WORLD.players[p.id]=p;
      return p.id;
    });
    club.squad=ids;
    topUpSquad(club);
    return club.squad;
  }
  const ids=[];
  const rep=club.rep;
  let idx=0;
  for(const [pos,cnt] of SQUAD_TEMPLATE){
    for(let i=0;i<cnt;i++){
      // 主力 vs 替补 强度递减
      const depth = i/Math.max(1,cnt-1||1);
      const lvl = clamp(gauss(rep*(1 - depth*0.30) + 4, 6.5), 8, 99);
      let age;
      const r=rnd();
      age = r<0.10? ri(17,19) : r<0.34? ri(20,23) : r<0.72? ri(24,28) : r<0.92? ri(29,32) : ri(33,36);
      const p=makePlayer(lvl,pos,age,club.id);
      p.wage=calcWage(p,rep,club); p.value=calcValue(p);
      if(rnd()<0.3) p.homegrown=true;
      WORLD.players[p.id]=p; ids.push(p.id);
      idx++;
    }
  }
  club.squad=ids;
  return ids;
}

function setBoardExpectation(){
  const sqCache={};
  WORLD.clubs.forEach(c=>{
    const lg=LG(c);
    if(!lg){ c.board.expect="在欧战中有所作为"; c.board.target=99; return; }
    // 一半看声望、一半看真实阵容：夏窗买了一堆人，期望就该跟着上调
    if(!sqCache[lg.lg]) sqCache[lg.lg]=squadRanks(lg);
    const sq=sqCache[lg.lg];
    const byRep=[...lg.clubIds].sort((a,b)=>WORLD.clubs[b].rep-WORLD.clubs[a].rep);
    const score=id=>byRep.indexOf(id)+sq[id];
    const sorted=[...lg.clubIds].sort((a,b)=>score(a)-score(b) || WORLD.clubs[b].rep-WORLD.clubs[a].rep);
    const rank=sorted.indexOf(c.id)+1, n=lg.clubIds.length;
    let e;
    if(rank<=2) e={txt:"争夺联赛冠军",target:1};
    else if(rank<=5) e={txt:"跻身前四",target:4};
    else if(rank<=9) e={txt:"冲击前六名",target:6};
    else if(rank<=n-6) e={txt:"稳居中游",target:Math.round(n*0.6)};
    else e={txt:"避免降级",target:n-3};
    if(c.tier>0 && rank<=3) e={txt:"冲击升级",target:2};
    c.board.expect=e.txt; c.board.target=e.target;
  });
}

// ---------- 循环赛程 ----------
function roundRobin(ids){
  const t=[...ids]; if(t.length%2) t.push(-1);
  const n=t.length, half=n/2, rounds=[];
  let arr=[...t];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<half;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a>=0&&b>=0) rd.push(r%2? [b,a] : [a,b]);
    }
    rounds.push(rd);
    arr=[arr[0], ...arr.slice(-1), ...arr.slice(1,-1)];
  }
  return rounds;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 赛季日历 ----------
   以 8 月第一个周六（≥6 日）为第 0 周的周六，每周一个周末联赛轮次。
   周中：周二 = 周六+3，周三 = 周六+4。
   - 20 队联赛 38 轮：第 0–37 周；18 队联赛 34 轮：跳过第 12/19/20/30 周（冬歇等）
   - 国内杯赛 6 轮：第 2/5/10/21/25/30 周周三，决赛第 38 周周六（中立场地）
   - 欧战小组赛 6 轮：第 6/8/11/13/15/17 周（欧冠周二 / 欧联周三）
   - 欧战淘汰赛：1/8 决赛 27 & 29 周，1/4 决赛 32 & 34 周，半决赛 35 & 37 周；
     欧联决赛第 39 周周三，欧冠决赛第 40 周周六 */
const EURO_KO_NAMES=["1/8决赛","1/4决赛","半决赛","决赛"];
const CUP_ROUND_NAMES=["首轮","32强","16强","1/4决赛","半决赛","决赛"];
const WEEKS_18_SKIP=[12,19,20,30];
const CUP_WEEKS=[2,5,10,21,25,30];
const EURO_GROUP_WEEKS=[6,8,11,13,15,17];
const EURO_KO_WEEKS=[[27,29],[32,34],[35,37]];

function seasonStart(){ let s=0; while(dateOf(s).getDay()!==6 || dateOf(s).getDate()<6) s++; return s; }
function satOf(w){ return WORLD.calStart + w*7; }

function buildSeason(){
  /* 营收预测缓存必须在这里作废。bridgeTiers 里降级队卖人会在本函数之前调
     clubSpend → avail → revRemain，那时新赛季 fixtures 还没建、主场场次扫出来是 0，
     缓存就钉死在这个值上，同一天后面的 resetSeasonFinance 算 alloc0 用的还是它。
     实测不清的话进新赛季后 238 队里 212 队 avail 有偏差，最大 £57M。*/
  FIN_CLK++; REV_R={key:""}; REV_S={key:""};
  WORLD.fixtures=[];
  WORLD.calStart=seasonStart();
  // 联赛对象
  WORLD.leagues=LEAGUE_DEFS.map(d=>({
    lg:d.lg, nation:d.nation, tier:d.tier, name:d.name, short:d.short, price:d.price, prize:d.prize,
    clubIds: WORLD.clubs.filter(c=>c.nation===d.nation && c.tier===d.tier).map(c=>c.id),
    rounds:0
  }));
  WORLD.clubs.forEach(c=>{ c.lg=lgIndex(c.nation,c.tier); c.seasonStats={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; c.form=[]; c.euro=null; });
  Object.values(WORLD.players).forEach(p=>{
    p.last={apps:p.apps,goals:p.goals,assists:p.assists,rt:p.apps?p.ratingSum/p.apps:0,motm:p.motm};
    p.apps=0;p.goals=0;p.assists=0;p.cleanSheet=0;p.ratingSum=0;p.motm=0;p.yellow=0;p.red=0;p.susp=0;p.form=[];
  });

  // ---- 联赛 ----
  WORLD.leagues.forEach(lg=>{
    const half=roundRobin(shuffle([...lg.clubIds]));
    const all=[...half, ...half.map(r=>r.map(m=>[m[1],m[0]]))];
    const weeks=[]; for(let w=0;w<38;w++){ if(all.length<38 && WEEKS_18_SKIP.includes(w)) continue; weeks.push(w); }
    all.forEach((rd,ri)=>{
      const day=satOf(weeks[ri]);
      rd.forEach(([h,a])=>{
        const d = day + (rnd()<0.28?1:0);   // 同轮次错开到周六/周日
        WORLD.fixtures.push({day:d,home:h,away:a,comp:"L",lg:lg.lg,round:ri+1,played:false,hg:0,ag:0});
      });
    });
    lg.rounds=all.length;
  });

  // ---- 国内杯赛（每国一项，全体本国球队单场淘汰）----
  WORLD.cups=NATIONS.map((nat,ni)=>{
    const ids=WORLD.clubs.filter(c=>c.nation===ni).map(c=>c.id);
    const days=CUP_WEEKS.map((w,i)=> i<5? satOf(w)+4 : satOf(38));
    const byeN=Math.max(0, 64-ids.length);                    // 首轮轮空数，使首轮后恰好 32 队
    const sorted=[...ids].sort((a,b)=>C(b).rep-C(a).rep);
    const byes=sorted.slice(0,byeN), rest=shuffle(sorted.slice(byeN));
    return { nation:ni, name:nat.cup, roundNames:CUP_ROUND_NAMES, days, cur:0, alive:rest, byes, results:[], winner:null };
  });
  WORLD.cups.forEach(cup=>scheduleCupRound(cup));

  // ---- 升级附加赛（联赛踢完后才排对阵）----
  WORLD.playoffs=makePlayoffs();
  // ---- 欧战 ----
  buildEuro();
  WORLD.fixtures.sort((a,b)=>a.day-b.day);
}

const PO_ROUNDS={ENG:2, ESP:2, ITA:3, GER:1, FRA:3};
function poFmtOf(ni){ const c=NATIONS[ni].code; return PO_ROUNDS[c]? c : "ENG"; }
function makePlayoffs(){

// 本轮规格：赛制、基准日期、对阵（返回 null = 附加赛已经打完）
function poRoundSpec(po, r){
  const S=w=>satOf(w), P=k=>po.byPos[k];
  const W=r>0? po.rounds[r-1].ties.map(t=>t.w).sort((x,y)=>po.seed[x]-po.seed[y]) : [];

    if(r===1) return {name:"决赛", legs:1, tb:"pens", neutral:true, days:[S(39)+1], ties:[[W[0],W[1]]]};
  }
  if(f==="ESP"){

    if(r===1) return {name:"决赛", legs:2, tb:"seed", days:[S(39)+1,S(40)+1], ties:[[W[0],W[1]]]};
  }
  if(f==="ITA"){
    if(r===0) return {name:"预选赛", legs:1, tb:"seed", days:[S(37)+4], ties:[[P(5),P(8)],[P(6),P(7)]]};
    if(r===1) return {name:"半决赛", legs:2, tb:"seed", days:[S(38)+1,S(38)+4], ties:[[P(3),W[1]],[P(4),W[0]]]};
    if(r===2) return {name:"决赛", legs:2, tb:"seed", days:[S(39)+1,S(40)+1], ties:[[W[0],W[1]]]};
  }
  if(f==="GER"){
    if(r===0) return {name:"附加赛", legs:2, tb:"pens", days:[S(37)+4,S(38)+1], ties:[[po.up16,P(3)]]};
  }
  if(f==="FRA"){
    if(r===0) return {name:"首轮", legs:1, tb:"pens", days:[S(37)+4], ties:[[P(4),P(5)]]};
    if(r===1) return {name:"第二轮", legs:1, tb:"pens", days:[S(38)+1], ties:[[P(3),W[0]]]};
    if(r===2) return {name:"决赛", legs:2, tb:"pens", days:[S(39)+1,S(40)+1], ties:[[po.up16,W[0]]]};
  }
  return null;
}
// 找一个两队前后两天都没比赛的日子（杯赛决赛、欧战决赛可能撞上）
function poFreeDay(d, ids){
  const busy=dd=>WORLD.fixtures.some(f=>(ids.includes(f.home)||ids.includes(f.away)) && Math.abs(f.day-dd)<=2);
  let g=0; while(busy(d) && g++<30) d++;
  return d;
}
function poSchedule(po, pi, r, today){
  const sp=poRoundSpec(po,r); if(!sp) return false;
  const R={name:sp.name, legs:sp.legs, tb:sp.tb, neutral:!!sp.neutral, ties:sp.ties.map(([a,b])=>({a,b,w:null}))};
  po.rounds[r]=R; po.cur=r;
  R.ties.forEach((t,ti)=>{
    const ids=[t.a,t.b];
    let d1=poFreeDay(Math.max(sp.days[0], today+2), ids);
    if(R.legs===1){
      WORLD.fixtures.push({day:d1, home:t.a, away:t.b, comp:"PO", po:pi, round:r+1, tie:ti, leg:1,
        played:false, hg:0, ag:0, pens:null, neutral:R.neutral});
      t.days=[d1];
    } else {
      WORLD.fixtures.push({day:d1, home:t.b, away:t.a, comp:"PO", po:pi, round:r+1, tie:ti, leg:1, played:false, hg:0, ag:0, pens:null});
      const d2=poFreeDay(Math.max(sp.days[1], d1+3), ids);
      WORLD.fixtures.push({day:d2, home:t.a, away:t.b, comp:"PO", po:pi, round:r+1, tie:ti, leg:2, played:false, hg:0, ag:0, pens:null});
      t.days=[d1,d2];
    }
  });
  WORLD.fixtures.sort((a,b)=>a.day-b.day);
  return true;
}
function poLegs(pi, r, ti){ return WORLD.fixtures.filter(f=>f.comp==="PO"&&f.po===pi&&f.round===r+1&&f.tie===ti).sort((x,y)=>x.leg-y.leg); }
function poTieWinner(R, t, legs){
  if(R.legs===1){ const f=legs[0]; t.g1=[f.hg,f.ag]; t.pens=f.pens;
    if(f.hg!==f.ag) return f.hg>f.ag? f.home : f.away;
    if(f.pens) return f.pens[0]>f.pens[1]? f.home : f.away;
    return t.a; }
  const [l1,l2]=legs;                       // l1 在 b 主场，l2 在 a 主场
  const ga=l1.ag+l2.hg, gb=l1.hg+l2.ag;
  t.g1=[l1.hg,l1.ag]; t.g2=[l2.hg,l2.ag]; t.agg=[ga,gb]; t.pens=l2.pens;
  if(ga!==gb) return ga>gb? t.a : t.b;
  if(l2.pens) return l2.pens[0]>l2.pens[1]? t.a : t.b;
  return t.a;                                 // 总比分打平、不踢点球：种子高的晋级
}
// 从 id 一方的视角写比分：「总比分 3-2」/「2-1」，点球另附
function poScore(t,id){
  const A=id===t.a, g=t.agg||t.g1, x=A?g[0]:g[1], y=A?g[1]:g[0];
  const pen=t.pens? `，点球 ${A?t.pens[0]:t.pens[1]}-${A?t.pens[1]:t.pens[0]}` : "";
  return (t.agg?"总比分 ":"")+x+"-"+y+pen;
}
function poInvolvesUser(po){ const u=WORLD.userClub; return po.seed[u]!=null; }
function poStart(po, pi, today){
  const lo=leagueTable(lgIndex(po.nation,po.tier+1));
  po.byPos={}; lo.forEach(r=>po.byPos[r.rank]=r.id);
  const [s0,s1]=poSeedsRange(po.fmt);
  for(let k=s0;k<=s1;k++) if(po.byPos[k]!=null) po.seed[po.byPos[k]]=k;
  if(poHasUpper(po.fmt)){
    const up=leagueTable(lgIndex(po.nation,po.tier));
    po.up16=up[up.length-3].id; po.seed[po.up16]=0;
  }
  po.started=true;
  const u=UC();
  // 意乙：第 3 名领先第 4 名 15 分及以上，附加赛取消
  if(po.fmt==="ITA" && lo[2] && lo[3] && lo[2].pts-lo[3].pts>=15){
    po.skip=true; po.done=true; po.winner=lo[2].id;
    if(u.nation===po.nation) news(`${po.name}取消`,`${C(lo[2].id).cn} 领先第 4 名 ${lo[2].pts-lo[3].pts} 分，按规则直接升级，本赛季不打附加赛。`, po.winner===u.id?"good":"info");
    return;
  }
  poSchedule(po, pi, 0, today);
  if(poInvolvesUser(po)){
    const R=po.rounds[0], t=R.ties.find(t=>t.a===u.id||t.b===u.id);
    if(t){ const opp=C(t.a===u.id?t.b:t.a);
      news(`${po.name}`, po.up16===u.id
        ? `${u.cn} 排名第 ${LG(u).clubIds.length-2}，要和 ${opp.cn} 打两回合附加赛保级。首回合 ${fmtDate(dateOf(t.days[0]))}（客场），次回合回到主场。`
        : `${u.cn} 进入${po.name}，${R.name}对手是 ${opp.cn}。${R.legs===2?`首回合 ${fmtDate(dateOf(t.days[0]))}（${t.b===u.id?"主场":"客场"}），次回合 ${fmtDate(dateOf(t.days[1]))}（${t.a===u.id?"主场":"客场"}）。`:`${fmtDate(dateOf(t.days[0]))}（${R.neutral?"中立场地":(t.a===u.id?"主场":"客场")}）。`}${R.tb==="seed"?"打平的话排名高的一方晋级。":""}`,"info");
    } else {
      // 种子还没进本轮（法乙第 3 名、意乙前两名先轮空）
      news(`${po.name}`,`${u.cn} 进入${po.name}，首轮轮空，等待对手产生。`,"info");
    }
  }
}
function poResolve(po, pi, today){
  const r=po.cur, R=po.rounds[r], u=WORLD.userClub;
  R.ties.forEach((t,ti)=>{
    t.w=poTieWinner(R,t,poLegs(pi,r,ti));
    if(t.a===u||t.b===u){
      const won=t.w===u, opp=C(t.a===u?t.b:t.a);
      const sc=poScore(t,u);
      const how=t.pens? "" : ((t.agg?t.agg[0]===t.agg[1]:t.g1[0]===t.g1[1])? `，按排名${won?"晋级":"出局"}` : "");
      const last=r===PO_ROUNDS[po.fmt]-1;
      if(!last) news(won?`附加赛${R.name}晋级`:`附加赛${R.name}出局`, `${C(u).cn} ${sc} ${won?"淘汰":"不敌"} ${opp.cn}${how}。${won?"":"本赛季的升级梦到此为止。"}`, won?"good":"bad");
    }
  });
  if(po.cur+1 < PO_ROUNDS[po.fmt]){ poSchedule(po, pi, po.cur+1, today);
    const R2=po.rounds[po.cur], t=R2.ties.find(t=>t.a===u||t.b===u);
    if(t && !R.ties.some(x=>x.a===u||x.b===u)) news(`${po.name}${R2.name}`,`对手确定了：${C(t.a===u?t.b:t.a).cn}。${fmtDate(dateOf(t.days[0]))}开打。`,"info");
    return; }
  const fin=R.ties[0];
  po.winner=fin.w; po.done=true;
  const uc=UC(), w=C(fin.w), l=C(fin.w===fin.a?fin.b:fin.a);
  const upName=NATIONS[po.nation].tiers[po.tier].short;
  const promoted = !(poHasUpper(po.fmt) && fin.w===po.up16);
  const sc=poScore(fin,fin.w);
  const seedTie=!fin.pens && (fin.agg?fin.agg[0]===fin.agg[1]:fin.g1[0]===fin.g1[1]);
  if(fin.a===u||fin.b===u){
    if(fin.w===u) news(promoted?"附加赛胜出，升级！":"保级成功！", promoted
      ? `${uc.cn} 在${po.name}${R.name}中击败 ${l.cn}（${sc}${seedTie?"，按排名胜出":""}），下赛季征战${upName}。`
      : `${uc.cn} 在附加赛里顶住了 ${l.cn}（${sc}${seedTie?"，按排名胜出":""}），下赛季还留在${upName}。`,"good");
    else { const lsc=poScore(fin,u)+(seedTie?"，按排名出局":"");
      news(po.up16===u?"附加赛失利，降级":"附加赛决赛失利", po.up16===u
      ? `${uc.cn} 在附加赛里输给了 ${w.cn}（${lsc}），下赛季降入${NATIONS[po.nation].tiers[po.tier+1].short}。`
      : `${uc.cn} 倒在了最后一步，${R.name}不敌 ${w.cn}（${lsc}）。下赛季继续在${NATIONS[po.nation].tiers[po.tier+1].short}。`,"bad"); }
  } else if(uc.nation===po.nation){
    news(`${po.name}结束`, `${w.cn} 以 ${sc}${seedTie?"（按排名）":""} 战胜 ${l.cn}，${promoted?`通过附加赛升入${upName}`:`保住了${upName}席位`}。`,"info");
  }
}
function playoffsDayEnd(day){
  ensurePlayoffs().forEach((po,pi)=>{
    if(po.done) return;
    if(!po.started){ if(poLeaguesDone(po)) poStart(po,pi,day); return; }
    const fx=WORLD.fixtures.filter(f=>f.comp==="PO"&&f.po===pi&&f.round===po.cur+1);
    if(!fx.length || fx.some(f=>!f.played)) return;
    poResolve(po,pi,day);
  });
}
function poKnockoutOpts(f){
  const po=(WORLD.playoffs||[])[f.po]; const R=po&&po.rounds[f.round-1];
  if(!R) return {knockout:false};
  if(R.legs===1) return {knockout:R.tb==="pens", neutral:R.neutral};
  if(f.leg===2 && R.tb==="pens"){
    const l1=WORLD.fixtures.find(x=>x.comp==="PO"&&x.po===f.po&&x.round===f.round&&x.tie===f.tie&&x.leg===1&&x.played);
    return {knockout:true, aggBase: l1? [l1.ag,l1.hg] : [0,0]};
  }
  return {knockout:false};
}

// ---------- 国内杯赛 ----------
function scheduleCupRound(cup){
  if(cup.cur>=6) return;
  const pool=shuffle([...cup.alive]);
  const day=cup.days[cup.cur];
  const isFinal = cup.cur===5;
  for(let i=0;i+1<pool.length;i+=2){
    WORLD.fixtures.push({day, home:pool[i], away:pool[i+1], comp:"C", nation:cup.nation, round:cup.cur+1,
                         played:false, hg:0, ag:0, pens:null, neutral:isFinal});
  }
  WORLD.fixtures.sort((a,b)=>a.day-b.day);
}
function cupPrize(cup, roundIdx){
  const scale=[1,0.8,0.7,0.7,0.5][cup.nation]||0.5;
  return Math.round([1e5,2e5,4.5e5,9e5,1.8e6,3.6e6][roundIdx]*scale);
}
function advanceCupRound(cup){
  const day=cup.days[cup.cur];
  const ms=WORLD.fixtures.filter(f=>f.comp==="C"&&f.nation===cup.nation&&f.day===day&&f.played);
  let winners=ms.map(f=>winnerOf(f));
  const losers=ms.map(f=> winnerOf(f)===f.home? f.away : f.home);
  losers.forEach(id=>addMoney(C(id), cupPrize(cup,cup.cur), cup.name+cup.roundNames[cup.cur]+"奖金"));
  if(cup.cur===0 && cup.byes){ winners=winners.concat(cup.byes); cup.byes=null; }
  cup.results.push({round:cup.roundNames[cup.cur], matches:ms.map(f=>({h:f.home,a:f.away,hg:f.hg,ag:f.ag,pens:f.pens}))});
  cup.cur++;
  cup.alive=winners;
  if(winners.length===1){
    cup.winner=winners[0]; const w=C(winners[0]);
    w.trophies.push(WORLD.season+" "+cup.name);
    addMoney(w, cupPrize(cup,5), cup.name+"冠军奖金");
    w.board.conf=clamp(w.board.conf+15,0,100);
    const ff=ms.find(f=>f.played && (f.home===w.id||f.away===w.id));
    const fl=ff? finalLine(ff)+"，" : "";
    if(w.id===WORLD.userClub) news(`${cup.name}冠军！`,`${fl}${w.cn} 捧起了 ${WORLD.season}/${String(WORLD.season+1).slice(2)} 赛季的${cup.name}！`,"good");
    else if(NATIONS[cup.nation] && UC().nation===cup.nation) news(`${cup.name}决赛`,`${fl}${w.cn} 夺得本赛季${cup.name}冠军。`,"info");
    return;
  }
  if(cup.cur<6) scheduleCupRound(cup);
}
function winnerOf(f){
  if(f.hg>f.ag) return f.home;
  if(f.ag>f.hg) return f.away;
  return f.pens && f.pens[0]>f.pens[1] ? f.home : f.away;
}

// ---------- 欧战：资格 ----------
// 首个赛季按声望；之后由上赛季结算写入 WORLD.euroQual
function defaultEuroQual(){
  const q={CL:[],EL:[]};
  NATIONS.forEach((nat,ni)=>{
    const top=WORLD.clubs.filter(c=>c.nation===ni&&c.tier===0).sort((a,b)=>b.rep-a.rep);
    q.CL.push(...top.slice(0,nat.cl).map(c=>c.id));
    q.EL.push(...top.slice(nat.cl,nat.cl+nat.el+1).map(c=>c.id));  // 多一个名额代表杯赛冠军
  });
  return q;
}
function fillEuroWithOthers(q){
  const others=WORLD.clubs.filter(c=>c.nation===EURO_NATION)
    .map(c=>({id:c.id, s:c.rep+gauss(0,5)})).sort((a,b)=>b.s-a.s).map(x=>x.id);
  const needCL=32-q.CL.length, needEL=32-q.EL.length;
  q.CL.push(...others.slice(0,Math.max(0,needCL)));
  q.EL.push(...others.slice(Math.max(0,needCL), Math.max(0,needCL)+Math.max(0,needEL)));
  q.CL=q.CL.slice(0,32); q.EL=q.EL.slice(0,32);
}

// 分组抽签：按声望分 4 档，每组各档 1 队，尽量避免同国同组
function drawGroups(ids){
  const sorted=[...ids].sort((a,b)=>C(b).rep-C(a).rep);
  const pots=[0,1,2,3].map(i=>sorted.slice(i*8,i*8+8));
  const groups=[[],[],[],[],[],[],[],[]];
  pots.forEach((pot,pi)=>{
    let best=null, bestClash=1e9;
    for(let tries=0;tries<40;tries++){
      const order=shuffle([...pot]);
      let clash=0;
      order.forEach((id,gi)=>{ if(groups[gi].some(x=>C(x).nation===C(id).nation && C(id).nation!==EURO_NATION)) clash++; });
      if(clash<bestClash){ bestClash=clash; best=order; if(clash===0) break; }
    }
    best.forEach((id,gi)=>groups[gi].push(id));
  });
  return groups;
}

function buildEuro(){
  const q = WORLD.euroQual ? {CL:[...WORLD.euroQual.CL],EL:[...WORLD.euroQual.EL]} : defaultEuroQual();
  // 剔除已不存在 / 重复
  q.CL=[...new Set(q.CL)]; q.EL=[...new Set(q.EL)].filter(id=>!q.CL.includes(id));
  fillEuroWithOthers(q);
  WORLD.euro={};
  ["CL","EL"].forEach(code=>{
    const def=EURO_COMPS[code];
    const ids=q[code];
    const E={ code, name:def.name, short:def.short, teams:ids, groups:drawGroups(ids),
      gtable:{}, stage:"G", gdays:EURO_GROUP_WEEKS.map(w=>satOf(w)+(code==="CL"?3:4)),
      kdays:EURO_KO_WEEKS.map(([a,b])=>[satOf(a)+(code==="CL"?3:4), satOf(b)+(code==="CL"?3:4)]),
      finalDay: code==="CL"? satOf(40) : satOf(39)+4,
      ko:null, results:[], winner:null };
    ids.forEach(id=>{ E.gtable[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; C(id).euro=code;
      addMoney(C(id), def.prize.enter, def.short+"参赛奖金"); });
    // 小组赛赛程：每组 4 队双循环 6 轮
    E.groups.forEach((g,gi)=>{
      const half=roundRobin(shuffle([...g]));
      const all=[...half, ...half.map(r=>r.map(m=>[m[1],m[0]]))];
      all.forEach((rd,ri)=>rd.forEach(([h,a])=>{
        WORLD.fixtures.push({day:E.gdays[ri], home:h, away:a, comp:code, stage:"G", grp:gi, round:ri+1, played:false, hg:0, ag:0});
      }));
    });
    WORLD.euro[code]=E;
  });
  const u=UC();
  if(u.euro){ const E=WORLD.euro[u.euro]; const g=E.groups.find(g=>g.includes(u.id));
    news(`${E.short}分组揭晓`,`${u.cn} 进入${E.name}第 ${String.fromCharCode(65+E.groups.indexOf(g))} 组，同组对手：${g.filter(i=>i!==u.id).map(i=>C(i).cn).join("、")}。`,"good"); }
}
function euroGroupTable(E, gi){
  const rows=E.groups[gi].map(id=>{ const s=E.gtable[id]; return {id, ...s, gd:s.gf-s.ga}; });
  rows.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || C(b.id).rep-C(a.id).rep);
  rows.forEach((r,i)=>r.rank=i+1);
  return rows;
}
function euroApplyGroupResult(E, fx){
  [[fx.home,fx.hg,fx.ag],[fx.away,fx.ag,fx.hg]].forEach(([id,gf,ga])=>{
    const s=E.gtable[id]; if(!s) return;
    s.p++; s.gf+=gf; s.ga+=ga;
    if(gf>ga){s.w++;s.pts+=3; addMoney(C(id), EURO_COMPS[E.code].prize.win, E.short+"小组赛胜场奖金");}
    else if(gf===ga){s.d++;s.pts++; addMoney(C(id), EURO_COMPS[E.code].prize.draw, E.short+"小组赛平局奖金");}
    else s.l++;
  });
}
// 淘汰赛：两回合，次回合总比分相同则点球
function euroScheduleKO(E, pairs, roundIdx){
  const [d1,d2]=E.kdays[roundIdx];
  E.ko={round:roundIdx, ties:pairs.map(([a,b])=>({a,b}))};
  pairs.forEach(([a,b],ti)=>{
    // a 先主场
    WORLD.fixtures.push({day:d1, home:a, away:b, comp:E.code, stage:"K", round:roundIdx+1, leg:1, tie:ti, played:false, hg:0, ag:0});
    WORLD.fixtures.push({day:d2, home:b, away:a, comp:E.code, stage:"K", round:roundIdx+1, leg:2, tie:ti, played:false, hg:0, ag:0, pens:null});
  });
  WORLD.fixtures.sort((a,b)=>a.day-b.day);
}
function euroFirstLegOf(fx){
  return WORLD.fixtures.find(f=>f.comp===fx.comp&&f.stage==="K"&&f.round===fx.round&&f.tie===fx.tie&&f.leg===1&&f.played);
}
function euroSeedKnockout(E){
  const winners=[], runners=[];
  E.groups.forEach((g,gi)=>{ const t=euroGroupTable(E,gi); winners.push(t[0].id); runners.push(t[1].id); });
  // 小组第一对其他组第二，尽量避免同组 / 同国
  let best=null, bestClash=1e9;
  for(let tries=0;tries<60;tries++){
    const order=shuffle([...runners]); let clash=0;
    order.forEach((r,i)=>{ const w=winners[i];
      if(E.groups[i].includes(r)) clash+=10;
      if(C(r).nation===C(w).nation && C(r).nation!==EURO_NATION) clash+=1; });
    if(clash<bestClash){ bestClash=clash; best=order; if(!clash) break; }
  }
  const pairs=best.map((r,i)=>[r, winners[i]]);   // 小组第二先主场
  E.stage="K";
  E.teams.forEach(id=>{ if(!winners.includes(id)&&!runners.includes(id)) C(id).euro=null; });
  euroScheduleKO(E, pairs, 0);
  const u=UC(); if(u.euro===E.code){ const t=pairs.find(p=>p.includes(u.id));
    if(t) news(`${E.short}淘汰赛抽签`,`${u.cn} 在${E.short}1/8决赛的对手是 ${C(t[0]===u.id?t[1]:t[0]).cn}。`,"info"); }
}
function euroResolveRound(E){
  const r=E.ko.round;
  const legs=WORLD.fixtures.filter(f=>f.comp===E.code&&f.stage==="K"&&f.round===r+1&&f.played);
  const res=[]; const winners=[];
  E.ko.ties.forEach((t,ti)=>{
    const l1=legs.find(f=>f.tie===ti&&f.leg===1), l2=legs.find(f=>f.tie===ti&&f.leg===2);
    if(!l1||!l2) return;
    const ga=l1.hg+l2.ag, gb=l1.ag+l2.hg;    // a 的总进球 / b 的总进球
    let w;
    if(ga>gb) w=t.a; else if(gb>ga) w=t.b; else w = l2.pens && l2.pens[0]>l2.pens[1] ? l2.home : l2.away;
    winners.push(w);
    res.push({a:t.a,b:t.b,g1:[l1.hg,l1.ag],g2:[l2.hg,l2.ag],agg:[ga,gb],pens:l2.pens,winner:w});
    const loser = w===t.a? t.b : t.a; C(loser).euro=null;
  });
  E.results.push({round:EURO_KO_NAMES[r], ties:res});
  const pz=EURO_COMPS[E.code].prize, key=["r16","qf","sf"][r];
  winners.forEach(id=>addMoney(C(id), pz[key], E.short+EURO_KO_NAMES[r+1]+"晋级奖金"));
  if(r<2){
    const pairs=[]; const pool=shuffle([...winners]);
    for(let i=0;i+1<pool.length;i+=2) pairs.push([pool[i],pool[i+1]]);
    E.ko={round:r+1, ties:pairs.map(([a,b])=>({a,b}))};
    euroScheduleKO(E, pairs, r+1);
  } else {
    // 决赛：单场中立
    E.ko={round:3, ties:[{a:winners[0],b:winners[1]}]};
    WORLD.fixtures.push({day:E.finalDay, home:winners[0], away:winners[1], comp:E.code, stage:"K", round:4, leg:1, tie:0, played:false, hg:0, ag:0, pens:null, neutral:true});
    WORLD.fixtures.sort((a,b)=>a.day-b.day);
    const u=UC(); if(winners.includes(u.id)) news(`${E.short}决赛！`,`${u.cn} 闯入${E.name}决赛，对手是 ${C(winners.find(i=>i!==u.id)).cn}。`,"good");
  }
}
function euroFinish(E, fx){
  const w=winnerOf(fx), l= w===fx.home? fx.away : fx.home;
  E.results.push({round:"决赛", ties:[{a:fx.home,b:fx.away,g1:[fx.hg,fx.ag],pens:fx.pens,winner:w}]});
  E.winner=w; E.stage="F";
  const pz=EURO_COMPS[E.code].prize;
  addMoney(C(w), pz.fin+pz.champ, E.short+"冠军奖金"); addMoney(C(l), pz.fin, E.short+"亚军奖金");
  C(w).trophies.push(WORLD.season+" "+E.name);
  C(w).board.conf=clamp(C(w).board.conf+ (E.code==="CL"?40:25),0,100);
  C(w).euro=null; C(l).euro=null;
  if(w===WORLD.userClub) news(`${E.name}冠军！！`,`${C(w).cn} 登上欧洲之巅，捧起${E.name}奖杯！`,"good");
  else news(`${E.name}决赛`,`${finalLine(fx)}，${C(w).cn} 夺冠。`,"info");
}
// 决赛比分一律按「主队 比分 客队」写，点球同样按主客顺序（原来按冠军在前写，冠军是客队时比分就反了）
function finalLine(fx){
  return `${C(fx.home).cn} ${fx.hg}-${fx.ag} ${C(fx.away).cn}${fx.pens?`（点球 ${fx.pens[0]}-${fx.pens[1]}）`:""}`;

// 每日收尾：推进各项杯赛
function competitionsDayEnd(day){
  playoffsDayEnd(day);
  WORLD.cups.forEach(cup=>{
    if(cup.cur<6 && cup.days[cup.cur]===day){
      const rem=WORLD.fixtures.some(f=>f.comp==="C"&&f.nation===cup.nation&&f.day===day&&!f.played);
      if(!rem) advanceCupRound(cup);
    }
  });
  if(!WORLD.euro) return;
  ["CL","EL"].forEach(code=>{
    const E=WORLD.euro[code];
    const rem=WORLD.fixtures.some(f=>f.comp===code&&f.day===day&&!f.played);
    if(rem) return;
    if(E.stage==="G" && day===E.gdays[5]) euroSeedKnockout(E);
    else if(E.stage==="K" && E.ko){
      if(E.ko.round<3 && day===E.kdays[E.ko.round][1]) euroResolveRound(E);
      else if(E.ko.round===3 && day===E.finalDay){ const f=WORLD.fixtures.find(f=>f.comp===code&&f.stage==="K"&&f.round===4&&f.played); if(f) euroFinish(E,f); }
    }
  });
}
// 创建比赛时的淘汰赛参数（是否需要点球、总比分基数）
function knockoutOpts(f){
  if(f.comp==="PO") return poKnockoutOpts(f);
  if(f.comp==="C") return {knockout:true, neutral:!!f.neutral};
  if(EURO_COMPS[f.comp] && f.stage==="K"){
    if(f.round===4) return {knockout:true, neutral:true};
    if(f.leg===2){ const l1=euroFirstLegOf(f); return {knockout:true, aggBase: l1? [l1.ag,l1.hg] : [0,0]}; }
    return {knockout:false};
  }
  return {knockout:false, neutral:!!f.neutral};
}

function leagueTable(lgIdx){
