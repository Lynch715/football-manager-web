<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="足球经理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>足球经理 · Football Manager Web</title>
<style>
:root{
  --bg:#0d1117; --bg2:#151b24; --bg3:#1c2430; --line:#2a3441;
  --txt:#e6edf3; --dim:#8b98a8; --dim2:#5f6b7a;
  --acc:#00d47e; --acc2:#0a8f57; --warn:#f0a020; --bad:#e5484d; --info:#4a9eff;
  --gold:#ffcc44;
  /* 刘海 / 灵动岛 / home 指示条安全区 */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{
  background:var(--bg2);
  touch-action:pan-x pan-y;          /* 允许滚动，禁止双指缩放与双击放大 */
  overscroll-behavior:none;          /* 禁止下拉刷新与橡皮筋回弹 */
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body{
  background:var(--bg);color:var(--txt);
  font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,212,126,.18);
}
input,textarea,select{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333d4b;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#465264}

/* ---------- 布局 ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100svh;overflow:hidden}
#topbar{
  height:calc(52px + var(--sat));flex:0 0 calc(52px + var(--sat));
  background:linear-gradient(180deg,#1b2430,#141b24);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:var(--sat) calc(14px + var(--sar)) 0 calc(14px + var(--sal));
}
#tb-crest{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
#tb-club{font-weight:700;font-size:14px;line-height:1.15}
#tb-club small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
.tb-stat{text-align:center;padding:0 10px;border-left:1px solid var(--line);min-width:78px}
.tb-stat b{display:block;font-size:13px}
.tb-stat span{font-size:10px;color:var(--dim)}
#tb-spacer{flex:1}
#main{flex:1;display:flex;min-height:0;min-width:0;overflow:hidden}
#side{
  width:calc(172px + var(--sal));flex:0 0 calc(172px + var(--sal));
  background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;overflow-anchor:none;min-height:0;min-width:0;
  padding:6px 0 var(--sab) var(--sal);
}
.nav-grp{font-size:10px;color:var(--dim2);padding:10px 14px 4px;letter-spacing:1px}
.nav{
  display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;
  color:var(--dim);border-left:3px solid transparent;user-select:none;font-size:13px;
}
.nav:hover{background:var(--bg3);color:var(--txt)}
.nav.on{background:var(--bg3);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.nav i{font-style:normal;width:16px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:700}
#view{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-anchor:none;
  -webkit-overflow-scrolling:touch;background:var(--bg);
  padding:16px calc(20px + var(--sar)) calc(40px + var(--sab)) 20px}

/* ---------- 通用组件 ---------- */
h1{font-size:19px;font-weight:700;margin-bottom:3px}
h2{font-size:15px;font-weight:700;margin:18px 0 8px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card>h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--txt);
  display:flex;align-items:center;gap:8px}
.card>h3 .tag{margin-left:auto}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.grid3,.grid4{grid-template-columns:1fr 1fr}}

.tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:6px 7px;
  border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--bg2);z-index:2
}
th:hover{color:var(--txt)}
th.nos{cursor:default}
td{padding:5px 7px;border-bottom:1px solid #1d242e;white-space:nowrap}
tbody tr:hover{background:#1a222c}
tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}

button,.btn{
  background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:5px;
  padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;transition:.12s;
}
button:hover,.btn:hover{background:#28323f;border-color:#3c4756}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
button.pri:hover{background:#0aa866;border-color:#0aa866}
button.danger{background:#7a2226;border-color:#7a2226;color:#fff}
button.sm{padding:3px 8px;font-size:11px}
button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
select,input[type=text],input[type=number]{
  background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:5px;
  padding:5px 8px;font-size:12px;font-family:inherit
}
input[type=range]{accent-color:var(--acc)}
label{font-size:11px;color:var(--dim);display:block;margin-bottom:3px}

.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}
.t-gk{background:#3d2a52;color:#c79cf0}
.t-df{background:#1e3a52;color:#69b7f0}
.t-mf{background:#1e4a30;color:#5fd48f}
.t-fw{background:#52281e;color:#f09069}
.t-ok{background:#123a26;color:var(--acc)}
.t-w{background:#3d3010;color:var(--warn)}
.t-b{background:#3d1618;color:#ff8080}
.t-i{background:#12293d;color:var(--info)}
.t-n{background:#252d38;color:var(--dim)}

.bar{height:5px;background:#252d38;border-radius:3px;overflow:hidden;min-width:44px}
.bar>i{display:block;height:100%;border-radius:3px}
.hint{color:var(--dim);font-size:11px}
.big{font-size:22px;font-weight:800;line-height:1.1}
.mono{font-variant-numeric:tabular-nums}
.pos{color:var(--acc)}.neg{color:var(--bad)}
.hr{height:1px;background:var(--line);margin:12px 0}
.center{display:flex;align-items:center;justify-content:center}
.empty{color:var(--dim2);text-align:center;padding:26px;font-size:12px}
.scroll{max-height:420px;overflow-y:auto}
.pill{background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px}
.attr{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px}
.attr .an{flex:1;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attr .av{width:20px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.crest{vertical-align:-4px;margin-right:6px;flex:0 0 auto;object-fit:contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
img.crest{display:inline-block}

/* ---------- 弹窗 ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:100;
  align-items:center;justify-content:center;backdrop-filter:blur(2px);
  padding:calc(24px + var(--sat)) calc(24px + var(--sar)) calc(24px + var(--sab)) calc(24px + var(--sal))}
#modal.on{display:flex}
#modal-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal-hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#modal-hd b{font-size:15px}
#modal-hd .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:19px;line-height:1;padding:0 4px}
#modal-hd .x:hover{color:var(--txt)}
#modal-bd{padding:16px;overflow-y:auto}
#modal-ft{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

/* ---------- 提示条 ---------- */
#toast{position:fixed;bottom:calc(20px + var(--sab));left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:#1f2937;border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:6px;padding:9px 15px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);
  animation:tin .25s ease}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ---------- 比赛日 ---------- */
#pitchwrap{background:#0a1410;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#pitch{display:block;width:100%;height:auto;background:#12331f}
#mscore{display:flex;align-items:center;justify-content:center;gap:16px;padding:11px;
  background:var(--bg2);border-bottom:1px solid var(--line)}
#mscore .tn{font-weight:700;font-size:14px;width:190px}
#mscore .tn.a{text-align:right}
#mscore .sc{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
  background:#0b0f14;padding:2px 14px;border-radius:6px;letter-spacing:1px}
#mclock{text-align:center;font-size:12px;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
#mfeed{height:230px;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;font-size:12px}
.ev{padding:3px 0;border-bottom:1px solid #1a2029;display:flex;gap:9px;animation:evin .2s}
@keyframes evin{from{opacity:0;transform:translateX(-6px)}}
.ev .m{color:var(--dim);width:34px;flex:0 0 34px;font-variant-numeric:tabular-nums;font-size:11px}
.ev.goal{color:var(--acc);font-weight:700;background:#0d2a1c;margin:2px -12px;padding:5px 12px}
.ev.chance{color:var(--warn)}
.ev.card{color:#ffd24a}
.ev.hurt{color:var(--bad)}
.ev.sys{color:var(--info)}

.fmt-slot{position:absolute;transform:translate(-50%,-50%);width:70px;text-align:center;cursor:pointer;user-select:none}
.fmt-slot .n{background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  font-size:10px;padding:2px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmt-slot .p{font-size:9px;color:var(--acc);font-weight:700}
.fmt-slot.sel .n{border-color:var(--acc);background:var(--acc2);color:#fff}
.fmt-slot.tired .n{border-color:var(--warn)}

#loadscr{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:18px}
#loadscr h1{font-size:34px;letter-spacing:5px;color:var(--acc);font-weight:800}

/* ================= 移动端适配 ================= */
.mcol-main{flex:1;min-width:520px}
.mcol-side{flex:0 0 330px}
.tac-pitch{flex:0 0 430px}
#rotate-tip{display:none}

@media (max-width:900px){
  body{font-size:13px}
  #topbar{height:calc(46px + var(--sat));flex:0 0 calc(46px + var(--sat));gap:8px;
    padding:var(--sat) calc(8px + var(--sar)) 0 calc(8px + var(--sal))}
  #tb-crest{width:28px;height:28px;flex:0 0 28px}
  #tb-crest img{width:28px;height:28px}
  #tb-club{font-size:12.5px}
  #tb-club small{font-size:10px}
  .tb-stat{min-width:0;padding:0 7px}
  .tb-stat b{font-size:12px} .tb-stat span{font-size:9px}
  .s-pos{display:none}
  #tb-go{padding:7px 13px !important;font-size:12px;margin-left:6px !important}

  /* 导航移到底部：用 order 而非 column-reverse，避免反向弹性容器的重排抖动 */
  #main{flex-direction:column}
  #view{order:1}
  /* 两排固定导航：9 + 8，全部可见，无需横向滚动 */
  #side{order:2;
    width:100%;
    height:auto;flex:0 0 auto;
    display:flex;flex-wrap:wrap;align-items:stretch;
    overflow:hidden;overflow-anchor:none;
    border-right:none;border-top:1px solid var(--line);
    background:linear-gradient(180deg,#18202b,#121821);
    /* 安全区只留一小截，别整条空着 */
    padding:1px var(--sar) max(calc(var(--sab) - 14px), 3px) var(--sal);
    scrollbar-width:none}
  #side::-webkit-scrollbar{display:none}
  .nav-grp{display:none}
  .nav{position:relative;flex:1 1 10%;flex-direction:column;gap:0;
    margin:2px 1px;padding:3px 0 2px;border-radius:8px;
    border-left:none;border-top:none;line-height:1.1;
    font-size:9px;white-space:nowrap;min-width:0;justify-content:center;align-items:center;
    overflow:hidden}
  .nav:hover{background:none;color:var(--dim)}
  .nav.on{background:rgba(0,212,126,.13);color:var(--acc);font-weight:600}
  .nav i{width:auto;font-size:15px;line-height:1.3;filter:grayscale(1);opacity:.6}
  .nav.on i{filter:none;opacity:1}
  .nav .badge{position:absolute;top:0;right:50%;transform:translate(15px,0);margin:0}
  /* 底栏已经吃掉安全区，视图底部不要再补一次，否则留白翻倍 */
  #view{padding:11px calc(11px + var(--sar)) 10px calc(11px + var(--sal))}

  /* 单栏堆叠 */
  .grid2,.grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr;gap:9px}
  .row{gap:11px}
  .col{min-width:100% !important}
  .mcol-main,.mcol-side,.tac-pitch{flex:1 1 100% !important;min-width:0 !important}
  .card{padding:11px;margin-bottom:11px}
  h1{font-size:17px}
  .big{font-size:19px}

  /* 表格 */
  .tw{border-radius:6px}
  table{font-size:11.5px;min-width:max-content}
  th,td{padding:6px 8px}
  button,.btn{padding:8px 13px;font-size:12.5px}
  button.sm{padding:6px 10px;font-size:11.5px}
  select,input[type=text],input[type=number]{font-size:16px;padding:7px 9px}

  /* 弹窗全屏 */
  #modal{padding:0;align-items:stretch}
  #modal-box{max-height:100vh;max-height:100svh;border-radius:0;max-width:none}
  #modal-hd{padding-top:calc(13px + var(--sat));
    padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar))}
  #modal-bd{padding:12px calc(12px + var(--sar)) 12px calc(12px + var(--sal))}
  #modal-ft{padding-bottom:calc(11px + var(--sab));
    padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar))}
  #modal-bd table{min-width:max-content}

  /* 比赛日 */
  #mscore{padding:8px;gap:8px}
  #mscore .tn{width:auto;flex:1;font-size:12.5px}
  #mscore .sc{font-size:21px;padding:2px 10px}
  #mfeed{height:170px}
  .fmt-slot{width:56px}
  .fmt-slot .n{font-size:9px}
}

/* 竖屏窄屏进一步压缩 */
@media (max-width:560px){
  .grid4{grid-template-columns:1fr 1fr}
  .s-next{display:none}
  #tb-club{max-width:96px;overflow:hidden}
  .nav{font-size:9px}
}

/* 横屏手机：保留左侧图标导航，纵向空间优先 */
@media (max-height:520px) and (orientation:landscape){
  #topbar{height:calc(40px + var(--sat));flex:0 0 calc(40px + var(--sat));padding-top:var(--sat)}
  #tb-crest{width:24px;height:24px;flex:0 0 24px}
  #tb-crest img{width:24px;height:24px}
  #main{flex-direction:row}
  #view{order:2}
  #side{order:1;
    width:calc(60px + var(--sal));flex:0 0 calc(60px + var(--sal));
    height:auto;flex-direction:column;flex-wrap:nowrap;align-items:stretch;
    overflow-y:auto;overflow-x:hidden;
    border-top:none;border-right:1px solid var(--line);
    padding:2px 0 var(--sab) var(--sal)}
  .nav{flex:0 0 auto}
  .nav{min-width:0;margin:0;border-radius:0;padding:7px 2px;font-size:9px;border-top:none;border-left:3px solid transparent}
  .nav.on{background:var(--bg3);border-left-color:var(--acc);border-top-color:transparent}
  #view{padding:9px calc(11px + var(--sar)) calc(16px + var(--sab)) 11px}
  #mfeed{height:150px}
  .card{margin-bottom:9px}
  .col{min-width:0 !important}
  .mcol-main{flex:1 1 60% !important}
  .mcol-side{flex:1 1 34% !important;min-width:250px !important}
  .tac-pitch{flex:1 1 46% !important;min-width:280px !important}
  .tac-pitch>div[style*="aspect-ratio"]{max-height:260px !important;min-height:200px !important}
  .grid2{grid-template-columns:1fr 1fr}
  .grid4{grid-template-columns:repeat(4,1fr)}
  #modal-box{max-height:100svh}
}
</style>
</head>
<body>
<div id="loadscr"><h1>足球经理</h1><div class="hint">FOOTBALL MANAGER · WEB</div></div>
<div id="app" style="display:none">
  <div id="topbar">
    <div id="tb-crest"></div>
    <div id="tb-club"></div>
    <div id="tb-spacer"></div>
    <div class="tb-stat s-date"><b id="tb-date">-</b><span>日期</span></div>
    <div class="tb-stat s-pos"><b id="tb-pos">-</b><span>联赛排名</span></div>
    <div class="tb-stat s-bal"><b id="tb-bal">-</b><span>可用资金</span></div>
    <div class="tb-stat s-next"><b id="tb-next">-</b><span>下一场</span></div>
    <button class="pri" id="tb-go" style="margin-left:12px;padding:8px 20px">继续 ▶</button>
  </div>
  <div id="main">
    <div id="side"></div>
    <div id="view"></div>
  </div>
</div>
<div id="modal"><div id="modal-box">
  <div id="modal-hd"><b id="modal-t"></b><span class="x" onclick="closeModal()">×</span></div>
  <div id="modal-bd"></div><div id="modal-ft"></div>
</div></div>
<div id="toast"></div>
<script>
/* =========================================================
   数据层：俱乐部 / 姓名池 / 阵型 / 常量
   ========================================================= */
'use strict';

// [英文名, 中文名, 简称, 主色, 副色, 声望, 球场容量, 球场名]
const CLUB_DATA = [
 // ---------- 第一级：英超 ----------
 [["Manchester City","曼彻斯特城","曼城","#6CABDD","#1C2C5B",94,53400,"伊蒂哈德球场"],
  ["Liverpool","利物浦","利物浦","#C8102E","#F6EB61",93,61000,"安菲尔德"],
  ["Arsenal","阿森纳","阿森纳","#EF0107","#FFFFFF",92,60700,"酋长球场"],
  ["Manchester United","曼彻斯特联","曼联","#DA020E","#FBE122",91,74300,"老特拉福德"],
  ["Chelsea","切尔西","切尔西",'#034694',"#FFFFFF",89,40300,"斯坦福桥"],
  ["Tottenham Hotspur","托特纳姆热刺","热刺","#132257","#FFFFFF",86,62800,"热刺球场"],

}

// 每队 [外形, 底纹]  外形: shield 尖盾 / crest 平顶盾 / round 圆形 / diamond 菱形
// 底纹: solid 纯色 / vstripe 竖条 / hoops 横环 / halves 左右分色 / sash 斜带 / quarters 四分 / chevron 人字
const CREST_STYLE=[
 // 英超
 ["round","solid"],["shield","solid"],["crest","solid"],["round","solid"],["round","solid"],
 ["shield","solid"],["shield","vstripe"],["shield","halves"],["crest","solid"],["shield","vstripe"],
 ["shield","solid"],["crest","solid"],["shield","sash"],["round","solid"],["shield","vstripe"],

 // 英冠

 // 英甲
 ["round","solid"],["shield","solid"],["crest","solid"],["shield","vstripe"],["round","solid"],
 ["shield","solid"],["crest","hoops"],["round","solid"],["shield","solid"],["round","solid"],
 ["crest","solid"],["shield","solid"],["shield","quarters"],["crest","vstripe"],["round","solid"],
 ["shield","vstripe"],["crest","solid"],["shield","solid"],["round","solid"],["crest","sash"]
];


// 三字母缩写（按足球界通行写法，与真实商标无关）
const CREST_ABBR=[
 "MCI","LIV","ARS","MUN","CHE","TOT","NEW","AVL","WHU","BHA",
 "EVE","WOL","CRY","FUL","BRE","NFO","BOU","LEI","SOU","IPS",
 "LEE","SUN","BUR","SHU","WBA","NOR","MID","STK","SHW","COV",

 "ROT","PET","BRR","LIN","NTH","EXE","BUT","SHR","STE","LEY"

// ---------- 颜色工具 ----------
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lum(h){ const [r,g,b]=hex2rgb(h).map(v=>{v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b; }
function contrast(a,b){ const la=lum(a),lb=lum(b);
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05); }
function shade(h,f){ const [r,g,b]=hex2rgb(h);
  const m=v=>Math.round(clamp(f<0? v*(1+f) : v+(255-v)*f,0,255));
  return "#"+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,"0")).join(""); }

function initialsOf(en, idx){
  if(idx!=null && CREST_ABBR[idx]) return CREST_ABBR[idx];
  const w=en.replace(/[^A-Za-z ]/g,"").split(/\s+/).filter(Boolean);
  if(w.length===1) return w[0].slice(0,3).toUpperCase();
  if(w.length===2) return (w[0][0]+w[1][0]).toUpperCase();
  return w.slice(0,3).map(x=>x[0]).join("").toUpperCase();
}

// ---------- 外形路径 ----------
function shapePath(kind,inset){
  const k=inset||0;
  switch(kind){
    case "round":   return null;   // 用 circle
    case "diamond": return `M32 ${2+k} L${62-k} 32 L32 ${62-k} L${2+k} 32 Z`;
    case "crest":   return `M${5+k} ${5+k} H${59-k} V${34-k*0.3} Q${59-k} ${52-k} 32 ${61-k} Q${5+k} ${52-k} ${5+k} ${34-k*0.3} Z`;
    default:        return `M32 ${2+k} L${60-k} ${11+k} V${31} C${60-k} ${46-k} ${46-k} ${57-k} 32 ${62-k} C${18+k} ${57-k} ${4+k} ${46-k} ${4+k} 31 V${11+k} Z`;
  }
}
function patternSVG(kind,col){
  switch(kind){
    case "vstripe": return [10,22,34,46].map(x=>`<rect x="${x}" y="0" width="6" height="64" fill="${col}"/>`).join("");
    case "hoops":   return [12,26,40,54].map(y=>`<rect x="0" y="${y}" width="64" height="7" fill="${col}"/>`).join("");
    case "halves":  return `<rect x="0" y="0" width="32" height="64" fill="${col}"/>`;
    case "sash":    return `<path d="M-6 44 L44 -6 L60 6 L10 56 Z" fill="${col}"/>`;
    case "quarters":return `<rect x="0" y="0" width="32" height="32" fill="${col}"/><rect x="32" y="32" width="32" height="32" fill="${col}"/>`;
    case "chevron": return `<path d="M32 8 L60 34 L60 48 L32 22 L4 48 L4 34 Z" fill="${col}"/>`;
    default:        return "";
  }
}
function starRow(n,y){
  if(!n) return "";
  const s=(cx)=>`<path transform="translate(${cx} ${y}) scale(.115)" fill="#ffcf४4"
    d="M0 -30 L8.8 -9.3 L31 -9.3 L13 4.5 L20 26 L0 13 L-20 26 L-13 4.5 L-31 -9.3 L-8.8 -9.3 Z"/>`;
  const xs = n===1?[32]: n===2?[25,39]: [18,32,46];
  return xs.map(s).join("").replace(/ffcf४4/g,"ffcf44");
}

// ---------- 生成 SVG ----------
function buildCrestSVG(c){
  const idx = c.crestIdx!=null? c.crestIdx : c.id;
  const [shape,pat]=CREST_STYLE[idx%60]||["shield","solid"];
  let c1=c.c1, c2=c.c2;
  if(contrast(c1,c2)<1.35) c2 = lum(c1)>0.5? shade(c1,-0.55) : shade(c1,0.55);
  const dark = lum(c1)>0.55;
  const border = dark? shade(c1,-0.62) : shade(c1,-0.35);
  const band   = dark? "#111820" : "#ffffff";
  let txt = contrast(c1,band)>=2.6? c1 : (contrast(c2,band)>=2.6? c2 : (band==="#ffffff"?"#111820":"#ffffff"));
  const ini=initialsOf(c.en, idx%60);
  const stars = c.rep>=85?3 : c.rep>=68?2 : c.rep>=48?1 : 0;
  const fs = ini.length>=3? 15.5 : 18;
  const clip=`cl${idx}`;
  const inner = shape==="round"
    ? `<circle cx="32" cy="32" r="26.5"/>`
    : `<path d="${shapePath(shape,4)}"/>`;
  const outer = shape==="round"
    ? `<circle cx="32" cy="32" r="30" fill="${border}"/>`
    : `<path d="${shapePath(shape,0)}" fill="${border}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<defs><clipPath id="${clip}">${inner}</clipPath>
<linearGradient id="g${idx}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#000000" stop-opacity=".22"/></linearGradient></defs>
${outer}
<g clip-path="url(#${clip})">
  <rect x="0" y="0" width="64" height="64" fill="${c1}"/>
  ${patternSVG(pat,c2)}
  <rect x="0" y="0" width="64" height="64" fill="url(#g${idx})"/>
  <rect x="0" y="${shape==="round"?26:27}" width="64" height="17" fill="${band}" opacity=".93"/>
  <text x="32" y="${shape==="round"?38.5:39.5}" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
    font-size="${fs}" font-weight="700" fill="${txt}" letter-spacing="0.5">${ini}</text>
  ${starRow(stars, shape==="round"?17:18)}
</g>
${shape==="round"?`<circle cx="32" cy="32" r="26.5" fill="none" stroke="${band}" stroke-opacity=".35" stroke-width="1"/>`
 :`<path d="${shapePath(shape,4)}" fill="none" stroke="${band}" stroke-opacity=".3" stroke-width="1"/>`}
</svg>`;
}

/* =========================================================
   随机数 / 球员生成 / 世界初始化
   ========================================================= */

// ---------- 种子随机 ----------
let RNGSTATE = 123456789;
function seedRng(s){ RNGSTATE = (s>>>0)||1; }
function rnd(){ // mulberry32
  RNGSTATE |= 0; RNGSTATE = (RNGSTATE + 0x6D2B79F5) | 0;
  let t = Math.imul(RNGSTATE ^ (RNGSTATE >>> 15), 1 | RNGSTATE);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a,b)=> a + Math.floor(rnd()*(b-a+1));
const pick = arr => arr[Math.floor(rnd()*arr.length)];
function gauss(mu,sd){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd();
  return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v); }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const R1=v=>Math.round(v*10)/10;

// ---------- 中文译名 ----------
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function toCN(first,last){
  return (NAME_CN[first]||first) + "·" + (NAME_CN[last]||last);
}

// ---------- 属性生成 ----------
function genAttrs(lvl,pos){
  const w = POS_WEIGHTS[pos], A={};
  const isGK = pos==="GK";
  for(const k of ATTR_KEYS){
    const gkAttr = k in ATTRS_GK;
    let base;
    if(gkAttr && !isGK)      base = lvl*0.045 + gauss(0,1.2) - 4;
    else if(!gkAttr && isGK && (k in ATTRS_TECH) && k!=="passing" && k!=="setpiece")
                             base = lvl*0.09 + gauss(0,1.3) - 2;
    else {
      const weight = w[k]||0;
      const wf = 0.72 + weight*0.075;          // 关键属性更高
      base = (lvl/5.2)*wf + gauss(0,1.35);
    }
    A[k]=clamp(Math.round(base),1,20);
  }
  return A;
}

function calcCA(A,pos){
  const w=POS_WEIGHTS[pos]; let s=0,t=0;
  for(const k in w){ s += (A[k]||1)*w[k]; t += w[k]; }
  const core = s/t;                       // 1-20
  let extra=0,n=0;
  for(const k of ATTR_KEYS){ if(!(k in w) && !(k in ATTRS_GK)){ extra+=A[k]; n++; } }
  const rest = n? extra/n : 10;
  return Math.round((core*0.85 + rest*0.15)*10);   // 10-200
}

// 位置适配度 0~1
function posFit(p,pos){
  if(p.pos===pos) return 1;
  if((p.pos2||[]).includes(pos)) return 0.9;
  if((POS_NEAR[p.pos]||[]).includes(pos)) return 0.72;
  if(p.pos==="GK"||pos==="GK") return 0.18;
  return 0.5;
}

// ---------- 身价 / 工资 ----------
function calcValue(p){
  const ca=p.ca, pa=p.pa, age=p.age;
  let v = Math.pow(ca/10, 3.55) * 2200;
  let ageF = age<=19?1.55: age<=22?1.65: age<=25?1.45: age<=28?1.1: age<=31?0.66: age<=33?0.33: 0.13;
  v *= ageF;
  const potF = 1 + clamp((pa-ca)/100,0,0.9)*(age<24?1.25:0.35);
  v *= potF;
  const yrs = Math.max(0, p.contract - WORLD.season);
  v *= yrs<=0?0.16: yrs===1?0.62: yrs===2?0.9: 1;
  if(p.injury>0) v*=0.82;
  return Math.max(3000, Math.round(v/1000)*1000);
}
function calcWage(p, rep){
  let w = Math.pow(p.ca/10,3.0)*33 + rep*20;
  if(p.age<21) w*=0.5; else if(p.age<24) w*=0.82; else if(p.age>33) w*=0.85;
  return Math.max(300, Math.round(w/50)*50);   // 周薪 £
}

// ---------- 单个球员 ----------
let PID=1;
function nextPid(){ if(WORLD && WORLD.pid!=null){ WORLD.pid++; return WORLD.pid; } return PID++; }
function makePlayer(lvl, pos, age, clubId){
  const rg=pick(REGION_WHEEL), pool=NAME_POOLS[rg];
  const first=pick(pool.first), last=pick(pool.last);
  const A=genAttrs(lvl,pos);
  const p={
    id:nextPid(), first, last, name:first+" "+last, cn:toCN(first,last),
    pos, pos2:[], age, clubId, nat:pick(pool.nat), rg,
    a:A, ca:0, pa:0,
    condition:100, morale:ri(60,88), injury:0, injType:"", sharp:ri(70,95),
    contract:0, wage:0, value:0,
    apps:0, goals:0, assists:0, cleanSheet:0, ratingSum:0, motm:0, yellow:0, red:0, susp:0,
    careerApps:0, careerGoals:0,
    scouted: 0, // 0未知 1部分 2完全
    homegrown: false, form:[]
  };
  p.ca=calcCA(A,pos);
  // 潜力
  const room = age<=17? ri(30,72) : age<=19? ri(20,58) : age<=21? ri(12,44)
             : age<=23? ri(6,32) : age<=26? ri(0,18) : age<=29? ri(0,7) : 0;
  p.pa = clamp(p.ca + room, p.ca, 200);
  // 副位置
  const near = POS_NEAR[pos]||[];
  if(near.length && rnd()<0.42) p.pos2=[pick(near)];
  if(near.length>1 && rnd()<0.12) { const q=pick(near); if(!p.pos2.includes(q)) p.pos2.push(q); }
  p.contract = WORLD.season + (age<20? ri(2,4) : age>32? ri(0,2) : ri(1,4));
  return p;
}

// ---------- 阵容生成 ----------
const SQUAD_TEMPLATE = [ // 位置 : 人数
  ["GK",3],["DC",5],["DL",2],["DR",2],["DM",2],["MC",4],["ML",2],["MR",2],["AM",2],["ST",4]
];
function genSquad(club){
  const ids=[];
  const rep=club.rep;
  let idx=0;
  for(const [pos,cnt] of SQUAD_TEMPLATE){
    for(let i=0;i<cnt;i++){
      // 主力 vs 替补 强度递减
      const depth = i/Math.max(1,cnt-1||1);
      const lvl = clamp(gauss(rep*(1 - depth*0.30) + 4, 6.5), 8, 99);
      let age;
      const r=rnd();
      age = r<0.10? ri(17,19) : r<0.34? ri(20,23) : r<0.72? ri(24,28) : r<0.92? ri(29,32) : ri(33,36);
      const p=makePlayer(lvl,pos,age,club.id);
      p.wage=calcWage(p,rep); p.value=calcValue(p);
      if(rnd()<0.3) p.homegrown=true;
      WORLD.players[p.id]=p; ids.push(p.id);
      idx++;
    }
  }
  club.squad=ids;
  return ids;
}

      WORLD.clubs.push(club);
    });
  });
  WORLD.clubs.forEach(c=>genSquad(c));
  WORLD.clubs.forEach(c=>{ autoPickLineup(c); });
  // 自由球员
  for(let i=0;i<40;i++){
    const lvl=clamp(gauss(34,14),8,72);
    const pos=pick(POSITIONS);
    const p=makePlayer(lvl,pos,ri(19,35),-1);

  }
  WORLD.userClub = WORLD.clubs.findIndex(c=>c.tier===userTier && c.id===userClubIdx);
  if(WORLD.userClub<0) WORLD.userClub=userClubIdx;
  buildSeason();

function defaultTactic(){
  return { formation:"4-4-2", mentality:2, tempo:2, press:2, width:2,
           offside:true, counter:true, timeWaste:1, roles:{} };

function setBoardExpectation(){
  WORLD.clubs.forEach(c=>{
    const lg=WORLD.leagues[c.tier];
    const sorted=[...lg.clubIds].sort((a,b)=>WORLD.clubs[b].rep-WORLD.clubs[a].rep);
    const rank=sorted.indexOf(c.id)+1;
    let e;
    if(rank<=2) e={txt:"争夺联赛冠军",target:1};
    else if(rank<=5) e={txt:"跻身前四",target:4};
    else if(rank<=9) e={txt:"冲击前六名",target:6};
    else if(rank<=14) e={txt:"稳居中游",target:12};
    else e={txt:"避免降级",target:17};
    if(c.tier>0 && rank<=3) e={txt:"冲击升级",target:2};
    c.board.expect=e.txt; c.board.target=e.target;
  });
}

function money(n){

  if(a>=1e9) return s+"£"+(a/1e9).toFixed(2)+"B";
  if(a>=1e6) return s+"£"+(a/1e6).toFixed(a>=1e7?1:2)+"M";
  if(a>=1e3) return s+"£"+Math.round(a/1e3)+"K";
  return s+"£"+Math.round(a);
}
function ovr(p){ return Math.round(p.ca/2); }   // 0-100 概览值
function caColor(ca){
  const v=ca/2;
  return v>=80?"#00d47e": v>=68?"#7ed957": v>=55?"#ffd24a": v>=42?"#f0a020":"#e5484d";
}
function attrColor(v){
  return v>=17?"#00d47e": v>=14?"#7ed957": v>=11?"#ffd24a": v>=8?"#f0a020":"#e5484d";
}
/* =========================================================
   赛季 / 赛程 / 积分榜 / 阵容自动排布
   ========================================================= */

function dateOf(day){ return new Date(WORLD.season, 7, 1+day); }   // 8月1日为第0天
function fmtDate(d){
  const w=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${w}`;
}
function fmtDateShort(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
const SEASON_DAYS = 304;   // 8/1 -> 5/31

// ---------- 循环赛程 ----------
function roundRobin(ids){
  const t=[...ids]; if(t.length%2) t.push(-1);
  const n=t.length, half=n/2, rounds=[];
  let arr=[...t];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<half;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a>=0&&b>=0) rd.push(r%2? [b,a] : [a,b]);
    }
    rounds.push(rd);
    arr=[arr[0], ...arr.slice(-1), ...arr.slice(1,-1)];
  }
  return rounds;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildSeason(){
  WORLD.fixtures=[];
  WORLD.leagues=[0,1,2].map(tier=>({
    tier, name:LEAGUE_NAMES[tier], short:LEAGUE_SHORT[tier],
    clubIds: WORLD.clubs.filter(c=>c.tier===tier).map(c=>c.id),
    table:{}, rounds:[]
  }));
  WORLD.clubs.forEach(c=>{ c.seasonStats={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; c.form=[]; });
  Object.values(WORLD.players).forEach(p=>{
    p.apps=0;p.goals=0;p.assists=0;p.cleanSheet=0;p.ratingSum=0;p.motm=0;p.yellow=0;p.red=0;p.susp=0;p.form=[];
  });

  // 找到 8 月首个周六
  let start=0; while(dateOf(start).getDay()!==6 || dateOf(start).getDate()<6) start++;
  const matchDays=[]; for(let i=0;i<38;i++) matchDays.push(start + i*7);

  WORLD.leagues.forEach(lg=>{
    const half=roundRobin(shuffle([...lg.clubIds]));
    const all=[...half, ...half.map(r=>r.map(m=>[m[1],m[0]]))];
    all.forEach((rd,ri)=>{
      const day=matchDays[ri];
      rd.forEach(([h,a])=>{
        // 同轮次错开到周六/周日
        const d = day + (rnd()<0.28?1:0);
        WORLD.fixtures.push({day:d,home:h,away:a,comp:"L",tier:lg.tier,round:ri+1,played:false,hg:0,ag:0});
      });
    });
    lg.rounds=all.length;
  });

  // ---------- 足总杯 ----------
  const cupDays=[]; { let w=[10,17,23,29,33,36]; w.forEach(i=> cupDays.push(matchDays[i]+4)); }
  WORLD.cup={ name:CUP_NAME, roundNames:["第三轮","第四轮","第五轮","1/4决赛","半决赛","决赛"],
              days:cupDays, cur:0, alive:null, results:[], winner:null };
  const all=WORLD.clubs.map(c=>c.id);
  const seeds=WORLD.clubs.filter(c=>c.tier===0).sort((a,b)=>b.rep-a.rep).slice(0,4).map(c=>c.id);
  const rest=shuffle(all.filter(i=>!seeds.includes(i)));
  WORLD.cup.alive=[...rest];
  WORLD.cup.byes=seeds;
  scheduleCupRound();
}

function scheduleCupRound(){
  const cup=WORLD.cup; if(cup.cur>=6) return;
  let pool=[...cup.alive];
  if(cup.cur===0 && cup.byes) { /* 首轮 56 队 */ }
  shuffle(pool);
  const day=cup.days[cup.cur];
  for(let i=0;i+1<pool.length;i+=2){
    WORLD.fixtures.push({day, home:pool[i], away:pool[i+1], comp:"C", round:cup.cur+1, played:false, hg:0, ag:0, pens:null});
  }
  WORLD.fixtures.sort((a,b)=>a.day-b.day);
}
function advanceCupRound(){
  const cup=WORLD.cup;
  const day=cup.days[cup.cur];
  const ms=WORLD.fixtures.filter(f=>f.comp==="C"&&f.day===day&&f.played);
  let winners=ms.map(f=>{
    if(f.hg>f.ag) return f.home;
    if(f.ag>f.hg) return f.away;
    return f.pens && f.pens[0]>f.pens[1] ? f.home : f.away;
  });
  if(cup.cur===0 && cup.byes){ winners=winners.concat(cup.byes); cup.byes=null; }
  cup.results.push({round:cup.roundNames[cup.cur], matches:ms.map(f=>({h:f.home,a:f.away,hg:f.hg,ag:f.ag,pens:f.pens}))});
  cup.cur++;
  cup.alive=winners;
  if(winners.length===1){ cup.winner=winners[0]; C(winners[0]).trophies.push(WORLD.season+" "+CUP_NAME); return; }
  if(cup.cur<6) scheduleCupRound();
}

// ---------- 积分榜 ----------
function leagueTable(tier){
  const lg=WORLD.leagues[tier];
  const rows=lg.clubIds.map(id=>{ const c=C(id), s=c.seasonStats;
    return {id, ...s, gd:s.gf-s.ga, form:c.form.slice(-5)}; });
  rows.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || (C(a.id).cn<C(b.id).cn?-1:1));
  rows.forEach((r,i)=>r.rank=i+1);
  return rows;
}
function clubRank(id){
  const t=leagueTable(C(id).tier);
  return t.find(r=>r.id===id).rank;
}

// ---------- 阵容 ----------
function playerScore(p,pos){
  if(!p) return 0;
  const fit=posFit(p,pos);
  const cond=0.55+0.45*(p.condition/100);
  const mor=0.9+0.2*(p.morale/100);
  const sh=0.85+0.15*(p.sharp/100);
  return p.ca*fit*cond*mor*sh;
}
function autoPickLineup(club){
  const slots=FORMATIONS[club.tactic.formation];
  const avail=club.squad.filter(id=>{const p=P(id); return p.injury<=0 && p.susp<=0;});
  const used=new Set(), lineup=[];
  // 先门将
  slots.forEach((s,si)=>{ lineup[si]=null; });
  const order=slots.map((s,i)=>i).sort((a,b)=> (slots[a][0]==="GK"?-1:0)-(slots[b][0]==="GK"?-1:0));
  for(const si of order){
    const pos=slots[si][0];
    let best=null,bs=-1;
    for(const id of avail){ if(used.has(id))continue;
      const sc=playerScore(P(id),pos);
      if(sc>bs){bs=sc;best=id;} }
    if(best!=null){ used.add(best); lineup[si]=best; }
  }
  club.lineup=lineup;
  // 替补 7 人：保证 1 门将
  const restIds=avail.filter(id=>!used.has(id));
  restIds.sort((a,b)=>P(b).ca-P(a).ca);
  const subs=[];
  const gk=restIds.find(id=>P(id).pos==="GK"); if(gk){subs.push(gk);used.add(gk);}
  for(const id of restIds){ if(subs.length>=7)break; if(used.has(id))continue; subs.push(id); used.add(id); }
  club.subs=subs;
}
function teamStrength(club, forMatch){
  const slots=FORMATIONS[club.tactic.formation];
  let sum=0;
  club.lineup.forEach((id,i)=>{ if(id==null)return;
    sum += playerScore(P(id), slots[i][0]); });
  const n=club.lineup.filter(x=>x!=null).length||1;
  let s=sum/n;
  s *= 1 + (club.coachRating-10)*0.004;
  return s;
}
/* =========================================================
   比赛引擎：回合推进 + 位置轨迹
   球场坐标 105 x 68，主队由左向右进攻
   ========================================================= */
const PW=105, PH=68;

function slotWorld(fx,fy,side){   // side 0 主 1 客
  return side===0 ? {x:fx/100*PW, y:fy/100*PH} : {x:PW-fx/100*PW, y:PH-fy/100*PH};
}

function createMatch(homeId, awayId, opts){
  opts=opts||{};
  const M={
    h:homeId, a:awayId, comp:opts.comp||"L", round:opts.round||0, neutral:!!opts.neutral,
    knockout:!!opts.knockout, record:!!opts.record,
    t:0, addedTime:0, half:1, done:false,
    score:[0,0], events:[], frames:[], phase:0,
    stats:[blankStats(),blankStats()],
    teams:[], possTicks:[0,0], ballOwner:null, side:0,
    ball:{x:PW/2,y:PH/2}, lastTouch:null, subsMade:[0,0], pens:null,
    userSide: opts.userSide!=null?opts.userSide:-1,
    momentum:0, log:[]
  };
  [homeId,awayId].forEach((cid,side)=>{
    const club=C(cid);
    if(!club.lineup.length || club.lineup.filter(x=>x!=null).length<11) autoPickLineup(club);
    const slots=FORMATIONS[club.tactic.formation];
    const arr=[];
    club.lineup.forEach((pid,i)=>{
      if(pid==null) return;
      const p=P(pid), w=slotWorld(slots[i][1],slots[i][2],side);
      arr.push({
        id:pid, p, slot:i, pos:slots[i][0], bx:w.x, by:w.y, x:w.x, y:w.y,
        cond:p.condition, rating:6.4, goals:0, assists:0, shots:0, sot:0,
        passes:0, passOk:0, tackles:0, tackleOk:0, saves:0, keyp:0, drib:0,
        yellow:0, red:0, off:false, mins:0
      });
    });
    M.teams.push({cid, club, men:arr, benchUsed:[], gk:arr.find(m=>m.pos==="GK")||arr[0],
      form:club.tactic.formation, tac:club.tactic,
      homeAdv: side===0 && !M.neutral ? 1.17 : 1});
  });
  M.ballOwner = M.teams[0].men.find(m=>m.pos==="MC")||M.teams[0].men[5];
  updatePositions(M);
  return M;
}
function blankStats(){ return {shots:0,sot:0,poss:0,corners:0,fouls:0,yellow:0,red:0,offside:0,pass:0,passOk:0,xg:0,saves:0}; }

// ---------- 位置更新 ----------
function updatePositions(M){
  const bx=M.ball.x, by=M.ball.y;
  M.teams.forEach((T,side)=>{
    const att = M.side===side;
    const tac=T.tac;
    const ment=(tac.mentality-2)*0.055;
    const widthF=0.85+tac.width*0.09;
    const pressF=0.5+tac.press*0.075;
    const dir = side===0?1:-1;
    T.men.forEach(m=>{
      if(m.off) return;
      const prog=(bx-PW/2)*dir;              // 球在本方进攻方向的推进度
      let shift = prog*(att?0.42:0.46) + ment*PW*(att?1:0.5);
      // 门将跟随较少
      if(m.pos==="GK") shift = prog*0.10;
      let tx = m.bx + shift*dir;
      let ty = PH/2 + (m.by-PH/2)*widthF + (by-PH/2)*(m.pos==="GK"?0.12:0.22*pressF);
      // 前锋压上/后卫回收极限
      // 不允许挤到对方门线：进攻推进度上限 96m
      const axp = side===0? tx : PW-tx;
      if(m.pos!=="GK" && axp>96) tx = side===0? 96 : PW-96;
      tx = clamp(tx, 3, PW-3); ty = clamp(ty, 2, PH-2);
      // 靠近球时被吸引
      const d=Math.hypot(bx-tx, by-ty);
      if(d<20 && m.pos!=="GK"){ const k=(att?0.16:0.30)*(1-d/20)*pressF; tx+=(bx-tx)*k; ty+=(by-ty)*k; }
      m.x = tx + gauss(0,0.9); m.y = clamp(ty + gauss(0,0.9),1,PH-1);
    });
  });
  if(M.ballOwner && !M.ballOwner.off){ M.ballOwner.x=M.ball.x; M.ballOwner.y=M.ball.y; }
}

function pressureOn(M, side, x, y){
  const opp=M.teams[1-side]; let pr=0;
  opp.men.forEach(m=>{ if(m.off||m.pos==="GK")return;
    const d=Math.hypot(m.x-x,m.y-y);
    if(d<14) pr += (1-d/14)*(0.55+ (m.p.a.tackling+m.p.a.aggression+m.p.a.workrate)/120);
  });
  return pr;
}
function nearestOpp(M, side, x, y){
  const opp=M.teams[1-side]; let best=null,bd=1e9;
  opp.men.forEach(m=>{ if(m.off||m.pos==="GK")return;
    const d=Math.hypot(m.x-x,m.y-y); if(d<bd){bd=d;best=m;} });
  return {m:best,d:bd};
}
const att=(m,k)=> m.p.a[k]*(0.62+0.38*(m.cond/100));

function addEvent(M,type,text,cls){
  const e={t:Math.floor(M.t), half:M.half, type, text, cls:cls||type, score:[...M.score]};
  M.events.push(e); return e;
}
function nm(m){ return m.p.cn.split("·")[1]||m.p.cn; }

// ---------- 主循环：推进一个回合 ----------
function stepMatch(M){
  if(M.done) return null;
  const dt = 2.4 + rnd()*5.2;
  M.t += dt/60;
  const side=M.side, T=M.teams[side], O=M.teams[1-side];
  M.possTicks[side]++;
  // 体能消耗
  const tempoF=0.85+T.tac.tempo*0.08, pressG=0.85+T.tac.press*0.09;
  M.teams.forEach((tm,s)=>{ tm.men.forEach(m=>{ if(m.off)return;
    m.mins += dt/60;
    const st=m.p.a.stamina, wr=m.p.a.workrate;
    let drain=(dt/60)*(0.30+ (20-st)*0.028 + wr*0.006)*(s===side?tempoF:pressG*1.05);
    m.cond=clamp(m.cond-drain,12,100);
  }); });

  const owner=M.ballOwner;
  if(!owner||owner.off){ M.ballOwner=T.men.find(m=>!m.off)||O.men[0]; }
  const o=M.ballOwner;
  const dir = side===0?1:-1;
  const ax = side===0 ? o.x : PW-o.x;             // 进攻推进度 0..105
  const dy = Math.abs(o.y-PH/2);
  const pr = pressureOn(M, side, o.x, o.y);
  const goalX = side===0?PW:0;
  const distGoal = Math.hypot(goalX-o.x, PH/2-o.y);

  // --- 决策权重 ---
  const A=o.p.a;
  let wShoot=0, wCross=0, wDrib=0, wPass=1.0;
  if(ax>52 && distGoal<36){
    const angle = 1 - clamp(dy/34,0,1)*0.72;
    wShoot = 0.322*angle*(0.40+A.finishing/22)*Math.exp(-(distGoal-7)/12)/(1+pr*0.75);
    if(distGoal>19) wShoot *= clamp(A.longshot/15,0.30,1.5);
  }
  if(ax>50 && dy>13) wCross = 12*(A.crossing/16)*(ax-50)/55/(1+pr*0.5)*clamp((dy-11)/12,0,1.25);
  wDrib = 0.55*(A.dribbling/17)*(0.6+A.flair/34)/(1+pr*1.25)*(0.6+A.accel/30);
  wPass = 1.35*(0.5+A.passing/22)*(0.7+A.vision/30);
  if(pr>2.2) { wPass*=1.25; wDrib*=0.5; }
  if(T.tac.tempo>=3) { wPass*=1.05; wDrib*=0.95; }
  if(T.tac.mentality>=3){ wShoot*=1.18; wCross*=1.1; }
  if(T.tac.mentality<=1){ wShoot*=0.8; wPass*=1.15; }

  const tot=wShoot+wCross+wDrib+wPass; let r=rnd()*tot, act;
  if((r-=wShoot)<0) act="shoot"; else if((r-=wCross)<0) act="cross";
  else if((r-=wDrib)<0) act="drib"; else act="pass";

  // --- 抢断拦截判定（先于动作）---
  const near=nearestOpp(M,side,o.x,o.y);
  if(near.m && near.d<8 && rnd()< 0.30*(1-near.d/8)+0.025){
    const D=near.m;
    D.tackles++;
    const dv=(att(D,'tackling')*0.6+att(D,'marking')*0.25+att(D,'aggression')*0.15)*(side===0?1:1.04)+gauss(0,3.2);
    const ov=att(o,'dribbling')*0.4+att(o,'technique')*0.25+att(o,'agility')*0.2+att(o,'strength')*0.15+gauss(0,3.2);
    if(dv>ov){
      if(rnd()<0.55){ // 犯规
        M.stats[1-side].fouls++; D.rating-=0.06;
        const inBox = (side===0? D.x>PW-16.5 : D.x<16.5) && Math.abs(D.y-PH/2)<20.15;
        cardCheck(M,1-side,D,inBox);
        if(inBox && rnd()<0.030){ penalty(M,side,o); return finPhase(M,dt); }
        // 任意球
        if(ax>72 && dy<22 && rnd()<0.45){ freeKick(M,side,o); return finPhase(M,dt); }
        M.ballOwner=o; return finPhase(M,dt);
      }
      D.tackleOk++; D.rating+=0.07; o.rating-=0.05;
      turnover(M,D); return finPhase(M,dt);
    } else { o.rating+=0.03; }
  }

  switch(act){
    case "shoot": doShot(M,side,o,distGoal,dy,pr,false); break;
    case "cross": doCross(M,side,o); break;
    case "drib": doDribble(M,side,o,pr,dir); break;
    default: doPass(M,side,o,pr,dir); break;
  }
  return finPhase(M,dt);
}

function finPhase(M,dt){
  updatePositions(M);
  if(M.record){
    M.frames.push({t:M.t, b:{x:R1(M.ball.x),y:R1(M.ball.y)}, s:M.side,
      p:M.teams.flatMap(T=>T.men.filter(m=>!m.off).map(m=>[Math.round(m.x*10)/10,Math.round(m.y*10)/10]))});
  }
  M.phase++;
  // 半场 / 结束
  if(M.half===1 && M.t>=45+M.addedTime){
    if(M.addedTime===0){ M.addedTime=ri(1,4); }
    if(M.t>=45+M.addedTime){ M.half=2; M.t=45; M.addedTime=0; M.side=1;
      M.ball={x:PW/2,y:PH/2}; M.ballOwner=M.teams[1].men[5]||M.teams[1].men[0];
      addEvent(M,"sys","—— 中场休息  "+M.score[0]+" : "+M.score[1]+" ——","sys");
      halftimeRecover(M); updatePositions(M); }
  } else if(M.half===2 && M.t>=90+M.addedTime){
    if(M.addedTime===0) M.addedTime=ri(2,6);
    if(M.t>=90+M.addedTime) endMatch(M);
  }
  aiSubs(M);
  return M.events[M.events.length-1];
}
function halftimeRecover(M){ M.teams.forEach(T=>T.men.forEach(m=>{ m.cond=clamp(m.cond+ri(3,7),0,100); })); }

// ---------- 具体动作 ----------
function turnover(M, newOwner){
  M.side = M.teams[0].men.includes(newOwner)?0:1;
  M.ballOwner=newOwner; M.ball={x:newOwner.x,y:newOwner.y};
}
function doPass(M,side,o,pr,dir){
  const T=M.teams[side];
  const mates=T.men.filter(m=>m!==o && !m.off);
  // 选择接球人：偏向前场、距离适中
  let best=null,bw=-1;
  mates.forEach(m=>{
    const fwd=(m.x-o.x)*dir, d=Math.hypot(m.x-o.x,m.y-o.y);
    if(d<2) return;
    const oppPr=pressureOn(M,side,m.x,m.y);
    let w=(1+Math.max(0,fwd)*0.075) / (1+Math.abs(d-16)*0.055) / (1+oppPr*0.7);
    if(m.pos==="GK") w*=0.06;
    const axm=side===0?m.x:PW-m.x; if(axm>88) w*=0.55;
    if(T.tac.mentality>=3) w*=(1+Math.max(0,fwd)*0.04);
    if(T.tac.tempo>=3&&fwd>18) w*=1.35;
    best=(w>bw)?(bw=w,m):best;
  });
  if(!best){ return; }
  const d=Math.hypot(best.x-o.x,best.y-o.y);
  o.passes++; M.stats[side].pass++;
  const skill=att(o,'passing')*0.5+att(o,'vision')*0.25+att(o,'technique')*0.25;
  let p = 0.965 - d*0.0125 - pr*0.055 + (skill-10)*0.021;
  p = clamp(p*(side===0&&!M.neutral?1.03:1),0.28,0.97);
  // 越位判定（简化）
  const axT = side===0? best.x : PW-best.x;
  if(axT>72 && M.teams[1-side].tac.offside && rnd()<0.032){
    M.stats[side].offside++; addEvent(M,"off",`${nm(best)} 越位在先`,"");
    const D=M.teams[1-side].gk; turnover(M,D); return;
  }
  if(rnd()<p){
    o.passOk++; M.stats[side].passOk++; o.rating+=0.006;
    const axB=side===0?best.x:PW-best.x;
    if(axB>78 && (best.x-o.x)*dir>10){ o.keyp++; o.rating+=0.05; }
    M.ballOwner=best; M.ball={x:best.x,y:best.y}; M.lastTouch=o;
  } else {
    o.rating-=0.025;
    const iv=nearestOpp(M,side,best.x,best.y);
    turnover(M, iv.m || M.teams[1-side].gk);
  }
}
function doDribble(M,side,o,pr,dir){
  const D=nearestOpp(M,side,o.x,o.y);
  const ov=att(o,'dribbling')*0.4+att(o,'agility')*0.2+att(o,'accel')*0.2+att(o,'flair')*0.2+gauss(0,3);
  const dv=D.m? (att(D.m,'tackling')*0.4+att(D.m,'marking')*0.2+att(D.m,'pace')*0.2+att(D.m,'positioning')*0.2)*(D.d<6?1:0.45)+gauss(0,3) : 3;
  if(ov>dv){
    o.drib++; o.rating+=0.045;
    const adv=6+rnd()*10;
    o.x=clamp(o.x+adv*dir, side===0?2:PW-95, side===0?95:PW-2); o.y=clamp(o.y+gauss(0,5),2,PH-2);
    M.ball={x:o.x,y:o.y};
  } else {
    o.rating-=0.03;
    if(D.m){ D.m.tackleOk++; D.m.rating+=0.06; turnover(M,D.m); }
  }
}
function doCross(M,side,o){
  const T=M.teams[side], dir=side===0?1:-1;
  const targets=T.men.filter(m=>!m.off&&m!==o&&(POS_GRP[m.pos]==="fw"||m.pos==="AM"||m.pos==="MC"||m.pos==="DC"));
  if(!targets.length){ doPass(M,side,o,0,dir); return; }
  const ranked=targets.slice().sort((x,y)=>(att(y,'heading')*0.6+att(y,'jumping')*0.4)-(att(x,'heading')*0.6+att(x,'jumping')*0.4));
  let tgt=ranked[Math.floor(Math.pow(rnd(),1.5)*Math.min(4,ranked.length))]||ranked[0];
  const acc = clamp(0.20+att(o,'crossing')*0.024 + att(o,'technique')*0.006,0.15,0.62);
  M.stats[side].pass++; o.passes++;
  if(rnd()<acc){
    o.passOk++; M.stats[side].passOk++;
    const gk=M.teams[1-side].gk;
    const def=nearestOpp(M,side,side===0?PW-11:11,PH/2);
    const av=att(tgt,'heading')*0.55+att(tgt,'jumping')*0.3+att(tgt,'strength')*0.15+gauss(0,3);
    const dv=def.m?(att(def.m,'heading')*0.5+att(def.m,'jumping')*0.3+att(def.m,'marking')*0.2)+gauss(0,3):6;
    tgt.x = side===0? PW-10-rnd()*6 : 10+rnd()*6; tgt.y=PH/2+gauss(0,7);
    M.ball={x:tgt.x,y:tgt.y};
    if(av>dv){ M.ballOwner=tgt; M.lastTouch=o; doShot(M,side,tgt,Math.hypot((side===0?PW:0)-tgt.x,PH/2-tgt.y),Math.abs(tgt.y-PH/2),0.6,true); }
    else { if(rnd()<0.34){ corner(M,side); } else turnover(M, def.m||gk); }
  } else {
    if(rnd()<0.26) corner(M,side); else turnover(M, M.teams[1-side].gk);
  }
}
function corner(M,side){
  M.stats[side].corners++;
  const T=M.teams[side], dir=side===0?1:-1;
  const taker=T.men.reduce((b,m)=> att(m,'setpiece')>att(b,'setpiece')?m:b);
  const tgt=T.men.filter(m=>!m.off).reduce((b,m)=> (att(m,'heading')*0.6+att(m,'jumping')*0.4)>(att(b,'heading')*0.6+att(b,'jumping')*0.4)?m:b);
  const gk=M.teams[1-side].gk;
  M.ball={x:side===0?PW-9-rnd()*4:9+rnd()*4,y:PH/2+gauss(0,6)};
  const q=att(taker,'setpiece')*0.6+att(taker,'crossing')*0.4;
  if(rnd()< 0.30+q*0.014){
    const av=att(tgt,'heading')*0.6+att(tgt,'jumping')*0.4+gauss(0,3.4);
    const dv=att(gk,'aerial')*0.4+ 11 + gauss(0,3.4);
    tgt.x=M.ball.x; tgt.y=M.ball.y; M.ballOwner=tgt; M.lastTouch=taker;
    if(av>dv){ doShot(M,side,tgt,Math.hypot((side===0?PW:0)-tgt.x,PH/2-tgt.y),Math.abs(tgt.y-PH/2),0.7,true); return; }
  }
  turnover(M,gk);
}
function doShot(M,side,o,dist,dy,pr,isHeader){
  const gk=M.teams[1-side].gk;
  o.shots++; M.stats[side].shots++;
  const angle=1-clamp(dy/30,0,1)*0.6;
  // 预期进球
  let xg = clamp(0.92*Math.exp(-dist/8.2)*angle*(isHeader?0.62:1)/(1+pr*0.42),0.008,0.86);
  M.stats[side].xg+=xg;
  const fin=isHeader? att(o,'heading')*0.65+att(o,'jumping')*0.35 : att(o,'finishing')*0.7+att(o,'technique')*0.3;
  const comp=att(o,'composure');
  let onTarget = clamp((0.20+fin*0.020+comp*0.006-dist*0.0092-pr*0.030)*0.86,0.06,0.72);
  const blocked = rnd()< clamp(pr*0.11,0,0.30);
  if(blocked){ addEvent(M,"blk",`${nm(o)} 的射门被封堵`,""); 
    if(rnd()<0.46) corner(M,side); else turnover(M, nearestOpp(M,side,o.x,o.y).m||gk); return; }
  if(rnd()>onTarget){
    o.rating-=0.06;
    addEvent(M,"miss",`${nm(o)} ${dist>24?"远射":"打门"}偏出`, xg>0.28?"chance":"");
    if(rnd()<0.10) corner(M,side); else turnover(M,gk); return;
  }
  o.sot++; M.stats[side].sot++;
  // 门将扑救
  const gkq=att(gk,'reflex')*0.45+att(gk,'handling')*0.2+att(gk,'oneonone')*0.2+att(gk,'positioning')*0.15;
  let pGoal = clamp(xg*2.0*(0.70+fin*0.030)*(1.30-gkq*0.028),0.015,0.90);
  pGoal *= M.teams[side].homeAdv;
  if(rnd()<pGoal){ scoreGoal(M,side,o,isHeader?"头球":dist>24?"远射":"射门"); }
  else{
    gk.saves++; gk.rating+=0.12; M.stats[1-side].saves++; o.rating+=0.04;
    addEvent(M,"save",`${nm(gk)} 扑出 ${nm(o)} 的射门！`, xg>0.30?"chance":"");
    if(rnd()<0.40) corner(M,side); else turnover(M,gk);
  }
}
function scoreGoal(M,side,o,how){
  M.score[side]++; o.goals++; o.rating+=1.05;
  let asst=null;
  if(M.lastTouch && M.lastTouch!==o && M.teams[side].men.includes(M.lastTouch)){
    asst=M.lastTouch; asst.assists++; asst.rating+=0.55;
  }
  const T=M.teams[side];
  addEvent(M,"goal",`⚽ 进球！${C(T.cid).short} ${nm(o)} ${how}破门${asst?"（"+nm(asst)+" 助攻）":""}  ${M.score[0]}-${M.score[1]}`,"goal");
  M.teams[1-side].men.forEach(m=>{ if(m.pos==="GK") m.rating-=0.32; else if(POS_GRP[m.pos]==="df") m.rating-=0.11; });
  T.men.forEach(m=>m.rating+=0.03);
  M.momentum = side===0?2:-2;
  // 中圈开球
  M.ball={x:PW/2,y:PH/2}; M.side=1-side;
  M.ballOwner=M.teams[1-side].men.find(m=>m.pos==="MC"&&!m.off)||M.teams[1-side].men[5];
  M.lastTouch=null;
  M.t += 0.7;
}
function penalty(M,side,victim){
  const T=M.teams[side], gk=M.teams[1-side].gk;
  const taker=T.men.filter(m=>!m.off).reduce((b,m)=> (att(m,'finishing')*0.6+att(m,'composure')*0.4)>(att(b,'finishing')*0.6+att(b,'composure')*0.4)?m:b);
  addEvent(M,"pen",`点球！${C(T.cid).short} 获得 12 码机会`,"chance");
  taker.shots++; M.stats[side].shots++; M.stats[side].xg+=0.78;
  const p=clamp(0.62+att(taker,'finishing')*0.012+att(taker,'composure')*0.010-att(gk,'reflex')*0.008,0.4,0.94);
  M.ball={x:side===0?PW-11:11,y:PH/2};
  if(rnd()<p){ M.stats[side].sot++; taker.sot++; scoreGoal(M,side,taker,"点球"); }
  else { M.stats[side].sot++; taker.sot++; taker.rating-=0.55; gk.rating+=0.5; gk.saves++;
    addEvent(M,"save",`${nm(gk)} 扑出点球！${nm(taker)} 罚失`,"chance"); turnover(M,gk); }
}
function freeKick(M,side,o){
  const T=M.teams[side], gk=M.teams[1-side].gk;
  const taker=T.men.filter(m=>!m.off).reduce((b,m)=> att(m,'setpiece')>att(b,'setpiece')?m:b);
  const dist=18+rnd()*12;
  if(rnd()<0.42){   // 直接射门
    taker.shots++; M.stats[side].shots++;
    const q=att(taker,'setpiece')*0.6+att(taker,'technique')*0.4;
    const xg=clamp(0.055*(q/13),0.01,0.18); M.stats[side].xg+=xg;
    if(rnd()< clamp(0.18+q*0.014,0.1,0.5)){
      taker.sot++; M.stats[side].sot++;
      if(rnd()< clamp(xg*3.2*(1.25-att(gk,'reflex')*0.026),0.02,0.45)) { scoreGoal(M,side,taker,"任意球直接"); return; }
      gk.saves++; gk.rating+=0.12; M.stats[1-side].saves++;
      addEvent(M,"save",`${nm(taker)} 任意球被 ${nm(gk)} 没收`,"");
      turnover(M,gk); return;
    }
    addEvent(M,"miss",`${nm(taker)} 任意球高出横梁`,""); turnover(M,gk); return;
  }
  M.ball={x:side===0?PW-dist:dist,y:PH/2+gauss(0,10)};
  M.ballOwner=taker; taker.x=M.ball.x; taker.y=M.ball.y;
  doCross(M,side,taker);
}
function cardCheck(M,side,D,inBox){
  const agg=D.p.a.aggression;
  let pY=0.11+agg*0.0065;
  if(inBox) pY+=0.10;
  if(rnd()<pY){
    if(D.yellow>=1 || rnd()<0.028){
      D.red=1; D.yellow=D.yellow; D.off=true; M.stats[side].red++; D.rating-=1.3;
      addEvent(M,"card",`🟥 ${nm(D)} 被红牌罚下！`,"card");
    } else {
      D.yellow=1; M.stats[side].yellow++; D.rating-=0.25;
      addEvent(M,"card",`🟨 ${nm(D)} 吃到黄牌`,"card");
    }
  }
  // 受伤
  if(rnd()<0.0035){
    const T=M.teams[1-side];
    const v=T.men[Math.floor(rnd()*T.men.length)];
    if(v && !v.off){ v.off=true; v.injured=true;
      addEvent(M,"hurt",`🚑 ${nm(v)} 受伤离场`,"hurt"); }
  }
}

// ---------- 换人 ----------
function canSub(M,side){ return M.subsMade[side]<5; }
function doSub(M,side,outMan,inPid){
  if(!canSub(M,side)) return false;
  const T=M.teams[side], p=P(inPid);
  if(T.benchUsed.includes(inPid)) return false;
  const slots=FORMATIONS[T.form];
  const w=slotWorld(slots[outMan.slot][1],slots[outMan.slot][2],side);
  outMan.off=true;
  const nm2={id:inPid,p,slot:outMan.slot,pos:slots[outMan.slot][0],bx:w.x,by:w.y,x:w.x,y:w.y,
    cond:p.condition,rating:6.4,goals:0,assists:0,shots:0,sot:0,passes:0,passOk:0,tackles:0,tackleOk:0,
    saves:0,keyp:0,drib:0,yellow:0,red:0,off:false,mins:0,subIn:M.t};
  T.men.push(nm2); T.benchUsed.push(inPid); M.subsMade[side]++;
  if(outMan.pos==="GK") T.gk=nm2;
  addEvent(M,"sub",`🔁 ${C(T.cid).short} 换人：${nm(nm2)} 换下 ${nm(outMan)}`,"sys");
  if(M.ballOwner===outMan) M.ballOwner=nm2;
  return true;
}
function aiSubs(M){
  M.teams.forEach((T,side)=>{
    if(side===M.userSide) return;
    if(!canSub(M,side)) return;
    if(M.t<55 && !T.men.some(m=>m.injured&&m.off&&!m.subDone)) return;
    // 受伤优先
    let out=T.men.find(m=>m.off&&m.injured&&!m.subDone);
    if(out){ out.subDone=true; }
    else {
      if(rnd()>0.045) return;
      const cands=T.men.filter(m=>!m.off&&m.pos!=="GK"&&m.cond<64);
      if(!cands.length) return;
      out=cands.reduce((b,m)=>m.cond<b.cond?m:b);
    }
    const club=C(T.cid);
    const bench=club.subs.filter(id=>!T.benchUsed.includes(id)&&P(id).injury<=0);
    if(!bench.length) return;
    const slots=FORMATIONS[T.form], want=slots[out.slot][0];
    let bestId=null,bs=-1;
    bench.forEach(id=>{ const sc=playerScore(P(id),want)* (P(id).pos===want?1.1:1);
      if(sc>bs){bs=sc;bestId=id;} });
    if(bestId) doSub(M,side,out,bestId);
  });
}

// ---------- 结束 ----------
function endMatch(M){
  M.done=true;
  const tot=M.possTicks[0]+M.possTicks[1]||1;
  M.stats[0].poss=Math.round(M.possTicks[0]/tot*100);
  M.stats[1].poss=100-M.stats[0].poss;
  M.teams.forEach((T,side)=>{
    const conceded=M.score[1-side];
    T.men.forEach(m=>{
      if(conceded===0 && m.mins>44){ m.rating += m.pos==="GK"?0.45:(POS_GRP[m.pos]==="df"?0.3:0.1); }
      let r = m.rating + (M.score[side]-M.score[1-side])*0.07;
      if(r>7.4) r = 7.4 + (r-7.4)*0.58;          // 压缩高分尾部
      if(r<5.2) r = 5.2 - (5.2-r)*0.75;
      m.rating = Math.round(clamp(r,3.2,10.0)*10)/10;
    });
  });
  // 全场最佳
  let best=null; M.teams.forEach(T=>T.men.forEach(m=>{ if(!best||m.rating>best.rating) best=m; }));
  M.motm=best;
  if(M.knockout && M.score[0]===M.score[1]){
    // 点球大战
    let p=[0,0];
    for(let i=0;i<5;i++){ if(rnd()<0.75)p[0]++; if(rnd()<0.75)p[1]++; }
    while(p[0]===p[1]){ if(rnd()<0.75)p[0]++; if(rnd()<0.75)p[1]++; }
    M.pens=p;
    addEvent(M,"sys",`点球大战 ${p[0]}-${p[1]}，${C(p[0]>p[1]?M.h:M.a).cn} 晋级`,"sys");
  }
  addEvent(M,"sys",`—— 全场结束  ${C(M.h).short} ${M.score[0]} : ${M.score[1]} ${C(M.a).short} ——`,"sys");
}
function runMatch(M){ let guard=0; while(!M.done && guard++<20000) stepMatch(M); return M; }

   推进：日程 / 训练 / 成长 / 伤病 / 转会 / 财政 / 赛季结算
   ========================================================= */

function news(title, body, cat){
  WORLD.inbox.unshift({d:WORLD.day, title, body, cat:cat||"info", read:false});
  if(WORLD.inbox.length>140) WORLD.inbox.length=140;
}

// ---------- 结果落地 ----------
function applyResult(fx, M){
  fx.played=true; fx.hg=M.score[0]; fx.ag=M.score[1]; fx.pens=M.pens;
  fx.stats=[M.stats[0],M.stats[1]];
  fx.scorers=[[],[]];
  M.events.filter(e=>e.type==="goal").forEach(e=>{});
  const H=C(fx.home), A=C(fx.away);
  if(fx.comp==="L"){
    [[H,M.score[0],M.score[1]],[A,M.score[1],M.score[0]]].forEach(([c,gf,ga])=>{
      const s=c.seasonStats; s.p++; s.gf+=gf; s.ga+=ga;
      if(gf>ga){s.w++;s.pts+=3;c.form.push("W");}
      else if(gf===ga){s.d++;s.pts++;c.form.push("D");}
      else {s.l++;c.form.push("L");}
      if(c.form.length>8) c.form.shift();
    });
  }
  // 上座与收入
  const att0=Math.round(Math.min(H.cap, H.cap*(0.55+H.rep/220+ (H.seasonStats.pts/Math.max(1,H.seasonStats.p))*0.06)));
  const price = H.tier===0? 42 : H.tier===1? 27 : 19;
  const gate = Math.round(att0*price*(fx.comp==="C"?0.8:1));
  addMoney(H, gate, "门票收入 vs "+A.short);
  fx.attendance=att0;
  // 球员数据结算
  M.teams.forEach((T,side)=>{
    const conceded=M.score[1-side];
    T.men.forEach(m=>{
      const p=P(m.id);
      p.condition=Math.round(m.cond);
      p.apps++; p.careerApps++; p.goals+=m.goals; p.careerGoals+=m.goals;
      p.assists+=m.assists; p.ratingSum+=m.rating;
      p.form.push(m.rating); if(p.form.length>6)p.form.shift();
      if(conceded===0 && p.pos==="GK" && m.mins>60) p.cleanSheet++;
      if(m.yellow) p.yellow++;
      if(m.red){ p.red++; p.susp += ri(1,3); }
      else if(p.yellow>0 && p.yellow%5===0 && m.yellow) p.susp+=1;
      p.sharp=clamp(p.sharp + (m.mins>60?6:m.mins>20?3:0),0,100);
      // 士气
      const res = M.score[side]-M.score[1-side];
      let dm = res>0?ri(3,8): res===0?ri(-2,3): ri(-8,-2);
      if(m.mins<10) dm-=2;
      if(m.goals) dm+=4*m.goals;
      p.morale=clamp(p.morale+dm,5,100);
      if(m.injured){
        const sev=rnd();
        p.injury = sev<0.55? ri(3,10) : sev<0.85? ri(11,30) : ri(31,120);
        p.injType = p.injury<11?"轻伤":p.injury<31?"肌肉拉伤":"重伤";
        if(T.cid===WORLD.userClub) news(`${p.cn} 受伤`,`${p.cn} 在对阵${C(side===0?fx.away:fx.home).cn}的比赛中受伤，预计缺阵约 ${p.injury} 天（${p.injType}）。`,"bad");
      }
    });
    if(M.motm && T.men.includes(M.motm)) {}
  });
  if(M.motm) P(M.motm.id).motm++;
  // 未出场球员恢复
  [H,A].forEach(c=>{ c.squad.forEach(id=>{ const p=P(id);
    if(!M.teams.flatMap(t=>t.men).some(m=>m.id===id)) p.condition=clamp(p.condition+ri(2,6),0,100); }); });
  if(fx.comp==="C") { /* 杯赛晋级在当日统一处理 */ }
  fx.motm = M.motm? M.motm.id : null;
  fx.events = M.events.filter(e=>["goal","card","hurt","pen"].includes(e.type)).map(e=>({t:e.t,x:e.text,c:e.cls}));
}

function addMoney(club, amt, memo){
  club.finance.balance += amt;
  if(amt>0) club.finance.income+=amt; else club.finance.expense-=amt;
  club.finance.ledger.unshift({d:WORLD.day, amt, memo});
  if(club.finance.ledger.length>90) club.finance.ledger.length=90;
}

// ---------- 每日 ----------
function dailyTick(){
  const d=WORLD.day;
  Object.values(WORLD.players).forEach(p=>{
    if(p.injury>0){ p.injury--; if(p.injury===0){ p.condition=Math.min(p.condition,55); p.sharp=Math.max(20,p.sharp-25);
      if(p.clubId===WORLD.userClub) news(`${p.cn} 伤愈`,`${p.cn} 已恢复健康，可以重新参加训练。`,"good"); } }
    else {
      const c=p.clubId>=0?C(p.clubId):null;
      const phys=c?c.physioRating:10;
      let rec=4.5 + p.a.stamina*0.22 + phys*0.16 - Math.max(0,p.age-29)*0.18;
      if(c && c.trainIntensity===0) rec+=2.5; if(c && c.trainIntensity===4) rec-=1.6;
      p.condition=clamp(p.condition+rec,0,100);
      p.sharp=clamp(p.sharp-0.35,0,100);
    }
    if(p.susp>0 && isMatchDayFor(p.clubId,d)) p.susp--;
  });
  // 训练伤病
  WORLD.clubs.forEach(c=>{
    const risk=0.00055*(1+c.trainIntensity*0.55)*(1+(12-c.physioRating)*0.03);
    c.squad.forEach(id=>{ const p=P(id);
      if(p.injury<=0 && rnd()<risk){
        p.injury=ri(4,45); p.injType=p.injury<12?"训练轻伤":p.injury<30?"拉伤":"韧带伤";
        if(c.id===WORLD.userClub) news(`${p.cn} 训练中受伤`,`${p.cn} 在训练中受伤，预计缺阵 ${p.injury} 天。`,"bad");
      }});
  });
  // 球探进度（先清掉已退役/被删除球员的条目，否则 P(sl.id) 为 undefined 会让推进崩溃）
  WORLD.shortlist=(WORLD.shortlist||[]).filter(sl=>P(sl.id));
  WORLD.shortlist.forEach(sl=>{
    const c=UC(); sl.know=clamp((sl.know||0)+c.scoutRating*0.55+2,0,100);
    const p=P(sl.id); p.scouted = sl.know>=95?2: sl.know>=45?1:0;
  });
}
function isMatchDayFor(cid,d){
  if(cid<0) return false;
  return WORLD.fixtures.some(f=>f.day===d&&(f.home===cid||f.away===cid));
}

// ---------- 每周（周一） ----------
function weeklyTick(){
  // 工资
  WORLD.clubs.forEach(c=>{
    const wages=c.squad.reduce((s,id)=>s+P(id).wage,0);
    addMoney(c,-wages,"周薪支出");
    const spon=Math.round(Math.pow(c.rep,3)*2);
    addMoney(c,spon,"商业赞助");
  });
  // 训练成长
  WORLD.clubs.forEach(c=>trainClub(c));
  // 董事会 & AI 转会
  if(inTransferWindow()) aiTransferRound();
  boardReview();
}

function trainClub(c){
  const focus=TRAIN_FOCUS[c.trainFocus];
  const inten=[0.45,0.75,1,1.28,1.55][c.trainIntensity];
  c.squad.forEach(id=>{
    const p=P(id);
    if(p.injury>18) return;
    const ageF = p.age<=18?1.55: p.age<=20?1.35: p.age<=22?1.12: p.age<=24?0.85: p.age<=26?0.55: p.age<=28?0.30: p.age<=30?0.12:0.03;
    const coachF = 0.55 + c.coachRating*0.055;
    const playF = 0.75 + clamp(p.apps/Math.max(1,c.seasonStats.p||1),0,1.25)*0.45;
    const gap = Math.max(0,p.pa-p.ca);
    let gain = gap*0.0055*ageF*coachF*playF*inten*(0.55+p.a.workrate/22)*(0.7+rnd()*0.7);
    // 老化衰退
    if(p.age>=30) gain -= (p.age-29)*0.055*(1.15-p.a.stamina*0.012);
    if(p.injury>0) gain*=0.25;
    p.dev=(p.dev||0)+gain;
    while(p.dev>=1){ p.dev-=1; bumpAttr(p,focus.a,+1,c); }
    while(p.dev<=-1){ p.dev+=1; bumpAttr(p,null,-1,c); }
    p.value=calcValue(p);
    // 士气自然回归
    p.morale = clamp(p.morale + (p.morale<55?1.5:-0.4) + (p.injury>0?-1.2:0), 5,100);
  });
}
function bumpAttr(p,focusList,dir,club){
  const w=POS_WEIGHTS[p.pos];
  let pool=[];
  if(dir>0){
    for(const k in w) for(let i=0;i<w[k];i++) pool.push(k);
    if(focusList) focusList.forEach(k=>{ for(let i=0;i<7;i++) pool.push(k); });
    if(p.pos==="GK") for(const k in ATTRS_GK) for(let i=0;i<3;i++) pool.push(k);
    pool=pool.filter(k=>p.a[k]<20);
  } else {
    // 衰退优先身体属性
    ["pace","accel","agility","stamina","jumping","strength"].forEach(k=>{ for(let i=0;i<4;i++) pool.push(k); });
    for(const k in w) pool.push(k);
    pool=pool.filter(k=>p.a[k]>1);
  }
  if(!pool.length) return;
  const k=pick(pool);
  p.a[k]=clamp(p.a[k]+dir,1,20);
  const nc=calcCA(p.a,p.pos);
  if(dir>0 && nc>p.pa) { p.a[k]-=dir; return; }
  p.ca=nc;
  if(dir>0 && club && club.id===WORLD.userClub && rnd()<0.06)
    news(`${p.cn} 状态提升`,`训练报告：${p.cn} 的「${ALL_ATTRS[k]}」提升到 ${p.a[k]}。`,"good");
}

function boardReview(){

// ---------- 转会 ----------
function inTransferWindow(){
  const d=WORLD.day;                     // 8/1 起
  const dt=dateOf(d), m=dt.getMonth()+1;
  return m===8 || (m===1);
}
function windowName(){ const m=dateOf(WORLD.day).getMonth()+1; return m===8?"夏窗":m===1?"冬窗":null; }

function wageBill(c){ return c.squad.reduce((s,i)=>s+P(i).wage,0)*52; }
function askingPrice(p){
  const c=p.clubId>=0?C(p.clubId):null;
  let base=p.value;
  if(!c) return Math.round(base*0.30/1000)*1000;
  const same=c.squad.map(i=>P(i)).filter(q=>q.pos===p.pos).sort((a,b)=>b.ca-a.ca);
  const isKey = same.indexOf(p)===0;
  let mult = 1.04 + (isKey?0.28:0) + (p.age<24?0.20:0) + c.rep/520;
  const yrs=p.contract-WORLD.season;
  if(yrs<=0) mult*=0.30; else if(yrs===1) mult*=0.66;
  if(p.morale<40) mult*=0.86;
  if(p.injury>20) mult*=0.80;
  return Math.max(5000, Math.round(base*mult/1000)*1000);
}
// 必须是确定性的：报价弹窗里展示的要求，与提交时校验的要求要完全一致
function wageDemand(p, club){
  const w=calcWage(p, club.rep);
  const h=(hashStr(p.id+"|"+club.id+"|"+p.contract)%1000)/1000;
  return Math.round(Math.max(p.wage*1.06, w*(0.95+h*0.35))/50)*50;
}
function squadNeed(club){
  // 返回最薄弱的位置
  let worst=null, ws=1e9;
  SQUAD_TEMPLATE.forEach(([pos,n])=>{
    const arr=club.squad.map(i=>P(i)).filter(p=>p.pos===pos||(p.pos2||[]).includes(pos));
    const s = arr.length? arr.sort((a,b)=>b.ca-a.ca)[0].ca * (arr.length>=n-1?1:0.75) : 0;
    if(s<ws){ws=s;worst=pos;}
  });
  return {pos:worst, cur:ws};
}
function canSell(club,p){
  const same=club.squad.filter(i=>P(i).pos===p.pos);
  return same.length>2;
}
function transferPlayer(pid, toClubId, fee, wage, years){
  const p=P(pid), to=C(toClubId);
  const from = p.clubId>=0? C(p.clubId):null;
  if(from){ from.squad=from.squad.filter(i=>i!==pid); addMoney(from, fee, `出售 ${p.cn}`);
            from.finance.transferBudget+=Math.round(fee*0.7); autoPickLineup(from); }
  else WORLD.freeAgents=WORLD.freeAgents.filter(i=>i!==pid);
  addMoney(to, -fee, `引进 ${p.cn}`);
  to.finance.transferBudget=Math.max(0,to.finance.transferBudget-fee);
  to.squad.push(pid); p.clubId=toClubId; p.wage=wage; p.contract=WORLD.season+years;
  p.morale=clamp(p.morale+8,5,100); p.value=calcValue(p);
  autoPickLineup(to);
  WORLD.transferLog.unshift({d:WORLD.day, s:WORLD.season, pid, name:p.cn, pos:p.pos,
    from:from?from.id:-1, to:toClubId, fee});
  if(WORLD.transferLog.length>200) WORLD.transferLog.length=200;
}
function aiTransferRound(){
  const tries=ri(14,26);
  for(let k=0;k<tries;k++){
    const buyer=WORLD.clubs[Math.floor(rnd()*60)];
    if(buyer.id===WORLD.userClub) continue;
    if(buyer.squad.length>=29) continue;
    const budget=Math.min(buyer.finance.transferBudget, Math.max(0,buyer.finance.balance)+Math.pow(buyer.rep,3)*25);
    if(budget<50000) continue;
    const need=squadNeed(buyer);
    const pool=Object.values(WORLD.players).filter(p=>
        p.clubId!==buyer.id && p.injury<=25 && p.age<34 &&
        (p.pos===need.pos||(p.pos2||[]).includes(need.pos)) &&
        p.ca>need.cur+5 && p.ca < buyer.rep*2.05+42);
    const afford=pool.filter(p=>{
        if(p.clubId===WORLD.userClub) return false;
        const seller=p.clubId>=0?C(p.clubId):null;
        if(seller && !canSell(seller,p)) return false;
        if(seller && seller.rep>buyer.rep+11 && rnd()<0.85) return false;
        return askingPrice(p)<=budget; });
    if(!afford.length) continue;
    afford.sort((a,b)=>b.ca-a.ca);
    const tgt=afford[Math.floor(Math.pow(rnd(),1.8)*Math.min(afford.length,12))];
    if(!tgt) continue;
    const fee=askingPrice(tgt);
    const wage=wageDemand(tgt,buyer);
    if(wageBill(buyer)+wage*52 > buyer.finance.wageBudget*1.02) continue;
    transferPlayer(tgt.id, buyer.id, fee, wage, ri(2,5));
  }
  // 自由球员签约
  for(let k=0;k<ri(1,4);k++){
    const buyer=WORLD.clubs[Math.floor(rnd()*60)];
    if(buyer.id===WORLD.userClub||buyer.squad.length>=28) continue;
    const fa=WORLD.freeAgents.filter(i=>P(i)&&P(i).ca>buyer.rep*1.2);
    if(!fa.length) continue;
    const id=pick(fa);
    transferPlayer(id, buyer.id, 0, wageDemand(P(id),buyer), ri(1,3));
  }
  // AI 向用户报价
  const u=UC();
  if(rnd()<(u.squad.map(i=>P(i)).some(p=>p.listed)?0.78:0.42) && u.squad.length>17){
    const star=u.squad.map(i=>P(i)).filter(p=>p.injury<=0).sort((a,b)=>b.ca-a.ca);
    const tgt=star[ri(0,Math.min(9,star.length-1))];
    if(tgt){
      const suitors=WORLD.clubs.filter(c=>c.id!==u.id && c.rep>tgt.ca/2.6
         && Math.min(c.finance.transferBudget, c.finance.balance+Math.pow(c.rep,3)*25) > askingPrice(tgt)*0.85);
      if(suitors.length){
        const b=pick(suitors);
        const offer=Math.round(askingPrice(tgt)*(0.82+rnd()*0.45)/1000)*1000;
        WORLD.offers=WORLD.offers||[];
        if(!WORLD.offers.some(o=>o.pid===tgt.id))
          WORLD.offers.push({pid:tgt.id, club:b.id, fee:offer, day:WORLD.day});
        news(`${b.cn} 报价 ${tgt.cn}`,`${b.cn} 为 ${tgt.cn} 提交了 ${money(offer)} 的转会报价。请到「转会」页面处理，7 天内有效。`,"warn");
      }
    }
  }
}

      c.trophies.push(WORLD.season+" 升入"+LEAGUE_SHORT[mv.tier]);

    mv.relegated.forEach(id=>{ const c=C(id); c.tier=mv.tier+1; c.board.conf=clamp(c.board.conf-42,0,100);
      if(id===WORLD.userClub) news("球队降级",
        `${c.cn} 不幸降入 ${LEAGUE_NAMES[mv.tier+1]}。董事会对此深感失望，你的帅位岌岌可危。`,"bad"); });

      return;
    }
    if(p.contract<=WORLD.season && p.clubId>=0){
      const c=C(p.clubId);
      if(c.id!==WORLD.userClub || rnd()<0.5){
        // AI 自动续约 / 放走
        if(p.ca> c.rep*1.7 && rnd()<0.8){ p.contract=WORLD.season+1+ri(1,4); }
        else { c.squad=c.squad.filter(i=>i!==p.id); p.clubId=-1; WORLD.freeAgents.push(p.id); }

      }
    }
    p.condition=ri(70,92); p.sharp=ri(45,70); p.injury=0; p.susp=0;
    p.value=calcValue(p);
  });
  // AI 补强阵容
  WORLD.clubs.forEach(c=>{
    let guard=0;
    while(c.squad.length<20 && guard++<25){
      const pos=SQUAD_TEMPLATE.find(([ps,n])=>c.squad.filter(i=>P(i).pos===ps).length<n);
      const usePos = pos? pos[0] : pick(POSITIONS);
      const fa=WORLD.freeAgents.filter(i=>P(i).pos===usePos);
      if(fa.length && rnd()<0.6){
        const id=pick(fa); transferPlayer(id, c.id, 0, calcWage(P(id),c.rep), ri(1,3));
      } else {
        const p=makePlayer(clamp(gauss(c.rep*0.9,7),8,95), usePos, ri(18,29), c.id);
        p.wage=calcWage(p,c.rep); p.value=calcValue(p); p.contract=WORLD.season+1+ri(1,4);
        WORLD.players[p.id]=p; c.squad.push(p.id);
      }
    }
  });
  // 控制球员总量：清理长期无球可踢的低水平自由球员
  WORLD.freeAgents = WORLD.freeAgents.filter(id=>{
    const p=P(id); if(!p) return false;
    if(p.ca<42 || p.age>33){ delete WORLD.players[id]; return false; }
    return true;
  });
  // 自由球员市场容量上限，避免逐年膨胀
  WORLD.freeAgents.sort((a,b)=>(P(b).ca+(P(b).pa-P(b).ca)*0.5)-(P(a).ca+(P(a).pa-P(a).ca)*0.5));
  WORLD.freeAgents.splice(150).forEach(id=>{ delete WORLD.players[id]; });
  WORLD.clubs.forEach(c=>{
    while(c.squad.length>30){
      const worst=c.squad.map(i=>P(i)).sort((a,b)=>(a.ca+ (a.pa-a.ca)*0.6)-(b.ca+(b.pa-b.ca)*0.6))[0];
      c.squad=c.squad.filter(i=>i!==worst.id); worst.clubId=-1; WORLD.freeAgents.push(worst.id);
    }
  });
  // 清理关注名单里已不存在的球员（退役 / 自由市场清理）
  WORLD.shortlist=(WORLD.shortlist||[]).filter(sl=>WORLD.players[sl.id]);
  WORLD.season++;
  WORLD.day=0; WORLD.fired=false; WORLD.offers=[];
  WORLD.clubs.forEach(c=>{
    c.finance.income=0; c.finance.expense=0;
    c.finance.transferBudget=Math.round(Math.max(0,c.finance.balance)*0.42 + Math.pow(c.rep,3)*20);
    c.board.conf=clamp(c.board.conf*0.5+45,20,95);
    c.coachRating=clamp(c.coachRating+ri(-1,1),3,20);
    autoPickLineup(c);
  });
  buildSeason();
  setBoardExpectation();
}
function poGame(a,b){
  const sa=teamStrength(C(a))*1.02+gauss(0,9), sb=teamStrength(C(b))+gauss(0,9);

}

  if(WORLD.cup.cur<6 && WORLD.cup.days[WORLD.cup.cur]===day){
    const rem=WORLD.fixtures.filter(f=>f.comp==="C"&&f.day===day&&!f.played);
    if(!rem.length) advanceCupRound();
  }
}

function processDayEnd(day){
  dailyTick();
  const dt=dateOf(day);
  if(dt.getDay()===1) weeklyTick();
  if(dt.getMonth()===2 && dt.getDate()===20 && !WORLD.youthDone){ WORLD.youthDone=true; youthIntake(); }
  // 报价过期
  if(WORLD.offers) WORLD.offers=WORLD.offers.filter(o=>WORLD.day-o.day<7);
}

// 主「继续」入口，返回状态
function advance(){
  if(WORLD.gameOver) return {t:"over"};
  const uf=userFixtureOn(WORLD.day);
  if(uf) return {t:"match", fx:uf};
  simDay(WORLD.day,false);
  processDayEnd(WORLD.day);
  WORLD.day++;
  if(WORLD.day>=SEASON_DAYS || allFixturesDone()){ WORLD.youthDone=false; endSeason(); return {t:"season"}; }
  return {t:"day"};
}
function allFixturesDone(){ return !WORLD.fixtures.some(f=>!f.played); }

// 用户比赛结束后收尾
function finishUserMatch(){
  const M=CURMATCH;
  const fx=WORLD.fixtures.find(f=>f.day===WORLD.day && !f.played && (f.home===M.h&&f.away===M.a));
  if(fx) applyResult(fx,M);
  simDay(WORLD.day,false);
  processDayEnd(WORLD.day);
  WORLD.day++;
  CURMATCH=null;
  if(WORLD.day>=SEASON_DAYS || allFixturesDone()){ WORLD.youthDone=false; endSeason(); return "season"; }
  return "ok";
}

// 快速模拟到某天
function skipTo(targetDay, onStop){
  let guard=0;
  while(WORLD.day<targetDay && guard++<400){
    const r=advance();
    if(r.t!=="day") return r;
  }
  return {t:"day"};
}

// ---------- 表格排序 ----------
function sortTable(rows, key, get){
  if(SORT.k===key) SORT.d*=-1; else {SORT.k=key; SORT.d=-1;}
  return rows;
}
function makeTable(cols, rows, opts){
  opts=opts||{};
  const t=el("table");
  const thead=el("thead"); const tr=el("tr");
  cols.forEach(c=>{
    const th=el("th",c.nos?"nos":"",c.h);
    if(c.cls) th.style.textAlign=c.cls==="num"?"right":c.cls==="ctr"?"center":"left";
    if(!c.nos) th.onclick=()=>{ if(SORT.k===c.k) SORT.d*=-1; else {SORT.k=c.k;SORT.d=c.desc===false?1:-1;} opts.rerender?opts.rerender():render(); };
    if(SORT.k===c.k) th.innerHTML=c.h+(SORT.d<0?" ▾":" ▴");
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb=el("tbody");
  let data=[...rows];
  if(SORT.k){
    const col=cols.find(c=>c.k===SORT.k);
    if(col&&col.v) data.sort((a,b)=>{ const x=col.v(a),y=col.v(b);
      return (typeof x==="string"? x.localeCompare(y): x-y)*SORT.d; });
  }
  data.forEach((r,i)=>{
    const row=el("tr",opts.onRow?"clickable":"");
    cols.forEach(c=>{ const td=el("td",c.cls||"",c.r(r,i)); row.appendChild(td); });
    if(opts.onRow) row.onclick=()=>opts.onRow(r);
    if(opts.rowStyle) opts.rowStyle(row,r,i);
    tb.appendChild(row);
  });
  t.appendChild(tb);
  const wrap=el("div","tw"); wrap.appendChild(t);
  return wrap;
}

        ${attrBlock("身体",ATTRS_PHYS,p,hideAttr)}
      </div>
    </div></div>`;
  let ft="";
  if(own){
    ft=`<button onclick="renewContract(${pid})">续约</button>
        <button onclick="listPlayer(${pid})">挂牌出售</button>
        <button onclick="closeModal()">关闭</button>`;
  } else {
    ft=`<button onclick="toggleShortlist(${pid})">${sl?"取消关注":"加入球探名单"}</button>

        <button onclick="closeModal()">关闭</button>`;
  }
  openModal(esc(p.cn)+' <span class="hint" style="font-weight:400">'+(club?esc(club.cn):"自由球员")+'</span>', h, ft);
}
function paRange(p,know){
  if(know<20) return "未知";
  const w=Math.max(4, Math.round((100-know)/4));
  const lo=clamp(Math.round(p.pa/2)-w,1,99), hi=clamp(Math.round(p.pa/2)+w,1,100);
  return lo+" - "+hi;
}

      const cur=c.lineup.indexOf(p.id);
      if(cur>=0){ const tmp=c.lineup[SELSLOT]; c.lineup[SELSLOT]=p.id; c.lineup[cur]=tmp; }
      else { const outId=c.lineup[SELSLOT]; c.lineup[SELSLOT]=p.id;

  const off=$("#offs"); if(off) off.onchange=e=>c.tactic.offside=e.target.checked;
  const cnt=$("#cntr"); if(cnt) cnt.onchange=e=>c.tactic.counter=e.target.checked;
}

    <div><label>最低能力 ${TFILTER.minCa||"不限"}</label><input id="f-ca" type="range" min="0" max="100" value="${TFILTER.minCa}" style="width:110px"></div>
    <div><label>最大年龄 ${TFILTER.maxAge}</label><input id="f-age" type="range" min="16" max="40" value="${TFILTER.maxAge}" style="width:100px"></div>
    <div><label>姓名</label><input id="f-q" type="text" value="${esc(TFILTER.q)}" style="width:110px" placeholder="搜索…"></div>`;
  s.appendChild(f);

  let pool=Object.values(WORLD.players).filter(p=>p.clubId!==WORLD.userClub);
  if(TFILTER.pos) pool=pool.filter(p=>p.pos===TFILTER.pos||p.pos2.includes(TFILTER.pos));
  if(TFILTER.tier==="fa") pool=pool.filter(p=>p.clubId<0);
  else if(TFILTER.tier!=="") pool=pool.filter(p=>p.clubId>=0&&C(p.clubId).tier==TFILTER.tier);
  if(TFILTER.minCa) pool=pool.filter(p=>ovr(p)>=TFILTER.minCa);
  pool=pool.filter(p=>p.age<=TFILTER.maxAge);
  if(TFILTER.maxFee) pool=pool.filter(p=>askingPrice(p)<=TFILTER.maxFee);
  if(TFILTER.q) pool=pool.filter(p=>p.cn.includes(TFILTER.q)||p.name.toLowerCase().includes(TFILTER.q.toLowerCase()));

    {h:"姓名",k:"n",v:p=>p.cn,r:p=>esc(p.cn)},

    {h:"位置",k:"pos",v:p=>POSITIONS.indexOf(p.pos),r:p=>`<span class="tag t-${POS_GRP[p.pos]}">${POS_CN[p.pos]}</span>`},
    {h:"年龄",k:"age",cls:"num",v:p=>p.age,r:p=>p.age},

    {h:"进球",k:"g",cls:"num",v:p=>p.goals,r:p=>p.goals},
    {h:"评分",k:"rt",cls:"num",v:p=>p.apps?p.ratingSum/p.apps:0,r:p=>avgRating(p)},
    {h:"周薪",k:"w",cls:"num",v:p=>p.wage,r:p=>money(p.wage)},
