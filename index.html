/* ---------- 存储自检：丢档时用它定位到底哪一层挂了 ---------- */
async function storageSelfTest(onStep){
  const R=[], log=(name,ok,msg)=>{ R.push({name,ok,msg:msg||""}); if(onStep) onStep(R); };
  const MB=n=>"x".repeat(Math.round(n*1048576));
  let mode="浏览器标签页";
  try{ if(window.matchMedia && (matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches)) mode="桌面快捷方式/PWA 启动"; }catch(e){}
  log("环境",true,`${location.protocol}//${location.host||"本地文件"}　${window.isSecureContext===false?"非安全上下文":"安全上下文"}　${mode}`);
  log("浏览器",true,navigator.userAgent);

  try{
    localStorage.setItem("__fmprobe","1"); localStorage.removeItem("__fmprobe");
    let best=0;
    for(const m of [0.25,0.5,1,2,4,8]){ try{ localStorage.setItem("__fmprobe",MB(m)); best=m; }catch(e){ break; } }
    try{ localStorage.removeItem("__fmprobe"); }catch(e){}
    log("localStorage",true,`可写，单条最大约 ${best>=8?"≥8":best} MB`);
  }catch(e){ log("localStorage",false,"不可写："+((e&&e.message)||e)); }

  if(!window.indexedDB) log("IndexedDB",false,"内核不提供 indexedDB");
  else{ try{ const big=MB(1); await idbSet("__fmprobe",big); const back=await idbGet("__fmprobe");
      try{ await idbDel("__fmprobe"); }catch(e){}
      log("IndexedDB",back===big,back===big?"写入 1MB 并读回一致":"写入后读回不一致或为空");
    }catch(e){ log("IndexedDB",false,"失败："+((e&&e.message)||e)); } }

  if(typeof caches==="undefined") log("Cache Storage",false,"内核不提供 caches");
  else if(window.isSecureContext===false) log("Cache Storage",false,"非安全上下文，不可用");
  else{ try{ const big=MB(1); await cacheSet("__fmprobe",big); const back=await cacheGet("__fmprobe");
      try{ await cacheDel("__fmprobe"); }catch(e){}
      log("Cache Storage",back===big,back===big?"写入 1MB 并读回一致":"写入后读回不一致或为空");
    }catch(e){ log("Cache Storage",false,"失败："+((e&&e.message)||e)); } }

  { const st=Z_FMTS.map(([h,f])=>f+(zFmtOK(f)?" ✓":" ✗")).join("，");
    log("存档压缩",CAN_Z,CAN_Z?`使用 ${Z_USABLE[0][1]}（${st}）`:`都不支持（${st}），存档按原文落盘（体积约大 8 倍）`); }

  try{
    if(navigator.storage&&navigator.storage.estimate){
      const es=await navigator.storage.estimate();
      let ps=null; try{ if(navigator.storage.persisted) ps=await navigator.storage.persisted(); }catch(e){}
      log("配额",true,`已用 ${(es.usage/1048576).toFixed(1)} MB，上限 ${(es.quota/1048576).toFixed(0)} MB`
        +(ps===null?"":`　持久化：${ps?"已授予（系统不会随手清）":"未授予（系统紧张时可能清掉）"}`));
    } else log("配额",true,"内核不提供 storage.estimate");
  }catch(e){ log("配额",false,String((e&&e.message)||e)); }

  try{ if(typeof caches!=="undefined"){ const ks=await caches.keys();
      log("浏览器缓存桶",ks.indexOf(CACHE_NS)>=0,ks.length?ks.join("、"):"（空）"); } }catch(e){}
  try{ const fp=await readFP();
    log("存档指纹",!!fp,fp?`${fp.club||"?"} 第 ${fp.day} 天，${new Date(fp.at).toLocaleString()}`:"没有——本机从未成功保存过"); }catch(e){}

  const where=[],mw=[];
  try{ if(await idbGet(SAVEKEY)) where.push("IndexedDB"); }catch(e){}
  try{ if(await cacheGet(SAVEKEY)) where.push("Cache"); }catch(e){}
  try{ if(localStorage.getItem(SAVEKEY)) where.push("localStorage"); }catch(e){}
  try{ if(localStorage.getItem(METAKEY)) mw.push("localStorage"); }catch(e){}
  try{ if(await idbGet(METAKEY)) mw.push("IndexedDB"); }catch(e){}
  try{ if(await cacheGet(METAKEY)) mw.push("Cache"); }catch(e){}
  log("存档正文",where.length>0,where.length?"存在于 "+where.join("、"):"三层都没有");
  log("存档索引",mw.length>0,mw.length?"存在于 "+mw.join("、"):"三层都没有");
  return R;
}

  a.appendChild(el("div","hr")); a.appendChild(b1); a.appendChild(b2); a.appendChild(b3);
  g.appendChild(a);

  const c2=el("div","card"); c2.innerHTML="<h3>文件存档</h3><div class='hint'>导出为 .json 文件，可在任何设备导入继续游戏</div><div class='hr'></div>";
  const e1=el("button","","导出存档文件"); e1.onclick=()=>exportSave();
  const inp=el("input"); inp.type="file"; inp.accept=".json"; inp.style.display="none";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return;

  const e2=el("button","","导入存档文件"); e2.style.marginLeft="8px"; e2.onclick=()=>inp.click();

      : "全屏模式下没有浏览器刷新按钮。如果怀疑用的是旧版本，可在此强制拉取最新版（会先清空离线缓存）。"}</div>
    <div class="hr"></div>`;
  const ub=el("button", UPDATE_READY?"pri":"", UPDATE_READY?"应用更新并重新载入":"检查更新 / 强制刷新");

function saveGame(){
  const s=JSON.stringify(WORLD);
  storeSave(s,{club:UC().cn,season:WORLD.season,day:WORLD.day})
    .then(()=>{ AUTOSAVE_DAY=WORLD.day; LAST_SAVE_AT=new Date(); SAVE_DIRTY=false; toast(`已保存（${(s.length/1048576).toFixed(2)} MB）`); if(VIEW==="save") render(); })
    .catch(err=>toast("保存失败："+((err&&err.message)||"浏览器存储不可用")+"，请改用导出文件","bad"));
}
function loadGame(){
  readSave().then(s=>{
    if(!s){ toast("没有找到存档","bad"); return; }
    try{ adoptWorld(JSON.parse(s)); render(); toast("存档已载入"); }
    catch(e){ toast(loadErrMsg(e),"bad"); return; }
    healSave().then(fx=>{ if(fx.length) toast("已把存档补写回 "+fx.join("、")); }).catch(()=>{});
  }).catch(()=>toast("读取失败","bad"));
}
function exportSave(){
  const blob=new Blob([JSON.stringify(WORLD)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`足球经理_${UC().short}_${WORLD.season}_第${WORLD.day}天.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("存档文件已导出");
}

/* ---------- 自动保存：任何操作后 1.5 秒内落盘 ----------

   等结算后再存。切后台 / 关页面时如果还有未落盘的改动，立刻同步写一次。 */
let SAVE_DIRTY=false, SAVE_TIMER=null, LAST_SAVE_AT=null, SAVE_INFLIGHT=false;
function markDirty(){
  if(!WORLD||!WORLD.clubs) return;
  SAVE_DIRTY=true;
  clearTimeout(SAVE_TIMER); SAVE_TIMER=setTimeout(flushAutosave,1500);
}
function flushAutosave(force){
  if(!SAVE_DIRTY||!WORLD||!WORLD.clubs) return;
  if(CURMATCH && !CURMATCH.done && !force){ clearTimeout(SAVE_TIMER); SAVE_TIMER=setTimeout(flushAutosave,3000); return; }
  if(SAVE_INFLIGHT && !force){ clearTimeout(SAVE_TIMER); SAVE_TIMER=setTimeout(flushAutosave,1000); return; }
  SAVE_DIRTY=false; SAVE_INFLIGHT=true;
  try{
    const s=JSON.stringify(WORLD);
    storeSave(s,{club:UC().cn,season:WORLD.season,day:WORLD.day,auto:1})
      .then(()=>{ SAVE_FAILS=0; SAVE_ERR=""; LAST_SAVE_AT=new Date(); AUTOSAVE_DAY=WORLD.day;
        const el=document.getElementById("save-status"); if(el) el.textContent=saveStatusText(); })
      .catch(err=>{ SAVE_DIRTY=true; SAVE_FAILS++; SAVE_ERR=(err&&err.message)||String(err);
        const el=document.getElementById("save-status"); if(el) el.textContent=saveStatusText();
        if(SAVE_FAILS===2 || SAVE_FAILS%15===0)
          toast("自动保存失败，进度不会被保留！请到「存档」页导出存档文件","bad"); })
      .then(()=>{ SAVE_INFLIGHT=false; });
  }catch(e){ SAVE_INFLIGHT=false; SAVE_DIRTY=true; }
}
function saveStatusText(){
  if(SAVE_FAILS>0) return `⚠ 连续 ${SAVE_FAILS} 次保存失败${SAVE_ERR?"："+SAVE_ERR:""}——请立刻导出存档文件`;
  if(!LAST_SAVE_AT) return SAVE_DIRTY? "有未保存的改动，稍后自动保存…" : "本局尚未自动保存";
  const d=LAST_SAVE_AT;
  return `上次自动保存 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`
    +(STORE_TIER?`（${STORE_TIER}）`:"")+(SAVE_DIRTY?"　有新改动待保存":"");
}

const MENU_WAIT=1500;
function within(p,ms){ return Promise.race([p.then(v=>({v}),()=>({v:null})), new Promise(r=>setTimeout(()=>r(null),ms))]); }
async function startMenu(){
  const metaP=readMeta().catch(()=>saveMeta());
  const r=await within(metaP, MENU_WAIT);
  if(r && r.v) return saveMenu(r.v);
  if(r){                                   // 各层都答了：没有存档
    const f=await within(readFP(), 800);
    if(f && f.v) return wipedScreen(f.v);  // 曾经存过档但被清了 → 说清楚，别默默开新局
    newGameScreen();
    if(!f) readFP().then(fp=>{ if(fp && !WORLD && !STARTING) wipedScreen(fp); }).catch(()=>{});
    return;
  }
  // 超时：先让他选队，存储层慢慢答
  newGameScreen();
  metaP.then(m=>{ if(m && !WORLD && !STARTING){ saveMenu(m); toast("找到了之前的存档"); } }).catch(()=>{});
}

let REAL_DATA_P=null;
function ensureRealData(){

    const sc=document.createElement("script"); sc.src=REAL_DATA_URL; sc.async=true;
    sc.onload=()=>{ if(Object.keys(REAL_ROSTERS).length) res(); else { REAL_DATA_P=null; rej(new Error("empty")); } };
    sc.onerror=()=>{ REAL_DATA_P=null; sc.remove(); rej(new Error("球员数据下载失败")); };
    document.head.appendChild(sc);
  });
  return REAL_DATA_P;
}

/* ---------- PWA：可安装 + 离线 ---------- */
let UPDATE_READY=false;
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  if(!/^https?:$/.test(location.protocol)) return;   // file:// 下跳过
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        // 已有旧版本在跑，且新版本装好了 → 提示而不是直接刷新，避免冲掉未保存的进度
        if(nw.state==="installed" && hadController && !UPDATE_READY){
          UPDATE_READY=true;
          toast("已下载新版本：请先保存进度，再到「存档」页点『应用更新』","warn");
          if(VIEW==="save") render();
        }
      });
    });
    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});
}
// 全屏模式下没有地址栏也没有下拉刷新，这里提供手动更新出口
function applyUpdate(){
  if(!("serviceWorker" in navigator)){ location.reload(); return; }
  navigator.serviceWorker.getRegistrations()
    .then(rs=>Promise.all(rs.map(r=>r.unregister())))
    .then(()=>caches.keys().then(ks=>Promise.all(
        ks.filter(k=>k!==CACHE_NS).map(k=>caches.delete(k)))))   // 只清资源缓存，存档桶必须留着
    .catch(()=>{})
    .then(()=>location.reload(true));
}
// 离线可用提示（仅首次）
function offlineHint(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    if(localStorage.getItem("fmweb_pwa_hint")) return;
    localStorage.setItem("fmweb_pwa_hint","1");
    setTimeout(()=>toast("提示：可把本页「添加到主屏幕」，之后断网也能玩"),2200);
  }catch(e){}
}

/* ---------- 移动端手势：彻底关掉缩放 ---------- */
function lockZoom(){
  // iOS Safari 会忽略 user-scalable=no，需拦截 gesture 事件
  ["gesturestart","gesturechange","gestureend"].forEach(t=>
    document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
  // 双指 touchmove 兜底（不影响单指滚动）
  document.addEventListener("touchmove", e=>{
    if(e.touches && e.touches.length>1) e.preventDefault();
  }, {passive:false});
  // 万一被浏览器缩放过，切回前台时复位
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden && window.visualViewport && window.visualViewport.scale>1.01)
      window.scrollTo(0,0);
  });
}

// 屏幕旋转：等布局稳定后重绘一次，避免残留滚动偏移与半旧布局
let _oriT=0, _oriLast="";
// 兜底：个别机型 fixed 仍比可视高度矮时，按 innerHeight 撑满（只撑大不缩小）
function fitAppHeight(){
  const a=document.getElementById("app"); if(!a) return;
  a.style.height=""; a.style.bottom="";
  const h=window.innerHeight;
  if(h && h>a.clientHeight+1){ a.style.bottom="auto"; a.style.height=h+"px"; }
}
function isTextInput(e){
  return !!e && (e.tagName==="TEXTAREA" || e.isContentEditable ||
    (e.tagName==="INPUT" && !/^(checkbox|radio|range|button|submit|reset|color|file|hidden)$/i.test(e.type||"")));
}
// 聚焦输入框时若当前不是横屏布局，就锁住竖屏布局，键盘把视口压扁也不切换
function kbGuard(){
  const mq="(max-height:520px) and (orientation:landscape)", R=document.documentElement;
  document.addEventListener("focusin",e=>{
    if(isTextInput(e.target) && !(window.matchMedia && matchMedia(mq).matches)) R.classList.add("kb"); });
  document.addEventListener("focusout",()=>{
    setTimeout(()=>{ if(!isTextInput(document.activeElement)) R.classList.remove("kb"); },120); });
}
function watchOrientation(){
  kbGuard();
  fitAppHeight(); setTimeout(fitAppHeight,400);
  window.addEventListener("resize",()=>setTimeout(fitAppHeight,80));
  // 不能用 innerWidth>innerHeight：安卓/鸿蒙弹出键盘会把视口压扁，被当成横屏 → 重绘 → 输入框被销毁、键盘收起、页面跳回顶部
  const key=()=>{
    try{ if(screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf("landscape")===0?"L":"P"; }catch(e){}
    if(typeof window.orientation==="number") return Math.abs(window.orientation)===90?"L":"P";
    return innerWidth>innerHeight?"L":"P";
  };
  _oriLast=key();
  const on=()=>{
    if(isTextInput(document.activeElement)) return;     // 正在打字（键盘弹出引起的 resize）
    if(key()===_oriLast) return;
    _oriLast=key();
    clearTimeout(_oriT);
    _oriT=setTimeout(()=>{
      const s=document.getElementById("side"); if(s){ s.scrollLeft=0; s.scrollTop=0; }
      const v=document.getElementById("view"); if(v) v.scrollTop=0;
      try{ render(); }catch(e){}
    },260);
  };
  window.addEventListener("orientationchange",on);
  window.addEventListener("resize",on);
}

let _errShown=0;
window.addEventListener("error",e=>{ if(_errShown++<3){ try{ toast("脚本错误："+(e.message||e)+" @"+(e.lineno||"?"),"bad"); }catch(_){} } });
window.addEventListener("unhandledrejection",e=>{ if(_errShown++<3){ try{ toast("脚本错误："+((e.reason&&e.reason.message)||e.reason),"bad"); }catch(_){} } });
window.addEventListener("DOMContentLoaded",()=>{
  lockZoom();
  watchOrientation();
  registerSW();
  loadCustomCrests();
  document.getElementById("tb-go").onclick=onContinue;
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeModal();
    if(e.code==="Space" && VIEW==="match" && CURMATCH && !CURMATCH.done){ e.preventDefault(); toggleplay(); }
    if(e.key==="Enter" && !$("#modal").classList.contains("on")
       && (VIEW!=="match" || (CURMATCH && CURMATCH.done))) onContinue();
  });
  // 申请持久化存储：能显著降低系统在存储紧张时清掉存档的概率（鸿蒙/iOS 尤其有用）
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  setTimeout(()=>{ Promise.resolve(startMenu()).catch(e=>{ try{toast("读取存档出错："+((e&&e.message)||e),"bad");}catch(_){} newGameScreen(); }); offlineHint(); },20);
  setTimeout(prefetchAssets, 2500);         // 菜单出来以后再在后台补齐队徽和球员数据
});

/* ---------- 调试/测试桥接（顶层 let 绑定不会自动挂到 window） ---------- */
Object.defineProperties(window,{
  WORLD:{get:()=>WORLD, set:v=>{WORLD=v;}, configurable:true},
  CURMATCH:{get:()=>CURMATCH, set:v=>{CURMATCH=v;}, configurable:true},
  ANIM:{get:()=>ANIM, set:v=>{ANIM=v;}, configurable:true},
  VIEW:{get:()=>VIEW, set:v=>{VIEW=v;}, configurable:true}
});
</script>
