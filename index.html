}

// ---------- 超级妖人 ----------
function makeWonderkid(clubId){
  const pos=pick(POSITIONS);
  const p=makePlayer(clamp(gauss(46,8),34,60), pos, ri(16,18), clubId);
  p.pa=clamp(Math.max(p.pa, ri(150,178)), p.ca+40, 200);   // 显示潜力 75~89，压在传奇之下
  p.wonderkid=true;
  if(clubId>=0){
    const c=C(clubId);
    p.wage=Math.max(300,Math.round(calcWage(p,c.rep,c)*0.5/50)*50);
    p.contract=WORLD.season+ri(2,4);
    WORLD.players[p.id]=p; c.squad.push(p.id);
  }else{
    p.wage=marketWage(p); p.contract=WORLD.season;
    WORLD.players[p.id]=p; WORLD.freeAgents.push(p.id);
  }
  p.value=calcValue(p);
  return p;
}
function spawnWonderkids(n){
  const arr=[];
  for(let i=0;i<n;i++){
    const cands=WORLD.clubs.filter(x=>x.squad.length<34);
    if(!cands.length) break;
    // 好苗子更可能出在青训体系强、声望高的队，而不是均匀撒
    const host=pickW(cands, cands.map(x=>Math.pow(x.youthRating*1.4+x.rep*0.5,1.8)));
    arr.push(makeWonderkid((host||pick(cands)).id));
  }
  if(arr.length){
    const txt=arr.map(p=>`${p.cn}（${POS_CN[p.pos]}，${p.age}岁，${p.clubId>=0?C(p.clubId).cn:"自由身"}）`).join("、");
    news("球探圈热议：天才少年横空出世",
      `球探圈盛传新一代妖人已崭露头角：${txt}。这类球员成长上限极高，尽早加入球探名单摸清潜力，抢在豪门之前下手。`,"good");
  }
  return arr;
}

const LEG_MAP=[["pace","accel"],["finishing","longshot","composure"],["passing","vision","crossing","setpiece"],
  ["dribbling","technique","agility","flair"],["tackling","marking","positioning","heading"],["strength","stamina","jumping","aggression"]];
const LEG_MAP_GK=[["reflex"],["handling"],["gkkick"],["reflex","oneonone"],["pace","accel"],["command","positioning"]];
function makeLegendYouth(clubId, ageMin, ageMax){
  const used=WORLD.legendsUsed||(WORLD.legendsUsed=[]);
  const pool=LEGENDS.filter(r=>!used.includes(r[0]));
  if(!pool.length) return null;
  const L=pick(pool); used.push(L[0]);
  const [en,cn,natCn,pos,ovr,born,height,v]=L;
  const age=ri(ageMin,ageMax);
  const pa=Math.min(200,ovr*2);
  // 青年时代：当前能力约为巅峰的 33%~42%，年长一岁略高一点
  const lvl=clamp(Math.round(pa*(0.33+rnd()*0.09)+(age-16)*3),40,110);
  const p=makePlayer(lvl,pos,age,clubId);
  const maps=pos==="GK"? LEG_MAP_GK : LEG_MAP;
  maps.forEach((keys,i)=>{ const f=clamp(v[i]/ovr,0.45,1.1);
    keys.forEach(k=>{ p.a[k]=clamp(Math.round(p.a[k]*(0.55+f*0.6)),1,20); }); });
  fitAttrsToOverall(p.a,pos,lvl);
  p.ca=calcCA(p.a,pos); p.ca0=p.ca;   // 属性被重写过，成长基准要跟着走
  p.pa=clamp(Math.max(pa+ri(2,10), p.ca+55), p.ca+55, 200);   // 传奇必须是潜力天花板
  const parts=cn.split("·");
  p.name=en; p.first=parts.length>1?parts[0]:""; p.last=parts[parts.length-1]; p.cn=cn; p.nat=natCn;
  p.legend=true; p.prof=genProfLegend(); p.pos2=[]; const near=POS_NEAR[pos]||[]; if(near.length) p.pos2=[pick(near)];
  return p;
}
function spawnLegendYouths(){
  const n=(rnd()<0.6?1:0)+(rnd()<0.25?1:0);
  for(let i=0;i<n;i++){
    const cands=WORLD.clubs.filter(x=>x.squad.length<34);
    if(!cands.length) return;
    const uc=cands.find(x=>x.id===WORLD.userClub);
    const c=(uc&&rnd()<0.18)? uc : pick(cands);
    const p=makeLegendYouth(c.id,16,17); if(!p) return;
    p.homegrown=true; p.wage=Math.max(250,Math.round(calcWage(p,c.rep,c)*0.35/50)*50); p.contract=WORLD.season+3;
    WORLD.players[p.id]=p; c.squad.push(p.id); p.value=calcValue(p);
    if(c.id===WORLD.userClub)
      news("青训营的惊喜",`青训主管特别提到一名叫 ${p.cn}（${POS_CN[p.pos]}，${p.age}岁，${p.nat}）的少年："我从没见过这样的天赋。"`,"good");
  }
}

function youthIntake(){
  WORLD.clubs.forEach(c=>{
    const n=ri(3,6);
    const arr=[];
    for(let i=0;i<n;i++){
      const lvl=clamp(gauss(c.youthRating*2.0+c.rep*0.28, 7),6,62);
      const pos=pick(POSITIONS);
      const p=makePlayer(lvl,pos,ri(16,17),c.id);
      // 右偏：rnd^2.3 让绝大多数苗子只加 20~40，出一个高潜力才是真事件
      const bonus = 20 + Math.pow(rnd(),2.3)*85 + c.youthRating*1.2;
      const capPA = 108 + c.youthRating*3.4;   // 20 级青训营天花板 176(≈88)，8 级只有 135(≈67)
      p.pa=clamp(Math.round(p.ca+bonus), p.ca, Math.min(200, Math.round(capPA)));
      p.homegrown=true; p.wage=Math.max(250,Math.round(calcWage(p,c.rep,c)*0.35/50)*50);
      p.contract=WORLD.season+3;
      WORLD.players[p.id]=p; c.squad.push(p.id); arr.push(p);
    }
    if(c.id===WORLD.userClub){
      const best=arr.reduce((a,b)=>b.pa>a.pa?b:a);
      news("青年球员入队",`本赛季青训营送来 ${n} 名年轻球员。青训主管认为 ${best.cn}（${POS_CN[best.pos]}，${best.age}岁）最具潜力。`,"good");
    }
  });
  spawnLegendYouths();
  spawnWonderkids(ri(1,2));
  ensureAllNumbers();                        // 新苗子（含妖人/传奇）发号
  /* v37：青训与妖人是被动入队，工资直接走 avail，可能把队推过 cap。
     canAfford 的规则 2 只拦主动签约，不管这个。 */
}

// ---------- 赛季结算 ----------
/* AI 续约决策。旧写法 `p.ca > c.rep*1.7` 把 CA(0~200) 和 rep(0~100) 两个量纲混在一起，
   变成一个绝对阈值：rep94 的豪门阈值 CA162，队内一半主力够不着就被白白放走；
   rep45 的中游队阈值 77 也高于队内 CA 中位 68。改成看他在本队的地位。 */
// 队内中位 CA。凡是「这人配不配得上这支队」的判断都用它，不要再拿 rep 乘个系数当 CA 门槛
function squadMedCA(c){
  const a=c.squad.map(i=>P(i)).filter(q=>q).map(q=>q.ca).sort((x,y)=>x-y);
  return a.length? a[a.length>>1] : 0;
}
function aiRenewDecide(c, p){
  const mates=c.squad.map(i=>P(i)).filter(q=>q && q.id!==p.id);
  const better=mates.filter(q=>q.ca>p.ca).length;                     // 队内比他强的人数
  const samePos=mates.filter(q=>q.pos===p.pos && q.ca>p.ca).length;   // 同位置比他强的人数
  const prospect = p.age<=23 && p.pa-p.ca>=20;
  let pr;
  if(samePos===0 || better<11) pr=0.92;        // 同位置第一 / 队内前 11：主力
  else if(prospect)            pr=0.85;        // 潜力股不看现在的能力
  else if(better<18)           pr=0.70;        // 轮换
  else                         pr=0.15;        // 边缘人
  if(p.age>=34)      pr=Math.min(pr,0.15);
  else if(p.age>=32) pr*=0.7;
  if(p.morale<35) pr*=0.8;
  if((p.unrest||0)>=2) pr*=0.5;
  if(rnd()>=pr) return false;
  // 钱：新合同要占得下工资空间（只算涨薪的增量，他现在的工资已经在 wageBill 里）。
  // 占不下就是真的「续不起」——这才是有据可查的少数情况。
  const want=Math.max(p.wage, calcWage(p,c.rep,c));
  const extra=(want-p.wage)*52;
  /* 同 doRenew：提前续约（contract > season）算增量，到期续约（contract <= season）算全额。
     前者原薪免检没问题，后者免检就等于每季把到期的人白送回下季承诺。*/
  const capAn=(p.contract>WORLD.season? extra : want*52);
  if(extra<=0 && capAn<=0) return true;
  return canAfford(c, 0, extra, {capAnnual:capAn}).ok;
}
// 提前续约：合同只剩 1 年的先谈掉，别让所有合同都跑到零再赌一次闸门
function aiExtendContracts(){
  WORLD.clubs.forEach(c=>{
    if(c.id===WORLD.userClub) return;
    c.squad.slice().forEach(i=>{
      const p=P(i); if(!p || p.loan) return;
      // 剩 1 年的重点谈，剩 2 年的偶尔提前锁定——顺便把建世界时扎堆的合同年限摊开，
      // 否则开局第 3 季会有一波集体到期（实测 24% 的合同同时到期）
      const left=p.contract-WORLD.season;
      if(left!==1 && left!==2) return;
      if(rnd() >= (left===1? 0.55 : 0.22)) return;
      if(!aiRenewDecide(c,p)) return;
      p.contract=WORLD.season+ri(3,5);
      p.wage=Math.max(p.wage, calcWage(p,c.rep,c));
    });
  });
}
function endSeason(){
  processLoanExpiry(true);                     // 外租球员先全部归队，再处理合同到期 / 退役
  const summary={season:WORLD.season, leagues:[], cups:WORLD.cups.map(c=>c.winner),
                 euro:{CL:WORLD.euro?WORLD.euro.CL.winner:null, EL:WORLD.euro?WORLD.euro.EL.winner:null}};
  const allP=Object.values(WORLD.players).filter(p=>p.apps>0);
  summary.topScorers=allP.slice().sort((a,b)=>b.goals-a.goals||b.assists-a.assists).slice(0,10)
    .map(p=>({n:p.cn,c:p.clubId>=0?C(p.clubId).short:"-",g:p.goals,a:p.assists,ap:p.apps}));
  summary.topRated=allP.filter(p=>p.apps>=15).sort((a,b)=>b.ratingSum/b.apps-a.ratingSum/a.apps).slice(0,10)
    .map(p=>({n:p.cn,c:p.clubId>=0?C(p.clubId).short:"-",r:(p.ratingSum/p.apps).toFixed(2),ap:p.apps}));
  const tables={};
  WORLD.leagues.forEach(lg=>{
    const t=leagueTable(lg.lg); tables[lg.lg]=t;
    summary.leagues.push({lg:lg.lg, nation:lg.nation, tier:lg.tier, table:t.map(r=>({id:r.id,pts:r.pts,gd:r.gd,rank:r.rank}))});
    const champ=C(t[0].id); champ.trophies.push(WORLD.season+" "+lg.name);
    const n=t.length;
    t.forEach(r=>{
      const c=C(r.id);
      const [hi,lo]=lg.prize;
      const money0=Math.round(lo*0.5+(hi-lo)*(n-r.rank)/(n-1));      // 保底部分的另一半已在赛季中按月发放（weeklyTick）
      addMoney(c, money0, `${lg.short}第${r.rank}名奖金/转播分成`);
      c.lastRank=r.rank; c.lastLg=lg.lg;
    });
  });
  // 只打欧战的其他欧洲球队：按声望折算其本国联赛的奖金与转播收入
  WORLD.clubs.filter(c=>c.nation===EURO_NATION).forEach(c=>addMoney(c, Math.round(Math.pow(c.rep,3)*EURO_TV_K), `${c.country||"本国"}联赛奖金/转播分成`));
  // ---- 下赛季欧战资格（按各国顶级联赛排名 + 杯赛冠军）----
  const qual={CL:[],EL:[]};
  NATIONS.forEach((nat,ni)=>{
    const t=tables[lgIndex(ni,0)]; if(!t) return;
    const ids=t.map(r=>r.id);
    qual.CL.push(...ids.slice(0,nat.cl));
    const el=ids.slice(nat.cl, nat.cl+nat.el);
    const cupW=WORLD.cups[ni].winner;
    if(cupW!=null && C(cupW).nation===ni && !qual.CL.includes(cupW) && !el.includes(cupW)) el.push(cupW);
    else el.push(ids[nat.cl+nat.el]);           // 杯赛冠军已获资格 → 名额顺延给联赛下一名
    qual.EL.push(...el.filter(x=>x!=null));
  });
  WORLD.euroQual=qual;
  // ---- 升降级：2 队直升 + 附加赛。英西意 3 队直降；德法 2 队直降，第 16 名打附加赛 ----
  const moves=[];
  NATIONS.forEach((nat,ni)=>{
    for(let tier=0;tier<nat.tiers.length-1;tier++){
      const upper=tables[lgIndex(ni,tier)], lower=tables[lgIndex(ni,tier+1)];
      const promoted=[lower[0].id, lower[1].id];
      const PO=(WORLD.playoffs||[]).find(p=>p.nation===ni && p.tier===tier);
      let relegated, win;
      if(PO && PO.done && PO.winner!=null){
        win=PO.winner;
        if(poHasUpper(PO.fmt)){
          relegated=upper.slice(-2).map(r=>r.id);
          if(win!==PO.up16){ promoted.push(win); relegated.push(PO.up16); }
        } else { promoted.push(win); relegated=upper.slice(-3).map(r=>r.id); }
        // 附加赛没升上去的：打进来本身也算交差
        Object.keys(PO.seed).map(Number).forEach(id=>{
          if(promoted.includes(id) || id===PO.up16) return;
          const inFinal=PO.rounds.length && PO.rounds[PO.rounds.length-1].ties.some(t=>t.a===id||t.b===id);
          C(id).board.conf=clamp(C(id).board.conf+(inFinal?10:5),0,100);
        });
        if(PO.up16!=null && win===PO.up16) C(PO.up16).board.conf=clamp(C(PO.up16).board.conf+8,0,100);
      } else {
        // 兜底（附加赛没打完就结算，比如老存档恰好卡在赛季末）：按阵容实力模拟
        const po=[lower[2].id,lower[3].id,lower[4].id,lower[5].id];
        const s1=poGame(po[0],po[3]), s2=poGame(po[1],po[2]);
        win=poGame(s1,s2); promoted.push(win);
        relegated=upper.slice(-3).map(r=>r.id);
      }
      moves.push({nation:ni, tier, promoted, relegated, poWin:win});
    }
  });
  summary.playoffs=(WORLD.playoffs||[]).map(p=>({nation:p.nation,tier:p.tier,name:p.name,winner:p.winner,up16:p.up16,skip:p.skip}));
  moves.forEach(mv=>{
    const upName=NATIONS[mv.nation].tiers[mv.tier], downName=NATIONS[mv.nation].tiers[mv.tier+1];
    mv.promoted.forEach(id=>{ const c=C(id); c.tier=mv.tier; c.lg=upName.lg; c.board.conf=clamp(c.board.conf+28,0,100);
      c.trophies.push(WORLD.season+" 升入"+upName.short);
      if(id===WORLD.userClub) news("升级成功！",
        `${c.cn} 成功升入 ${upName.name}！董事会对你的工作非常满意，下赛季的预算也将大幅提升。`,"good"); });
    mv.relegated.forEach(id=>{ const c=C(id); c.tier=mv.tier+1; c.lg=downName.lg; c.board.conf=clamp(c.board.conf-42,0,100);
      if(id===WORLD.userClub) news("球队降级",
        `${c.cn} 不幸降入 ${downName.name}。董事会对此深感失望，你的帅位岌岌可危。`,"bad"); });
  });
  // 夺冠加成
  WORLD.leagues.forEach(lg=>{ const t=tables[lg.lg];
    C(t[0].id).board.conf=clamp(C(t[0].id).board.conf+30,0,100); });
  WORLD.history.push(summary);

  // 用户战报
  const u=UC();
  const myLg=WORLD.leagues[u.lastLg!=null?u.lastLg:u.lg];
  news(`${WORLD.season} 赛季结束`,
    `你带领 ${u.cn} 完成了 ${WORLD.season}/${(WORLD.season+1)%100} 赛季，${myLg?myLg.short:""}最终排名第 ${u.lastRank} 位。`+
    (u.trophies.some(t=>t.startsWith(WORLD.season))?" 恭喜夺冠！":""),"info");

  // 董事会评估
  const tenure = (WORLD.seasonsHere=(WORLD.seasonsHere||0)+1);
  if(tenure>=2 && u.lastRank > u.board.target+7 && u.board.conf<18){
    WORLD.gameOver=`在 ${u.cn} 执教 ${tenure} 个赛季后，董事会决定解除你的主教练职务。最终排名第 ${u.lastRank} 位，远低于「${u.board.expect}」的期望。`;
  }

  aiExtendContracts();          // 先谈提前续约，再处理到期合同

  // 年龄 / 合同 / 退役
  const leftUser=[];
  Object.values(WORLD.players).forEach(p=>{
    p.age++;
    prospectFate(p);
    if(p.loan) returnLoan(p.id,"season");     // 保险：不该有漏网的
    if(p.age>=34 && (rnd()< (p.age-33)*0.22 + (p.ca<70?0.25:0))){
      p.retired=true;
      if(p.clubId>=0){ const c=C(p.clubId); c.squad=c.squad.filter(i=>i!==p.id);
        if(c.id===WORLD.userClub) news(`${p.cn} 宣布退役`,`${p.age}岁的 ${p.cn} 结束了职业生涯，共出场 ${p.careerApps} 次，打进 ${p.careerGoals} 球。`,"info"); }
      WORLD.freeAgents=WORLD.freeAgents.filter(i=>i!==p.id);
      delete WORLD.players[p.id];
      return;
    }
    if(p.contract<=WORLD.season && p.clubId>=0){
      const c=C(p.clubId);
      if(c.id!==WORLD.userClub){
        // AI 自动续约 / 放走
        if(aiRenewDecide(c,p)){ p.contract=WORLD.season+1+ri(1,4); p.wage=Math.max(p.wage, calcWage(p,c.rep,c)); }
        else toFreeAgent(p, c);
      } else {
        // 玩家的人一律由玩家决定：赛季中已经提醒过三次，没续就走（原来有一半会被按 AI 逻辑偷偷续约）
        leftUser.push(`${p.cn}（${POS_CN[p.pos]}，${p.age-1}岁，能力 ${ovr(p)}）`);
        toFreeAgent(p, c);
      }
    }
    p.condition=ri(70,92); p.sharp=ri(45,70); p.injury=0; p.susp=0;
    p.value=calcValue(p);
  });
  if(leftUser.length) news(`${leftUser.length} 名球员合同到期离队`,`以下球员合同到期，已以自由身离开：\n${leftUser.join("\n")}`,"warn");
  // AI 补强阵容
  WORLD.clubs.forEach(c=>{
    let guard=0;
    while(c.squad.length<20 && guard++<25){
      const pos=SQUAD_TEMPLATE.find(([ps,n])=>c.squad.filter(i=>P(i).pos===ps).length<n);
      const usePos = pos? pos[0] : pick(POSITIONS);
      // 先翻自由市场：以前 40% 的概率直接凭空造人，市场上的人反而没人要
      const fa=WORLD.freeAgents.filter(i=>{const q=P(i); return q && q.pos===usePos;});
      /* 用队内中位 CA 划一个**区间**，不是只划下限。
         只有下限（med*0.85）再按 CA 降序取前 6，等于专挑全世界最强的自由球员：
         实测一支 rep30、队内中位 CA53、工资预算 £12.98M 的球队，一口气免签了
         6 名 CA147~167 的球员，年薪合计 £36.24M —— 是它全年预算的 2.8 倍。
         再加一道工资闸：付不起就往下顺延，都付不起就退回去自己造一个（造出来的
         lvl 跟球会匹配，天然便宜）。*/
      const med=squadMedCA(c);
      const good=fa.filter(i=>{const q=P(i); return q.ca>=med*0.85 && q.ca<=med*1.35;})
                   .sort((a,b)=>P(b).ca-P(a).ca);
      // 市场厚的时候优先消化市场、薄的时候才凭空造人——这条同时兼任球员总量的调节阀
      const useFA = WORLD.freeAgents.length>=100? 0.90 : 0.35;
      let signed=false;
      if(good.length && rnd()<useFA){
        const top=good.slice(0, Math.min(good.length,6));
        const start=Math.floor(Math.pow(rnd(),1.6)*top.length);   // 偏向能力高的那头起手
        for(let t=0;t<top.length && !signed;t++){
          const id=top[(start+t)%top.length], w=calcWage(P(id),c.rep,c);
          if(!aiAffordWage(c, w*52, 0) && !faReliefOK(c, P(id), w*52)) continue;   // 付不起就顺延；人数不足 18 走保底闸
          // 这里跑在 WORLD.season++ 之前，年限要 +1，否则 ri(1,3) 实际只剩 0~2 年（一半人下季末又到期）
          transferPlayer(id, c.id, 0, w, 1+ri(1,3));
          signed=true;
        }
      }
      if(!signed){
        const p=makePlayer(clamp(gauss(c.rep*0.9,7),8,95), usePos, ri(18,29), c.id);
        p.wage=calcWage(p,c.rep,c); p.value=calcValue(p); p.contract=WORLD.season+1+ri(1,4);
        WORLD.players[p.id]=p; c.squad.push(p.id);
      }
    }
  });
  // 控制球员总量：清理长期无球可踢的低水平自由球员
  WORLD.freeAgents = WORLD.freeAgents.filter(id=>{
    const p=P(id); if(!p) return false;
    if(p.ca<42 || p.age>33){ delete WORLD.players[id]; return false; }
    return true;
  });
  WORLD.clubs.forEach(c=>{
    const cap = c.id===WORLD.userClub? 30 : 26;   // AI 主动清理冗员，转会市场才有买家
    while(c.squad.length>cap){
      const worst=c.squad.map(i=>P(i)).filter(p=>!p.loan).sort((a,b)=>(a.ca+ (a.pa-a.ca)*0.6)-(b.ca+(b.pa-b.ca)*0.6))[0];
      if(!worst) break;
      toFreeAgent(worst, c);
    }
  });
  // 自由球员市场容量上限，避免逐年膨胀（在各队清理冗员之后执行，只留最好的一批）
  WORLD.freeAgents.sort((a,b)=>(P(b).ca+(P(b).pa-P(b).ca)*0.5)-(P(a).ca+(P(a).pa-P(a).ca)*0.5));
  WORLD.freeAgents.splice(220).forEach(id=>{ delete WORLD.players[id]; });
  /* 自由市场保底：AI 不再白白放人之后，池子会被逐季抽干（实测 10 季后归零、
     全联盟阵容卡在 20 人、谁都没人可签）。这里补一批「下级联赛 / 解约球员」进市场，
     能力刻意压低——市场要有货，但不该有球星。这一条和 220 上限一起把池子夹在 120~220。 */
  for(let need=120-WORLD.freeAgents.length; need>0; need--){
    const q=makePlayer(clamp(gauss(36,13),8,72), pick(POSITIONS), ri(19,32), -1);
    q.wage=marketWage(q); q.value=Math.round(calcValue(q)*0.4); q.contract=WORLD.season;
    WORLD.players[q.id]=q; WORLD.freeAgents.push(q.id);
  }
  ensureAllNumbers();
  // 清理关注名单里已不存在的球员（退役 / 自由市场清理）
  WORLD.shortlist=(WORLD.shortlist||[]).filter(sl=>WORLD.players[sl.id]);
  WORLD.season++;
  WORLD.day=0; WORLD.fired=false; WORLD.offers=[];
  Object.values(WORLD.players).forEach(p=>{ if(p.clubId!==WORLD.userClub) p.listed=false; p.unrest=0; p.wantsLoan=false; });
  WORLD.clubs.forEach(c=>{ if(c.id!==WORLD.userClub) aiInvest(c); });
  WORLD.clubs.forEach(c=>{
    c.finance.income=0; c.finance.expense=0;
    c.board.conf=clamp(c.board.conf*0.5+45,20,95);
    c.coachRating=clamp(c.coachRating+ri(-1,1),3,20);
    autoPickLineup(c);
  });
  bridgeTiers(moves);                       // 升班马补强 / 降班马卖核心，别让新赛季出现 6 分队和 84 球射手
  buildSeason();
  /* 核定必须在 buildSeason 之后：rev0 里的门票要数新赛季的主场场次。
     升级奖励是「董事会追加」，得写在 reset（会把 grant 清零）之后。 */
  WORLD.clubs.forEach(c=>{
    resetSeasonFinance(c);
    if(c._promo){
      c.finance.grant += c._promo.bonus;
      if(c.id===WORLD.userClub)
        news("升级后的董事会追加",`新联赛留守球队的阵容实力约 ${Math.round(c._promo.target/2)}，你的阵容目前 ${Math.round(squadStrength(c)/2)}。董事会在核定的 ${money(c.finance.alloc0)} 之外追加 ${money(c._promo.bonus)}，夏窗是补强的时候。`,"info");
      delete c._promo;
    }
  });
  setBoardExpectation();
}
// 升降级衔接。此时 lg.clubIds 还是上赛季名单（buildSeason 才重排）：上级联赛去掉降级队 = 留守队
function bridgeTiers(moves){
  const u=UC();
  const pct=(arr,q)=>{ if(!arr.length) return 0; const a=arr.slice().sort((x,y)=>x-y); return a[Math.min(a.length-1,Math.floor(q*a.length))]; };
  moves.forEach(mv=>{
    const upLg=WORLD.leagues[lgIndex(mv.nation,mv.tier)], downLg=WORLD.leagues[lgIndex(mv.nation,mv.tier+1)];
    if(!upLg||!downLg) return;
    const stayUp=upLg.clubIds.filter(id=>!mv.relegated.includes(id)).map(id=>squadStrength(C(id)));
    const stayDown=downLg.clubIds.filter(id=>!mv.promoted.includes(id)).map(id=>squadStrength(C(id)));
    const target=pct(stayUp,0.2), ceiling=pct(stayDown,0.8)+25;
    // 升班马
    mv.promoted.forEach(id=>{
      const c=C(id);
      c.rep=clamp(c.rep+4,15,96);
      if(id===WORLD.userClub){
        c._promo={bonus:Math.round(Math.pow(c.rep,3)*30/1e5)*1e5, target};   // 等 resetSeasonFinance 跑完再计入 grant
        return;
      }
      let added=0;
      while(squadStrength(c)<target*0.97 && added<9){
        const need=squadNeed(c);
        const lvl=clamp(Math.round(target/1.85+ri(-3,3)),8,96);
        const p=makePlayer(lvl, need.pos, ri(23,29), c.id);
        p.wage=calcWage(p,c.rep,c); p.value=calcValue(p); p.contract=WORLD.season+ri(2,4); p.joinedAbs=absDay();
        WORLD.players[p.id]=p; c.squad.push(p.id); assignNumber(c,p); added++;
        if(c.squad.length>28){
          const worst=c.squad.map(i=>P(i)).filter(q=>!q.loan).sort((a,b)=>a.ca-b.ca)[0];
          if(worst) toFreeAgent(worst, c);
        }
      }
      if(added){ autoPickLineup(c); if(c.nation===u.nation && c.tier===u.tier) news(`${c.cn} 升级后大举补强`,`为了在 ${NATIONS[mv.nation].tiers[mv.tier].name} 站稳脚跟，${c.cn} 一口气引进了 ${added} 名球员。`,"info"); }
    });
    // 降班马：核心球员离队
    mv.relegated.forEach(id=>{
      const c=C(id);
      c.rep=clamp(c.rep-3,15,96);
      if(id===WORLD.userClub) return;
      const stars=c.squad.map(i=>P(i)).filter(p=>!p.loan && p.ca>=ceiling && p.age<=31).sort((a,b)=>b.ca-a.ca).slice(0,3);
      let sold=0;
      stars.forEach(p=>{
        /* 八季跑数里所有「阵容 <18 人」都出在这里：降级队本来就 20 人，一口气卖掉 3 个核心就成了 17。
           跟 cap 和保底闸都无关——是这里没管人数。*/
        if(c.squad.length<=SQUAD_FLOOR) return;
        const buyers=WORLD.clubs.filter(b=>b.id!==c.id && b.id!==u.id && b.tier===0 && b.squad.length<28 && p.ca<b.rep*2.05+42 && p.ca>b.rep*1.4 && clubSpend(b)>=askingPrice(p)*0.8);
        if(!buyers.length) return;
        const b=pick(buyers), fee=Math.min(askingPrice(p), clubSpend(b)), w=wageDemand(p,b);
        if(!aiAffordWage(b, w*52, fee)) return;
        if(transferPlayer(p.id, b.id, fee, w, ri(2,4))){ sold++; if(b.lg===u.lg || c.nation===u.nation) news(`${p.cn} 离开降级的 ${c.cn}`,`${b.cn} 以 ${money(fee)} 签下 ${POS_CN[p.pos]} ${p.cn}（能力 ${ovr(p)}）。降级后 ${c.cn} 留不住他。`,"info"); }
      });
      if(sold) autoPickLineup(c);
    });
  });
}
function poGame(a,b){
  const sa=squadStrength(C(a))*1.02+gauss(0,9), sb=squadStrength(C(b))+gauss(0,9);
  return sa>sb?a:b;
}
/* =========================================================
   游戏流程控制
   ========================================================= */
let CURMATCH=null;      // 正在进行的用户比赛
let PENDING=null;

function userFixtureOn(day){
  return WORLD.fixtures.find(f=>f.day===day && !f.played && (f.home===WORLD.userClub||f.away===WORLD.userClub));
}
function nextUserFixture(){
  return WORLD.fixtures.filter(f=>!f.played&&(f.home===WORLD.userClub||f.away===WORLD.userClub))
    .sort((a,b)=>a.day-b.day)[0];
}

// 模拟当天所有（非用户）比赛
function simDay(day, skipUser){
  const fx=WORLD.fixtures.filter(f=>f.day===day && !f.played);
  fx.forEach(f=>{
    if(skipUser && (f.home===WORLD.userClub||f.away===WORLD.userClub)) return;
    [f.home,f.away].forEach(id=>{ const c=C(id); if(c.id!==WORLD.userClub) autoPickLineup(c); });
    const M=runMatch(createMatch(f.home,f.away,{comp:f.comp, round:f.round, record:false, ...knockoutOpts(f)}));
    applyResult(f,M);
  });
  // 杯赛 / 欧战轮次推进
  competitionsDayEnd(day);
}

/* 合同到期提醒：开季、冬窗开启、最后一轮联赛前两周各一次。只列还没续约的。*/
function contractReminder(stage){
  const u=UC(); if(!u) return;
  const R=WORLD.ctrRem||(WORLD.ctrRem={});
  const key=WORLD.season+"_"+stage; if(R[key]) return; R[key]=1;
  const exp=u.squad.map(P).filter(p=>p && !p.loan && p.contract<=WORLD.season)
    .concat((u.loanedOut||[]).map(P).filter(p=>p && p.contract<=WORLD.season))
    .sort((a,b)=>b.ca-a.ca);
  if(!exp.length) return;
  const lines=exp.map(p=>`${p.cn}（${POS_CN[p.pos]}，${p.age}岁，能力 ${ovr(p)}，周薪 ${money(p.wage)}${p.loan?"，外租中":""}）`).join("\n");
  const tail="\n\n在球员档案里点「续约」谈新合同；不续约的球员会在赛季结束后以自由身离队。阵容页的「即将到期」可以一次看全。";
  if(stage==="start") news(`本赛季有 ${exp.length} 名球员合同到期`,`以下球员的合同将在本赛季结束时到期：\n${lines}${tail}`,"warn");
  else if(stage==="winter") news(`合同提醒：还有 ${exp.length} 人未续约`,`冬窗已开。以下球员合同本季到期，至今仍未续约：\n${lines}${tail}`,"warn");
  else news(`最后提醒：${exp.length} 名球员即将合同到期`,`距离本赛季最后一轮联赛还有两周。以下球员如果不续约，赛季结束后将以自由身离队：\n${lines}${tail}`,"bad");
}
function lastFixtureDay(){ let m=0; (WORLD.fixtures||[]).forEach(f=>{ if(f.comp==="L" && f.day>m) m=f.day; }); return m; }   // 联赛赛程开季就排定，杯赛/欧战后几轮是晋级后才排的
function processDayEnd(day){
  dailyTick();
  { const dt0=dateOf(day);
    if(day===0) contractReminder("start");
    if(dt0.getMonth()===0 && dt0.getDate()===1) contractReminder("winter");
    const lf=lastFixtureDay(); if(lf>20 && day>=lf-14) contractReminder("final"); }
  if(inTransferWindow()) marketDaily();
  faSigningRound();                 // 自由球员不受转会窗限制，全年都跑
  const dt=dateOf(day);
  if(dt.getDay()===1) weeklyTick();
  if(dt.getMonth()===2 && dt.getDate()===20 && !WORLD.youthDone){ WORLD.youthDone=true; youthIntake(); }
  autoSellRound();                  // 到价自动成交（留一天给竞价，所以放在报价过期之前）
  // 报价过期（到期前始终可处理，不会被新报价顶掉）
  if(WORLD.offers) WORLD.offers=WORLD.offers.filter(o=>((o.until!=null?o.until:o.day+7))>WORLD.day && inTransferWindow());
}

/* 到价自动成交。不当场成交——留一天给别家竞价（竞价抬价 6~18% 仍有机会发生），
   所以只看昨天或更早收到的报价，同一球员取最高的那份。玩家当天手动处理过的自然扫不到。*/
function autoSellRound(){
  if(!inTransferWindow()) return;
  const u=UC(), offs=WORLD.offers||[];
  const ready=offs.filter(o=>o.type!=="loan" && o.atAsk && o.day<WORLD.day
     && P(o.pid) && P(o.pid).autoSell && P(o.pid).clubId===u.id && !P(o.pid).loan);
  const byP={};
  ready.forEach(o=>{ if(!byP[o.pid] || o.fee>byP[o.pid].fee) byP[o.pid]=o; });
  Object.keys(byP).forEach(pid=>{
    const of=byP[pid], p=P(of.pid);
    const want=sellPrice(p);
    if(!(of.fee >= want)) return;
    const i=WORLD.offers.indexOf(of); if(i<0) return;
    const b=C(of.club), fee=of.fee;
    acceptOffer(i);
    news(`按挂牌条件自动成交`,`${p.cn} 以 ${money(fee)} 转会 ${b.cn}——达到了你设定的要价 ${money(want)}。`,"good");
  });
}

// 主「继续」入口，返回状态
function advance(){
  if(WORLD.gameOver) return {t:"over"};
  const uf=userFixtureOn(WORLD.day);
  if(uf) return {t:"match", fx:uf};
  simDay(WORLD.day,false);
  processDayEnd(WORLD.day);
  WORLD.day++;
  if(WORLD.day>=SEASON_DAYS || allFixturesDone()){ WORLD.youthDone=false; endSeason(); return {t:"season"}; }
  return {t:"day"};
}
function allFixturesDone(){ return !WORLD.fixtures.some(f=>!f.played); }

// 用户比赛结束后收尾
function finishUserMatch(){
  const M=CURMATCH;
  const fx=WORLD.fixtures.find(f=>f.day===WORLD.day && !f.played && (f.home===M.h&&f.away===M.a));
  if(fx) applyResult(fx,M);
  simDay(WORLD.day,false);
  processDayEnd(WORLD.day);
  WORLD.day++;
  CURMATCH=null;
  if(WORLD.day>=SEASON_DAYS || allFixturesDone()){ WORLD.youthDone=false; endSeason(); return "season"; }
  return "ok";
}

// 快速模拟到某天
function skipTo(targetDay, onStop){
  let guard=0;
  while(WORLD.day<targetDay && guard++<400){
    const r=advance();
    if(r.t!=="day") return r;
  }
  return {t:"day"};
}

/* 同一页面里的操作（筛选、排序、接受报价……）重画时保留滚动位置；只有换页才回顶部。
   原来每次 render 都 scrollTop=0，手机上筛完要再滑回去。 */
let LAST_VIEW=null;
function render(){
  markDirty();
  renderNav(); renderTop();
  const v=$("#view");
  const keepY = (LAST_VIEW===VIEW)? v.scrollTop : 0;
  const fn={home:vHome,inbox:vInbox,squad:vSquad,tactics:vTactics,training:vTraining,youth:vYouth,
    transfer:vTransfer,scout:vScout,finance:vFinance,build:vBuild,club:vClub,league:vLeague,schedule:vSchedule,
    stats:vStats,history:vHistory,save:vSave,crests:vCrests,help:vHelp,match:vMatch}[VIEW]||vHome;
  v.innerHTML=""; fn(v);
  LAST_VIEW=VIEW;
  v.scrollTop=keepY;
  if(keepY) requestAnimationFrame(()=>{ if(LAST_VIEW===VIEW && Math.abs(v.scrollTop-keepY)>1) v.scrollTop=keepY; });
}

// 把一张已经画好的 .card（第一个子元素是 h3）改成可折叠栏目。展开状态按 key 存在本机。
const FOLD_LS="fm_fold_v1";
let FOLD_STATE=(()=>{ try{ return JSON.parse(localStorage.getItem(FOLD_LS))||{}; }catch(e){ return {}; } })();
function foldCard(card, key, title, chips, defOpen){
  const h=card.querySelector(":scope>h3"); let sub=null;
  if(h){ const hs=h.querySelector(".hint"); if(hs){ sub=el("div","hint"); sub.style.marginBottom="10px"; sub.innerHTML=hs.innerHTML; } h.remove(); }
  const kids=[...card.childNodes];
  const open = (key in FOLD_STATE)? !!FOLD_STATE[key] : !!defOpen;
  card.className="card fold"+(open?" open":"");
  card.innerHTML=`<button type="button" class="fh" aria-expanded="${open}"><span class="fa"></span><span class="ft">${title}</span>`+
    `<span class="fs">${chips.filter(Boolean).map(([t,c,id])=>`<span class="chip${c?" "+c:""}"${id?` id="${id}"`:""}>${t}</span>`).join("")}</span>`+
    `<span class="chev" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></span></button>`+
    `<div class="fb"><div class="fbi"><div class="fbc"></div></div></div>`;
  const body=card.querySelector(".fbc"), fb=card.querySelector(".fb"), btn=card.querySelector(".fh");
  if(sub) body.appendChild(sub);
  kids.forEach(n=>body.appendChild(n));
  fb.inert=!open;
  btn.onclick=()=>{
    const o=!card.classList.contains("open");
    card.classList.toggle("open",o); btn.setAttribute("aria-expanded",o); fb.inert=!o;
    FOLD_STATE[key]=o; try{ localStorage.setItem(FOLD_LS, JSON.stringify(FOLD_STATE)); }catch(e){}
  };
  return card;
}

// ---------- 表格排序 ----------
function sortTable(rows, key, get){
  if(SORT.k===key) SORT.d*=-1; else {SORT.k=key; SORT.d=-1;}
  return rows;
}
function makeTable(cols, rows, opts){
  opts=opts||{};
  const t=el("table");
  const thead=el("thead"); const tr=el("tr");
  cols.forEach(c=>{
    const th=el("th",(c.nos?"nos":"")+(c.mh?" mh":""),c.h);
    if(c.cls) th.style.textAlign=c.cls==="num"?"right":c.cls==="ctr"?"center":"left";
    if(!c.nos) th.onclick=()=>{ if(SORT.k===c.k) SORT.d*=-1; else {SORT.k=c.k;SORT.d=c.desc===false?1:-1;} opts.rerender?opts.rerender():render(); };
    if(SORT.k===c.k) th.innerHTML=c.h+(SORT.d<0?" ▾":" ▴");
    tr.appendChild(th);
  });
  // 首个文本列吸收多余宽度，数字列才会靠右成组，不会被均匀拉散
  // （只在宽屏生效：移动端表格是 min-width:max-content 横向滚动，撑开首列会把其余列顶出屏幕）
  const flexIdx=cols.findIndex(c=>c.cls!=="num"&&c.cls!=="ctr"&&!c.nos);
  if(flexIdx>=0 && cols.some(c=>c.cls==="num")) tr.children[flexIdx].classList.add("flexcol");
  thead.appendChild(tr); t.appendChild(thead);
  const tb=el("tbody");
  let data=[...rows];
  if(SORT.k){
    const col=cols.find(c=>c.k===SORT.k);
    if(col&&col.v) data.sort((a,b)=>{ const x=col.v(a),y=col.v(b);
      return (typeof x==="string"? x.localeCompare(y): x-y)*SORT.d; });
  }
  data.forEach((r,i)=>{
    const row=el("tr",opts.onRow?"clickable":"");
    cols.forEach(c=>{ const td=el("td",(c.cls||"")+(c.mh?" mh":""),c.r(r,i)); row.appendChild(td); });
    if(opts.onRow) row.onclick=()=>opts.onRow(r);
    if(opts.rowStyle) opts.rowStyle(row,r,i);
    tb.appendChild(row);
  });
  t.appendChild(tb);
  const wrap=el("div","tw"); wrap.appendChild(t);
  return wrap;
}

  let h=`<div style="min-width:0"><div class="hint" style="margin-bottom:4px;font-weight:700">${title}</div>`;
  for(const k in dict){
    const val=p.a[k];
    const show = hide? (val>=1? "?" : "?") : val;
    h+=`<div class="attr"><span class="an">${dict[k]}</span>
      ${hide?'':barHTML(val,20,attrColor(val))}
      <span class="av" style="color:${hide?'var(--dim2)':attrColor(val)}">${show}</span></div>`;
  }
  return h+"</div>";
}

/* ---------- 主动推销 ---------- */
// 这家俱乐部有多需要他：缺这个位置 2，能首发 1，都不是 0
function pitchNeed(c, p){
  const nd=squadNeed(c).pos;
  if(nd===p.pos || (p.pos2||[]).includes(nd)) return 2;
  return wouldStart(p,c)? 1 : 0;
}
function pitchReset(p){
  if(p.pitchWin!==winKey()){ p.pitchWin=winKey(); p.pitchN=0; p.pitched=[]; p.pitchFelt=0; }
}
function pitchCands(p){
  const u=UC(), price=sellPrice(p);
  pitchReset(p);
  return WORLD.clubs.filter(c=>c.id!==u.id && c.squad.length<29
      && p.ca > c.rep*1.45 && p.ca < c.rep*2.05+42
      && clubSpend(c) >= price*0.6
      && !(p.pitched||[]).includes(c.id))
    .map(c=>{ const v=aiValuation(c,p), need=pitchNeed(c,p), start=wouldStart(p,c);
      const lvl = (v>=price*0.9 && need>=1)? 2 : (v>=price*0.65 && (need>=1||start))? 1 : 0;
      return {c, v, need, start, lvl}; })
    .sort((a,b)=>(b.lvl-a.lvl)||(b.need-a.need)||(b.c.rep-a.c.rep))
    .slice(0,14);
}
function pitchDialog(pid){
  const p=P(pid), u=UC();
  if(!inTransferWindow()){ toast("只能在转会窗内推销","bad"); return; }
  if(p.loan){ toast("租借中的球员归属权在母队","bad"); return; }
  if(p.untouchable){ toast(`${p.cn} 是非卖品`,"bad"); return; }
  pitchReset(p);
  const left=3-(p.pitchN||0);
  const cands=pitchCands(p), price=sellPrice(p);
  if(!cands.length){ toast("目前没有球队适合推销他","bad"); return; }
  const lvlTag=x=>x.lvl===2?'<span class="tag t-ok">兴趣 高</span>':x.lvl===1?'<span class="tag t-i">兴趣 中</span>':'<span class="tag t-n">兴趣 低</span>';
  const rows=cands.map(x=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1d242e;flex-wrap:wrap;cursor:pointer">
      <input type="checkbox" class="pitch-cb" value="${x.c.id}" ${left<=0?"disabled":""}>
      ${crestHTML(x.c)}<b>${esc(x.c.cn)}</b><span class="tag t-n">${LGS(x.c)}</span>
      ${x.need>=2?'<span class="tag t-w">缺该位置</span>':''}${x.start?'<span class="tag t-i">能首发</span>':''}
      ${clubSpend(x.c)>=price?'<span class="tag t-ok">可负担</span>':''}
      <span style="flex:1"></span>${lvlTag(x)}</label>`).join("");
  const willMind = !(p.listed || (p.unrest||0)>=1 || p.wantsLoan);
  openModal("推销 "+esc(p.cn),
    `<div class="hint">${POS_CN[p.pos]} · ${p.age} 岁 · 能力 ${ovr(p)} · 周薪 ${money(p.wage)} · 你的要价 <b style="color:var(--acc)">${money(price)}</b>${p.listed?"":"（未挂牌，按市价）"}</div>
     <div class="hint" style="margin-top:6px">${left>0?`本窗还可推销 <b>${left}</b> 家（每名球员每窗最多 3 家，同一家只能推一次）。`:"<b>本窗推销次数已用完。</b>"}对方会在 1~3 天内答复。</div>
     <div class="scroll" style="max-height:280px;margin-top:8px">${rows}</div>
     <div class="hint" style="margin-top:10px">成交后可用资金 +${money(price)} + 剩余周薪 ${money(p.wage*remWeeks(u))}，下季工资承诺 −${money(p.wage*52)}。</div>
     <div class="hint" style="margin-top:6px">球员对被兜售的反应：${willMind?'<span style="color:var(--warn)">他会不高兴（士气下降）</span>':"他本来就想走，不会介意"}。</div>`,
    `<button class="pri" ${left<=0?"disabled":""} onclick="sendPitch(${pid})">发出推荐</button><button onclick="closeModal()">取消</button>`);
  const cbs=document.querySelectorAll(".pitch-cb");
  cbs.forEach(cb=>cb.onchange=()=>{
    const n=[...document.querySelectorAll(".pitch-cb")].filter(x=>x.checked).length;
    if(n>left){ cb.checked=false; toast(`本窗最多还能推 ${left} 家`,"bad"); }
  });
}
function sendPitch(pid){
  const p=P(pid), u=UC();
  pitchReset(p);
  const left=3-(p.pitchN||0);
  const ids=[...document.querySelectorAll(".pitch-cb")].filter(x=>x.checked).map(x=>+x.value).slice(0,Math.max(0,left));
  if(!ids.length){ toast("先选至少一家俱乐部","bad"); return; }
  const price=sellPrice(p), endD=windowEndDay();
  WORLD.pitches=WORLD.pitches||[];
  ids.forEach(cid=>{
    WORLD.pitches.push({pid, club:cid, price, day:WORLD.day, due:Math.min(WORLD.day+ri(1,3), endD)});
    (p.pitched=p.pitched||[]).push(cid); p.pitchN=(p.pitchN||0)+1;
  });
  // 球员的反应：本来就想走的不介意；主力被兜售还要多一层不被信任
  if(!(p.listed || (p.unrest||0)>=1 || p.wantsLoan) && !p.pitchFelt){
    p.pitchFelt=1; p.morale=clamp(p.morale-8,5,100);
    news(`${p.cn} 知道了俱乐部在兜售他`,`${p.cn} 得知俱乐部在向其他球队兜售他，训练时情绪明显低落。`,"warn");
    if(u.lineup.includes(pid)) p.unrest=Math.min(2,(p.unrest||0)+1);
  }
  news(`已向 ${ids.map(i=>C(i).short).join("、")} 推荐 ${p.cn}`,
    `${u.cn} 主动向 ${ids.map(i=>esc(C(i).cn)).join("、")} 推荐了 ${p.cn}，要价 ${money(price)}。对方会在几天内答复。`,"info");
  toast(`已推荐给 ${ids.length} 家俱乐部`); closeModal(); render();
}
/* 推销回复。每日在 marketDaily 里跑。*/
function pitchReplies(){
  const u=UC(); WORLD.pitches=WORLD.pitches||[];
  const keep=[], done=[];
  WORLD.pitches.forEach(pt=>{
    const p=P(pt.pid), b=WORLD.clubs[pt.club];
    if(!p || !b || p.clubId!==u.id || p.loan || !inTransferWindow()) return;   // 人已经不在了，条目直接丢
    if(pt.due>WORLD.day){ keep.push(pt); return; }
    const price=pt.price, v=aiValuation(b,p), need=pitchNeed(b,p), start=wouldStart(p,b), w=wageDemand(p,b);
    const already=WORLD.offers.some(o=>o.pid===p.id&&o.club===b.id);
    const fee1=Math.min(price, v);
    if(!already && v>=price*0.9 && need>=1 && canAfford(b, fee1, w*52).ok){
      const fee=v>=price? price : v;
      WORLD.offers.push({pid:p.id, club:b.id, fee, max:Math.round(Math.min(clubSpend(b), fee*1.18)/1e4)*1e4,
        wage:w, atAsk:fee>=price, pitched:true, day:WORLD.day, until:Math.min(WORLD.day+14, windowEndDay())});
      news(`${b.cn} 接受了推荐`,`${b.cn} 接受了你对 ${p.cn} 的推荐，报价 ${money(fee)}。请到「转会」页面处理。`,"good");
    } else if(!already && v>=price*0.65 && (need>=1||start) && canAfford(b, v, w*52).ok){
      WORLD.offers.push({pid:p.id, club:b.id, fee:v, max:Math.round(Math.min(clubSpend(b), v*1.15)/1e4)*1e4,
        wage:w, atAsk:false, pitched:true, day:WORLD.day, until:Math.min(WORLD.day+14, windowEndDay())});
      news(`${b.cn} 有兴趣`,`${b.cn} 对 ${p.cn} 有兴趣，但只愿出 ${money(v)}（你的要价 ${money(price)}）。`,"info");
    } else if(start && b.squad.length<28 && p.age<=27 && !already
              && makeLoanOffer(b, p, `${b.cn} 买不起 ${p.cn}，但提出租借`)){
      // makeLoanOffer 里已经发了 news
    } else {
      news(`${b.cn} 回复`,`${b.cn} 回复：目前不需要 ${p.cn} 这样的球员。`,"info");
      const it=interestList().find(x=>x.pid===p.id&&x.club===b.id); if(it) it.heat*=0.7;
      if(p.pitchRejWin!==winKey()){ p.pitchRejWin=winKey(); p.pitchRej=0; }
      p.pitchRej=(p.pitchRej||0)+1;
    }
    done.push(p);
  });
  WORLD.pitches=keep;
  /* 本窗推的每一家都拒了 → 再掉一点。等这个球员没有待回复的条目了再判，
     否则前两家先拒、第三家还没回就会提前触发。*/
  [...new Set(done)].forEach(p=>{
    if(keep.some(q=>q.pid===p.id)) return;                 // 还有没回的
    if(p.pitchRejWin!==winKey()) return;
    if((p.pitchRej||0) < (p.pitchN||0)) return;            // 有人接了
    if(p.pitchDown===winKey()) return;                     // 本窗已经掉过
    p.pitchDown=winKey();
    if(p.listed || (p.unrest||0)>=1 || p.wantsLoan) return;
    p.morale=clamp(p.morale-4,5,100);
    news(`${p.cn} 无人问津`,`${p.cn} 被推销一圈无人问津，更没心思了。`,"warn");
  });
}

function submitLoanCounter(i){

  if(t.wageShare>of.wageShare) hard++;
  if(t.minApps>of.minApps) hard++;
  if(t.fee>of.fee) hard += (t.fee>of.fee*1.5+2e5)? 2 : 1;

    WORLD.offers.splice(i,1); toast(`${b.cn} 无法接受修改后的条款，放弃了租借`,"bad"); closeModal(); render(); return;

function paRange(p,know){
  if(know<20) return "未知";
  const w=Math.max(4, Math.round((100-know)/4));
  const lo=clamp(Math.round(p.pa/2)-w,1,99), hi=clamp(Math.round(p.pa/2)+w,1,100);
  return lo+" - "+hi;
}

      if(p.injury>0||p.susp>0){ toast("该球员无法出场","bad"); return; }
      const outId=c.lineup[SELSLOT]; c.lineup[SELSLOT]=p.id;
      c.subs=c.subs.filter(x=>x!==p.id);
      if(outId!=null&&!c.subs.includes(outId)) c.subs.unshift(outId);
      if(c.subs.length>BENCH_MAX){                 // 原来是静默丢人，现在说清楚是谁
        const dropped=c.subs.splice(BENCH_MAX);
        const nm=dropped.map(x=>P(x)?P(x).cn:"").filter(Boolean).join("、");
        if(nm) toast(`替补席已满，${nm} 被移出大名单`,"warn");
      }
      SELSLOT=null; render();
    };
    scroll.appendChild(d);
  });
  list.appendChild(scroll);
  right.appendChild(list);

  // 替补席
  const bench=el("div","card"); bench.innerHTML=`<h3>替补席 <span class="hint" style="font-weight:400">${c.subs.length}/${BENCH_MAX} · 点 × 移出大名单</span></h3>`;
  const bl=el("div"); bl.style.cssText="display:flex;flex-wrap:wrap;gap:6px";
  c.subs.forEach(id=>{ const p=P(id); if(!p)return;
    const b=el("span","pill",`${POS_CN[p.pos]} ${esc(p.cn.split("·").pop())} <b style="color:${caColor(p.ca)}">${ovr(p)}</b> <span data-x="${id}" style="margin-left:4px;color:var(--dim2);padding:0 2px">×</span>`);
    b.style.cursor="pointer";
    b.onclick=(ev)=>{ if(ev.target&&ev.target.dataset&&ev.target.dataset.x){ benchRemove(id); return; } showPlayer(id); };
    bl.appendChild(b); });
  if(!c.subs.length) bl.innerHTML='<span class="hint">尚未设置替补</span>';
  bench.appendChild(bl);
  right.appendChild(bench);
  wrap.appendChild(right);
  v.appendChild(wrap);

  const fsel=$("#fmtsel"); if(fsel) fsel.onchange=e=>{ const kept=remapLineup(c, e.target.value); SELSLOT=null;
    toast(`已换成 ${e.target.value}，原首发留下 ${kept} 人`); render(); };
  const off=$("#offs"); if(off) off.onchange=e=>c.tactic.offside=e.target.checked;
  const cnt=$("#cntr"); if(cnt) cnt.onchange=e=>c.tactic.counter=e.target.checked;
}

// 替补席的增删。之前全游戏只能通过「点场上位置换人」间接改名单，
// 替补和未入选之间没有任何操作入口。
const BENCH_MAX = 7;
function benchAdd(pid){
  const c=UC(), p=P(pid); if(!p || p.clubId!==c.id) return;
  if(c.lineup.includes(pid)){ toast("他已经是首发，先从阵型里换下来","bad"); return; }
  if(c.subs.includes(pid)) return;
  if(c.subs.length>=BENCH_MAX){ toast(`替补席已满 ${BENCH_MAX} 人，先移出一个`,"bad"); return; }
  if(p.injury>0||p.susp>0){ toast("该球员无法出场","bad"); return; }
  c.subs.push(pid); toast(`${p.cn} 进入替补席`); render();
}
function benchRemove(pid){
  const c=UC(), p=P(pid); if(!p) return;
  if(!c.subs.includes(pid)) return;
  c.subs=c.subs.filter(x=>x!==pid); toast(`${p.cn} 移出大名单`); render();
}
function benchToggle(pid){
  const c=UC();
  if(c.subs.includes(pid)) benchRemove(pid); else benchAdd(pid);
}

/* ================= 阵容预设（3 套） ================= */
// club.presets[i] = {name, form, lineup:[ids], subs:[ids], tac:{完整战术}}；只给玩家球队用
const PRESET_N = 3;
function presetsOf(c){ if(!Array.isArray(c.presets)) c.presets=[]; while(c.presets.length<PRESET_N) c.presets.push(null); return c.presets; }
function presetDefaultName(c,i){ return `方案${i+1}`; }
function presetSave(i){
  const c=UC(), ps=presetsOf(c), old=ps[i];
  ps[i]={ name: old&&old.name? old.name : presetDefaultName(c,i), form:c.tactic.formation,
          lineup:c.lineup.slice(), subs:(c.subs||[]).slice(), tac:JSON.parse(JSON.stringify(c.tactic)) };
  closeModal(); toast(`已存为「${ps[i].name}」（${ps[i].form}）`); render();
}
function presetSaveAsk(i){
  const c=UC(), cur=presetsOf(c)[i];
  if(!cur){ presetSave(i); return; }
  openModal("覆盖预设", `<div>把当前的阵型、首发、替补和战术指令存进「<b>${esc(cur.name)}</b>」？<div class="hint" style="margin-top:6px">原来存的 ${esc(cur.form)} 会被覆盖。</div></div>`,
    `<button onclick="closeModal()">取消</button><button class="pri" onclick="presetSave(${i})">覆盖</button>`);
}
function presetRenameAsk(i){
  const c=UC(), cur=presetsOf(c)[i];
  if(!cur){ toast("这个方案还是空的，先点「存当前」","warn"); return; }
  openModal("预设改名", `<input id="ps-name" maxlength="12" value="${esc(cur.name)}" style="width:100%">
    <div class="hint" style="margin-top:6px">最多 12 个字，比如「主力 4-3-3」「杯赛轮换」</div>`,
    `<button onclick="closeModal()">取消</button><button class="pri" onclick="presetRenameDo(${i})">确定</button>`);
  setTimeout(()=>{ const x=$("#ps-name"); if(x){ x.focus(); x.select(); } },50);
}
function presetRenameDo(i){
  const c=UC(), cur=presetsOf(c)[i], x=$("#ps-name"); if(!cur||!x) return;
  const n=x.value.trim().slice(0,12); if(n) cur.name=n;
  closeModal(); render();
}
function presetApply(i){
  const c=UC(), pr=presetsOf(c)[i];
  if(!pr){ toast("这个方案还是空的，先点「存当前」","warn"); return; }
  const tac=JSON.parse(JSON.stringify(pr.tac||{}));
  if(!FORMATIONS[tac.formation]) tac.formation=FORMATIONS[pr.form]? pr.form : c.tactic.formation;
  c.tactic=Object.assign(defaultTactic(), tac);
  c.lineup=pr.lineup.slice(); c.subs=(pr.subs||[]).slice();
  repairLineup(c);
  // 说清楚谁被顶掉了、为什么
  const inSquad=new Set(c.squad), why=id=>{ const p=P(id); return !p||!inSquad.has(id)? "不在队" : p.injury>0? "伤" : p.susp>0? "停赛" : ""; };
  const ch=[];
  pr.lineup.forEach((id,k)=>{ if(id==null||c.lineup[k]===id) return; const w=why(id); if(!w) return;
    const a=P(id), b=c.lineup[k]!=null?P(c.lineup[k]):null;
    ch.push(`${a?a.cn.split("·").pop():"?"}（${w}）→ ${b?b.cn.split("·").pop():"空缺"}`); });
  SELSLOT=null;
  toast(`已套用「${pr.name}」${ch.length? "："+ch.join("，") : ""}`, ch.length?"warn":"");
  render();
}
function presetBar(){
  const c=UC(), ps=presetsOf(c);
  const box=el("div","preset-bar");
  ps.forEach((pr,i)=>{
    const col=el("div","preset");
    col.innerHTML=`<button class="sm preset-main ${pr?"":"empty"}" title="${pr?esc(pr.name)+" · "+esc(pr.form):"空"}">
        <span class="pn">${pr?esc(pr.name):presetDefaultName(c,i)}</span><span class="pf">${pr?esc(pr.form):"空"}</span></button>
      <div class="preset-ops"><button class="sm" data-op="save">存当前</button><button class="sm" data-op="ren" ${pr?"":"disabled"}>✎</button></div>`;
    col.querySelector(".preset-main").onclick=()=>presetApply(i);
    col.querySelector('[data-op="save"]').onclick=()=>presetSaveAsk(i);
    col.querySelector('[data-op="ren"]').onclick=()=>presetRenameAsk(i);
    box.appendChild(col);
  });
  return box;
}
// 换阵型时尽量保留原首发：同位置的人原地不动，其余按适配度对到新位置，实在对不上的才换人
function remapLineup(c, newForm){
  const oldSlots=FORMATIONS[c.tactic.formation], newSlots=FORMATIONS[newForm];
  const old=(c.lineup||[]).map((id,k)=>({id,pos:oldSlots&&oldSlots[k]?oldSlots[k][0]:null})).filter(x=>x.id!=null&&P(x.id));
  c.tactic.formation=newForm;
  const lineup=newSlots.map(()=>null), used=new Set(), pairs=[];
  old.forEach(o=>newSlots.forEach((sl,k)=>{ const p=P(o.id), fit=posFit(p,sl[0]);
    pairs.push({id:o.id,k,key:(o.pos===sl[0]?2:0)+fit, sc:playerScore(p,sl[0]), fit}); }));
  pairs.sort((a,b)=>b.key-a.key||b.sc-a.sc);
  pairs.forEach(x=>{ if(used.has(x.id)||lineup[x.k]!=null) return; if(x.key<2 && x.fit<0.6) return; lineup[x.k]=x.id; used.add(x.id); });
  const dropped=old.map(o=>o.id).filter(id=>!used.has(id));
  c.lineup=lineup;
  c.subs=dropped.concat((c.subs||[]).filter(id=>!dropped.includes(id))).slice(0, BENCH_MAX+dropped.length);
  repairLineup(c);
  if(c.subs.length>BENCH_MAX) c.subs=c.subs.slice(0,BENCH_MAX);
  return old.length-dropped.length;
}

function makeBid(pid){
  const p=P(pid), c=UC();
  const isFA = p.clubId<0;
  if(!isFA && !inTransferWindow()){ toast("当前不在转会窗口","bad"); return; }
  if(p.loan){ toast("他正在租借中，租期结束前不可转会","bad"); return; }

     ${isFA? '<input id="bid-fee" type="hidden" value="0">'

     <div style="margin-top:8px"><label>周薪（${CURSYM()}）</label><input id="bid-wage" type="number" value="${toCurIn(wg)}" style="width:180px"></div>
     <div style="margin-top:8px"><label>合同年限</label><select id="bid-yr" onchange="updBidCost()"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>

/* 报价弹窗底部那行：这笔合同本季占用多少、之后每季多少。合同年限一变就重算。*/
function updBidCost(){
  const box=$("#bid-cost"); if(!box) return;
  const c=UC(), fee=fromCur(($("#bid-fee")||{}).value||0), wg=fromCur(($("#bid-wage")||{}).value||0), yr=+(($("#bid-yr")||{}).value||3);
  const wks=remWeeks(c), av=avail(c), now=fee+wg*52*wks/52, cn=committedNext(c), cap=wageCap(c);
  const r=canAfford(c, fee, wg*52);
  box.innerHTML=`可用资金 <b style="color:${av>=0?"var(--acc)":"var(--bad)"}">${money(av)}</b>。`
    +`这份合同本季占用 <b style="color:${now>av?"var(--bad)":""}">${money(Math.round(now))}</b>`
    +`（转会费 ${money(fee)} + ${wks} 周工资 ${money(Math.round(wg*52*wks/52))}），之后每季 ${money(wg*52)}，共 ${yr} 年。<br>`
    +`下季工资承诺将从 ${money(cn)} 升到 <b style="color:${cn+wg*52>cap?"var(--bad)":""}">${money(cn+wg*52)}</b> / ${inCapTransition(c)?"本季上限（过渡期）":"上限"} ${money(cap)}。`
    +(r.ok?"":`<br><span style="color:var(--bad)">${r.why==="cash"?"可用资金不足":(inCapTransition(c)?"超出本季工资上限（过渡期）":"超出董事会工资上限")}，差 ${money(r.gap)}${r.why==="cap"?"/年":""}。</span>`);
}
/* 卖方底线。相对 askingPrice（它已经含了合同年限折扣），越是「他们本来就想卖」的人越能砍。
   底线不显示给玩家，玩家最多试两次。*/
function sellerFloor(seller, p){
  let m;
  if(p.listed) m=0.78;
  else if(p.age>=30 || p.ca<seller.rep*1.5 || p.morale<40) m=0.85;   // 与 aiListSurplus 的冗员标准一致
  else { const same=seller.squad.map(i=>P(i)).filter(q=>q.pos===p.pos).sort((a,b)=>b.ca-a.ca);
         m = same[0]===p ? 1.0 : 0.92; }
  if(isDeadline()) m-=0.05;                                          // 截止日捡漏
  return Math.round(askingPrice(p)*m/1e4)*1e4;
}
function submitBid(pid){
  const p=P(pid), c=UC();
  const isFA = p.clubId<0;
  if(!isFA && !inTransferWindow()){ toast("当前不在转会窗口","bad"); closeModal(); return; }
  if(p.loan){ toast("他正在租借中，租期结束前不可转会","bad"); closeModal(); return; }
  const fee=isFA?0:Math.round(fromCur($("#bid-fee").value)), wg=Math.round(fromCur($("#bid-wage").value)), yr=+$("#bid-yr").value;
  const ask=isFA?0:askingPrice(p), need=wageDemand(p,c);
  { const r=canAfford(c, fee, wg*52); if(!r.ok){ toast(affordMsg(c, r, fee, wg*52),"bad"); return; } }
  if(c.squad.length>=30){ toast("阵容已满（上限 30 人）","bad"); return; }
  const seller=p.clubId>=0?C(p.clubId):null;
  if(seller && !canSell(seller,p)){ toast(`${seller.cn} 拒绝出售——该位置人手不足`,"bad"); closeModal(); return; }
  if(!isFA && seller && fee < ask){
    const floor=sellerFloor(seller,p);
    if(fee < floor){
      if(p.negoLock===winKey()){ toast(`${seller.cn} 本窗不再和你压价谈 ${p.cn}——只接受要价 ${money(ask)}`,"bad"); closeModal(); return; }
      const first = !p.nego || p.nego.win!==winKey() || !p.nego.round;
      if(first){
        const counter=Math.max(floor, Math.round((fee+ask)/2/1e4)*1e4);
        p.nego={win:winKey(), round:1, counter};
        const fi=$("#bid-fee"); if(fi) fi.value=toCurIn(counter);
        const box=$("#bid-nego");
        if(box) box.innerHTML=`<span style="color:var(--warn)">${esc(seller.cn)} 还价 <b>${money(counter)}</b>（要价 ${money(ask)}）。你可以接受或再出一次价，再谈不拢对方就会退出。</span>`;
        const btn=$("#bid-go"); if(btn) btn.textContent="按还价成交 / 再出一次";
        if(typeof updBidCost==="function") updBidCost();
        toast(`${seller.cn} 还价 ${money(counter)}`,"warn");
        return;
      }
      p.negoLock=winKey(); p.nego=null;
      toast(`${seller.cn} 认为没得谈，退出了谈判。本窗不再接受你对 ${p.cn} 的压价，要价 ${money(ask)} 照旧有效。`,"bad");
      closeModal(); return;
    }
  }
  if(wg < need*0.92){ toast(`${p.cn} 认为薪资不足，要求 ${money(need)}/周`,"bad"); closeModal(); return; }
  // 球员意愿：声望差
  if(seller && seller.rep > c.rep+14 && rnd()<0.6){ toast(`${p.cn} 不愿加盟——认为这是职业生涯的倒退`,"bad"); closeModal(); return; }
  // 抢手球员：报价仅略高于要价时，可能被更大的俱乐部截胡
  if(seller && fee < ask*1.08 && (perfIndex(p)>=0.35 || p.ca>seller.rep*1.9) && rnd()<0.14){
    const rivals=WORLD.clubs.filter(r=>r.id!==c.id && r.id!==seller.id && r.rep>c.rep+3 && r.squad.length<29
       && clubSpend(r)>=fee*1.12 && p.ca<r.rep*2.05+42 && p.ca>r.rep*1.4);
    if(rivals.length){
      const r=pick(rivals), rf=Math.round(fee*(1.1+rnd()*0.15)/1000)*1000, rw=wageDemand(p,r);
      if(aiAffordWage(r, rw*52, rf)){
        transferPlayer(pid, r.id, rf, rw, ri(2,5));
        news(`${r.cn} 截胡 ${p.cn}`,`就在你与 ${seller.cn} 以 ${money(fee)} 谈妥之际，${r.cn} 突然介入并开出 ${money(rf)}，球员最终选择了他们。`,"bad");
        toast(`${r.cn} 截胡了 ${p.cn}！`,"bad"); closeModal(); render(); return;
      }
    }
  }
  transferPlayer(pid, c.id, fee, wg, yr);
  news(`签下 ${p.cn}`,`${c.cn} ${isFA?"免签":"以 "+money(fee)} 从 ${seller?seller.cn:"自由市场"} 签下 ${p.cn}，签约 ${yr} 年，周薪 ${money(wg)}。`,"good");
  toast(`签约成功：${p.cn}`); closeModal(); render();
}
function renewContract(pid){
  const p=P(pid), c=UC();
  if(ownerOf(p)!==c.id){ toast("只有母队能和他谈续约","bad"); return; }
  const nw=Math.round(Math.max(p.wage*1.15, calcWage(p,c.rep,c)*(1+ (p.pa-p.ca)/300))/50)*50;
  openModal("续约 "+esc(p.cn),
    `<div class="hint">${esc(p.cn)} 目前周薪 ${money(p.wage)}，合同到 ${p.contract} 年。</div>
     <div style="margin-top:10px">他的要求：<b style="color:var(--acc)">${money(nw)}</b> / 周</div>
     <div style="margin-top:10px"><label>提供周薪（${CURSYM()}）</label><input id="rn-w" type="number" value="${toCurIn(nw)}" style="width:160px"></div>
     <div style="margin-top:8px"><label>年限</label><select id="rn-y"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
     <div class="hint" id="rn-cost" style="margin-top:10px"></div>`,
    `<button class="pri" onclick="doRenew(${pid},${nw})">确认续约</button><button onclick="closeModal()">取消</button>`);
  const w=$("#rn-w"); if(w) w.oninput=()=>updRenewCost(pid);
  updRenewCost(pid);
}
function updRenewCost(pid){
  const box=$("#rn-cost"); if(!box) return;
  const p=P(pid), c=UC(), w=($("#rn-w")&&$("#rn-w").value!=="")? fromCur($("#rn-w").value) : p.wage;
  const shareK=p.loan? (1-p.loan.wageShare):1, d=Math.round((w-p.wage)*shareK), inc=d*52;
  const cn=committedNext(c), cap=wageCap(c), has=p.contract>WORLD.season;
  const next=cn+(has? inc : w*52*shareK);
  box.innerHTML=`涨薪 ${money(d)}/周。下季工资承诺 ${money(cn)} → <b style="color:${next>cap?"var(--bad)":""}">${money(Math.round(next))}</b> / 上限 ${money(cap)}。`
    +(d<=0?"　<span class=\"hint\">原薪或降薪续约不占用额度。</span>":"");
}
function doRenew(pid,need){
  const p=P(pid), c=UC(); const w=Math.round(fromCur($("#rn-w").value)), y=+$("#rn-y").value;
  if(ownerOf(p)!==c.id) return;
  if((p.unrest||0)>=2){ toast(`${p.cn} 拒绝续约——他已要求转会`,"bad"); return; }
  if(w<need*0.95){ toast(`${p.cn} 拒绝了这份合同`,"bad"); return; }
  const shareK = p.loan? (1-p.loan.wageShare) : 1;
  const inc=(w-p.wage)*52*shareK;                 // 本季现金只多付涨薪这部分
  /* 合同还没到期的人已经在 committedNext 里，续约只新增涨薪；本季到期的人**不在**里面，
     续约他等于给下季新增一整份年薪——按增量算会让每季到期的人免检塞回下季承诺。*/
  const capAn=(p.contract>WORLD.season? inc : w*52*shareK);
  if(inc>0 || capAn>0){
    const r=canAfford(c, 0, inc, {capAnnual:capAn});
    if(!r.ok){ toast(affordMsg(c, r, 0, inc),"bad"); return; }
  }
  p.wage=w; p.contract=WORLD.season+y; p.morale=clamp(p.morale+10,5,100); p.value=calcValue(p);
  toast(`${p.cn} 已续约至 ${p.contract} 年`); closeModal(); render();
}
/* 挂牌弹窗。要价是玩家唯一能主动定价的地方：挂得越便宜，AI 的关注度和报价概率越高，
   到价的报价会照要价出（不再砍）。取消挂牌 / 改要价都会清掉「到价自动成交」。*/
function listPlayer(pid){
  const p=P(pid), u=UC();
  if(p.loan){ toast("租借球员的归属权在母队","bad"); return; }
  const ask=askingPrice(p), cur=p.listed? (p.askPrice||ask) : ask;

  openModal((p.listed?"修改要价 ":"挂牌出售 ")+esc(p.cn),
    `<div class="hint">${POS_CN[p.pos]} · ${p.age} 岁 · 能力 ${ovr(p)} · 本季 ${p.apps} 场 · 周薪 ${money(p.wage)} · 合同还剩 ${yrs} 年</div>
     <table style="font-size:13px;margin-top:8px;width:100%">
       <tr><td class="hint" style="width:82px">市场估价</td><td><b style="color:var(--acc)">${money(ask)}</b><span class="hint"> · 身价 ${money(p.value)}</span></td></tr>
       <tr><td class="hint">外界关注度</td><td>${Math.round(Math.min(100,heatOf(p)*100))}%${interestOf(pid).length?`<span class="hint"> · 追求者 ${interestOf(pid).map(it=>esc(C(it.club).short)).join("、")}</span>`:""}</td></tr>
     </table>
     <div style="margin-top:12px"><label>要价（${CURSYM()}）</label><input id="ls-price" type="number" value="${toCurIn(cur)}" style="width:180px"></div>
     <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
       <button class="sm" onclick="setAsk(${ask})">市价</button>
       <button class="sm" onclick="setAsk(${Math.round(ask*0.85/1000)*1000})">−15%</button>
       <button class="sm" onclick="setAsk(${Math.round(ask*0.70/1000)*1000})">−30%</button>
       <button class="sm" onclick="setAsk(${Math.round(ask*0.50/1000)*1000})">半价</button>
     </div>
     <div class="hint" id="ls-hint" style="margin-top:10px"></div>
     <div style="margin-top:10px"><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
       <input type="checkbox" id="ls-auto" ${p.autoSell?"checked":""}> 到价自动成交</label>
       <div class="hint">收到不低于要价的报价后，留一天给其他球队竞价，次日自动接受最高的那份。</div></div>
     <div class="hint" id="ls-fin" style="margin-top:10px"></div>`,
    `<button class="pri" onclick="submitList(${pid})">${p.listed?"保存":"挂牌"}</button>`
    +(p.listed?`<button onclick="unlistPlayer(${pid})">取消挂牌</button>`:"")
    +`<button onclick="closeModal()">取消</button>`);
  LS_PID=pid;
  const inp=$("#ls-price"); if(inp) inp.oninput=()=>updListHint(pid);
  updListHint(pid);
}
let LS_PID=null;                                  // 挂牌弹窗当前的球员，快捷按钮要用
function setAsk(v){ const i=$("#ls-price"); if(i){ i.value=toCurIn(v); updListHint(); } }
function updListHint(pid){
  const box=$("#ls-hint"), fin=$("#ls-fin"); if(!box) return;
  const u=UC(), pr=Math.max(0, fromCur(($("#ls-price")||{}).value||0));
  const p = P(pid!=null? pid : LS_PID);
  if(!p) return;
  const ask=askingPrice(p);
  const d=ask>0? clamp(1-pr/ask,-0.5,0.6) : 0;
  const base=heatOf({...p, listed:false});
  const add = d < -0.2 ? 0 : clamp(0.25 + d*0.6, 0, 0.6);
  const m=Math.round(Math.min(100,(base+add)*100));
  box.innerHTML=`要价 ${money(pr)}（市价的 ${ask?Math.round(pr/ask*100):0}%）· 预计关注度 → <b>${m}%</b>`
    + (d<-0.2? `　<span style="color:var(--warn)">高于市价两成以上，基本不会有人问</span>` : "");
  if(fin) fin.innerHTML=`成交后可用资金 +${money(pr)} + 剩余周薪 ${money(p.wage*remWeeks(u))}，下季工资承诺 −${money(p.wage*52)}。`;
}
function submitList(pid){
  const p=P(pid), u=UC();
  const pr=Math.max(5000, Math.round(fromCur(($("#ls-price")||{}).value||0)/1000)*1000);
  const auto=!!($("#ls-auto")&&$("#ls-auto").checked);
  const first=!p.listed;
  p.listed=true; p.untouchable=false;
  p.askPrice=pr; p.autoSell=auto;
  if(first) p.listedAbs=absDay();
  toast(first? `${p.cn} 已挂牌，要价 ${money(pr)}` : `${p.cn} 的要价改为 ${money(pr)}`);
  closeModal(); render();
}
function unlistPlayer(pid){
  const p=P(pid);
  p.listed=false; p.askPrice=null; p.autoSell=false; p.listedAbs=null;
  toast(`已取消 ${p.cn} 的挂牌`); closeModal(); render();
}

function seasonOccupancy(c){
  const home=WORLD.fixtures.filter(f=>f.played&&f.home===c.id&&f.attendance);
  if(!home.length) return null;
  const avg=home.reduce((s,f)=>s+f.attendance,0)/home.length;
  return {avg:Math.round(avg), pct:avg/c.cap, n:home.length};
}

function shrinkImage(file, size, cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas"); cv.width=size; cv.height=size;
        const ctx=cv.getContext("2d");
        if(!ctx){ cb(fr.result); return; }
        const r=Math.min(size/img.width, size/img.height);
        const w=img.width*r, h=img.height*r;
        ctx.clearRect(0,0,size,size);
        ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        cb(cv.toDataURL("image/png"));
      }catch(e){ cb(fr.result); }
    };
    img.onerror=()=>cb(null);
    img.src=fr.result;
  };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}
function importCrest(clubId, file){
  shrinkImage(file,128,url=>{
    if(!url){ toast("图片无法读取","bad"); return; }
    CUSTOM_CRESTS[C(clubId).en]=url;
    if(!saveCustomCrests()){ delete CUSTOM_CRESTS[C(clubId).en]; toast("浏览器存储空间不足，无法保存队徽","bad"); return; }
    toast(`${C(clubId).cn} 队徽已更新`); render();
  });
}
function matchClubByFilename(name){
  const base=name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[\s_\-]/g,"");
  let best=null,bl=0;
  WORLD.clubs.forEach(c=>{
    const keys=[c.en.toLowerCase().replace(/[\s_\-]/g,""), c.cn, c.short];
    keys.forEach(k=>{ const kk=k.toLowerCase().replace(/[\s_\-]/g,"");
      if(kk && (base.includes(kk)||kk.includes(base)) && kk.length>bl){ bl=kk.length; best=c; } });
  });
  return best;
}
function batchImport(files){
  if(!files.length) return;
  let done=0, ok=0, miss=[];
  files.forEach(f=>{
    const c=matchClubByFilename(f.name);
    if(!c){ miss.push(f.name); done++; if(done===files.length) finish(); return; }
    shrinkImage(f,128,url=>{
      if(url){ CUSTOM_CRESTS[c.en]=url; ok++; }
      done++; if(done===files.length) finish();
    });
  });
  function finish(){
    if(!saveCustomCrests()) toast("部分队徽未能保存：浏览器存储空间不足","bad");
    render();
    toast(`已匹配替换 ${ok} 支球队${miss.length?`，${miss.length} 个文件未识别`:""}`, miss.length?"warn":"");
  }
}

function bindMatchControls(){
  {
    $("#btn-play").onclick=()=>toggleplay();

    $("#btn-tac").onclick=()=>tacDialog();

    $("#btn-done").onclick=()=>completeMatch();
    document.querySelectorAll(".spd").forEach(b=>b.onclick=()=>{
      ANIM.speed=+b.dataset.s; if(WORLD.settings) WORLD.settings.matchSpeed=ANIM.speed;
      document.querySelectorAll(".spd").forEach(x=>x.classList.remove("on")); b.classList.add("on"); });
    drawPitch(); refreshMatchUI();
    // 比赛已结束时重建视图（旋转屏幕、切页返回等）：必须重新露出「完成比赛」按钮
    if(CURMATCH && CURMATCH.done){ ANIM.ended=true; ANIM.playing=false; onMatchEnd(); }

function toggleplay(force){
  const b=$("#btn-play"); if(!b) return;
  ANIM.playing = force!=null? force : !ANIM.playing;
  b.textContent=ANIM.playing?"⏸ 暂停":"▶ 继续";
  cancelAnimationFrame(ANIM.raf);                       // 先取消旧循环，避免重复 rAF 叠加
  if(ANIM.playing){ ANIM.last=performance.now(); ANIM.raf=requestAnimationFrame(animLoop); }
  else { drawPitch(1); refreshMatchUI(true); }
}
function animLoop(ts){
  const M=CURMATCH; if(!M||VIEW!=="match"){ ANIM.playing=false; return; }
  if(!ANIM.playing) return;                             // 已暂停的残留回调直接退出
  const dt=Math.min(120, ts-ANIM.last); ANIM.last=ts;
  ANIM.acc += dt*ANIM.speed;
  let steps=0;
  while(ANIM.acc>=PHASE_MS && !M.done && steps<40){
    ANIM.prev=ANIM.cur;
    const before=M.score[0]+M.score[1], ev0=M.events.length;
    stepMatch(M);
    ANIM.cur=M.frames[M.frames.length-1];
    ANIM.acc-=PHASE_MS; steps++;
    if(M.events.length>ev0){ const e=M.events[M.events.length-1]; ANIM.cap={text:e.text,cls:e.cls||e.type,at:performance.now()}; }
    if(M.score[0]+M.score[1]>before){ const g=M.events.slice().reverse().find(e=>e.type==="goal"); flashGoal(g?g.text.replace(/^⚽ 进球！/,"").replace(/\s+\d+-\d+$/,""):""); }
  }
  if(M.done && !ANIM.ended){ ANIM.ended=true; ANIM.playing=false;
    cancelAnimationFrame(ANIM.raf); onMatchEnd(); drawPitch(1); refreshMatchUI(true); return; }
  try{ drawPitch(clamp(ANIM.acc/PHASE_MS,0,1)); }catch(e){ if(!ANIM.drawErr){ ANIM.drawErr=1; console.error(e); toast("球场绘制出错："+e.message,"bad"); } }
  try{ refreshMatchUI(); }catch(e){ console.error(e); }
  if(ANIM.playing) ANIM.raf=requestAnimationFrame(animLoop);
}
function skipMatch(){
  const M=CURMATCH; if(!M) return;
  ANIM.playing=false; cancelAnimationFrame(ANIM.raf);
  M.record=false; M.autoUser=true;          // 托管：剩余时间由助教负责换人

}

function refreshMatchUI(force){
  const M=CURMATCH; if(!M) return;
  const setT=(el,t)=>{ if(el && el.textContent!==t) el.textContent=t; };
  setT($("#m-sc"), `${M.score[0]} : ${M.score[1]}`);
  const ck=$("#mclock"); if(ck){
    const mm=Math.min(Math.floor(M.t), M.half===1?45+M.addedTime:90+M.addedTime);
    setT(ck, M.done? "全场结束" : (mm>=90? `90+${mm-90}'` : mm>=45&&M.half===1? `45+${mm-45}'` : mm+"'"));
  }
  // 重的 DOM 更新（统计/事件流/球员条）限频：高速播放时每帧重写会把手机主线程占满，点击被吞
  const now=performance.now();
  if(!force && ANIM.playing && !M.done && now-(ANIM.uiT||0)<280) return;
  ANIM.uiT=now;
  const st=$("#m-stats");
  if(st){
    const s=M.stats, tot=(a,b)=>a+b||1;
    const line=(n,a,b)=>{
      const av=+a||0, bv=+b||0;
      const bar = (av+bv)>0
        ? `<div style="display:flex;height:4px;gap:2px"><div style="flex:${av};min-width:${av?3:0}px;background:var(--acc);border-radius:2px"></div>
           <div style="flex:${bv};min-width:${bv?3:0}px;background:#4a9eff;border-radius:2px"></div></div>`
        : `<div style="height:4px;background:#252d38;border-radius:2px"></div>`;
      return `<div style="margin-bottom:5px"><div style="display:flex;font-size:11px"><b style="width:40px">${a}</b>
      <span class="hint" style="flex:1;text-align:center">${n}</span><b style="width:40px;text-align:right">${b}</b></div>${bar}</div>`;
    };
    const sh=line("控球率",s[0].poss||Math.round(M.possTicks[0]/(M.possTicks[0]+M.possTicks[1]||1)*100),
                       s[1].poss||100-Math.round(M.possTicks[0]/(M.possTicks[0]+M.possTicks[1]||1)*100))
      +line("射门",s[0].shots,s[1].shots)+line("射正",s[0].sot,s[1].sot)
      +line("xG",s[0].xg.toFixed(2),s[1].xg.toFixed(2))
      +line("角球",s[0].corners,s[1].corners)+line("犯规",s[0].fouls,s[1].fouls);
    if(st._h!==sh){ st._h=sh; st.innerHTML=sh; }
  }
  const fd=$("#mfeed");
  if(fd && ANIM.evShown<M.events.length){
    for(let i=ANIM.evShown;i<M.events.length;i++){
      const e=M.events[i];
      if(["blk","off"].includes(e.type)&&rnd()<0.5) continue;
      const d=el("div","ev "+(e.cls||""),`<span class="m">${Math.floor(e.t)}'</span><span>${esc(e.text)}</span>`);
      fd.appendChild(d);
    }
    ANIM.evShown=M.events.length; fd.scrollTop=fd.scrollHeight;
  }
  const bs=$("#btn-sub"); if(bs && M.userSide>=0){ const t=`🔁 换人 (${5-M.subsMade[M.userSide]})`; if(bs.textContent!==t) bs.textContent=t; }  // 只在变化时改，iOS 上每帧改文本会吞掉同一行按钮的点击
  const pl=$("#m-players");
  if(pl){
    const mk=side=>`<div class="col"><div class="hint" style="margin-bottom:3px">${esc(C(side===0?M.h:M.a).cn)}${side===M.userSide?' <span style="opacity:.6">（点球员可直接换人）</span>':''}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${M.teams[side].men.filter(m=>!m.off).map((m,i)=>
        `<span class="pill" ${side===M.userSide&&!M.done?`onclick="subDialog(${i})" title="换下 ${esc(nm(m))}"`:""} style="font-size:11px;${side===M.userSide&&!M.done?'cursor:pointer;':''}${m.cond<60?'border-color:#f0a020':''}">${POS_CN[m.pos]} ${esc(nm(m))}
         <b style="color:${m.cond>70?'#00d47e':m.cond>50?'#f0a020':'#e5484d'}">${Math.round(m.cond)}</b>
         <span style="color:var(--gold)">${m.rating.toFixed(1)}</span>${m.goals?" ⚽".repeat(m.goals):""}${m.yellow?" 🟨":""}</span>`).join("")}</div></div>`;
    const html=mk(0)+mk(1); if(pl._h!==html){ pl._h=html; pl.className="row"; pl.innerHTML=html; }
  }
}

// ---------- Canvas 渲染 ----------
function drawPitch(alpha){
  const cv=$("#pitch"); if(!cv) return;
  const ctx=cv.getContext?cv.getContext("2d"):null; if(!ctx) return;
  const W=cv.width, H=cv.height;
  const M=CURMATCH;
  const mx=22, my=22, pw=W-mx*2, ph=H-my*2;
  const X=x=>mx+x/PW*pw, Y=y=>my+y/PH*ph;
  // 草地
  ctx.fillStyle="#12331f"; ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ ctx.fillStyle= i%2? "#15391f":"#123016";
    ctx.fillRect(mx+i*pw/10, my, pw/10, ph); }
  ctx.strokeStyle="rgba(255,255,255,.42)"; ctx.lineWidth=2.4;
  ctx.strokeRect(mx,my,pw,ph);
  ctx.beginPath(); ctx.moveTo(X(52.5),my); ctx.lineTo(X(52.5),my+ph); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(52.5),Y(34), 9.15/PW*pw, 0, 6.2832); ctx.stroke();
  // 禁区
  [[0,1],[PW,-1]].forEach(([bx,dir])=>{
    ctx.strokeRect(X(bx)- (dir<0?16.5/PW*pw:0), Y(34-20.15), 16.5/PW*pw, 40.3/PH*ph);
    ctx.strokeRect(X(bx)- (dir<0?5.5/PW*pw:0), Y(34-9.16), 5.5/PW*pw, 18.32/PH*ph);
    ctx.fillStyle="rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.arc(X(bx+dir*11),Y(34),3,0,6.2832); ctx.fill();
    // 球门
    ctx.fillStyle="rgba(255,255,255,.75)";
    ctx.fillRect(X(bx)-(dir<0?0:5), Y(34-3.66), 5, 7.32/PH*ph);
  });
  if(!M) return;
  const a = alpha==null?1:alpha;
  const now=performance.now();
  if(!ANIM.cwT || performance.now()-ANIM.cwT>500){ ANIM.cw=cv.clientWidth||W; ANIM.cwT=performance.now(); }
  const fs=clamp(W/(ANIM.cw||W),1,2.2);                   // 小屏上字幕按显示比例放大（clientWidth 限频读取，避免每帧强制布局）
  const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;      // 球员位移缓动
  const A=ANIM.prev, B=ANIM.cur;
  const kind=(B&&B.k)||"";
  const flight=kind==="pass"||kind==="cross"||kind==="shoot";
  let ball, pts, dist=0;
  if(B&&A&&A.p.length===B.p.length){
    const ea=ease(a), ba=flight? Math.min(1,a*1.15) : ea;   // 传射直线匀速略快，带球随人缓动
    ball={x:A.b.x+(B.b.x-A.b.x)*ba, y:A.b.y+(B.b.y-A.b.y)*ba};
    dist=Math.hypot(B.b.x-A.b.x,B.b.y-A.b.y);
    pts=B.p.map((q,i)=>[A.p[i][0]+(q[0]-A.p[i][0])*ea, A.p[i][1]+(q[1]-A.p[i][1])*ea]);
  } else if(B){ ball=B.b; pts=B.p; }
  else { ball=M.ball; pts=M.teams.flatMap(T=>T.men.filter(m=>!m.off).map(m=>[m.x,m.y])); }
  const men=M.teams.flatMap((T,s)=>T.men.filter(m=>!m.off).map(m=>({m,s})));
  const ownerIdx = (B&&B.o!=null&&B.o>=0)? B.o : men.findIndex(i=>i.m===M.ballOwner);
  // 控球方提示（顶部小角标）
  if(B){ const pc=C(B.s===0?M.h:M.a);
    ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(mx+6,my+6,118*fs,20*fs);
    ctx.fillStyle=pc.c1; ctx.beginPath(); ctx.arc(mx+6+11*fs,my+6+10*fs,6*fs,0,6.2832); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font=`bold ${11*fs}px -apple-system,sans-serif`; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText((B.s===0?"◀ ":"")+pc.short+" 控球"+(B.s===1?" ▶":""), mx+6+22*fs, my+6+10*fs); }
  // 球路：传球 / 传中 / 射门 / 带球
  if(A&&B&&dist>4&&(flight||kind==="drib")){
    const col= kind==="shoot"?"255,90,90":kind==="cross"?"255,220,90":"255,255,255";
    ctx.save(); ctx.setLineDash(kind==="drib"?[2,6]:[7,5]); ctx.lineWidth=kind==="shoot"?2.6:1.5;
    ctx.strokeStyle=`rgba(${col},${(0.6*(1-a*0.5)).toFixed(2)})`;
    ctx.beginPath(); ctx.moveTo(X(A.b.x),Y(A.b.y)); ctx.lineTo(X(ball.x),Y(ball.y)); ctx.stroke(); ctx.restore();
    if(kind==="shoot"){ ctx.fillStyle=`rgba(255,90,90,${(0.5*(1-a)).toFixed(2)})`; ctx.beginPath(); ctx.arc(X(A.b.x),Y(A.b.y),9+a*10,0,6.2832); ctx.fill(); }
  }
  // 球的拖尾
  const tr=ANIM.trail||(ANIM.trail=[]);
  const lt=tr[tr.length-1];
  if(!lt||Math.hypot(lt[0]-ball.x,lt[1]-ball.y)>0.35) tr.push([ball.x,ball.y]);
  if(tr.length>16) tr.splice(0,tr.length-16);
  tr.forEach((q,i)=>{ const f=(i+1)/tr.length; ctx.fillStyle=`rgba(255,255,255,${(0.06+f*0.22).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(X(q[0]),Y(q[1]),1.2+f*2.4,0,6.2832); ctx.fill(); });
  // 阴影
  pts.forEach((q,i)=>{ if(!men[i])return;
    ctx.fillStyle="rgba(0,0,0,.34)"; ctx.beginPath(); ctx.arc(X(q[0])+2,Y(q[1])+3,10,0,6.2832); ctx.fill(); });
  pts.forEach((q,i)=>{
    const info=men[i]; if(!info) return;
    const club=C(info.s===0?M.h:M.a);
    const isOwner = i===ownerIdx;
    const r=info.m.pos==="GK"?10:11, cx=X(q[0]), cy=Y(q[1]);
    // 体能环
    const cond=info.m.cond;
    ctx.beginPath(); ctx.arc(cx,cy,r+3.2,-Math.PI/2,-Math.PI/2+6.2832*cond/100);
    ctx.strokeStyle= cond>70?"rgba(0,212,126,.8)":cond>50?"rgba(240,160,32,.85)":"rgba(229,72,77,.95)"; ctx.lineWidth=2.2; ctx.stroke();
    // 持球人光圈（呼吸）
    if(isOwner){ const pulse=0.5+0.5*Math.sin(now/140);
      ctx.beginPath(); ctx.arc(cx,cy,r+7+pulse*3,0,6.2832); ctx.strokeStyle=`rgba(255,255,255,${(0.35+pulse*0.35).toFixed(2)})`; ctx.lineWidth=2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(cx,cy, r, 0, 6.2832);
    ctx.fillStyle= info.m.pos==="GK"? "#f0e14a" : club.c1;
    ctx.fill();
    ctx.lineWidth= isOwner?3.2:1.6;
    ctx.strokeStyle= isOwner? "#ffffff" : (info.s===0? "rgba(255,255,255,.65)":"rgba(0,0,0,.6)");
    ctx.stroke();
    ctx.fillStyle= info.m.pos==="GK"? "#111" : club.c2;
    ctx.font="bold 10px -apple-system,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(String(POSITIONS.indexOf(info.m.pos)+1), cx, cy);
    // 黄牌 / 受伤标记
    if(info.m.yellow){ ctx.fillStyle="#ffd24a"; ctx.fillRect(cx+r-3,cy-r-4,5,7); }
    // 名字
    ctx.fillStyle="rgba(255,255,255,.82)"; ctx.font="9.5px -apple-system,sans-serif";
    ctx.fillText(nm(info.m).slice(0,4), cx, cy+20);
  });
  // 球（传中/远传/射门时带弧线高度）
  let lift=0;
  if(A&&flight&&dist>10) lift=Math.sin(Math.PI*Math.min(1,a*1.15))*Math.min(1,dist/38)*(kind==="shoot"?0.5:1);
  const bx=X(ball.x), by=Y(ball.y);
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(bx+2+lift*6,by+3+lift*10,5.2,0,6.2832); ctx.fill();
  const br=6.2*(1+lift*0.9);
  ctx.beginPath(); ctx.arc(bx,by-lift*24,br,0,6.2832);
  ctx.fillStyle="#ffffff"; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle="#111"; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx-br*0.3,by-lift*24-br*0.3,br*0.28,0,6.2832); ctx.fillStyle="#111"; ctx.fill();
  // 事件字幕（底部居中，淡入淡出）
  if(ANIM.cap){
    const age=now-ANIM.cap.at;
    if(age<2800){
      const al= age<180? age/180 : age>2300? (2800-age)/500 : 1;
      const cl=ANIM.cap.cls||"";
      const col= cl==="goal"?"#00d47e": cl==="chance"?"#ffd24a": cl==="hurt"?"#ff6b6b": cl==="card"?"#ffd24a": cl==="sys"?"#9ab":"#fff";
      ctx.font=`bold ${15*fs}px -apple-system,sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
      const lim=fs>1.5?22:36;
      const txt=ANIM.cap.text.length>lim? ANIM.cap.text.slice(0,lim)+"…" : ANIM.cap.text;
      const tw=ctx.measureText(txt).width+26*fs, th=26*fs;
      ctx.globalAlpha=al;
      ctx.fillStyle="rgba(0,0,0,.62)";
      const rx=W/2-tw/2, ry=H-my-6-th;
      ctx.beginPath(); ctx.roundRect? ctx.roundRect(rx,ry,tw,th,7) : ctx.rect(rx,ry,tw,th); ctx.fill();
      ctx.fillStyle=col; ctx.fillText(txt, W/2, ry+th/2);
      ctx.globalAlpha=1;
    } else ANIM.cap=null;
  }
}

// ---------- 换人 / 临场战术 ----------
let SUBQ=[], SUBOUT=null, SUBRESUME=false;
function subDialog(preOut){
  const M=CURMATCH; if(!M||M.done) return; const side=M.userSide; if(side<0) return;
  if(ANIM.playing){ toggleplay(false); SUBRESUME=true; } else SUBRESUME=false;
  SUBQ=[]; SUBOUT=(preOut!=null&&preOut>=0)? preOut : null;
  renderSubDialog();
}
function subLeft(){ const M=CURMATCH; return 5-M.subsMade[M.userSide]-SUBQ.length; }
function renderSubDialog(){
  const M=CURMATCH, side=M.userSide, T=M.teams[side], club=C(T.cid);
  const on=subOuts(T);
  const queuedOut=SUBQ.map(q=>q.out), queuedIn=SUBQ.map(q=>q.in);
  const bench=club.subs.filter(id=>P(id)&&!T.benchUsed.includes(id)&&P(id).injury<=0&&!queuedIn.includes(id));
  const slots=FORMATIONS[T.form];
  const outM = SUBOUT!=null? on[SUBOUT]:null;
  const want = outM? slots[outM.slot][0] : null;
  const benchSorted=bench.slice().sort((a,b)=> want? playerScore(P(b),want)-playerScore(P(a),want) : ovr(P(b))-ovr(P(a)));
  const body=`
   <div class="hint" style="margin-bottom:8px">点左侧要换下的球员，再点右侧替补，可连续配好几组后一并确认。本次还可换 <b style="color:var(--acc)">${subLeft()}</b> 人。</div>
   <div class="row">
    <div class="col"><div class="hint" style="margin-bottom:5px">场上球员</div>
     ${on.map((m,i)=>{ const q=queuedOut.includes(m);
       return `<div class="clickable" ${q?'':`onclick="pickOut(${i})"`} style="display:flex;gap:8px;padding:5px;border-bottom:1px solid #1d242e;border-radius:4px;${q?'opacity:.35;':''}${SUBOUT===i?'background:#16301f;':''}">
        <span class="tag t-${POS_GRP[m.pos]}">${POS_CN[m.pos]}</span><span style="flex:1">${esc(nm(m))}${m.yellow?' 🟨':''}${m.off?' <span class="tag t-b">🚑 已伤退</span>':''}</span>
        <span style="color:${m.cond>70?'#00d47e':m.cond>50?'#f0a020':'#e5484d'}">${Math.round(m.cond)}%</span>
        <span style="color:var(--gold);min-width:26px;text-align:right">${m.rating.toFixed(1)}</span></div>`;}).join("")}</div>
    <div class="col"><div class="hint" style="margin-bottom:5px">替补席${want?`（换下 ${POS_CN[want]}，已按适配排序）`:""}</div>
     ${benchSorted.map(id=>{const p=P(id); const fit=want?Math.round(posFit(p,want)*100):null;
       return `<div class="clickable" onclick="pickIn(${id})" style="display:flex;gap:8px;padding:5px;border-bottom:1px solid #1d242e;${SUBOUT==null?'opacity:.55':''}">
        <span class="tag t-${POS_GRP[p.pos]}">${POS_CN[p.pos]}</span><span style="flex:1;white-space:nowrap">${esc(p.cn)}</span>

   存档存储层：IndexedDB → Cache Storage → localStorage 三层兜底
   任何一层活着就存得住。正文压缩后再写（体积约 1/10），
   索引（meta）单独写、三层都写，绝不因为正文写失败就丢掉。
   鸿蒙/华为浏览器上 IndexedDB 可能被隐私策略拦掉，这是本层存在的原因。
   ========================================================= */
const DB_NAME="fmweb_db", DB_STORE="saves";
const CACHE_NS="fmweb-saves", CACHE_BASE="./__fmsave__/";
let STORE_TIER="";        // 上次成功写入的层，状态栏与自检显示用
let SAVE_FAILS=0;         // 连续保存失败次数
let SAVE_ERR="";          // 最近一次失败原因
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no-idb"));
    let r;
    try{ r=indexedDB.open(DB_NAME,1); }catch(e){ return rej(e); }
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("idb-open"));
    r.onblocked=()=>rej(new Error("blocked"));
    setTimeout(()=>rej(new Error("idb-timeout")),8000);   // 有的内核会卡住不回调
  });
}
function idbSet(k,v){ return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,"readwrite"); tx.objectStore(DB_STORE).put(v,k);
  tx.oncomplete=()=>{db.close();res(true);}; tx.onerror=()=>{db.close();rej(tx.error);}; tx.onabort=()=>{db.close();rej(tx.error||new Error("abort"));}; })); }
function idbGet(k){ return idbOpen().then(db=>new Promise((res,rej)=>{

  q.onsuccess=()=>{db.close();res(q.result);}; q.onerror=()=>{db.close();rej(q.error);}; })); }
function idbDel(k){ return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,"readwrite"); tx.objectStore(DB_STORE).delete(k);
  tx.oncomplete=()=>{db.close();res(true);}; tx.onerror=()=>{db.close();rej(tx.error);}; })); }

function cacheOK(){ return typeof caches!=="undefined" && window.isSecureContext!==false; }
async function cacheSet(k,v){ if(!cacheOK()) throw new Error("no-cache");
  const c=await caches.open(CACHE_NS); await c.put(CACHE_BASE+k,new Response(v)); return true; }
async function cacheGet(k){ if(!cacheOK()) throw new Error("no-cache");
  const c=await caches.open(CACHE_NS); const r=await c.match(CACHE_BASE+k); return r? await r.text() : null; }
async function cacheDel(k){ if(!cacheOK()) return;
  const c=await caches.open(CACHE_NS); await c.delete(CACHE_BASE+k); }
/* ---------- 压缩：几 MB 的存档一般压到几百 KB ----------
   老内核（Chrome 80~102，如百度 App、部分国产浏览器）有 CompressionStream 但不认 "deflate-raw"，
   构造时直接抛错——原来只判断有没有这个类，结果每次存档都在压缩这步失败、三层一层都没写。
   现在按 deflate-raw → deflate → gzip 逐个试，用第一个能用的；压缩出任何错都降级成原文，绝不挡住存档。
   封装头：Z1 deflate-raw / Z2 deflate / Z3 gzip / Z0 原文 / 无头 = 更老版本的裸 JSON */
const Z_FMTS=[["Z1:","deflate-raw"],["Z2:","deflate"],["Z3:","gzip"]];
const Z_HDR2FMT={"Z1:":"deflate-raw","Z2:":"deflate","Z3:":"gzip"};
function zFmtOK(f){
  if(typeof CompressionStream==="undefined" || typeof DecompressionStream==="undefined") return false;
  try{ new CompressionStream(f); new DecompressionStream(f); return true; }catch(e){ return false; }
}
const Z_USABLE=Z_FMTS.filter(([h,f])=>zFmtOK(f));
const CAN_Z=Z_USABLE.length>0;
async function zipSave(str){
  for(const [h,f] of Z_USABLE){
    try{
      const buf=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream(f))).arrayBuffer();
      const b=new Uint8Array(buf); let out="";
      for(let i=0;i<b.length;i+=8192) out+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
      return h+out;
    }catch(e){ /* 这个格式在本内核里跑不通，换下一个 */ }

async function unzipSave(p){

  if(!f) return p;                              // 没有封装头 = 老版本的裸 JSON，直接用
  if(!zFmtOK(f)) throw new Error("这台设备的浏览器不支持解压该存档（"+f+"），请在原设备导出存档文件再导入");
  const s=p.slice(3), b=new Uint8Array(s.length);

/* ---------- 存档指纹：正文和索引都被清掉时，靠它认出「曾经有过存档」---------- */
const FPKEY="fmweb_save_fp";
async function writeFP(meta,bytes){
  const fp=JSON.stringify({at:Date.now(),club:meta.club,day:meta.day,season:meta.season,bytes});

/* ---------- 统一读写 ----------
   三层每次都写，不是「谁失败才轮到谁」。压缩后存档不到 1MB，localStorage 装得下，
   而它恰恰是这类浏览器最不爱清的一层——Cache Storage 名字里带 cache，清理缓存时第一个遭殃。 */
let META_CACHE=null;
async function storeSave(str, meta){
  const payload=await zipSave(str);
  const mj=JSON.stringify({...meta, mb:(str.length/1048576).toFixed(2),
                           zmb:(payload.length/1048576).toFixed(2), at:Date.now()});
  const tiers=[]; let lastErr=null;
  try{ await idbSet(SAVEKEY,payload); await idbSet(METAKEY,mj); tiers.push("IndexedDB"); }
  catch(e){ lastErr=e; }
  try{ localStorage.setItem(SAVEKEY,payload); localStorage.setItem(METAKEY,mj); tiers.push("localStorage"); }
  catch(e){ lastErr=lastErr||e;
    try{ localStorage.removeItem(SAVEKEY); localStorage.setItem(METAKEY,mj); }catch(_){} }  // 正文塞不下也要留索引
  try{ await cacheSet(SAVEKEY,payload); await cacheSet(METAKEY,mj); tiers.push("Cache"); }
  catch(e){ lastErr=lastErr||e; }
  try{ META_CACHE=JSON.parse(mj); }catch(e){}
  if(!tiers.length) throw new Error("三层存储全部写入失败"+(lastErr&&lastErr.message?("："+lastErr.message):""));
  await writeFP(meta,payload.length);

/* ---------- 自愈：读档时把缺失的层补回去 ----------
   Service Worker 升级会连带清掉 Cache 桶，浏览器也可能单独清某一层。
   每次成功读档都补一次，存档只会越补越全，不会越掉越少。 */
async function healSave(){
  const have={idb:null,ls:null,cache:null};
  try{ have.idb=await idbGet(SAVEKEY)||null; }catch(e){}
  try{ have.ls=localStorage.getItem(SAVEKEY)||null; }catch(e){}
  try{ have.cache=await cacheGet(SAVEKEY)||null; }catch(e){}
  const payload=have.idb||have.ls||have.cache;
  if(!payload) return [];
  let mj=null;
  try{ mj=localStorage.getItem(METAKEY); }catch(e){}
  if(!mj){ try{ mj=await idbGet(METAKEY); }catch(e){} }
  if(!mj){ try{ mj=await cacheGet(METAKEY); }catch(e){} }
  const fixed=[];
  if(!have.idb){ try{ await idbSet(SAVEKEY,payload); if(mj) await idbSet(METAKEY,mj); fixed.push("IndexedDB"); }catch(e){} }
  if(!have.ls){ try{ localStorage.setItem(SAVEKEY,payload); if(mj) localStorage.setItem(METAKEY,mj); fixed.push("localStorage"); }catch(e){} }
  if(!have.cache){ try{ await cacheSet(SAVEKEY,payload); if(mj) await cacheSet(METAKEY,mj); fixed.push("Cache"); }catch(e){} }
  return fixed;
}
async function readRawSave(){
