function inTransferWindow(){
  const d=WORLD.day;                     // 8/1 起
  const dt=dateOf(d), m=dt.getMonth()+1;
  return m===8 || (m===1);
}
function windowName(){ const m=dateOf(WORLD.day).getMonth()+1; return m===8?"夏窗":m===1?"冬窗":null; }

function wageBill(c){ return c.squad.reduce((s,i)=>s+P(i).wage,0)*52; }
function askingPrice(p){
  const c=p.clubId>=0?C(p.clubId):null;
  let base=p.value;
  if(!c) return Math.round(base*0.30/1000)*1000;
  const same=c.squad.map(i=>P(i)).filter(q=>q.pos===p.pos).sort((a,b)=>b.ca-a.ca);
  const isKey = same.indexOf(p)===0;
  let mult = 1.04 + (isKey?0.28:0) + (p.age<24?0.20:0) + c.rep/520;
  const yrs=p.contract-WORLD.season;
  if(yrs<=0) mult*=0.30; else if(yrs===1) mult*=0.66;
  if(p.morale<40) mult*=0.86;
  if(p.injury>20) mult*=0.80;
  mult *= 1 + perfIndex(p)*0.35;                       // 表现突出 → 溢价
  if(p.listed && p.clubId!==WORLD.userClub) mult*=0.85; // AI 挂牌 → 折价
  return Math.max(5000, Math.round(base*mult/1000)*1000);
}
// 必须是确定性的：报价弹窗里展示的要求，与提交时校验的要求要完全一致
function wageDemand(p, club){
  const w=calcWage(p, club.rep);
  const h=(hashStr(p.id+"|"+club.id+"|"+p.contract)%1000)/1000;
  return Math.round(Math.max(p.wage*1.06, w*(0.95+h*0.35))/50)*50;
}
function squadNeed(club){
  // 返回最薄弱的位置
  let worst=null, ws=1e9;
  SQUAD_TEMPLATE.forEach(([pos,n])=>{
    const arr=club.squad.map(i=>P(i)).filter(p=>p.pos===pos||(p.pos2||[]).includes(pos));
    const s = arr.length? arr.sort((a,b)=>b.ca-a.ca)[0].ca * (arr.length>=n-1?1:0.75) : 0;
    if(s<ws){ws=s;worst=pos;}
  });
  return {pos:worst, cur:ws};
}
function canSell(club,p){
  const same=club.squad.filter(i=>P(i).pos===p.pos);
  return same.length>2;
}
function transferPlayer(pid, toClubId, fee, wage, years){
  const p=P(pid), to=C(toClubId);
  const from = p.clubId>=0? C(p.clubId):null;
  if(from){ from.squad=from.squad.filter(i=>i!==pid); addMoney(from, fee, `出售 ${p.cn}`);
            from.finance.transferBudget+=Math.round(fee*0.7); autoPickLineup(from); }
  else WORLD.freeAgents=WORLD.freeAgents.filter(i=>i!==pid);
  addMoney(to, -fee, `引进 ${p.cn}`);
  to.finance.transferBudget=Math.max(0,to.finance.transferBudget-fee);
  to.squad.push(pid); p.clubId=toClubId; p.wage=wage; p.contract=WORLD.season+years; p.joinedAbs=WORLD.season*400+WORLD.day;
  p.morale=clamp(p.morale+8,5,100); p.value=calcValue(p);
  autoPickLineup(to);
  WORLD.transferLog.unshift({d:WORLD.day, s:WORLD.season, pid, name:p.cn, pos:p.pos,
    from:from?from.id:-1, to:toClubId, fee});
  if(WORLD.transferLog.length>200) WORLD.transferLog.length=200;
}
function clubSpend(c){ return Math.min(c.finance.transferBudget, Math.max(0,c.finance.balance)+Math.pow(c.rep,3)*25); }
function windowEndDay(){
  const dt=dateOf(WORLD.day);
  const end=new Date(dt.getFullYear(), dt.getMonth()+1, 0);
  return Math.round((end-dateOf(0))/864e5);
}
function windowDaysLeft(){ return inTransferWindow()? windowEndDay()-WORLD.day+1 : 0; }
function nextWindowIn(){
  for(let d=WORLD.day+1; d<WORLD.day+400; d++){ const m=dateOf(d).getMonth()+1; if(m===8||m===1) return d-WORLD.day; }
  return 0;
}
function isDeadline(){ return inTransferWindow() && windowEndDay()-WORLD.day<=2; }
function absDay(){ return WORLD.season*400+WORLD.day; }

// 表现指数 0~1：综合本季（样本不足时参考上季）评分、进球助攻、全场最佳
function perfIndex(p){
  const cur={apps:p.apps,goals:p.goals,assists:p.assists,rt:p.apps?p.ratingSum/p.apps:0,motm:p.motm};
  const last=p.last||{apps:0,goals:0,assists:0,rt:0,motm:0};
  const g=POS_GRP[p.pos];
  const score=st=>{
    if(!st.apps) return 0;
    const rt=clamp((st.rt-6.7)/1.0,0,1);
    const ga=(st.goals+st.assists*0.6)/st.apps;
    const atk= g==="fw"? clamp(ga/0.7,0,1) : g==="mf"? clamp(ga/0.4,0,1) : g==="df"? clamp(ga/0.18,0,1) : 0;
    const motm=clamp(st.motm/st.apps/0.18,0,1);
    const base = (g==="gk"||g==="df") ? rt*0.8+motm*0.2 : rt*0.5+atk*0.32+motm*0.18;
    return Math.min(1, base) * Math.min(1, st.apps/14);
  };
  const w=Math.min(1, cur.apps/12);
  return clamp(score(cur)*w + score(last)*(1-w), 0, 1);
}
function perfTag(p){
  const x=perfIndex(p);
  return x>=0.75?'<span class="tag t-ok">🔥 火热</span>':x>=0.5?'<span class="tag t-i">状态出色</span>':'';
}

// ---------- 外界对玩家球员的关注 ----------
function interestList(){ return WORLD.interest=(WORLD.interest||[]); }
function interestOf(pid){ return interestList().filter(it=>it.pid===pid); }
function heatOf(p){
  const u=UC();
  const perf=perfIndex(p);
  const star=clamp((p.ca-u.rep*1.85)/28,0,1);          // 能力明显高于球队层级
  const young=p.age<=23? clamp((p.pa-p.ca)/45,0,0.7):0;  // 潜力股
  let heat=perf*0.65 + star*0.35 + young*0.3;
  if(p.age>=31) heat*=0.5; if(p.age>=33) heat*=0.4;
  if(p.injury>40) heat*=0.5;
  if(p.listed) heat+=0.35;
  if(p.untouchable) heat*=0.4;
  return clamp(heat,0,1.4);
}
function addInterest(p, force){
  const u=UC(); const cur=interestOf(p.id);
  if(cur.length>=4) return false;
  const heat=heatOf(p);
  if(!force && heat<0.2) return false;
  if(absDay()-(p.joinedAbs!=null?p.joinedAbs:-999)<120) return false;   // 新援短期内不会被挖角
  if(!force && rnd() > heat*0.45) return false;
  const ask=askingPrice(p);
  const pool=WORLD.clubs.filter(c=>c.id!==u.id && !cur.some(e=>e.club===c.id)
    && c.squad.length<29
    && p.ca < c.rep*2.05+42 && p.ca > c.rep*1.45
    && clubSpend(c) >= ask*(p.untouchable?1.1:0.7));
  if(!pool.length) return false;
  // 声望越高的俱乐部越可能盯上明星
  const w=pool.map(c=>Math.pow(c.rep,1.5)*(c.rep>u.rep?1.6:1));
  let r=rnd()*w.reduce((a,b)=>a+b,0), b=pool[0];
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0){ b=pool[i]; break; } }
  interestList().push({pid:p.id, club:b.id, heat:+heat.toFixed(2), since:absDay()});
  if(b.rep>u.rep+4 || heat>=0.5 || force)
    news(`${b.cn} 盯上 ${p.cn}`,
      `有消息称 ${b.cn} 的球探多次现场考察 ${p.cn}${perfIndex(p)>=0.5?"，他近来的出色表现引起了广泛关注":""}。${inTransferWindow()?"预计很快会有正式报价。":`他们可能在约 ${nextWindowIn()} 天后开启的转会窗口出手。`}`,"info");
  return true;
}
function updateInterest(){
  const u=UC();
  WORLD.interest=interestList().filter(it=>{ const p=P(it.pid); return p && p.clubId===u.id && WORLD.clubs[it.club] && absDay()-it.since<170; });
  u.squad.map(i=>P(i)).forEach(p=>{
    addInterest(p,false);
    if((p.unrest||0)>=2 && p.morale>30) p.morale-=2;   // 要求转会的球员士气持续走低
  });
}

// ---------- AI 向玩家报价（转会窗内每日） ----------
function aiOffersToUser(){
  const u=UC(); WORLD.offers=WORLD.offers||[];
  const dl=isDeadline();
  interestList().forEach(it=>{
    const p=P(it.pid), b=WORLD.clubs[it.club]; if(!p||!b||p.clubId!==u.id) return;
    if(WORLD.offers.some(o=>o.pid===p.id&&o.club===b.id)) return;
    if(b.squad.length>=29 || WORLD.offers.length>=10) return;
    const heat=heatOf(p);
    let pr = 0.05 + heat*0.09; if(dl) pr*=2.5; if(p.listed) pr+=0.06;
    if(rnd()>pr) return;
    const ask=askingPrice(p), spend=clubSpend(b);
    if(spend < ask*0.8) return;
    // 报价倍数：表现越好、买家越大 → 溢价越高；挂牌略压价；非卖品要出天价
    let mult = 0.9 + perfIndex(p)*0.5 + Math.max(0,b.rep-u.rep)/55 + rnd()*0.25;
    if(p.listed) mult-=0.12;
    if(p.untouchable) mult+=0.3;
    let fee=Math.round(Math.min(ask*mult, spend)/1e4)*1e4;
    const top=WORLD.offers.filter(o=>o.pid===p.id).sort((a,b)=>b.fee-a.fee)[0];
    if(top){ fee=Math.max(fee, Math.round(top.fee*(1.06+rnd()*0.12)/1e4)*1e4); if(fee>spend || fee>ask*2.2) return; }
    if(fee < ask*0.75) return;
    fee=Math.min(fee, Math.round(ask*2.2/1e4)*1e4);
    const wage=wageDemand(p,b);
    if(wageBill(b)+wage*52 > b.finance.wageBudget*1.05) return;
    const max=Math.round(Math.min(spend, fee*(1.12+heat*0.35))/1e4)*1e4;
    WORLD.offers.push({pid:p.id, club:b.id, fee, max, wage, day:WORLD.day, until:Math.min(WORLD.day+14, windowEndDay())});
    const eager = b.rep>u.rep+8;
    news(top?`${b.cn} 加入争夺 ${p.cn}`:`${b.cn} 报价 ${p.cn}`,
      `${b.cn} 为 ${p.cn} 提交了 ${money(fee)} 的正式报价${top?`，高于 ${C(top.club).cn} 此前的 ${money(top.fee)}`:""}${fee>=ask*1.3?"，远超市场估价":""}。${eager?"据悉球员本人对加盟这家豪门很感兴趣。":""}请到「转会」页面处理，${dl?"转会窗即将关闭":"14 天内有效"}。`,"warn");
  });
}

// ---------- AI 之间的转会（转会窗内每日） ----------
function bigTransferNews(p, from, to, fee){
  const u=UC();
  if(!WORLD.aiNews || WORLD.aiNews.d!==WORLD.day) WORLD.aiNews={d:WORLD.day,n:0};
  if(WORLD.aiNews.n>=2) return;
  const bar=Math.max(3e6, Math.pow(u.rep,3)*10);
  const big = fee>=2.5e7 || (to.lg===u.lg && fee>=bar) || (from && from.lg===u.lg && fee>=bar);
  if(!big) return;
  WORLD.aiNews.n++;
  news(`转会：${p.cn} 加盟 ${to.cn}`,
    `${to.cn} 以 ${money(fee)} 从 ${from?from.cn:"自由市场"} 签下 ${POS_CN[p.pos]} ${p.cn}（${p.age} 岁，能力 ${ovr(p)}）${perfIndex(p)>=0.5?"，他近期状态火热":""}。`,"info");
}
function aiTransferRound(tries){
  const u=UC();
  if(tries==null) tries = isDeadline()? ri(6,10) : ri(2,5);
  for(let k=0;k<tries;k++){
    const buyer=WORLD.clubs[Math.floor(rnd()*60)];
    if(buyer.id===u.id) continue;
    if(buyer.squad.length>=29) continue;
    const budget=clubSpend(buyer);
    if(budget<50000) continue;
    const need=squadNeed(buyer);
    const chase = rnd()<0.3;   // 30% 追逐表现突出的球员，70% 补短板
    const pool=Object.values(WORLD.players).filter(p=>
        p.clubId!==buyer.id && p.clubId!==u.id && p.injury<=25 && p.age<34 &&
        absDay()-(p.joinedAbs!=null?p.joinedAbs:-999)>150 &&
        (chase ? (perfIndex(p)>=0.45 && p.ca>buyer.rep*1.6)
               : ((p.pos===need.pos||(p.pos2||[]).includes(need.pos)) && p.ca>need.cur+5)) &&
        p.ca < buyer.rep*2.05+42);
    const afford=pool.filter(p=>{
        const seller=p.clubId>=0?C(p.clubId):null;
        if(seller && !canSell(seller,p)) return false;
        if(seller && seller.rep>buyer.rep+11 && rnd()<0.85) return false;
        if(seller && !p.listed && buyer.rep < seller.rep-3 && rnd()<0.5) return false;
        return askingPrice(p)<=budget; });
    if(!afford.length) continue;
    afford.sort((a,b)=>(b.ca+perfIndex(b)*18)-(a.ca+perfIndex(a)*18));
    const tgt=afford[Math.floor(Math.pow(rnd(),1.8)*Math.min(afford.length,12))];
    if(!tgt) continue;
    const seller=tgt.clubId>=0?C(tgt.clubId):null;
    let fee=askingPrice(tgt);
    if(seller && !tgt.listed && seller.rep<buyer.rep-8 && rnd()<0.5) fee=Math.round(fee*(1.05+rnd()*0.3)/1000)*1000;  // 豪门抢人溢价
    fee=Math.min(fee,budget);
    const wage=wageDemand(tgt,buyer);
    if(wageBill(buyer)+wage*52 > buyer.finance.wageBudget*1.02) continue;
    tgt.listed=false;
    transferPlayer(tgt.id, buyer.id, fee, wage, ri(2,5));
    bigTransferNews(tgt, seller, buyer, fee);
  }
  // 自由球员签约
  for(let k=0;k<ri(0,2);k++){
    const buyer=WORLD.clubs[Math.floor(rnd()*60)];
    if(buyer.id===u.id||buyer.squad.length>=28) continue;
    const fa=WORLD.freeAgents.filter(i=>P(i)&&P(i).ca>buyer.rep*1.2);
    if(!fa.length) continue;
    const id=pick(fa);
    transferPlayer(id, buyer.id, 0, wageDemand(P(id),buyer), ri(1,3));
  }
}
// AI 俱乐部每周把冗员挂牌（市场上会出现折价球员）
function aiListSurplus(){
  WORLD.clubs.forEach(c=>{
    if(c.id===WORLD.userClub) return;
    const ps=c.squad.map(i=>P(i));
    if(ps.length<=24){ ps.forEach(p=>p.listed=false); return; }
    if(ps.filter(p=>p.listed).length>=3 || rnd()<0.6) return;
    const cand=ps.filter(p=>!p.listed && canSell(c,p) && (p.age>=30 || p.ca<c.rep*1.5 || p.morale<40)).sort((a,b)=>a.ca-b.ca);
    if(cand.length) cand[Math.floor(rnd()*Math.min(3,cand.length))].listed=true;
  });
}
function marketDaily(){
  const u=UC();
  // AI 清理冗员：阵容超编时解约最弱的球员（截止日前后更频繁）
  WORLD.clubs.forEach(c=>{
    if(c.id===u.id || c.squad.length<=27) return;
    if(rnd()>(isDeadline()?0.6:0.15)) return;
    const ps=c.squad.map(i=>P(i)).filter(p=>canSell(c,p));
    if(!ps.length) return;
    const worst=ps.sort((a,b)=>(a.ca+(a.pa-a.ca)*0.5)-(b.ca+(b.pa-b.ca)*0.5))[0];
    c.squad=c.squad.filter(i=>i!==worst.id); worst.clubId=-1; worst.listed=false; WORLD.freeAgents.push(worst.id);
  });
  aiTransferRound();
  aiOffersToUser();
  // 没被盯上也可能突然来人（挂牌球员更常见）
  if(rnd()<0.04 && u.squad.length>17){
    const all=u.squad.map(i=>P(i));
    const listed=all.filter(p=>p.listed);
    const pool=(listed.length&&rnd()<0.7)? listed : all.filter(p=>p.injury<=0).sort((a,b)=>b.ca-a.ca).slice(0,10);
    if(pool.length) addInterest(pick(pool), true);
  }
  const endD=windowEndDay(), key=WORLD.season+":"+windowName();
  if(WORLD.day===endD-2 && WORLD.dlNoted!==key){
    WORLD.dlNoted=key;
    const n=(WORLD.offers||[]).length;
    news(`${windowName()}截止日临近`,`转会窗将在 3 天后关闭，各俱乐部正在加紧最后的谈判${n?`。你手上还有 ${n} 份未处理的报价，窗口关闭后将自动失效`:""}。`,"warn");
  }
  if(WORLD.day===endD){
    const L=WORLD.transferLog.filter(t=>t.s===WORLD.season && t.d>endD-31 && t.d<=endD);
    const paid=L.filter(t=>t.fee>0);
    const top=paid.sort((a,b)=>b.fee-a.fee)[0];
    news(`${windowName()}关闭`,`本次转会窗共完成 ${L.length} 笔转会（其中 ${paid.length} 笔付费转会），总金额 ${money(paid.reduce((s,t)=>s+t.fee,0))}${top?`；标王为 ${top.name}（${C(top.to).cn}，${money(top.fee)}）`:""}。下一个转会窗约 ${nextWindowIn()} 天后开启。`,"info");
  }
}

// ---------- 处理收到的报价 ----------
function acceptOffer(i){
  const of=WORLD.offers[i]; if(!of) return; const p=P(of.pid), b=C(of.club), u=UC();
  if(!inTransferWindow()){ toast("转会窗已关闭","bad"); return; }
  const fee=of.fee;
  transferPlayer(of.pid, of.club, fee, of.wage||wageDemand(p,b), ri(2,5));
  WORLD.offers=WORLD.offers.filter(o=>o.pid!==of.pid);
  WORLD.interest=interestList().filter(it=>it.pid!==of.pid);
  news(`${p.cn} 转会 ${b.cn}`,`${u.cn} 接受了 ${b.cn} 的报价，${p.cn} 以 ${money(fee)} 转会离队。转会费的 70% 已计入转会预算。`,"good");
  toast(`${p.cn} 以 ${money(fee)} 转会至 ${b.cn}`); render();
}
function rejectOffer(i){
  const of=WORLD.offers[i]; if(!of) return; const p=P(of.pid), b=C(of.club), u=UC();
  WORLD.offers.splice(i,1);
  if(b.rep>u.rep+8 && !p.untouchable && rnd()<0.55){
    p.morale=clamp(p.morale-14,5,100); p.unrest=(p.unrest||0)+1;
    news(`${p.cn} 对拒绝报价感到失望`,`${p.cn} 得知俱乐部拒绝了 ${b.cn} 的报价后情绪低落，他认为那是职业生涯更进一步的机会。${p.unrest>=2?"经纪人暗示他将公开要求转会，并拒绝任何续约谈判。":""}`,"warn");
  }
  const it=interestList().find(x=>x.pid===of.pid&&x.club===of.club); if(it) it.heat*=0.6;

}
function counterOffer(i){
  const of=WORLD.offers[i]; if(!of) return; const p=P(of.pid), b=C(of.club);
  const sug=Math.round(of.fee*1.2/1e4)*1e4;
  openModal("向 "+esc(b.cn)+" 还价",
    `<div class="hint">${esc(b.cn)} 当前报价 <b style="color:var(--acc)">${money(of.fee)}</b>（${esc(p.cn)} 身价 ${money(p.value)}）。<br>每份报价只能还价一次：要价在对方承受范围内会被直接接受；略高时对方可能给出最终报价；过高则对方退出谈判。</div>
     <div style="margin-top:12px"><label>你的要价（£）</label><input id="co-fee" type="number" value="${sug}" style="width:180px"></div>`,
    `<button class="pri" onclick="submitCounter(${i})">发出还价</button><button onclick="closeModal()">取消</button>`);
}
function submitCounter(i){
  const of=WORLD.offers[i]; if(!of) return; const p=P(of.pid), b=C(of.club);
  const v=+$("#co-fee").value; if(!(v>of.fee)){ toast("要价需高于当前报价","bad"); return; }
  of.countered=true;
  const max=of.max||Math.round(of.fee*1.2);
  if(v<=max){ of.fee=Math.round(v/1000)*1000; of.until=Math.min(WORLD.day+7, windowEndDay()); toast(`${b.cn} 接受了你 ${money(of.fee)} 的要价`); }
  else if(v<=max*1.3 && rnd()<0.55){ of.fee=max; of.final=true; of.until=Math.min(WORLD.day+5, windowEndDay()); toast(`${b.cn} 无法满足要价，提高到 ${money(max)}——这是最终报价`,"warn"); }
  else { WORLD.offers.splice(i,1); toast(`${b.cn} 认为要价离谱，退出了谈判`,"bad"); const it=interestList().find(x=>x.pid===p.id&&x.club===b.id); if(it) it.heat*=0.5; }
  closeModal(); render();
}
// ---------- 解约 ----------
function releaseFee(p){
  // 剩余合同（含本季未走完的部分）薪水的七折作为一次性遣散费
  const yrsLeft=Math.max(0.1, (p.contract-WORLD.season+1) - WORLD.day/SEASON_DAYS);
  return Math.max(10000, Math.round(p.wage*52*yrsLeft*0.7/1000)*1000);
}
function releasePlayer(pid){
  const p=P(pid), c=UC();
  if(p.clubId!==c.id) return;
  const fee=releaseFee(p);
  const yrs=Math.max(0,(p.contract-WORLD.season+1)-WORLD.day/SEASON_DAYS).toFixed(1);
  const gk=c.squad.filter(i=>P(i).pos==="GK").length;
  const warn = c.squad.length<=18 ? "阵容已不足 18 人，无法再解约。" : (p.pos==="GK"&&gk<=2) ? "至少要保留 2 名门将。" : "";
  openModal("解约 "+esc(p.cn),
    `<div class="hint">${esc(p.cn)}（${POS_CN[p.pos]}，${p.age} 岁，能力 ${ovr(p)}）目前周薪 ${money(p.wage)}，合同至 ${p.contract} 年，剩余约 ${yrs} 年。</div>
     <div style="margin-top:10px">一次性遣散费：<b style="color:var(--warn)">${money(fee)}</b> <span class="hint">（剩余合同薪水的 70%）</span></div>
     <div class="hint" style="margin-top:6px">解约后他成为自由球员，工资空间立即释放，每年可省 ${money(p.wage*52)}；但你拿不到任何转会费，其他俱乐部可以免费签走他。</div>
     ${(WORLD.offers||[]).some(o=>o.pid===pid)?'<div class="hint" style="margin-top:6px;color:var(--warn)">注意：目前有俱乐部正在报价这名球员，出售能拿到转会费。</div>':''}
     ${warn?`<div style="margin-top:8px;color:var(--bad)">${warn}</div>`:""}
     <div class="hint" style="margin-top:8px">你的可用资金：${money(c.finance.balance)}</div>`,
    `${warn?"":`<button class="pri" onclick="doRelease(${pid})">确认解约</button>`}<button onclick="closeModal()">取消</button>`);
}
function doRelease(pid){
  const p=P(pid), c=UC();
  if(p.clubId!==c.id) return;
  const fee=releaseFee(p);
  if(c.squad.length<=18){ toast("阵容不足 18 人，无法解约","bad"); return; }
  if(c.finance.balance<fee){ toast("资金不足，无法支付遣散费","bad"); return; }
  addMoney(c, -fee, `解约 ${p.cn}`);
  c.squad=c.squad.filter(i=>i!==pid);
  p.clubId=-1; p.listed=false; p.untouchable=false; p.unrest=0; p.morale=clamp(p.morale-10,5,100);
  p.contract=WORLD.season; p.value=calcValue(p);
  WORLD.freeAgents.push(pid);
  WORLD.offers=(WORLD.offers||[]).filter(o=>o.pid!==pid);
  WORLD.interest=interestList().filter(it=>it.pid!==pid);
  WORLD.shortlist=(WORLD.shortlist||[]).filter(s=>s.id!==pid);
  autoPickLineup(c);
  news(`${p.cn} 与俱乐部解约`,`${c.cn} 支付 ${money(fee)} 遣散费后与 ${p.cn} 提前解除合同，他现在是自由球员。`,"warn");
  toast(`已与 ${p.cn} 解约，支付遣散费 ${money(fee)}`); closeModal(); render();
}
function toggleUntouchable(pid){
  const p=P(pid); p.untouchable=!p.untouchable; if(p.untouchable) p.listed=false;
  toast(p.untouchable?`${p.cn} 已设为非卖品，大多数俱乐部会知难而退`:`已取消 ${p.cn} 的非卖品标记`);
  closeModal(); render();
}

// ---------- 超级妖人 ----------
function makeWonderkid(clubId){
  const pos=pick(POSITIONS);
  const p=makePlayer(clamp(gauss(46,8),34,60), pos, ri(16,18), clubId);
  p.pa=clamp(Math.max(p.pa, ri(176,200)), p.ca+50, 200);
  p.wonderkid=true;
  if(clubId>=0){
    const c=C(clubId);
    p.wage=Math.max(300,Math.round(calcWage(p,c.rep)*0.5/50)*50);
    p.contract=WORLD.season+ri(2,4);
    WORLD.players[p.id]=p; c.squad.push(p.id);
  }else{
    p.wage=calcWage(p,30); p.contract=WORLD.season;
    WORLD.players[p.id]=p; WORLD.freeAgents.push(p.id);
  }
  p.value=calcValue(p);
  return p;
}
function spawnWonderkids(n){
  const arr=[];
  for(let i=0;i<n;i++){
    const cands=WORLD.clubs.filter(x=>x.squad.length<34);
    if(!cands.length) break;
    arr.push(makeWonderkid(pick(cands).id));
  }
  if(arr.length){
    const txt=arr.map(p=>`${p.cn}（${POS_CN[p.pos]}，${p.age}岁，${p.clubId>=0?C(p.clubId).cn:"自由身"}）`).join("、");
    news("球探圈热议：天才少年横空出世",
      `球探圈盛传新一代妖人已崭露头角：${txt}。这类球员成长上限极高，尽早加入球探名单摸清潜力，抢在豪门之前下手。`,"good");
  }
  return arr;
}

// ---------- 青训 ----------
function youthIntake(){
  WORLD.clubs.forEach(c=>{
    const n=ri(3,6);
    const arr=[];
    for(let i=0;i<n;i++){
      const lvl=clamp(gauss(c.youthRating*2.0+c.rep*0.28, 7),6,62);
      const pos=pick(POSITIONS);
      const p=makePlayer(lvl,pos,ri(16,17),c.id);
      p.pa=clamp(p.ca+ri(25,95)+Math.round(c.youthRating*1.6),p.ca,200);
      p.homegrown=true; p.wage=Math.max(250,Math.round(calcWage(p,c.rep)*0.35/50)*50);
      p.contract=WORLD.season+3;
      WORLD.players[p.id]=p; c.squad.push(p.id); arr.push(p);
    }
    if(c.id===WORLD.userClub){
      const best=arr.reduce((a,b)=>b.pa>a.pa?b:a);
      news("青年球员入队",`本赛季青训营送来 ${n} 名年轻球员。青训主管认为 ${best.cn}（${POS_CN[best.pos]}，${best.age}岁）最具潜力。`,"good");
    }
  });
  spawnWonderkids(ri(2,4));
}

// ---------- 赛季结算 ----------
function endSeason(){
  const summary={season:WORLD.season, leagues:[], cups:WORLD.cups.map(c=>c.winner),
                 euro:{CL:WORLD.euro?WORLD.euro.CL.winner:null, EL:WORLD.euro?WORLD.euro.EL.winner:null}};
  const allP=Object.values(WORLD.players).filter(p=>p.apps>0);
  summary.topScorers=allP.slice().sort((a,b)=>b.goals-a.goals||b.assists-a.assists).slice(0,10)
    .map(p=>({n:p.cn,c:p.clubId>=0?C(p.clubId).short:"-",g:p.goals,a:p.assists,ap:p.apps}));
  summary.topRated=allP.filter(p=>p.apps>=15).sort((a,b)=>b.ratingSum/b.apps-a.ratingSum/a.apps).slice(0,10)
    .map(p=>({n:p.cn,c:p.clubId>=0?C(p.clubId).short:"-",r:(p.ratingSum/p.apps).toFixed(2),ap:p.apps}));
  const tables={};
  WORLD.leagues.forEach(lg=>{
    const t=leagueTable(lg.lg); tables[lg.lg]=t;
    summary.leagues.push({lg:lg.lg, nation:lg.nation, tier:lg.tier, table:t.map(r=>({id:r.id,pts:r.pts,gd:r.gd,rank:r.rank}))});
    const champ=C(t[0].id); champ.trophies.push(WORLD.season+" "+lg.name);
    const n=t.length;
    t.forEach(r=>{
      const c=C(r.id);
      const [hi,lo]=lg.prize;
      const money0=Math.round(lo+(hi-lo)*(n-r.rank)/(n-1));
      addMoney(c, money0, `${lg.short}第${r.rank}名奖金/转播分成`);
      c.lastRank=r.rank; c.lastLg=lg.lg;
    });
  });
  // 只打欧战的其他欧洲球队：按声望折算其本国联赛的奖金与转播收入
  WORLD.clubs.filter(c=>c.nation===EURO_NATION).forEach(c=>addMoney(c, Math.round(Math.pow(c.rep,3)*90), `${c.country||"本国"}联赛奖金/转播分成`));
  // ---- 下赛季欧战资格（按各国顶级联赛排名 + 杯赛冠军）----
  const qual={CL:[],EL:[]};
  NATIONS.forEach((nat,ni)=>{
    const t=tables[lgIndex(ni,0)]; if(!t) return;
    const ids=t.map(r=>r.id);
    qual.CL.push(...ids.slice(0,nat.cl));
    const el=ids.slice(nat.cl, nat.cl+nat.el);
    const cupW=WORLD.cups[ni].winner;
    if(cupW!=null && C(cupW).nation===ni && !qual.CL.includes(cupW) && !el.includes(cupW)) el.push(cupW);
    else el.push(ids[nat.cl+nat.el]);           // 杯赛冠军已获资格 → 名额顺延给联赛下一名
    qual.EL.push(...el.filter(x=>x!=null));
  });
  WORLD.euroQual=qual;
  // ---- 升降级（各国相邻两级之间：2 队直升 + 附加赛 1 队；3 队降级）----
  const moves=[];
  NATIONS.forEach((nat,ni)=>{
    for(let tier=0;tier<nat.tiers.length-1;tier++){
      const upper=tables[lgIndex(ni,tier)], lower=tables[lgIndex(ni,tier+1)];
      const promoted=[lower[0].id, lower[1].id];
      const po=[lower[2].id,lower[3].id,lower[4].id,lower[5].id];
      const s1=poGame(po[0],po[3]), s2=poGame(po[1],po[2]);
      const win=poGame(s1,s2);
      promoted.push(win);
      const relegated=upper.slice(-3).map(r=>r.id);
      moves.push({nation:ni, tier, promoted, relegated, poWin:win});
    }
  });
  moves.forEach(mv=>{
    const upName=NATIONS[mv.nation].tiers[mv.tier], downName=NATIONS[mv.nation].tiers[mv.tier+1];
    mv.promoted.forEach(id=>{ const c=C(id); c.tier=mv.tier; c.lg=upName.lg; c.board.conf=clamp(c.board.conf+28,0,100);
      c.trophies.push(WORLD.season+" 升入"+upName.short);
      if(id===WORLD.userClub) news("升级成功！",
        `${c.cn} 成功升入 ${upName.name}！董事会对你的工作非常满意，下赛季的预算也将大幅提升。`,"good"); });
    mv.relegated.forEach(id=>{ const c=C(id); c.tier=mv.tier+1; c.lg=downName.lg; c.board.conf=clamp(c.board.conf-42,0,100);
      if(id===WORLD.userClub) news("球队降级",
        `${c.cn} 不幸降入 ${downName.name}。董事会对此深感失望，你的帅位岌岌可危。`,"bad"); });
  });
  // 夺冠加成
  WORLD.leagues.forEach(lg=>{ const t=tables[lg.lg];
    C(t[0].id).board.conf=clamp(C(t[0].id).board.conf+30,0,100); });
  WORLD.history.push(summary);

  // 用户战报
  const u=UC();
  const myLg=WORLD.leagues[u.lastLg!=null?u.lastLg:u.lg];
  news(`${WORLD.season} 赛季结束`,
    `你带领 ${u.cn} 完成了 ${WORLD.season}/${(WORLD.season+1)%100} 赛季，${myLg?myLg.short:""}最终排名第 ${u.lastRank} 位。`+
    (u.trophies.some(t=>t.startsWith(WORLD.season))?" 恭喜夺冠！":""),"info");

  // 董事会评估
  const tenure = (WORLD.seasonsHere=(WORLD.seasonsHere||0)+1);
  if(tenure>=2 && u.lastRank > u.board.target+7 && u.board.conf<18){
    WORLD.gameOver=`在 ${u.cn} 执教 ${tenure} 个赛季后，董事会决定解除你的主教练职务。最终排名第 ${u.lastRank} 位，远低于「${u.board.expect}」的期望。`;
  }

  // 年龄 / 合同 / 退役
  Object.values(WORLD.players).forEach(p=>{
    p.age++;
    if(p.age>=34 && (rnd()< (p.age-33)*0.22 + (p.ca<70?0.25:0))){
      p.retired=true;
      if(p.clubId>=0){ const c=C(p.clubId); c.squad=c.squad.filter(i=>i!==p.id);
        if(c.id===WORLD.userClub) news(`${p.cn} 宣布退役`,`${p.age}岁的 ${p.cn} 结束了职业生涯，共出场 ${p.careerApps} 次，打进 ${p.careerGoals} 球。`,"info"); }
      WORLD.freeAgents=WORLD.freeAgents.filter(i=>i!==p.id);
      delete WORLD.players[p.id];
      return;
    }
    if(p.contract<=WORLD.season && p.clubId>=0){
      const c=C(p.clubId);
      if(c.id!==WORLD.userClub || rnd()<0.5){
        // AI 自动续约 / 放走
        if(p.ca> c.rep*1.7 && rnd()<0.8){ p.contract=WORLD.season+1+ri(1,4); }
        else { c.squad=c.squad.filter(i=>i!==p.id); p.clubId=-1; WORLD.freeAgents.push(p.id); }
      } else {
        c.squad=c.squad.filter(i=>i!==p.id); p.clubId=-1; WORLD.freeAgents.push(p.id);
        news(`${p.cn} 合同到期离队`,`${p.cn} 的合同已经到期并自由转会离开。`,"warn");
      }
    }
    p.condition=ri(70,92); p.sharp=ri(45,70); p.injury=0; p.susp=0;
    p.value=calcValue(p);
  });
  // AI 补强阵容
  WORLD.clubs.forEach(c=>{
    let guard=0;
    while(c.squad.length<20 && guard++<25){
      const pos=SQUAD_TEMPLATE.find(([ps,n])=>c.squad.filter(i=>P(i).pos===ps).length<n);
      const usePos = pos? pos[0] : pick(POSITIONS);
      const fa=WORLD.freeAgents.filter(i=>P(i).pos===usePos);
      if(fa.length && rnd()<0.6){
        const id=pick(fa); transferPlayer(id, c.id, 0, calcWage(P(id),c.rep), ri(1,3));
      } else {
        const p=makePlayer(clamp(gauss(c.rep*0.9,7),8,95), usePos, ri(18,29), c.id);
        p.wage=calcWage(p,c.rep); p.value=calcValue(p); p.contract=WORLD.season+1+ri(1,4);
        WORLD.players[p.id]=p; c.squad.push(p.id);
      }
    }
  });
  // 控制球员总量：清理长期无球可踢的低水平自由球员
  WORLD.freeAgents = WORLD.freeAgents.filter(id=>{
    const p=P(id); if(!p) return false;
    if(p.ca<42 || p.age>33){ delete WORLD.players[id]; return false; }
    return true;
  });
  WORLD.clubs.forEach(c=>{
    const cap = c.id===WORLD.userClub? 30 : 26;   // AI 主动清理冗员，转会市场才有买家
    while(c.squad.length>cap){
      const worst=c.squad.map(i=>P(i)).sort((a,b)=>(a.ca+ (a.pa-a.ca)*0.6)-(b.ca+(b.pa-b.ca)*0.6))[0];
      c.squad=c.squad.filter(i=>i!==worst.id); worst.clubId=-1; WORLD.freeAgents.push(worst.id);
    }
  });
  // 自由球员市场容量上限，避免逐年膨胀（在各队清理冗员之后执行，只留最好的一批）
  WORLD.freeAgents.sort((a,b)=>(P(b).ca+(P(b).pa-P(b).ca)*0.5)-(P(a).ca+(P(a).pa-P(a).ca)*0.5));
  WORLD.freeAgents.splice(220).forEach(id=>{ delete WORLD.players[id]; });
  // 清理关注名单里已不存在的球员（退役 / 自由市场清理）
  WORLD.shortlist=(WORLD.shortlist||[]).filter(sl=>WORLD.players[sl.id]);
  WORLD.season++;
  WORLD.day=0; WORLD.fired=false; WORLD.offers=[];
  Object.values(WORLD.players).forEach(p=>{ if(p.clubId!==WORLD.userClub) p.listed=false; p.unrest=0; });
  WORLD.clubs.forEach(c=>{ if(c.id!==WORLD.userClub) aiInvest(c); });
  WORLD.clubs.forEach(c=>{
    c.finance.income=0; c.finance.expense=0;
    c.finance.transferBudget=Math.round(Math.max(0,c.finance.balance)*0.42 + Math.pow(c.rep,3)*20);
    c.board.conf=clamp(c.board.conf*0.5+45,20,95);
    c.coachRating=clamp(c.coachRating+ri(-1,1),3,20);
    autoPickLineup(c);
  });
  buildSeason();
  setBoardExpectation();
}
function poGame(a,b){
  const sa=teamStrength(C(a))*1.02+gauss(0,9), sb=teamStrength(C(b))+gauss(0,9);
  return sa>sb?a:b;
}
/* =========================================================
   游戏流程控制
   ========================================================= */
let CURMATCH=null;      // 正在进行的用户比赛
let PENDING=null;

function userFixtureOn(day){
  return WORLD.fixtures.find(f=>f.day===day && !f.played && (f.home===WORLD.userClub||f.away===WORLD.userClub));
}
function nextUserFixture(){
  return WORLD.fixtures.filter(f=>!f.played&&(f.home===WORLD.userClub||f.away===WORLD.userClub))
    .sort((a,b)=>a.day-b.day)[0];
}

// 模拟当天所有（非用户）比赛
function simDay(day, skipUser){
  const fx=WORLD.fixtures.filter(f=>f.day===day && !f.played);
  fx.forEach(f=>{
    if(skipUser && (f.home===WORLD.userClub||f.away===WORLD.userClub)) return;
    [f.home,f.away].forEach(id=>{ const c=C(id); if(c.id!==WORLD.userClub) autoPickLineup(c); });
    const M=runMatch(createMatch(f.home,f.away,{comp:f.comp, round:f.round, record:false, ...knockoutOpts(f)}));
    applyResult(f,M);
  });
  // 杯赛 / 欧战轮次推进
  competitionsDayEnd(day);
}

function processDayEnd(day){
  dailyTick();
  if(inTransferWindow()) marketDaily();
  const dt=dateOf(day);
  if(dt.getDay()===1) weeklyTick();
  if(dt.getMonth()===2 && dt.getDate()===20 && !WORLD.youthDone){ WORLD.youthDone=true; youthIntake(); }
  // 报价过期（到期前始终可处理，不会被新报价顶掉）
  if(WORLD.offers) WORLD.offers=WORLD.offers.filter(o=>((o.until!=null?o.until:o.day+7))>WORLD.day && inTransferWindow());
}

// 主「继续」入口，返回状态
function advance(){
  if(WORLD.gameOver) return {t:"over"};
  const uf=userFixtureOn(WORLD.day);
  if(uf) return {t:"match", fx:uf};
  simDay(WORLD.day,false);
  processDayEnd(WORLD.day);
  WORLD.day++;
  if(WORLD.day>=SEASON_DAYS || allFixturesDone()){ WORLD.youthDone=false; endSeason(); return {t:"season"}; }
  return {t:"day"};
}
function allFixturesDone(){ return !WORLD.fixtures.some(f=>!f.played); }

// 用户比赛结束后收尾
function finishUserMatch(){
  const M=CURMATCH;
  const fx=WORLD.fixtures.find(f=>f.day===WORLD.day && !f.played && (f.home===M.h&&f.away===M.a));
  if(fx) applyResult(fx,M);
  simDay(WORLD.day,false);
  processDayEnd(WORLD.day);
  WORLD.day++;
  CURMATCH=null;
  if(WORLD.day>=SEASON_DAYS || allFixturesDone()){ WORLD.youthDone=false; endSeason(); return "season"; }
  return "ok";
}

// 快速模拟到某天
function skipTo(targetDay, onStop){
  let guard=0;
  while(WORLD.day<targetDay && guard++<400){
    const r=advance();
    if(r.t!=="day") return r;
  }
  return {t:"day"};
}

// ---------- 表格排序 ----------
function sortTable(rows, key, get){
  if(SORT.k===key) SORT.d*=-1; else {SORT.k=key; SORT.d=-1;}
  return rows;
}
function makeTable(cols, rows, opts){
  opts=opts||{};
  const t=el("table");
  const thead=el("thead"); const tr=el("tr");
  cols.forEach(c=>{
    const th=el("th",(c.nos?"nos":"")+(c.mh?" mh":""),c.h);
    if(c.cls) th.style.textAlign=c.cls==="num"?"right":c.cls==="ctr"?"center":"left";
    if(!c.nos) th.onclick=()=>{ if(SORT.k===c.k) SORT.d*=-1; else {SORT.k=c.k;SORT.d=c.desc===false?1:-1;} opts.rerender?opts.rerender():render(); };
    if(SORT.k===c.k) th.innerHTML=c.h+(SORT.d<0?" ▾":" ▴");
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb=el("tbody");
  let data=[...rows];
  if(SORT.k){
    const col=cols.find(c=>c.k===SORT.k);
    if(col&&col.v) data.sort((a,b)=>{ const x=col.v(a),y=col.v(b);
      return (typeof x==="string"? x.localeCompare(y): x-y)*SORT.d; });
  }
  data.forEach((r,i)=>{
    const row=el("tr",opts.onRow?"clickable":"");
    cols.forEach(c=>{ const td=el("td",(c.cls||"")+(c.mh?" mh":""),c.r(r,i)); row.appendChild(td); });
    if(opts.onRow) row.onclick=()=>opts.onRow(r);
    if(opts.rowStyle) opts.rowStyle(row,r,i);
    tb.appendChild(row);
  });
  t.appendChild(tb);
  const wrap=el("div","tw"); wrap.appendChild(t);
  return wrap;
}

function attrBlock(title, dict, p, hide){

      <span class="av" style="color:${hide?'var(--dim2)':attrColor(val)}">${show}</span></div>`;
  }

}

function paRange(p,know){
  if(know<20) return "未知";
  const w=Math.max(4, Math.round((100-know)/4));
  const lo=clamp(Math.round(p.pa/2)-w,1,99), hi=clamp(Math.round(p.pa/2)+w,1,100);
  return lo+" - "+hi;
}

    <div style="position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border:1px solid rgba(255,255,255,.16);border-radius:50%"></div>
    <div style="position:absolute;left:22%;right:22%;bottom:0;height:15%;border:1px solid rgba(255,255,255,.16);border-bottom:none"></div>
    <div style="position:absolute;left:22%;right:22%;top:0;height:15%;border:1px solid rgba(255,255,255,.16);border-top:none"></div>`;
  const slots=FORMATIONS[t.formation];
  slots.forEach((s,i)=>{
    const pid=c.lineup[i], p=pid!=null?P(pid):null;
    const d=el("div","fmt-slot"+(SELSLOT===i?" sel":"")+(p&&p.condition<70?" tired":""));
    d.style.left=s[2]+"%"; d.style.bottom=s[1]+"%"; d.style.top="auto";
    d.innerHTML=`<div class="p">${POS_CN[s[0]]}</div><div class="n">${p?esc(p.cn.split("·").pop()):"—"}</div>
      <div class="hint" style="font-size:9px">${p?ovr(p)+" · "+Math.round(p.condition)+"%":""}</div>`;
    d.onclick=()=>{ SELSLOT=SELSLOT===i?null:i; render(); };
    pit.appendChild(d);
  });
  left.appendChild(pit);
  wrap.appendChild(left);

  // ---- 设置 & 名单 ----
  const right=el("div","col");
  const set=el("div","card");
  set.innerHTML=`<h3>战术指令</h3>`;
  const opts=[["mentality","心态",MENTALITY],["tempo","节奏",TEMPO_N],["press","逼抢",PRESS_N],["width","宽度",WIDTH_N]];
  opts.forEach(([k,n,arr])=>{
    const d=el("div"); d.style.marginBottom="9px";
    d.innerHTML=`<label>${n}：<b style="color:var(--acc)">${arr[t[k]]}</b></label>`;
    const r=el("input"); r.type="range"; r.min=0; r.max=4; r.value=t[k]; r.style.width="100%";
    r.oninput=e=>{ t[k]=+e.target.value; render(); };
    d.appendChild(r); set.appendChild(d);
  });
  const chk=el("div","hint");
  chk.innerHTML=`<label style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;color:var(--txt)">
      <input type="checkbox" id="offs" ${t.offside?"checked":""}> 造越位</label>
    <label style="display:inline-flex;align-items:center;gap:5px;color:var(--txt)">
      <input type="checkbox" id="cntr" ${t.counter?"checked":""}> 快速反击</label>`;
  set.appendChild(chk);
  right.appendChild(set);

  // 可选球员
  const list=el("div","card"); list.innerHTML=`<h3>可用球员 ${SELSLOT!=null?`<span class="tag t-ok">选择填入 ${POS_CN[slots[SELSLOT][0]]}</span>`:""}</h3>`;
  const scroll=el("div","scroll"); scroll.style.maxHeight="300px";
  const want=SELSLOT!=null?slots[SELSLOT][0]:null;
  const avail=c.squad.map(i=>P(i)).sort((a,b)=> want? playerScore(b,want)-playerScore(a,want) : b.ca-a.ca);
  avail.forEach(p=>{
    const used=c.lineup.includes(p.id), sub=c.subs.includes(p.id);
    const d=el("div"); d.style.cssText=`display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid #1d242e;cursor:pointer;${used?'background:#16301f':''}`;
    const fit=want?posFit(p,want):1;
    d.innerHTML=`<span class="tag t-${POS_GRP[p.pos]}">${POS_CN[p.pos]}</span>
      <span style="flex:1">${esc(p.cn)}</span>
      ${p.injury>0?'<span class="tag t-b">伤</span>':p.susp>0?'<span class="tag t-b">停</span>':''}
      ${want?`<span class="hint" style="color:${fit>=0.9?'#00d47e':fit>=0.7?'#ffd24a':'#e5484d'}">适配${Math.round(fit*100)}%</span>`:''}
      <span class="hint">${Math.round(p.condition)}%</span>
      <b style="color:${caColor(p.ca)};width:24px;text-align:right">${ovr(p)}</b>
      ${used?'<span class="tag t-ok">首发</span>':sub?'<span class="tag t-i">替补</span>':'<span class="tag t-n">未入选</span>'}`;
    d.onclick=()=>{
      if(SELSLOT==null){ showPlayer(p.id); return; }
      if(p.injury>0||p.susp>0){ toast("该球员无法出场","bad"); return; }
      const cur=c.lineup.indexOf(p.id);
      if(cur>=0){ const tmp=c.lineup[SELSLOT]; c.lineup[SELSLOT]=p.id; c.lineup[cur]=tmp; }
      else { const outId=c.lineup[SELSLOT]; c.lineup[SELSLOT]=p.id;
             c.subs=c.subs.filter(x=>x!==p.id); if(outId!=null&&!c.subs.includes(outId)) c.subs.unshift(outId);
             if(c.subs.length>7) c.subs.length=7; }
      SELSLOT=null; render();
    };
    scroll.appendChild(d);
  });
  list.appendChild(scroll);
  right.appendChild(list);

  // 替补席
  const bench=el("div","card"); bench.innerHTML="<h3>替补席（7 人）</h3>";
  const bl=el("div"); bl.style.cssText="display:flex;flex-wrap:wrap;gap:6px";
  c.subs.forEach(id=>{ const p=P(id); if(!p)return;
    const b=el("span","pill",`${POS_CN[p.pos]} ${esc(p.cn.split("·").pop())} <b style="color:${caColor(p.ca)}">${ovr(p)}</b>`);
    b.style.cursor="pointer"; b.onclick=()=>showPlayer(id); bl.appendChild(b); });
  if(!c.subs.length) bl.innerHTML='<span class="hint">尚未设置替补</span>';
  bench.appendChild(bl);
  right.appendChild(bench);
  wrap.appendChild(right);
  v.appendChild(wrap);

  const fsel=$("#fmtsel"); if(fsel) fsel.onchange=e=>{ c.tactic.formation=e.target.value; autoPickLineup(c); SELSLOT=null; render(); };
  const off=$("#offs"); if(off) off.onchange=e=>c.tactic.offside=e.target.checked;
  const cnt=$("#cntr"); if(cnt) cnt.onchange=e=>c.tactic.counter=e.target.checked;
}

    {h:"年龄",k:"age",cls:"num",v:p=>p.age,r:p=>p.age},

    {h:"本周进度",k:"dev",cls:"num",v:p=>p.dev||0,r:p=>{const d=p.dev||0;
       return `<span class="${d>=0?'pos':'neg'}">${d>=0?"+":""}${(d*100).toFixed(0)}%</span>`;}},
    {h:"工作投入",k:"wr",cls:"num",v:p=>p.a.workrate,r:p=>`<span style="color:${attrColor(p.a.workrate)}">${p.a.workrate}</span>`},
    {h:"出场",k:"ap",cls:"num",v:p=>p.apps,r:p=>p.apps},

/* ================= 转会 ================= */
let TFILTER={pos:"", maxFee:0, minCa:0, maxAge:40, tier:"", q:""};
function vTransfer(v){
  const c=UC();
  v.appendChild(el("div","",`<h1>转会市场</h1><div class="sub">
    转会预算 <b style="color:var(--acc)">${money(c.finance.transferBudget)}</b> ·
    年薪空间 ${money(Math.max(0,c.finance.wageBudget-wageBill(c)))} ·
    ${inTransferWindow()?`<span class="tag t-ok">${windowName()}开启中 · 还剩 ${windowDaysLeft()} 天</span>${isDeadline()?' <span class="tag t-w">截止日临近</span>':''}`:`<span class="tag t-w">转会窗关闭</span> <span class="hint">下一窗口约 ${nextWindowIn()} 天后开启</span>`}</div>`));

  // 收到的报价
  const offers=WORLD.offers||[];
  if(offers.length){
    const o=el("div","card"); o.innerHTML=`<h3>收到的报价 <span class="hint" style="font-weight:400">可接受、还价或拒绝；多家竞价时后来者通常出价更高</span></h3>`;
    offers.forEach((of,i)=>{
      const p=P(of.pid); if(!p) return; const b=C(of.club);
      const left=Math.max(0,(of.until!=null?of.until:of.day+7)-WORLD.day);
      const att = b.rep>c.rep+8?'<span class="tag t-w">球员渴望加盟</span>': b.rep>=c.rep-3?'<span class="tag t-n">球员愿意考虑</span>':'<span class="tag t-n">球员有些犹豫</span>';
      const d=el("div"); d.style.cssText="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1d242e;flex-wrap:wrap";
      d.innerHTML=`${crestHTML(b)}<b>${esc(b.cn)}</b><span class="tag t-n">${LGS(b)}</span>
        <span class="hint">报价</span><b style="cursor:pointer" onclick="showPlayer(${p.id})">${esc(p.cn)}</b>
        <span class="tag t-${POS_GRP[p.pos]}">${POS_CN[p.pos]}</span>${perfTag(p)}${att}${of.final?'<span class="tag t-w">最终报价</span>':''}
        <span style="flex:1"></span>
        <b style="color:var(--acc);font-size:14px">${money(of.fee)}</b>
        <span class="hint">身价 ${money(p.value)} · ${left>0?`${left} 天后到期`:"今天到期"}</span>`;
      const acc=el("button","sm pri","接受"); acc.onclick=()=>acceptOffer(i); d.appendChild(acc);
      if(!of.countered){ const co=el("button","sm","还价"); co.onclick=()=>counterOffer(i); d.appendChild(co); }
      const rej=el("button","sm","拒绝"); rej.onclick=()=>rejectOffer(i); d.appendChild(rej);
      o.appendChild(d);
    });
    v.appendChild(o);
  }

  // 转会传闻：谁在盯着你的球员
  const its=interestList().filter(it=>P(it.pid)&&P(it.pid).clubId===c.id);
  const hot=c.squad.map(i=>P(i)).filter(p=>its.some(it=>it.pid===p.id)||heatOf(p)>=0.45||p.listed||p.untouchable||(p.unrest||0)>=2)
     .sort((a,b)=>heatOf(b)-heatOf(a)).slice(0,10);
  const rm=el("div","card");
  rm.innerHTML=`<h3>转会传闻 · 你的球员</h3><div class="hint" style="margin-bottom:8px">表现突出、能力超出球队层级或已挂牌的球员会吸引外界关注；关注度越高，转会窗内收到高价报价的可能越大。设为<b>非卖品</b>后大多数俱乐部会知难而退，只有少数豪门仍会出天价。</div>`;
  if(!hot.length) rm.appendChild(el("div","empty","目前没有球员引起外界关注"));
  hot.forEach(p=>{
    const suit=its.filter(it=>it.pid===p.id).map(it=>C(it.club));
    const h=heatOf(p);
    const d=el("div"); d.style.cssText="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1d242e;flex-wrap:wrap";
    d.innerHTML=`<b style="cursor:pointer;min-width:64px" onclick="showPlayer(${p.id})">${esc(p.cn)}</b><span class="tag t-${POS_GRP[p.pos]}">${POS_CN[p.pos]}</span>${perfTag(p)}
      ${p.listed?'<span class="tag t-w">已挂牌</span>':''}${p.untouchable?'<span class="tag t-i">非卖品</span>':''}${(p.unrest||0)>=2?'<span class="tag t-b">要求转会</span>':''}
      <span class="hint">关注度</span><span style="width:70px;display:inline-block">${barHTML(Math.min(100,h*100),100,h>=0.6?"#ff7a45":"#4a9eff")}</span>
      <span class="hint">${suit.length?"追求者：":"暂无明确追求者"}</span>${suit.map(b=>`<span>${crestHTML(b)}${esc(b.short)}${b.rep>c.rep+8?' <span class="tag t-w">豪门</span>':''}</span>`).join("")}
      <span style="flex:1"></span>`;
    const l=el("button","sm",p.listed?"取消挂牌":"挂牌"); l.onclick=()=>listPlayer(p.id);
    const un=el("button","sm",p.untouchable?"取消非卖品":"设为非卖品"); un.onclick=()=>toggleUntouchable(p.id);
    d.appendChild(l); d.appendChild(un);
    if(p.listed){ const rl=el("button","sm",`解约 ${money(releaseFee(p))}`); rl.style.color="var(--bad)"; rl.onclick=()=>releasePlayer(p.id); d.appendChild(rl); }
    rm.appendChild(d);
  });
  v.appendChild(rm);

  // 搜索
  const s=el("div","card"); s.innerHTML="<h3>球员搜索</h3>";
  const f=el("div"); f.style.cssText="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px";
  f.innerHTML=`
    <div><label>位置</label><select id="f-pos"><option value="">全部</option>${POSITIONS.map(p=>`<option value="${p}" ${TFILTER.pos===p?"selected":""}>${POS_CN[p]}</option>`).join("")}</select></div>
    <div><label>联赛</label><select id="f-tier"><option value="">全部</option>${WORLD.leagues.map((l,i)=>`<option value="${i}" ${String(TFILTER.tier)===String(i)?"selected":""}>${l.short}</option>`).join("")}<option value="eu" ${TFILTER.tier==="eu"?"selected":""}>欧洲其他</option><option value="fa" ${TFILTER.tier==="fa"?"selected":""}>自由球员</option></select></div>
    <div><label>最高要价 ${TFILTER.maxFee?money(TFILTER.maxFee):"不限"}</label><input id="f-fee" type="range" min="0" max="150" value="${TFILTER.maxFee/1e6}" style="width:130px"></div>
    <div><label>最低能力 ${TFILTER.minCa||"不限"}</label><input id="f-ca" type="range" min="0" max="100" value="${TFILTER.minCa}" style="width:110px"></div>
    <div><label>最大年龄 ${TFILTER.maxAge}</label><input id="f-age" type="range" min="16" max="40" value="${TFILTER.maxAge}" style="width:100px"></div>
    <div><label>姓名</label><input id="f-q" type="text" value="${esc(TFILTER.q)}" style="width:110px" placeholder="搜索…"></div>`;
  s.appendChild(f);

  let pool=Object.values(WORLD.players).filter(p=>p.clubId!==WORLD.userClub);
  if(TFILTER.pos) pool=pool.filter(p=>p.pos===TFILTER.pos||p.pos2.includes(TFILTER.pos));
  if(TFILTER.tier==="fa") pool=pool.filter(p=>p.clubId<0);
  else if(TFILTER.tier==="eu") pool=pool.filter(p=>p.clubId>=0&&C(p.clubId).nation===EURO_NATION);
  else if(TFILTER.tier!=="") pool=pool.filter(p=>p.clubId>=0&&C(p.clubId).lg==TFILTER.tier);
  if(TFILTER.minCa) pool=pool.filter(p=>ovr(p)>=TFILTER.minCa);
  pool=pool.filter(p=>p.age<=TFILTER.maxAge);
  if(TFILTER.maxFee) pool=pool.filter(p=>askingPrice(p)<=TFILTER.maxFee);
  if(TFILTER.q) pool=pool.filter(p=>p.cn.includes(TFILTER.q)||p.name.toLowerCase().includes(TFILTER.q.toLowerCase()));
  pool.sort((a,b)=>b.ca-a.ca);
  const total=pool.length; pool=pool.slice(0,120);
  s.appendChild(el("div","hint",`找到 ${total} 名球员，显示前 ${pool.length} 名`));
  if(!SORT.k){SORT.k="ca";SORT.d=-1;}
  s.appendChild(makeTable([
    {h:"姓名",k:"n",v:p=>p.cn,r:p=>esc(p.cn)},
    {h:"俱乐部",k:"c",v:p=>p.clubId>=0?C(p.clubId).cn:"",r:p=>p.clubId>=0?crestHTML(C(p.clubId))+esc(C(p.clubId).short):'<span class="tag t-n">自由</span>'},
    {h:"位置",k:"pos",v:p=>POSITIONS.indexOf(p.pos),r:p=>`<span class="tag t-${POS_GRP[p.pos]}">${POS_CN[p.pos]}</span>`},
    {h:"年龄",k:"age",cls:"num",v:p=>p.age,r:p=>p.age},
    {h:"能力",k:"ca",cls:"num",v:p=>p.ca,r:p=>`<b style="color:${caColor(p.ca)}">${ovr(p)}</b>`},
    {h:"进球",k:"g",cls:"num",v:p=>p.goals,r:p=>p.goals},
    {h:"评分",k:"rt",cls:"num",v:p=>p.apps?p.ratingSum/p.apps:0,r:p=>avgRating(p)},
    {h:"周薪",k:"w",cls:"num",v:p=>p.wage,r:p=>money(p.wage)},
    {h:"要价",k:"ask",cls:"num",v:p=>askingPrice(p),r:p=>`<b>${money(askingPrice(p))}</b>`},
    {h:"",k:"z",nos:true,r:p=>(p.listed?'<span class="tag t-w">挂牌</span>':'')+perfTag(p)+(WORLD.shortlist.some(x=>x.id===p.id)?'<span class="tag t-i">关注中</span>':'')}
  ], pool, {onRow:p=>showPlayer(p.id)}));
  v.appendChild(s);

  // 转会动态
  const log=el("div","card");
  const thisSeason=WORLD.transferLog.filter(t=>t.s===WORLD.season);
  log.innerHTML=`<h3>转会动态 <span class="hint" style="font-weight:400">本赛季 ${thisSeason.length} 笔 · 总额 ${money(thisSeason.reduce((s,t)=>s+t.fee,0))}</span></h3>`;
  const L=WORLD.transferLog.slice(0,30);
  if(!L.length) log.appendChild(el("div","empty","暂无转会"));
  L.forEach(t=>{
    log.appendChild(el("div","",`<div style="padding:3px 0;border-bottom:1px solid #1d242e;font-size:12px">
      <span class="hint">${fmtDateShort(dateOf(t.d))}</span>

     <div style="margin-top:12px"><label>转会费（£）</label><input id="bid-fee" type="number" value="${ask}" style="width:180px"></div>

     <div class="hint" style="margin-top:12px">你的转会预算：${money(c.finance.transferBudget)}　薪资空间：${money(Math.max(0,c.finance.wageBudget-wageBill(c)))}/年</div>`,
    `<button class="pri" onclick="submitBid(${pid})">提交报价</button><button onclick="closeModal()">取消</button>`);
}
function submitBid(pid){
  const p=P(pid), c=UC();
  const fee=+$("#bid-fee").value, wg=+$("#bid-wage").value, yr=+$("#bid-yr").value;
  const ask=askingPrice(p), need=wageDemand(p,c);
  if(fee>c.finance.transferBudget){ toast("超出转会预算","bad"); return; }
  if(wageBill(c)+wg*52>c.finance.wageBudget){ toast("超出工资预算","bad"); return; }
  if(c.squad.length>=30){ toast("阵容已满（上限 30 人）","bad"); return; }
  const seller=p.clubId>=0?C(p.clubId):null;
  if(seller && !canSell(seller,p)){ toast(`${seller.cn} 拒绝出售——该位置人手不足`,"bad"); closeModal(); return; }
  if(fee < ask*0.93){ toast(`${seller?seller.cn:"球员"} 拒绝了报价，要价 ${money(ask)}`,"bad"); closeModal(); return; }
  if(wg < need*0.92){ toast(`${p.cn} 认为薪资不足，要求 ${money(need)}/周`,"bad"); closeModal(); return; }
  // 球员意愿：声望差
  if(seller && seller.rep > c.rep+14 && rnd()<0.6){ toast(`${p.cn} 不愿加盟——认为这是职业生涯的倒退`,"bad"); closeModal(); return; }
  // 抢手球员：报价仅略高于要价时，可能被更大的俱乐部截胡
  if(seller && fee < ask*1.08 && (perfIndex(p)>=0.35 || p.ca>seller.rep*1.9) && rnd()<0.14){
    const rivals=WORLD.clubs.filter(r=>r.id!==c.id && r.id!==seller.id && r.rep>c.rep+3 && r.squad.length<29
       && clubSpend(r)>=fee*1.12 && p.ca<r.rep*2.05+42 && p.ca>r.rep*1.4);
    if(rivals.length){
      const r=pick(rivals), rf=Math.round(fee*(1.1+rnd()*0.15)/1000)*1000, rw=wageDemand(p,r);
      if(wageBill(r)+rw*52<=r.finance.wageBudget*1.02){
        transferPlayer(pid, r.id, rf, rw, ri(2,5));
        news(`${r.cn} 截胡 ${p.cn}`,`就在你与 ${seller.cn} 以 ${money(fee)} 谈妥之际，${r.cn} 突然介入并开出 ${money(rf)}，球员最终选择了他们。`,"bad");
        toast(`${r.cn} 截胡了 ${p.cn}！`,"bad"); closeModal(); render(); return;
      }
    }
  }
  transferPlayer(pid, c.id, fee, wg, yr);
  news(`签下 ${p.cn}`,`${c.cn} 以 ${money(fee)} 从 ${seller?seller.cn:"自由市场"} 签下 ${p.cn}，签约 ${yr} 年，周薪 ${money(wg)}。`,"good");
  toast(`签约成功：${p.cn}`); closeModal(); render();
}
function renewContract(pid){
  const p=P(pid), c=UC();
  const nw=Math.round(Math.max(p.wage*1.15, calcWage(p,c.rep)*(1+ (p.pa-p.ca)/300))/50)*50;
  openModal("续约 "+esc(p.cn),
    `<div class="hint">${esc(p.cn)} 目前周薪 ${money(p.wage)}，合同到 ${p.contract} 年。</div>
     <div style="margin-top:10px">他的要求：<b style="color:var(--acc)">${money(nw)}</b> / 周</div>
     <div style="margin-top:10px"><label>提供周薪</label><input id="rn-w" type="number" value="${nw}" style="width:160px"></div>
     <div style="margin-top:8px"><label>年限</label><select id="rn-y"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>`,
    `<button class="pri" onclick="doRenew(${pid},${nw})">确认续约</button><button onclick="closeModal()">取消</button>`);
}
function doRenew(pid,need){
  const p=P(pid), c=UC(); const w=+$("#rn-w").value, y=+$("#rn-y").value;
  if((p.unrest||0)>=2){ toast(`${p.cn} 拒绝续约——他已要求转会`,"bad"); return; }
  if(w<need*0.95){ toast(`${p.cn} 拒绝了这份合同`,"bad"); return; }
  if(wageBill(c)-p.wage*52+w*52>c.finance.wageBudget){ toast("超出工资预算","bad"); return; }
  p.wage=w; p.contract=WORLD.season+y; p.morale=clamp(p.morale+10,5,100); p.value=calcValue(p);
  toast(`${p.cn} 已续约至 ${p.contract} 年`); closeModal(); render();
}
function listPlayer(pid){
  const p=P(pid);
  p.listed=!p.listed; if(p.listed) p.untouchable=false;
  toast(p.listed?`${p.cn} 已挂牌，其他俱乐部会更积极报价`:`已取消 ${p.cn} 的挂牌`);
  closeModal(); render();
}

function seasonOccupancy(c){
  const home=WORLD.fixtures.filter(f=>f.played&&f.home===c.id&&f.attendance);
  if(!home.length) return null;
  const avg=home.reduce((s,f)=>s+f.attendance,0)/home.length;
  return {avg:Math.round(avg), pct:avg/c.cap, n:home.length};
}

let LGNATION=null, LGTIER=0, EUROTAB="CL";
function vLeague(v){
  const u=UC();
  if(LGNATION==null){ LGNATION = u.nation===EURO_NATION? "EU" : u.nation; LGTIER=u.tier||0; }
  v.appendChild(el("div","",`<h1>赛事</h1>`));
  // 国家页签
  const bar=el("div","segbar"); bar.style.cssText="margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px";
  NATIONS.forEach((n,i)=>{ const b=el("button","sm"+(LGNATION===i?" on":""),n.name);
    b.onclick=()=>{LGNATION=i; LGTIER=Math.min(LGTIER,n.tiers.length-1); render();}; bar.appendChild(b); });
  { const b=el("button","sm"+(LGNATION==="EU"?" on":""),"欧战"); b.onclick=()=>{LGNATION="EU";render();}; bar.appendChild(b); }
  v.appendChild(bar);
  if(LGNATION==="EU"){ vEuro(v); return; }

  const nat=NATIONS[LGNATION];
  const bar2=el("div","segbar"); bar2.style.cssText="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px";

    b.onclick=()=>{LGTIER=i;render();}; bar2.appendChild(b); });
  v.appendChild(bar2);
  const lgIdx=lgIndex(LGNATION,LGTIER), lg=WORLD.leagues[lgIdx];
  const tbl=leagueTable(lgIdx), n=tbl.length, top=LGTIER===0, bottom=LGTIER===nat.tiers.length-1;

  card.appendChild(makeTable([
    {h:"#",k:"rank",cls:"num",v:r=>r.rank,desc:false,r:r=>r.rank},
    {h:"球队",k:"n",v:r=>C(r.id).cn,r:r=>crestHTML(C(r.id))+esc(C(r.id).cn)+(C(r.id).euro?` <span class="tag t-eu" style="font-size:9px">${EURO_COMPS[C(r.id).euro].short}</span>`:"")},
    {h:"场",k:"p",cls:"num",v:r=>r.p,r:r=>r.p},{h:"胜",k:"w",cls:"num",mh:true,v:r=>r.w,r:r=>r.w},
    {h:"平",k:"d",cls:"num",mh:true,v:r=>r.d,r:r=>r.d},{h:"负",k:"l",cls:"num",mh:true,v:r=>r.l,r:r=>r.l},
    {h:"进",k:"gf",cls:"num",mh:true,v:r=>r.gf,r:r=>r.gf},{h:"失",k:"ga",cls:"num",mh:true,v:r=>r.ga,r:r=>r.ga},
    {h:"净",k:"gd",cls:"num",v:r=>r.gd,r:r=>(r.gd>0?"+":"")+r.gd},
    {h:"积分",k:"pts",cls:"num",v:r=>r.pts,r:r=>`<b>${r.pts}</b>`},
    {h:"近况",k:"f",nos:true,r:r=>formHTML(r.form)}
  ], tbl, {onRow:r=>showClub(r.id), rowStyle:(row,r)=>{
      if(r.id===WORLD.userClub) row.style.background="#16301f";
      if(top){
        if(r.rank<=nat.cl) row.style.borderLeft="3px solid #00d47e";
        else if(r.rank<=nat.cl+nat.el) row.style.borderLeft="3px solid #f0a020";
      } else {
        if(r.rank<=2) row.style.borderLeft="3px solid #00d47e";
        else if(r.rank<=6) row.style.borderLeft="3px solid #4a9eff";
      }
      if(!bottom && r.rank>n-3) row.style.borderLeft="3px solid #e5484d";
    }}));
  card.appendChild(el("div","hint", top? "绿：欧冠资格　橙：欧联资格（另一席给杯赛冠军）　红：降级区"
                                     : bottom? "绿：直接升级　蓝：附加赛" : "绿：直接升级　蓝：附加赛　红：降级区"));
  v.appendChild(card);

  // 本轮赛果
  const played=WORLD.fixtures.filter(f=>f.comp==="L"&&f.lg===lgIdx&&f.played).sort((a,b)=>b.day-a.day);
  const lastRound=played.length?played[0].round:0;

  else { const nx=WORLD.fixtures.find(f=>f.comp==="C"&&f.nation===LGNATION&&!f.played);
    if(nx) cup.appendChild(el("div","hint",`下一轮：${cupObj.roundNames[nx.round-1]} · ${fmtDate(dateOf(nx.day))} · ${cupObj.alive.length} 队在争`)); }
  const cr=cupObj.results.slice(-2);
  if(!cr.length) cup.appendChild(el("div","hint","首轮尚未开始"));
  cr.forEach(rd=>{
    cup.appendChild(el("div","hint",`<b style="color:var(--txt)">${rd.round}</b>`));
    const wrap=el("div"); wrap.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 14px";
    rd.matches.forEach(m=>wrap.appendChild(el("div","",`<div style="font-size:12px;padding:2px 0">
      ${crestHTML(C(m.h))}${esc(C(m.h).short)} <b>${m.hg} - ${m.ag}</b> ${crestHTML(C(m.a))}${esc(C(m.a).short)}
      ${m.pens?`<span class="hint">(点球 ${m.pens[0]}-${m.pens[1]})</span>`:""}</div>`)));
    cup.appendChild(wrap);
  });
  v.appendChild(cup);
}
function vEuro(v){
  const bar=el("div"); bar.style.cssText="margin-bottom:10px;display:flex;gap:6px";
  ["CL","EL"].forEach(code=>{ const b=el("button","sm"+(EUROTAB===code?" on":""),EURO_COMPS[code].short);
    b.onclick=()=>{EUROTAB=code;render();}; bar.appendChild(b); });
  v.appendChild(bar);
  const E=WORLD.euro&&WORLD.euro[EUROTAB]; if(!E){ v.appendChild(el("div","card",'<div class="empty">本赛季尚未安排</div>')); return; }
  const head=el("div","card");
  head.innerHTML=`<h3>${E.name}</h3>`+(E.winner!=null?`<div>🏆 冠军：<b>${esc(C(E.winner).cn)}</b></div>`
    :`<div class="hint">${E.stage==="G"?"小组赛进行中":"淘汰赛进行中"} · 参赛 ${E.teams.length} 队</div>`);
  v.appendChild(head);
  // 淘汰赛结果（倒序）
  if(E.results.length){
    const k=el("div","card"); k.innerHTML="<h3>淘汰赛</h3>";
    E.results.slice().reverse().forEach(rd=>{
      k.appendChild(el("div","hint",`<b style="color:var(--txt)">${rd.round}</b>`));
      const wrap=el("div"); wrap.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 14px";
      rd.ties.forEach(t=>{
        const wa=t.winner===t.a;
        wrap.appendChild(el("div","",`<div style="font-size:12px;padding:3px 0">
          <span style="${wa?'font-weight:700':''}">${crestHTML(C(t.a))}${esc(C(t.a).short)}</span>
          <b style="background:#0b0f14;padding:1px 7px;border-radius:4px">${t.agg?t.agg[0]+" - "+t.agg[1]:t.g1[0]+" - "+t.g1[1]}</b>

          <span class="hint">${t.g2?`（${t.g1[0]}-${t.g1[1]}，${t.g2[0]}-${t.g2[1]}）`:""}${t.pens?` 点球 ${t.pens[0]}-${t.pens[1]}`:""}</span></div>`));
      });

    });
    v.appendChild(k);
  }
  // 即将进行的淘汰赛
  if(E.stage==="K" && E.winner==null){
    const up=WORLD.fixtures.filter(f=>f.comp===E.code&&f.stage==="K"&&!f.played).sort((a,b)=>a.day-b.day);

      const seen=new Set();

      v.appendChild(c); }
  }
  // 小组积分榜
  const g=el("div"); g.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px";
  E.groups.forEach((grp,gi)=>{
    const t=euroGroupTable(E,gi);
    const c=el("div","card"); c.innerHTML=`<h3>${String.fromCharCode(65+gi)} 组</h3>`;
    c.innerHTML+=`<table style="font-size:12px"><thead><tr><th>球队</th><th class="num">场</th><th class="num">净</th><th class="num">分</th></tr></thead><tbody>`+
      t.map(r=>`<tr style="${r.id===WORLD.userClub?'background:#16301f':''};${r.rank<=2?'border-left:3px solid #00d47e':''}"><td>${crestHTML(C(r.id))}${esc(C(r.id).short)}</td><td class="num">${r.p}</td><td class="num">${(r.gd>0?"+":"")+r.gd}</td><td class="num"><b>${r.pts}</b></td></tr>`).join("")+`</tbody></table>`;
    g.appendChild(c);
  });
  v.appendChild(g);
}
function fixtureRow(f){

    <span style="flex:1;text-align:right;${hw?'font-weight:700':''}">${esc(C(f.home).cn)}</span>

    ${crestHTML(C(f.away))}

    ["预期进球",s[0].xg?s[0].xg.toFixed(2):"-",s[1].xg?s[1].xg.toFixed(2):"-"],
    ["角球",s[0].corners,s[1].corners],["犯规",s[0].fouls,s[1].fouls],["黄牌",s[0].yellow,s[1].yellow],["红牌",s[0].red,s[1].red]]
    .map(([n,a,b])=>`<tr><td class="num" style="width:70px"><b>${a}</b></td><td class="ctr hint">${n}</td><td style="width:70px"><b>${b}</b></td></tr>`).join("");
  openModal(`${esc(C(f.home).cn)} ${f.hg} - ${f.ag} ${esc(C(f.away).cn)}`,
    `<div class="hint" style="margin-bottom:10px">${fmtDate(dateOf(f.day))} · ${compLabel(f)}
      ${f.attendance?" · 观众 "+f.attendance.toLocaleString():""}

     <div class="row"><div class="col tw"><table>${rowsHtml}</table></div>
     <div class="col"><div class="hint" style="margin-bottom:5px">比赛事件</div>
       ${(f.events||[]).map(e=>`<div style="font-size:12px;padding:2px 0" class="ev ${e.c}"><span class="m">${e.t}'</span>${esc(e.x)}</div>`).join("")||'<div class="hint">无关键事件</div>'}
     </div></div>`);
}

function vSchedule(v){
  const c=UC();
  v.appendChild(el("div","",`<h1>赛程</h1><div class="sub">${esc(c.cn)} ${WORLD.season}/${String(WORLD.season+1).slice(2)} 赛季全部比赛</div>`));
  const fx=WORLD.fixtures.filter(f=>f.home===c.id||f.away===c.id).sort((a,b)=>a.day-b.day);
  const card=el("div","card");
  let curMonth=-1;
  fx.forEach(f=>{
    const dt=dateOf(f.day);
    if(dt.getMonth()!==curMonth){ curMonth=dt.getMonth();
      card.appendChild(el("div","hint",`<div style="margin:10px 0 4px;font-weight:700;color:var(--txt)">${dt.getFullYear()}年 ${curMonth+1}月</div>`)); }
    const opp=C(f.home===c.id?f.away:f.home);
    const home=f.home===c.id;
    const d=el("div"); d.style.cssText="display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid #1d242e;font-size:12px"+(f.day===WORLD.day?";background:#16301f":"");
    let res="";
    if(f.played){
      const my=home?f.hg:f.ag, th=home?f.ag:f.hg;
      const w=my>th?"#00d47e":my<th?"#e5484d":"#f0a020";
      res=`<b style="color:${w}">${my} - ${th}</b>`;
    } else res=`<span class="hint">${dt.getDate()}日</span>`;
    d.innerHTML=`<span class="hint" style="width:44px">${fmtDateShort(dt)}</span>
      <span class="tag ${compTagCls(f)}" title="${compLabel(f)}">${compShort(f)}</span>
      <span class="tag t-n">${home?"主":"客"}</span>
      ${crestHTML(opp)}<span style="flex:1">${esc(opp.cn)}</span>${res}`;
    if(f.played){ d.style.cursor="pointer"; d.onclick=()=>showMatchReport(f); }
    card.appendChild(d);
  });
  v.appendChild(card);
}

function seasonSummaryHTML(h, brief){
  const u=UC();
  let inner="";
  // 我的联赛
  const mine=h.leagues.find(l=>l.lg===(u.lastLg!=null?u.lastLg:u.lg)) || h.leagues[0];
  if(mine){
    const lg=LEAGUE_DEFS[mine.lg];
    inner+=`<div style="font-weight:700;margin-bottom:4px">${lg?lg.name:""}</div>`;
    mine.table.slice(0,brief?4:6).forEach(r=>{ inner+=`<div style="font-size:12px;padding:1px 0">${r.rank}. ${crestHTML(C(r.id))}${esc(C(r.id).cn)} <span class="hint">${r.pts}分</span></div>`; });
    const me=mine.table.find(r=>r.id===u.id); if(me && me.rank>(brief?4:6)) inner+=`<div style="font-size:12px;padding:1px 0">${me.rank}. ${crestHTML(u)}${esc(u.cn)} <span class="hint">${me.pts}分</span></div>`;
  }
  inner+=`<div class="hr"></div><div style="font-weight:700;margin-bottom:4px">各国冠军</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 12px">`;
  NATIONS.forEach((nat,ni)=>{
    const top=h.leagues.find(l=>l.nation===ni&&l.tier===0);

function shrinkImage(file, size, cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const cv=document.createElement("canvas"); cv.width=size; cv.height=size;
        const ctx=cv.getContext("2d");
        if(!ctx){ cb(fr.result); return; }
        const r=Math.min(size/img.width, size/img.height);
        const w=img.width*r, h=img.height*r;
        ctx.clearRect(0,0,size,size);
        ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        cb(cv.toDataURL("image/png"));
      }catch(e){ cb(fr.result); }
    };
    img.onerror=()=>cb(null);
    img.src=fr.result;
  };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}
function importCrest(clubId, file){
  shrinkImage(file,128,url=>{
    if(!url){ toast("图片无法读取","bad"); return; }
    CUSTOM_CRESTS[C(clubId).en]=url;
    if(!saveCustomCrests()){ delete CUSTOM_CRESTS[C(clubId).en]; toast("浏览器存储空间不足，无法保存队徽","bad"); return; }
    toast(`${C(clubId).cn} 队徽已更新`); render();
  });
}
function matchClubByFilename(name){
  const base=name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[\s_\-]/g,"");
  let best=null,bl=0;
  WORLD.clubs.forEach(c=>{
    const keys=[c.en.toLowerCase().replace(/[\s_\-]/g,""), c.cn, c.short];
    keys.forEach(k=>{ const kk=k.toLowerCase().replace(/[\s_\-]/g,"");
      if(kk && (base.includes(kk)||kk.includes(base)) && kk.length>bl){ bl=kk.length; best=c; } });
  });
  return best;
}
function batchImport(files){
  if(!files.length) return;
  let done=0, ok=0, miss=[];
  files.forEach(f=>{
    const c=matchClubByFilename(f.name);
    if(!c){ miss.push(f.name); done++; if(done===files.length) finish(); return; }
    shrinkImage(f,128,url=>{
      if(url){ CUSTOM_CRESTS[c.en]=url; ok++; }
      done++; if(done===files.length) finish();
    });
  });
  function finish(){
    if(!saveCustomCrests()) toast("部分队徽未能保存：浏览器存储空间不足","bad");
    render();
    toast(`已匹配替换 ${ok} 支球队${miss.length?`，${miss.length} 个文件未识别`:""}`, miss.length?"warn":"");
  }
}

function toggleplay(force){
  const b=$("#btn-play"); if(!b) return;
  ANIM.playing = force!=null? force : !ANIM.playing;
  b.textContent=ANIM.playing?"⏸ 暂停":"▶ 继续";
  if(ANIM.playing){ ANIM.last=performance.now(); ANIM.raf=requestAnimationFrame(animLoop); }
  else cancelAnimationFrame(ANIM.raf);
}
function animLoop(ts){
  const M=CURMATCH; if(!M||VIEW!=="match"){ ANIM.playing=false; return; }
  const dt=Math.min(120, ts-ANIM.last); ANIM.last=ts;
  ANIM.acc += dt*ANIM.speed;
  let steps=0;
  while(ANIM.acc>=PHASE_MS && !M.done && steps<40){
    ANIM.prev=ANIM.cur;
    const before=M.score[0]+M.score[1];
    stepMatch(M);
    ANIM.cur=M.frames[M.frames.length-1];
    ANIM.acc-=PHASE_MS; steps++;
    if(M.score[0]+M.score[1]>before) flashGoal();
  }
  if(M.done && !ANIM.ended){ ANIM.ended=true; ANIM.playing=false;
    cancelAnimationFrame(ANIM.raf); onMatchEnd(); drawPitch(1); refreshMatchUI(); return; }
  drawPitch(clamp(ANIM.acc/PHASE_MS,0,1));
  refreshMatchUI();
  if(ANIM.playing) ANIM.raf=requestAnimationFrame(animLoop);
}

  const M=CURMATCH; if(!M) return;

// ---------- Canvas 渲染 ----------
function drawPitch(alpha){
  const cv=$("#pitch"); if(!cv) return;
  const ctx=cv.getContext?cv.getContext("2d"):null; if(!ctx) return;
  const W=cv.width, H=cv.height;
  const M=CURMATCH;
  const mx=22, my=22, pw=W-mx*2, ph=H-my*2;
  const X=x=>mx+x/PW*pw, Y=y=>my+y/PH*ph;
  // 草地
  ctx.fillStyle="#12331f"; ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ ctx.fillStyle= i%2? "#15391f":"#123016";
    ctx.fillRect(mx+i*pw/10, my, pw/10, ph); }
  ctx.strokeStyle="rgba(255,255,255,.42)"; ctx.lineWidth=2.4;
  ctx.strokeRect(mx,my,pw,ph);
  ctx.beginPath(); ctx.moveTo(X(52.5),my); ctx.lineTo(X(52.5),my+ph); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(52.5),Y(34), 9.15/PW*pw, 0, 6.2832); ctx.stroke();
  // 禁区
  [[0,1],[PW,-1]].forEach(([bx,dir])=>{
    ctx.strokeRect(X(bx)- (dir<0?16.5/PW*pw:0), Y(34-20.15), 16.5/PW*pw, 40.3/PH*ph);
    ctx.strokeRect(X(bx)- (dir<0?5.5/PW*pw:0), Y(34-9.16), 5.5/PW*pw, 18.32/PH*ph);
    ctx.fillStyle="rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.arc(X(bx+dir*11),Y(34),3,0,6.2832); ctx.fill();
    // 球门
    ctx.fillStyle="rgba(255,255,255,.75)";
    ctx.fillRect(X(bx)-(dir<0?0:5), Y(34-3.66), 5, 7.32/PH*ph);
  });
  if(!M) return;
  const a = alpha==null?1:alpha;
  const A=ANIM.prev, B=ANIM.cur;
  let ball, pts;
  if(B&&A&&A.p.length===B.p.length){
    ball={x:A.b.x+(B.b.x-A.b.x)*a, y:A.b.y+(B.b.y-A.b.y)*a};
    pts=B.p.map((q,i)=>[A.p[i][0]+(q[0]-A.p[i][0])*a, A.p[i][1]+(q[1]-A.p[i][1])*a]);
  } else if(B){ ball=B.b; pts=B.p; }
  else { ball=M.ball; pts=M.teams.flatMap(T=>T.men.filter(m=>!m.off).map(m=>[m.x,m.y])); }
  const men=M.teams.flatMap((T,s)=>T.men.filter(m=>!m.off).map(m=>({m,s})));
  // 阴影
  pts.forEach((q,i)=>{ if(!men[i])return;
    ctx.fillStyle="rgba(0,0,0,.34)"; ctx.beginPath(); ctx.arc(X(q[0])+2,Y(q[1])+3,10,0,6.2832); ctx.fill(); });
  pts.forEach((q,i)=>{
    const info=men[i]; if(!info) return;
    const club=C(info.s===0?M.h:M.a);
    const isOwner = M.ballOwner===info.m;
    ctx.beginPath(); ctx.arc(X(q[0]),Y(q[1]), info.m.pos==="GK"?10:11, 0, 6.2832);
    ctx.fillStyle= info.m.pos==="GK"? "#f0e14a" : club.c1;
    ctx.fill();
    ctx.lineWidth= isOwner?3.2:1.6;
    ctx.strokeStyle= isOwner? "#ffffff" : (info.s===0? "rgba(255,255,255,.65)":"rgba(0,0,0,.6)");
    ctx.stroke();
    ctx.fillStyle= info.m.pos==="GK"? "#111" : club.c2;
    ctx.font="bold 10px -apple-system,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(String(POSITIONS.indexOf(info.m.pos)+1), X(q[0]), Y(q[1]));
    // 名字
    ctx.fillStyle="rgba(255,255,255,.78)"; ctx.font="9px -apple-system,sans-serif";
    ctx.fillText(nm(info.m).slice(0,4), X(q[0]), Y(q[1])+19);
  });
  // 球
  ctx.beginPath(); ctx.arc(X(ball.x),Y(ball.y),6.2,0,6.2832);
  ctx.fillStyle="#ffffff"; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle="#111"; ctx.stroke();
}

const SAVEKEY="fmweb_save_v2";
const OLD_SAVEKEY="fmweb_save_v1";
/* ---------- IndexedDB 存档层（存档可达数 MB，localStorage 装不下）---------- */
const DB_NAME="fmweb_db", DB_STORE="saves";
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no-idb"));
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error("blocked"));
  });
}
function idbSet(k,v){ return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,"readwrite"); tx.objectStore(DB_STORE).put(v,k);
  tx.oncomplete=()=>{db.close();res(true);}; tx.onerror=()=>{db.close();rej(tx.error);}; tx.onabort=()=>{db.close();rej(tx.error||new Error("abort"));}; })); }
function idbGet(k){ return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,"readonly"); const q=tx.objectStore(DB_STORE).get(k);
  q.onsuccess=()=>{db.close();res(q.result);}; q.onerror=()=>{db.close();rej(q.error);}; })); }
function idbDel(k){ return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,"readwrite"); tx.objectStore(DB_STORE).delete(k);
  tx.oncomplete=()=>{db.close();res(true);}; tx.onerror=()=>{db.close();rej(tx.error);}; })); }
// 统一读写：优先 IndexedDB，失败时退回 localStorage
async function storeSave(str, meta){
  try{ await idbSet(SAVEKEY,str); try{ localStorage.removeItem(SAVEKEY); }catch(e){} }
  catch(e){ localStorage.setItem(SAVEKEY,str); }   // 抛错交给调用方
  localStorage.setItem(SAVEKEY+"_meta",JSON.stringify({...meta, mb:(str.length/1048576).toFixed(2)}));
}
async function readSave(){
  let s=null;
  try{ s=await idbGet(SAVEKEY); }catch(e){}
  if(!s){ try{ s=localStorage.getItem(SAVEKEY); }catch(e){} }
  return s||null;
}
async function deleteSave(){
  try{ await idbDel(SAVEKEY); }catch(e){}
  try{ localStorage.removeItem(SAVEKEY); localStorage.removeItem(SAVEKEY+"_meta"); }catch(e){}
}
// 载入存档对象并校验版本
function adoptWorld(obj){
  if(!obj || !obj.clubs || !obj.leagues) throw new Error("bad");
  if(obj.ver!==2 || !obj.cups) throw new Error("oldver");
  WORLD=obj; CURMATCH=null; VIEW="home"; LGNATION=null; AUTOSAVE_DAY=WORLD.day;
}
function loadErrMsg(e){ return (e&&e.message==="oldver")? "这是旧版（仅英格兰）的存档，与五大联赛版不兼容，请开始新游戏" : "存档无法读取"; }

function saveGame(){
  const s=JSON.stringify(WORLD);
  storeSave(s,{club:UC().cn,season:WORLD.season,day:WORLD.day})
    .then(()=>{ AUTOSAVE_DAY=WORLD.day; toast(`已保存（${(s.length/1048576).toFixed(2)} MB）`); if(VIEW==="save") render(); })
    .catch(()=>toast("保存失败：浏览器存储空间不足，请改用导出文件","bad"));
}
function loadGame(){
  readSave().then(s=>{
    if(!s){ toast("没有找到存档","bad"); return; }
    try{ adoptWorld(JSON.parse(s)); render(); toast("存档已载入"); }
    catch(e){ toast(loadErrMsg(e),"bad"); }
  }).catch(()=>toast("读取失败","bad"));
}
function exportSave(){
  const blob=new Blob([JSON.stringify(WORLD)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`足球经理_${UC().short}_${WORLD.season}_第${WORLD.day}天.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("存档文件已导出");
}

    <div class="hint" style="margin-bottom:18px">FOOTBALL MANAGER · WEB</div>
    <div style="background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:11px;text-align:left">
      <div class="hint">上次进度</div>
      <div style="font-weight:700;font-size:15px;margin:2px 0">${esc(m.club)}</div>
      <div class="hint">${m.season||"?"}/${m.season!=null?String(m.season+1).slice(2):"??"} 赛季 · 第 ${m.day} 天 · ${m.mb} MB</div>
    </div><div class="hr"></div>`;
  const mk=(cls,txt,fn)=>{ const b=el("button",cls,txt);
    b.style.cssText="display:block;width:100%;margin-top:9px;padding:11px"; b.onclick=fn; return b; };
  box.appendChild(mk("pri","▶ 继续游戏", continueGame));
  box.appendChild(mk("","＋ 新开一局", ()=>{
    if(confirm("开始新游戏会在保存时覆盖当前存档，确定继续？")) newGameScreen();
  }));
  const inp=el("input"); inp.type="file"; inp.accept=".json"; inp.style.display="none";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ adoptWorld(JSON.parse(r.result)); enterGame(); toast("存档已导入"); }
      catch(err){ toast(loadErrMsg(err),"bad"); } };
    r.readAsText(f); };
  box.appendChild(mk("","📂 导入存档文件", ()=>inp.click()));
  box.appendChild(inp);
  ls.appendChild(box);
}

/* ---------- 新游戏 ---------- */
function newGameScreen(){
  document.getElementById("app").style.display="none";
  const ls=document.getElementById("loadscr");
  ls.style.display="flex"; ls.innerHTML="";
  // 顶部必须避开灵动岛/刘海，否则标题会被挖孔盖住
  ls.style.cssText="position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;display:block;"+
    "padding:calc(20px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal))";
  const box=el("div"); box.style.cssText="max-width:1080px;margin:0 auto";
  box.innerHTML=`<h1 style="font-size:32px;letter-spacing:5px;color:var(--acc);text-align:center;margin-bottom:4px">足球经理</h1>
    <div class="sub" style="text-align:center">选择一家俱乐部，开始你的执教生涯 · 五大联赛 ${LEAGUE_DEFS.length} 个级别 共 ${LEAGUE_DEFS.reduce((s,l)=>s+l.n,0)} 队</div>`;
  const tabsWrap=el("div"); tabsWrap.style.cssText="position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px;margin-bottom:10px";
  const tabs=el("div"); tabs.style.cssText="text-align:center;margin-bottom:8px";
  const tabs2=el("div"); tabs2.style.cssText="text-align:center";
  let curNation=0, curTier=0;
  const grid=el("div","grid4");
  function paint(){
    tabs.innerHTML=""; tabs2.innerHTML="";
    NATIONS.forEach((n,i)=>{ const b=el("button","sm"+(curNation===i?" on":""),n.name);
      b.style.margin="0 4px 6px"; b.onclick=()=>{curNation=i;curTier=0;paint();}; tabs.appendChild(b); });
    NATIONS[curNation].tiers.forEach((t,i)=>{ const b=el("button","sm"+(curTier===i?" on":""),t.short);
      b.style.margin="0 4px"; b.onclick=()=>{curTier=i;paint();}; tabs2.appendChild(b); });
    grid.innerHTML="";
    CLUB_DATA[curNation][curTier].forEach((cd,idx)=>{
      const [en,cn,sh,c1,c2,rep,cap,st]=cd;
      const d=el("div","card"); d.style.cssText+="cursor:pointer;transition:.15s";
      d.onmouseenter=()=>d.style.borderColor="var(--acc)";
      d.onmouseleave=()=>d.style.borderColor="var(--line)";
      const diff = rep>=80?["轻松","#00d47e"] : rep>=60?["普通","#7ed957"] : rep>=42?["有挑战","#ffd24a"] : rep>=30?["困难","#f0a020"] : ["地狱","#e5484d"];
      d.innerHTML=`<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        <img class="crest" src="${crestURI(clubFromData(curNation,curTier,idx))}" width="38" height="38" alt="">
        <div><b style="font-size:14px">${cn}</b><div class="hint" style="font-size:10px">${en}</div></div></div>
        <div class="hint">${st} · ${cap.toLocaleString()} 座</div>
        <div style="margin:6px 0"><div class="hint">俱乐部声望 ${rep}</div>
          <div class="bar"><i style="width:${rep}%;background:${diff[1]}"></i></div></div>
        <div class="hint">执教难度 <b style="color:${diff[1]}">${diff[0]}</b></div>`;
      d.onclick=()=>startGame(en);
      grid.appendChild(d);
    });
  }
  paint();
  tabsWrap.appendChild(tabs); tabsWrap.appendChild(tabs2); box.appendChild(tabsWrap); box.appendChild(grid);
  const ft=el("div","hint"); ft.style.cssText="text-align:center;margin:22px 0 12px";
  ft.textContent="提示：声望越低的球队资金与球员越差，挑战越大。"+(hasOldSave()&&!saveMeta()?" 检测到旧版（仅英格兰）存档，它与五大联赛版不兼容，需要重新开始。":"");
  box.appendChild(ft);
  if(saveMeta()){                       // 有存档时留一个退路，别把人困在选队页
    const back=el("div"); back.style.cssText="text-align:center;margin-bottom:36px";
    const b=el("button","sm","← 返回，继续原来的存档"); b.onclick=()=>startMenu();
    back.appendChild(b); box.appendChild(back);
  }
  ls.appendChild(box);
}
function startGame(en){
  toast("正在生成五大联赛世界…");
  newWorld(Date.now()%2147483647, en);
  const c=UC();
  autoPickLineup(c);
  news("欢迎上任",`欢迎来到 ${c.cn}！董事会对你本赛季的期望是「${c.board.expect}」。祝你好运，教练。`,"good");
  news("赛季前瞻",`${WORLD.season}/${String(WORLD.season+1).slice(2)} 赛季即将开始，你可以在「战术」中调整阵型，在「转会」中补强阵容。`,"info");
  VIEW="home"; AUTOSAVE_DAY=WORLD.day; enterGame();
}

/* ---------- 赛季结束 ---------- */
function showSeasonEnd(){
  const h=WORLD.history[WORLD.history.length-1];
  if(!h) return;
  let html=`<div class="hint" style="margin-bottom:10px">${h.season}/${String(h.season+1).slice(2)} 赛季全部结束</div>`;
  html+=seasonSummaryHTML(h,true);
  if(h.topScorers&&h.topScorers.length){
    html+=`<div class="hr"></div><div style="font-weight:700;margin-bottom:4px">最佳射手</div>`;
    h.topScorers.slice(0,5).forEach(x=>html+=`<div style="font-size:12px">${esc(x.n)} <span class="hint">${esc(x.c)}</span> — <b>${x.g}</b> 球 / ${x.ap} 场</div>`);
  }
  openModal("赛季回顾", html, `<button class="pri" onclick="closeModal();go('home')">进入新赛季</button>`);
}

/* ---------- 继续按钮 ---------- */
let BUSY=false;
function onContinue(){
  if(BUSY) return;
  if(WORLD.gameOver){ openModal("下课",`<div>${esc(WORLD.gameOver)}</div>`,
     `<button class="pri" onclick="closeModal();newGameScreen()">重新开始</button>`); return; }
  // 有未结算的用户比赛：未打完 → 回到比赛页；已打完 → 直接结算，否则会卡住
  if(CURMATCH){
    if(!CURMATCH.done){ VIEW="match"; render(); return; }
    BUSY=true;
    try{ completeMatch(); }
    catch(err){ console.error(err); toast("结算比赛出错："+(err&&err.message||err),"bad"); }
    finally{ BUSY=false; }
    return;
  }
  BUSY=true;
  let r;
  try{ r=advance(); }
  catch(err){ console.error(err); toast("推进失败："+(err&&err.message||err),"bad"); return; }
  finally{ BUSY=false; }   // 出错也要解锁，否则「继续」会永久失效
  if(r.t==="match"){ startUserMatch(r.fx); return; }
  if(r.t==="season"){ AUTOSAVE_DAY=-99; autoSave(); render(); showSeasonEnd(); return; }
  autoSave();
  render();
}

/* ---------- 启动 ---------- */
/* ---------- PWA：可安装 + 离线 ---------- */
let UPDATE_READY=false;
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  if(!/^https?:$/.test(location.protocol)) return;   // file:// 下跳过
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        // 已有旧版本在跑，且新版本装好了 → 提示而不是直接刷新，避免冲掉未保存的进度
        if(nw.state==="installed" && hadController && !UPDATE_READY){
          UPDATE_READY=true;
          toast("已下载新版本：请先保存进度，再到「存档」页点『应用更新』","warn");
          if(VIEW==="save") render();
        }
      });
    });
    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});
}
// 全屏模式下没有地址栏也没有下拉刷新，这里提供手动更新出口
function applyUpdate(){
  if(!("serviceWorker" in navigator)){ location.reload(); return; }
  navigator.serviceWorker.getRegistrations()
    .then(rs=>Promise.all(rs.map(r=>r.unregister())))
    .then(()=>caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))))
    .catch(()=>{})
    .then(()=>location.reload(true));
}
// 离线可用提示（仅首次）
function offlineHint(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    if(localStorage.getItem("fmweb_pwa_hint")) return;
    localStorage.setItem("fmweb_pwa_hint","1");
    setTimeout(()=>toast("提示：可把本页「添加到主屏幕」，之后断网也能玩"),2200);
  }catch(e){}
}

/* ---------- 移动端手势：彻底关掉缩放 ---------- */
function lockZoom(){
  // iOS Safari 会忽略 user-scalable=no，需拦截 gesture 事件
  ["gesturestart","gesturechange","gestureend"].forEach(t=>
    document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
  // 双指 touchmove 兜底（不影响单指滚动）
  document.addEventListener("touchmove", e=>{
    if(e.touches && e.touches.length>1) e.preventDefault();
  }, {passive:false});
  // 万一被浏览器缩放过，切回前台时复位
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden && window.visualViewport && window.visualViewport.scale>1.01)
      window.scrollTo(0,0);
  });
}

// 屏幕旋转：等布局稳定后重绘一次，避免残留滚动偏移与半旧布局
let _oriT=0, _oriLast="";
function watchOrientation(){
  const key=()=>innerWidth>innerHeight?"L":"P";
  _oriLast=key();
  const on=()=>{
    if(key()===_oriLast) return;
    _oriLast=key();
    clearTimeout(_oriT);
    _oriT=setTimeout(()=>{
      const s=document.getElementById("side"); if(s){ s.scrollLeft=0; s.scrollTop=0; }
      const v=document.getElementById("view"); if(v) v.scrollTop=0;
      try{ render(); }catch(e){}
    },260);
  };
  window.addEventListener("orientationchange",on);
  window.addEventListener("resize",on);
}

window.addEventListener("DOMContentLoaded",()=>{
  lockZoom();
  watchOrientation();
  registerSW();
  loadCustomCrests();
  document.getElementById("tb-go").onclick=onContinue;
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeModal();
    if(e.code==="Space" && VIEW==="match" && CURMATCH && !CURMATCH.done){ e.preventDefault(); toggleplay(); }
    if(e.key==="Enter" && !$("#modal").classList.contains("on")
       && (VIEW!=="match" || (CURMATCH && CURMATCH.done))) onContinue();
  });
  setTimeout(()=>{ startMenu(); offlineHint(); },450);
});

/* ---------- 调试/测试桥接（顶层 let 绑定不会自动挂到 window） ---------- */
Object.defineProperties(window,{
  WORLD:{get:()=>WORLD, set:v=>{WORLD=v;}, configurable:true},
  CURMATCH:{get:()=>CURMATCH, set:v=>{CURMATCH=v;}, configurable:true},
  ANIM:{get:()=>ANIM, set:v=>{ANIM=v;}, configurable:true},
  VIEW:{get:()=>VIEW, set:v=>{VIEW=v;}, configurable:true}
});
</script>
